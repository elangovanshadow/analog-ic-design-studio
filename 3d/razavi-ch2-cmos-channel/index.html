<title>Ch 2 · NMOS and PMOS structure, and channel formation (Figs. 2.2–2.8)</title>
<style>
  :root{--bg:#0f1115;--panel:rgba(20,23,30,.86);--ink:#e8ebf1;--muted:#9aa3b2;--accent:#5aa9ff}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;touch-action:none}
  .lbl{padding:2px 7px;border-radius:6px;background:rgba(10,12,16,.78);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;border:1px solid rgba(255,255,255,.18)}
  #hud{position:fixed;left:10px;top:10px;right:10px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
  #title{background:var(--panel);padding:8px 12px;border-radius:10px;font-weight:600;pointer-events:auto;max-width:60%}
  #title small{display:block;font-weight:400;color:var(--muted)}
  #tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
  button{background:var(--panel);color:var(--ink);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer}
  button.on{border-color:var(--accent);color:var(--accent)}
  #info{position:fixed;left:10px;bottom:10px;max-width:min(420px,calc(100% - 20px));background:var(--panel);padding:10px 12px;border-radius:10px;display:none}
  #info b{display:block;margin-bottom:3px}
  #steps{position:fixed;right:10px;bottom:10px;background:var(--panel);padding:6px;border-radius:10px;display:none;gap:6px;align-items:center}
  #stepTxt{padding:0 6px;color:var(--muted);max-width:240px}

<script id="scene-data" type="application/json">{"title": "Ch 2 · NMOS and PMOS structure, and channel formation (Figs. 2.2–2.8)", "subtitle": "Press ▶ to build the devices · tap a part · Explode lifts the gates", "background": "#10131a", "camera": [1.5, 6.0, 13.0], "target": [0, -0.3, 0], "gridSize": 24, "steps": ["The p-type substrate is the body (bulk) of all NMOS devices", "An n-well gives the PMOS device its own local substrate", "Heavily doped regions make the source and the drain of each device", "A thin gate oxide and a polysilicon gate go on top. L and W are the gate dimensions", "Metal contacts give the terminals: S, G, D and B (bulk or well)", "NMOS, VG > 0: the gate pushes holes away. A depletion region with negative ions remains", "NMOS, VGS > VTH: electrons make an inversion channel from S to D", "PMOS, VGS more negative than −|VTH|: holes make the PMOS channel"], "objects": [{"type": "box", "size": [15, 2.0, 3.0], "position": [0, -1.0, 0], "color": "#7d5a9e", "label": "p-substrate", "labelOffset": [-6.6, -0.6, 1.6], "info": "The p-type substrate is the body (bulk) of each NMOS device. Engineers connect it to the most negative supply. Then the S/D junction diodes stay in reverse bias (p. 11).", "step": 0}, {"type": "box", "size": [7.0, 1.3, 3.02], "position": [3.5, -0.64, 0], "color": "#7dd3fc", "label": "n-well", "labelOffset": [2.6, -0.5, 1.6], "info": "The n-well is a local n-type substrate for the PMOS device. Engineers connect it to the most positive supply. Each PMOS device can have its own well (p. 12).", "step": 1}, {"type": "box", "size": [1.5, 0.5, 3.04], "position": [-5.2, -0.23, 0], "color": "#2563eb", "label": "n+ source", "labelOffset": [0, 0.1, 1.7], "info": "A heavily doped n-type region. The source gives the electrons to the channel (p. 11).", "step": 2, "explode": [-0.7, 0, 0]}, {"type": "box", "size": [1.5, 0.5, 3.04], "position": [-1.8, -0.23, 0], "color": "#2563eb", "label": "n+ drain", "labelOffset": [0, 0.1, 1.7], "info": "A heavily doped n-type region. The drain collects the electrons. The NMOS structure is symmetric, so the source and the drain can change roles (p. 11).", "step": 2, "explode": [0.7, 0, 0]}, {"type": "box", "size": [1.5, 0.5, 3.04], "position": [1.8, -0.23, 0], "color": "#c084fc", "label": "p+ source", "labelOffset": [0, 0.1, 1.7], "info": "A heavily doped p-type region in the n-well. In a PMOS device, the source gives holes to the channel.", "step": 2, "explode": [-0.7, 0, 0]}, {"type": "box", "size": [1.5, 0.5, 3.04], "position": [5.2, -0.23, 0], "color": "#c084fc", "label": "p+ drain", "labelOffset": [0, 0.1, 1.7], "info": "A heavily doped p-type region in the n-well. It collects the holes.", "step": 2, "explode": [0.7, 0, 0]}, {"type": "box", "size": [0.9, 0.5, 3.04], "position": [-6.8, -0.23, 0], "color": "#c084fc", "label": "p+ bulk tap", "labelOffset": [0, 0.1, 1.7], "info": "A p+ region gives an ohmic (low-resistance) connection to the p-substrate (Fig. 2.3).", "step": 2}, {"type": "box", "size": [0.8, 0.5, 3.04], "position": [6.5, -0.23, 0], "color": "#2563eb", "label": "n+ well tap", "labelOffset": [0.2, 0.1, 1.7], "info": "An n+ region gives an ohmic connection to the n-well.", "step": 2}, {"type": "box", "size": [1.9, 0.08, 3.0], "position": [-3.5, 0.05, 0], "color": "#e5e7eb", "label": "gate oxide", "labelOffset": [-1.5, 0.15, 1.7], "info": "A thin layer of silicon dioxide (SiO2). It insulates the gate from the substrate. Its thickness is tox. For tox = 50 Å, Cox is approximately 6.9 fF/µm² (p. 14).", "step": 3, "explode": [0, 0.7, 0]}, {"type": "box", "size": [1.7, 0.45, 3.0], "position": [-3.5, 0.315, 0], "color": "#9ca3af", "metalness": 0.4, "label": "poly gate", "labelOffset": [0, 0.3, 1.6], "info": "The gate is polysilicon with heavy doping. Its dimension along the S–D path is the length L. Its dimension across is the width W (p. 11).", "step": 3, "explode": [0, 1.4, 0]}, {"type": "box", "size": [1.9, 0.08, 3.0], "position": [3.5, 0.05, 0], "color": "#e5e7eb", "step": 3, "explode": [0, 0.7, 0]}, {"type": "box", "size": [1.7, 0.45, 3.0], "position": [3.5, 0.315, 0], "color": "#9ca3af", "metalness": 0.4, "label": "PMOS gate", "labelOffset": [0, 0.3, 1.6], "info": "The PMOS gate is the same as the NMOS gate. All polarities are opposite.", "step": 3, "explode": [0, 1.4, 0]}, {"type": "arrow", "from": [-4.35, 1.05, 1.8], "to": [-2.65, 1.05, 1.8], "color": "#e2e8f0", "step": 3, "label": "L", "labelOffset": [-3.5, 1.3, 1.8], "info": "L: the gate length, along the path from source to drain."}, {"type": "arrow", "from": [-4.6, 0.75, 1.5], "to": [-4.6, 0.75, -1.5], "color": "#e2e8f0", "step": 3, "label": "W", "labelOffset": [-4.75, 0.95, -1.9], "info": "W: the gate width, perpendicular to the length."}, {"type": "cylinder", "radius": 0.12, "height": 1.0, "position": [-5.2, 0.51, 0], "color": "#f59e0b", "metalness": 0.8, "roughness": 0.3, "label": "S", "labelOffset": [0, 0.8, 0], "info": "NMOS source terminal.", "step": 4}, {"type": "cylinder", "radius": 0.12, "height": 0.7, "position": [-3.5, 0.89, 0], "color": "#f59e0b", "metalness": 0.8, "roughness": 0.3, "label": "G", "labelOffset": [0, 0.65, 0], "info": "NMOS gate terminal.", "step": 4, "explode": [0, 1.4, 0]}, {"type": "cylinder", "radius": 0.12, "height": 1.0, "position": [-1.8, 0.51, 0], "color": "#f59e0b", "metalness": 0.8, "roughness": 0.3, "label": "D", "labelOffset": [0, 0.8, 0], "info": "NMOS drain terminal.", "step": 4}, {"type": "cylinder", "radius": 0.12, "height": 1.0, "position": [-6.8, 0.52, 0], "color": "#f59e0b", "metalness": 0.8, "roughness": 0.3, "label": "B", "labelOffset": [0, 0.8, 0], "info": "NMOS bulk terminal. All NMOS devices share this substrate (p. 12).", "step": 4}, {"type": "cylinder", "radius": 0.12, "height": 1.0, "position": [1.8, 0.51, 0], "color": "#f59e0b", "metalness": 0.8, "roughness": 0.3, "label": "S", "labelOffset": [0, 0.8, 0], "info": "PMOS source terminal. In the PMOS symbol, the source is on top, because it has the higher voltage (p. 12).", "step": 4}, {"type": "cylinder", "radius": 0.12, "height": 0.7, "position": [3.5, 0.89, 0], "color": "#f59e0b", "metalness": 0.8, "roughness": 0.3, "label": "G", "labelOffset": [0, 0.65, 0], "info": "PMOS gate terminal.", "step": 4, "explode": [0, 1.4, 0]}, {"type": "cylinder", "radius": 0.12, "height": 1.0, "position": [5.2, 0.51, 0], "color": "#f59e0b", "metalness": 0.8, "roughness": 0.3, "label": "D", "labelOffset": [0, 0.8, 0], "info": "PMOS drain terminal.", "step": 4}, {"type": "cylinder", "radius": 0.12, "height": 1.0, "position": [6.5, 0.52, 0], "color": "#f59e0b", "metalness": 0.8, "roughness": 0.3, "label": "B", "labelOffset": [0, 0.8, 0], "info": "PMOS bulk terminal: the n-well contact. It usually connects to VDD.", "step": 4}, {"type": "box", "size": [1.9, 0.5, 3.06], "position": [-3.5, -0.255, 0], "color": "#fde68a", "opacity": 0.8, "edges": false, "label": "depletion region", "labelOffset": [0, -0.62, 1.75], "info": "The positive gate pushes the holes away. Negative ions remain, and they mirror the gate charge. No carriers are free here, so no current flows yet (Fig. 2.6b).", "step": 5}, {"type": "box", "size": [1.9, 0.07, 3.08], "position": [-3.5, -0.03, 0], "color": "#22d3ee", "opacity": 0.9, "edges": false, "label": "electron channel", "labelOffset": [0, -0.2, 1.95], "info": "When VGS is more than VTH, electrons come from the source. They make an inversion layer under the oxide. The layer connects S and D, so the device is on (Fig. 2.6d).", "step": 6}, {"type": "arrow", "from": [-4.35, -0.12, 1.75], "to": [-2.65, -0.12, 1.75], "color": "#fde047", "step": 6, "info": "With a positive VDS, electrons move from S to D. The current ID flows from D to S."}, {"type": "box", "size": [1.9, 0.5, 3.06], "position": [3.5, -0.255, 0], "color": "#bbf7d0", "opacity": 0.75, "edges": false, "step": 7, "label": "PMOS depletion", "labelOffset": [0, -0.62, 1.75], "info": "A negative gate pushes the electrons of the n-well away. Positive ions remain."}, {"type": "box", "size": [1.9, 0.07, 3.08], "position": [3.5, -0.03, 0], "color": "#f472b6", "opacity": 0.9, "edges": false, "step": 7, "label": "hole channel", "labelOffset": [0, -0.2, 1.95], "info": "When VGS is sufficiently negative, holes make the inversion layer. The PMOS device is then on (Fig. 2.8)."}]}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const S = JSON.parse(document.getElementById('scene-data').textContent);
const deg = d => d * Math.PI / 180;
const stage = document.getElementById('stage');
document.getElementById('title').innerHTML = (S.title||'3D model') + (S.subtitle ? `<small>${S.subtitle}</small>` : '');
if (S.background) document.documentElement.style.setProperty('--bg', S.background);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer();
labelR.setSize(innerWidth, innerHeight);
Object.assign(labelR.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none' });
document.body.appendChild(labelR.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(S.background || '#0f1115');
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 2000);
const camPos = S.camera || [6, 5, 8], target = S.target || [0, 0, 0];
camera.position.set(...camPos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(...target); controls.enableDamping = true; controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(5, 10, 7); scene.add(sun);
if (S.grid !== false) { const g = new THREE.GridHelper(S.gridSize || 20, 20, 0x334055, 0x222a36); g.position.y = S.gridY ?? -0.001; scene.add(g); }

const pickable = [], items = [];
function material(o) {
  return new THREE.MeshStandardMaterial({
    color: o.color || '#8899aa', metalness: o.metalness ?? 0.1, roughness: o.roughness ?? 0.6,
    transparent: (o.opacity ?? 1) < 1, opacity: o.opacity ?? 1, wireframe: !!o.wireframe,
    side: (o.opacity ?? 1) < 1 ? THREE.DoubleSide : THREE.FrontSide, depthWrite: (o.opacity ?? 1) >= 1 });
}
function geometry(o) {
  switch (o.type) {
    case 'box': return new THREE.BoxGeometry(...(o.size || [1, 1, 1]));
    case 'cylinder': return new THREE.CylinderGeometry(o.radiusTop ?? o.radius ?? 0.5, o.radiusBottom ?? o.radius ?? 0.5, o.height ?? 1, o.segments || 48);
    case 'cone': return new THREE.ConeGeometry(o.radius ?? 0.5, o.height ?? 1, o.segments || 48);
    case 'sphere': return new THREE.SphereGeometry(o.radius ?? 0.5, 48, 32);
    case 'torus': return new THREE.TorusGeometry(o.radius ?? 1, o.tube ?? 0.2, 24, 96);
    case 'plane': return new THREE.PlaneGeometry(...(o.size || [1, 1]));
    case 'tube': return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(o.points.map(p => new THREE.Vector3(...p)), false, 'catmullrom', 0), 64 * o.points.length, o.radius ?? 0.05, 12, false);
    case 'extrude': { const sh = new THREE.Shape(o.shape.map(p => new THREE.Vector2(...p))); return new THREE.ExtrudeGeometry(sh, { depth: o.depth ?? 1, bevelEnabled: false }); }
  }
  return null;
}
function addLabel(obj, o) {
  if (!o.label) return;
  const d = document.createElement('div'); d.className = 'lbl'; d.textContent = o.label;
  const l = new CSS2DObject(d); l.position.set(...(o.labelOffset || [0, 0, 0])); obj.add(l);
}
function place(obj, o) {
  obj.position.set(...(o.position || [0, 0, 0]));
  if (o.rotation) obj.rotation.set(...o.rotation.map(deg));
  if (o.scale) typeof o.scale === 'number' ? obj.scale.setScalar(o.scale) : obj.scale.set(...o.scale);
  obj.userData = { o, home: obj.position.clone() };
  addLabel(obj, o); scene.add(obj); items.push(obj);
}
const loader = new GLTFLoader();
for (const o of S.objects || []) {
  if (o.type === 'gltf') { loader.load(o.url, g => { place(g.scene, o); g.scene.traverse(m => { if (m.isMesh) { m.userData.root = g.scene; pickable.push(m); } }); applyStep(); }); continue; }
  if (o.type === 'arrow') {
    const a = new THREE.Vector3(...o.from), b = new THREE.Vector3(...o.to), dir = b.clone().sub(a), len = dir.length();
    const ar = new THREE.ArrowHelper(dir.normalize(), a, len, new THREE.Color(o.color || '#ffcc33'), Math.min(0.35, len * 0.3), Math.min(0.2, len * 0.18));
    const g = new THREE.Group(); g.add(ar); place(g, { ...o, position: [0, 0, 0] }); g.userData.o = o; continue;
  }
  const geo = geometry(o); if (!geo) { console.warn('unknown type', o.type); continue; }
  const m = new THREE.Mesh(geo, material(o)); place(m, o); m.userData.root = m; pickable.push(m);
  if (o.edges !== false && (o.opacity ?? 1) >= 1) { const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: .35 })); m.add(e); }
}

// Steps: objects with "step": n appear at step n (build-up walkthrough)
const steps = S.steps || []; let cur = steps.length ? 0 : -1;
const stepsBox = document.getElementById('steps'), stepTxt = document.getElementById('stepTxt');
function applyStep() {
  if (cur < 0) return;
  for (const it of items) { const s = it.userData.o.step ?? 0; it.visible = s <= cur && (it.userData.o.stepEnd === undefined || cur <= it.userData.o.stepEnd); it.traverse(c => { if (c.isCSS2DObject) c.visible = it.visible; }); }
  stepTxt.textContent = `${cur + 1}/${steps.length} · ${steps[cur]}`;
}
if (steps.length) { stepsBox.style.display = 'flex'; applyStep(); }
document.getElementById('bPrev').onclick = () => { if (cur > 0) { cur--; applyStep(); } };
document.getElementById('bNext').onclick = () => { if (cur < steps.length - 1) { cur++; applyStep(); } };

// Click / tap an object for its info
const info = document.getElementById('info'), ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickable.filter(m => m.userData.root?.visible !== false), false)[0];
  const o = hit?.object.userData.root?.userData.o || hit?.object.userData.o;
  if (o && (o.label || o.info)) { info.innerHTML = `<b>${o.label || ''}</b>${o.info || ''}`; info.style.display = 'block'; } else info.style.display = 'none';
});

let spin = !!S.autoRotate, labels = true, exploded = false;
const tog = (id, v) => document.getElementById(id).classList.toggle('on', v);
tog('bSpin', spin); controls.autoRotate = spin;
document.getElementById('bSpin').onclick = () => { spin = !spin; controls.autoRotate = spin; tog('bSpin', spin); };
document.getElementById('bLabels').onclick = () => { labels = !labels; labelR.domElement.style.display = labels ? '' : 'none'; tog('bLabels', labels); };
document.getElementById('bReset').onclick = () => { camera.position.set(...camPos); controls.target.set(...target); controls.update(); };
const bEx = document.getElementById('bExplode');
if (!S.objects?.some(o => o.explode)) bEx.style.display = 'none';
bEx.onclick = () => { exploded = !exploded; tog('bExplode', exploded); };

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), k = 1 - Math.pow(0.001, dt);
  for (const it of items) {
    const o = it.userData.o, home = it.userData.home;
    if (o.explode && home) it.position.lerp(exploded ? home.clone().add(new THREE.Vector3(...o.explode)) : home, k);
    if (o.spin) it.rotation.y += deg(o.spin) * dt;
  }
  controls.update(); renderer.render(scene, camera); labelR.render(scene, camera);
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelR.setSize(innerWidth, innerHeight); });
window.__ready = true;
</script>
</body>
