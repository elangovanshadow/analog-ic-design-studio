LESSONS.push(
{id:'b-cmdm', unit:'Foundations', label:'bridge', title:'Common-mode and differential parts of two signals', mins:3, prereq:[], unlocks:['4a','4e','4f'],
 obj:'Split any pair of inputs into V_CM and V_DM, and read a ratio in dB.',
 why:'Chapter 4 analyses every input as “differential part + common-mode part” (Eqs. 4.22–4.23) and quotes rejection as CMRR, usually in dB.',
 blocks:[
  {t:'visual', fig:'cmdm', cap:'Any two voltages can be rewritten this way. Nothing is lost; it is just a change of variables.'},
  {t:'formal', eq:[{tex:R`V_{CM}=\frac{V_1+V_2}{2},\qquad V_{DM}=V_1-V_2`, note:'common-mode = average; differential = difference'},{tex:R`V_1=V_{CM}+\frac{V_{DM}}2,\qquad V_2=V_{CM}-\frac{V_{DM}}2`, note:'(4.22)–(4.23) — then use superposition: analyse the DM part and the CM part separately'},{tex:R`x\ \text{in dB} = 20\log_{10}x\ \ \text{(voltage ratio)}`, note:'×10 = 20 dB, ×100 = 40 dB, ×1000 = 60 dB'}]},
  {t:'check', q:{type:'mcq', q:'V₁ = 0.9 V, V₂ = 1.1 V. V_CM and V_DM?', opts:['1.0 V and −0.2 V','1.0 V and 0.2 V','2.0 V and 0.2 V','0.1 V and 1.0 V'], a:0, explain:'Average = 1.0 V; difference V₁ − V₂ = −0.2 V.'}},
  {t:'check', q:{type:'num', q:'A CMRR of 10,000 is how many dB?', a:80, tol:0.01, unit:'dB', explain:'20·log₁₀(10⁴) = 80 dB.'}},
  {t:'recall', prompt:'Write V₁ and V₂ in terms of V_CM and V_DM.', model:'V₁ = V_CM + V_DM/2, V₂ = V_CM − V_DM/2.'}
 ],
 cards:[['V_CM and V_DM of two inputs','V_CM = (V₁+V₂)/2, V_DM = V₁ − V₂'],['Voltage ratio in dB','20·log₁₀(ratio)']]},

{id:'4a', unit:'Ch 4 · Differential amplifiers', sec:'4.1', label:'book', title:'Why differential? Rejecting what both wires share', mins:3, pages:[100,102], prereq:['b-cmdm'],
 obj:'Give four advantages of differential signalling.',
 blocks:[
  {t:'idea', p:R`A <b>single-ended</b> signal is measured against a fixed potential (usually ground). A <b>differential</b> signal is measured between two nodes that swing equally and oppositely around a <b>common-mode (CM) level</b> (Fig. 4.1).`},
  {t:'idea', h:'What you gain (pp.101–102)', p:R`<ul><li><b>Immunity to coupled noise.</b> A clock line placed midway between the two phases disturbs both equally; the difference survives (Fig. 4.2). Distributing noisy signals (clocks) differentially helps too (Fig. 4.4).</li><li><b>Supply-noise rejection.</b> Noise on \(V_{DD}\) moves X and Y together but not \(V_X-V_Y\) (Fig. 4.3).</li><li><b>Twice the swing.</b> Each output can swing \(V_{DD}-(V_{GS}-V_{TH})\); the difference swings twice that, peak to peak.</li><li>Simpler biasing and higher linearity (Ch 13). Area cost is minor in practice.</li></ul>`},
  {t:'check', q:{type:'mcq', q:'Supply noise ΔV appears on V_DD of a symmetric differential circuit. The differential output…', opts:['is unaffected (both sides move equally)','doubles the noise','halves the signal','clips immediately'], a:0, prereq:'b-cmdm', explain:'Fig. 4.3(b): noise moves V_X and V_Y equally; their difference is unchanged.'}},
  {t:'recall', prompt:'List four advantages of differential operation.', model:'Rejects coupled noise, rejects supply noise, doubles swing, simpler biasing / better linearity.'}
 ],
 cards:[['Differential signal','Two nodes with equal and opposite swings around a common-mode level'],['Differential swing vs single-ended','Twice as large (peak-to-peak)']]},

{id:'4b', unit:'Ch 4 · Differential amplifiers', sec:'4.2–4.2.1', label:'book', title:'The differential pair: a tail current that steers', mins:5, pages:[103,107], prereq:['4a','3d'],
 obj:'Explain the tail current, trace the pair’s transfer curve, and find the input CM range.',
 blocks:[
  {t:'why', p:R`Two separate CS stages (Fig. 4.5) handle differential signals, but their bias currents — and so gain and output level — drift with the input CM level. Add one current source under both sources and \(I_{D1}+I_{D2}=I_{SS}\) no matter what the CM level does.`},
  {t:'visual', fig:'diffPair', cap:'Fig. 4.6: basic differential pair (also called a source-coupled or long-tailed pair).'},
  {t:'interactive', kind:'dp', cap:'Fig. 4.7 / 4.12 live. At ΔV_in = 0 (equilibrium) each side carries I_SS/2 and the slope is steepest. Past ±ΔV_in1 one device hogs all of I_SS.'},
  {t:'idea', h:'Two key properties (p.104)', p:R`<ul><li>Output extremes are fixed: \(V_{DD}\) and \(V_{DD}-R_DI_{SS}\) — independent of the input CM level.</li><li>Small-signal gain is largest at equilibrium and falls as \(|V_{in1}-V_{in2}|\) grows: the pair becomes nonlinear for big inputs.</li></ul>`},
  {t:'formal', h:'Input common-mode range (4.1)', eq:[{tex:R`V_{GS1}+(V_{GS3}-V_{TH3})\ \le\ V_{in,CM}\ \le\ \min\Big[V_{DD}-R_D\frac{I_{SS}}2+V_{TH},\ V_{DD}\Big]`, note:'Lower limit: the tail transistor M₃ must stay saturated. Upper limit: M₁, M₂ must stay out of triode.'}]},
  {t:'example', src:'book', h:'Example 4.1 (p.106): gain vs input CM level', given:'Sketch the differential gain as V_in,CM rises.', steps:[{tex:R`V_{in,CM}<V_{TH}:\ A=0;\quad V_1<V_{in,CM}<V_2:\ A\approx\text{const};\quad V_{in,CM}>V_2:\ A\downarrow`, say:'Gain appears once the inputs turn on, flattens once the tail saturates (V₁), and drops once the input pair enters triode (V₂).'}]},
  {t:'idea', h:'Swing vs CM level (Fig. 4.10)', p:R`Each output may go from \(V_{DD}\) down to about \(V_{in,CM}-V_{TH}\). A higher input CM level means less output swing — and more gain (bigger \(R_DI_{SS}/2\)) forces a lower input CM level.`},
  {t:'check', q:{type:'mcq', q:'What does the tail current source make independent of the input CM level?', opts:['The sum I_D1 + I_D2 (and so the output CM level and gain)','The differential gain only','The threshold voltage','The input impedance'], a:0, explain:'I_D1 + I_D2 = I_SS fixes bias currents, g_m and the output CM level (p.103).'}},
  {t:'check', q:{type:'mcq', q:'Raising the input CM level too high causes…', opts:['M₁, M₂ to enter triode and gain to fall','the tail source to enter triode','infinite gain','nothing'], a:0, explain:'Upper bound in (4.1): V_in,CM ≤ V_DD − R_D I_SS/2 + V_TH.'}},
  {t:'recall', prompt:'Sketch V_out1 and V_out2 vs V_in1 − V_in2 and write the input CM range.', model:'Crossing at equilibrium, saturating at V_DD and V_DD − R_D I_SS. V_GS1 + V_ov3 ≤ V_in,CM ≤ min(V_DD − R_D I_SS/2 + V_TH, V_DD).'}
 ],
 cards:[['Role of the tail current source','Fixes I_D1 + I_D2 = I_SS regardless of input CM'],['Input CM range of a diff pair (4.1)','V_GS1 + (V_GS3 − V_TH3) ≤ V_in,CM ≤ min[V_DD − R_D I_SS/2 + V_TH, V_DD]']]},

{id:'4c', unit:'Ch 4 · Differential amplifiers', sec:'4.2.2', label:'book', title:'Large-signal math of the pair: ΔI_D, G_m and ΔV_in1', mins:5, pages:[107,110], prereq:['4b','2h'],
 obj:'Follow the derivation of Eq. 4.9 and use ΔV_in1 = √(2I_SS/µnCox(W/L)).',
 blocks:[
  {t:'derive', h:'From the square law to ΔI_D (4.2–4.9)', steps:[
    {tex:R`V_{in1}-V_{in2}=V_{GS1}-V_{GS2}`, say:'Both sources share node P. (4.2)', why:'KVL around the two gate–source loops.'},
    {tex:R`V_{GS}=\sqrt{\frac{2I_D}{\mu_nC_{ox}W/L}}+V_{TH}`, say:'Invert the square law for each device. (4.4)', why:'λ = 0, both saturated.'},
    {tex:R`V_{in1}-V_{in2}=\sqrt{\frac{2I_{D1}}{\mu_nC_{ox}W/L}}-\sqrt{\frac{2I_{D2}}{\mu_nC_{ox}W/L}}`, say:'V_TH cancels. (4.5)', why:'', ask:{q:'What extra fact lets us solve for I_D1 − I_D2?', opts:['I_D1 + I_D2 = I_SS','I_D1 = I_D2 always','V_TH = 0'], a:0}},
    {tex:R`\boxed{I_{D1}-I_{D2}=\tfrac12\mu_nC_{ox}\tfrac WL(V_{in1}-V_{in2})\sqrt{\frac{4I_{SS}}{\mu_nC_{ox}W/L}-(V_{in1}-V_{in2})^2}}`, say:'Square twice, use I_D1 + I_D2 = I_SS. (4.9)', why:'An odd function of ΔV_in, zero at equilibrium.'}]},
  {t:'stop'},
  {t:'formal', h:'What the formula tells you', eq:[{tex:R`G_m\big|_{\Delta V_{in}=0}=\sqrt{\mu_nC_{ox}\tfrac WL I_{SS}},\qquad |A_v|=\sqrt{\mu_nC_{ox}\tfrac WL I_{SS}}\;R_D`, note:'(4.10)–(4.11) — equals g_m of each device at I_SS/2'},{tex:R`\Delta V_{in1}=\sqrt{\frac{2I_{SS}}{\mu_nC_{ox}W/L}}`, note:'(4.12) beyond this one device is off and 4.9 no longer applies (its spurious second zero crossing is not real)'},{tex:R`(V_{GS}-V_{TH})_{eq}=\frac{\Delta V_{in1}}{\sqrt2}`, note:'(4.13) a wider linear range needs a bigger overdrive → lower g_m for the same I_SS'}]},
  {t:'example', src:'book', h:'Example 4.2 (p.109)', given:'How does the characteristic change with W/L and I_SS?', steps:[{tex:R`W/L\uparrow\Rightarrow\Delta V_{in1}\downarrow;\qquad I_{SS}\uparrow\Rightarrow\Delta V_{in1}\uparrow,\ \text{output swing}\uparrow`, say:'More linear with larger I_SS or smaller W/L — try it on the slider in lesson 4b.'}]},
  {t:'example', src:'ours', h:'Numbers (Table 2.1, W/L = 100, I_SS = 1 mA)', given:'', steps:[{tex:R`\Delta V_{in1}=\sqrt{\tfrac{2(1\text{m})}{134\mu\times100}}=0.386\ \text{V},\quad V_{ov,eq}=0.273\ \text{V}`, say:''},{tex:R`G_m(0)=\sqrt{134\mu\times100\times1\text{m}}=3.66\ \text{mS}`, say:'Same as g_m of one device at 0.5 mA (lesson 2p). With R_D = 2 kΩ, gain ≈ 7.3.'}]},
  {t:'check', q:{type:'num', q:'µnCox(W/L) = 2 mA/V², I_SS = 1 mA. ΔV_in1 in volts?', a:1, tol:0.01, unit:'V', explain:'√(2·1m/2m) = 1 V.'}},
  {t:'check', q:{type:'mcq', q:'To widen the linear input range at fixed I_SS you must…', opts:['reduce W/L (bigger overdrive, lower g_m)','increase W/L','reduce R_D','increase λ'], a:0, explain:'(4.12)–(4.13): ΔV_in1 ∝ 1/√(W/L).'}},
  {t:'recall', prompt:'Write ΔV_in1, G_m at equilibrium, and the link between ΔV_in1 and the equilibrium overdrive.', model:'ΔV_in1 = √(2I_SS/µnCox(W/L)); G_m = √(µnCox(W/L)I_SS); V_ov,eq = ΔV_in1/√2.'}
 ],
 cards:[['Diff pair ΔV_in1 (4.12)','√(2I_SS/(µnCox W/L))'],['Diff pair G_m at equilibrium','√(µnCox(W/L)I_SS) = g_m of each device'],['Equilibrium overdrive vs ΔV_in1','V_ov = ΔV_in1/√2']]},

{id:'4d', unit:'Ch 4 · Differential amplifiers', sec:'4.2.2', label:'book', title:'Small-signal gain by superposition (Method I)', mins:4, pages:[110,113], prereq:['4c','3h','3l'],
 obj:'Get |A_v| = g_mR_D by treating one input at a time.',
 blocks:[
  {t:'idea', p:R`Set \(V_{in2}=0\) and drive only \(V_{in1}\) (Fig. 4.15). Two things happen at once: <b>M₁ is a CS stage degenerated by M₂’s source</b> (\(1/g_{m2}\)) and drives X; <b>M₁ acts as a source follower driving M₂ as a common-gate stage</b>, which drives Y (Fig. 4.16).`},
  {t:'derive', h:'One input at a time', steps:[
    {tex:R`\frac{V_X}{V_{in1}}=\frac{-R_D}{\frac1{g_{m1}}+\frac1{g_{m2}}}`, say:'Degenerated CS: drain R ÷ source-path R. (4.14)', why:'Lesson 3h, with R_S = 1/g_m2.'},
    {tex:R`\frac{V_Y}{V_{in1}}=\frac{R_D}{\frac1{g_{m2}}+\frac1{g_{m1}}}`, say:'Thevenin of the follower: V_T = V_in1, R_T = 1/g_m1; then CG gain. (4.15)', why:'Lesson 3l.', ask:{q:'With g_m1 = g_m2 = g_m, (V_X − V_Y)/V_in1 equals…', opts:['−g_m R_D','−g_m R_D/2','−2g_m R_D'], a:0}},
    {tex:R`\frac{V_X-V_Y}{V_{in1}-V_{in2}}=-g_mR_D`, say:'Add the mirror-image effect of V_in2 (superposition). (4.19)', why:'Single-ended output (X or Y alone) gives half of this.'}]},
  {t:'example', src:'book', h:'Example 4.3 (p.113): unequal devices', given:'M₂ twice as wide as M₁, equal DC gate voltages.', steps:[{tex:R`I_{D2}=2I_{D1}=\tfrac23I_{SS},\ g_{m2}=2g_{m1}\Rightarrow|A_v|=\frac{2R_D}{\frac1{g_{m1}}+\frac1{2g_{m1}}}=\tfrac43g_{m1}R_D`, say:'(4.21) Lower than a symmetric pair using the same total width, because g_m1 is smaller.'}]},
  {t:'idea', h:'Cost vs a CS stage', p:R`For the same total current, each pair device carries \(I_{SS}/2\), so its \(g_m\) is \(1/\sqrt2\) of one device biased at \(I_{SS}\). Put differently: same gain as a CS stage, at twice the current (p.113).`},
  {t:'check', q:{type:'num', q:'Diff pair: g_m = 2 mS each, R_D = 5 kΩ. Single-ended gain (X only) magnitude?', a:5, tol:0.01, unit:'V/V', explain:'Differential gain = g_mR_D = 10; single-ended = half = 5.'}},
  {t:'recall', prompt:'Explain the two paths from V_in1 to the outputs.', model:'Path to X: M₁ as CS degenerated by 1/g_m2. Path to Y: M₁ as source follower driving M₂ as common gate.'}
 ],
 cards:[['Diff pair differential gain','g_m R_D (single-ended: half)'],['Diff pair vs CS power','Same gain needs twice the bias current']]},

{id:'4e', unit:'Ch 4 · Differential amplifiers', sec:'4.2.2', label:'book', title:'The half-circuit trick: node P is a virtual ground', mins:4, pages:[113,118], prereq:['4d','b-cmdm'],
 obj:'Apply the half-circuit concept and split arbitrary inputs into DM and CM parts.',
 blocks:[
  {t:'idea', h:'The lemma (p.114)', p:R`In a symmetric circuit, if one input rises by \(\Delta V\) and the other falls by \(\Delta V\) (and the circuit stays linear), the source node P does not move. One side’s current rises exactly as much as the other’s falls, and symmetry means P cannot “favour” either input.`},
  {t:'visual', fig:'halfCircuit', cap:'Fig. 4.20–4.21: ground P and analyse one side as a CS stage.'},
  {t:'example', src:'book', h:'Example 4.4 (p.115): including r_o', given:'Differential gain of Fig. 4.20(a) with λ ≠ 0.', steps:[{tex:R`\frac{V_X-V_Y}{2V_{in1}}=-g_m(R_D\|r_o)`, say:'One line with the half circuit; Method I would take a page.'}]},
  {t:'idea', h:'Arbitrary inputs (Example 4.5)', p:R`Write \(V_{in1},V_{in2}\) as DM ± CM parts (bridge lesson). Apply the half-circuit to the DM part: \(V_X-V_Y=-g_m(R_D\|r_o)(V_{in1}-V_{in2})\). For the CM part, with perfect symmetry and an ideal tail, each side’s current stays \(I_{SS}/2\), so X and Y do not move at all.`},
  {t:'check', q:{type:'mcq', q:'The half-circuit concept requires…', opts:['a symmetric circuit and differential (equal and opposite) inputs','an ideal tail only','single-ended output','λ = 0'], a:0, explain:'Without symmetry or with a CM component you must decompose and superpose (p.115–116).'}},
  {t:'check', q:{type:'num', q:'g_m = 3 mS, R_D = 10 kΩ, r_o = 40 kΩ. Differential gain magnitude?', a:24, tol:0.01, unit:'V/V', explain:'3 m × (10k‖40k = 8k) = 24.'}},
  {t:'recall', prompt:'State the half-circuit lemma and the resulting gain with r_o.', model:'Differential inputs leave P fixed → AC ground; each side is a CS stage; A_v = −g_m(R_D‖r_o).'}
 ],
 cards:[['Half-circuit concept','Symmetric pair + differential input → P is AC ground, analyse one side'],['Diff gain with r_o (Ex. 4.4)','g_m(R_D ‖ r_o)']]},

{id:'4f', unit:'Ch 4 · Differential amplifiers', sec:'4.3', label:'book', title:'Common-mode response, mismatch and CMRR', mins:5, pages:[118,124], prereq:['4e','3h'],
 obj:'Compute CM gain, CM-to-DM conversion and CMRR.',
 blocks:[
  {t:'visual', fig:'cmEquiv', cap:'Fig. 4.25: with a CM input and finite tail resistance R_SS, the two halves merge into one degenerated CS stage.'},
  {t:'formal', eq:[{tex:R`A_{v,CM}=-\frac{R_D/2}{1/(2g_m)+R_{SS}}`, note:'(4.28) output CM level moves; usually a minor concern'}]},
  {t:'example', src:'book', h:'Example 4.6 (pp.119–120): a resistor as the tail', given:R`\(I_{tail}=1\) mA via \(R_{SS}\); \((W/L)_{1,2}=25/0.5\), \(\mu_nC_{ox}=50\,\mu\)A/V², \(V_{TH}=0.6\) V, \(V_{DD}=3\) V.`, steps:[
    {tex:R`V_{GS}=\sqrt{\tfrac{2(0.5\text{m})}{50\mu\times50}}+0.6=1.23\ \text{V}\Rightarrow V_{in,CM}=1.73\ \text{V for }0.5\ \text{V on }R_{SS}=500\ \Omega`, say:'(a)'},
    {tex:R`g_m=1/(632\ \Omega)\Rightarrow R_D=3.16\ \text{k}\Omega\ \text{for gain }5;\ V_{out}=1.42\ \text{V}`, say:'(b) 290 mV from triode.'},
    {tex:R`\Delta V_{in,CM}=50\ \text{mV}\Rightarrow\Delta V_{X,Y}=50\,\text{mV}\times\frac{1580}{316+500}=96.8\ \text{mV}`, say:'(c) Now only 143 mV from triode — CM noise eats headroom.'}]},
  {t:'stop'},
  {t:'idea', h:'The real problem: CM → DM conversion', p:R`Any asymmetry turns a CM change into a <b>differential</b> error, which is indistinguishable from signal. With load mismatch \(\Delta R_D\), \(\Delta V_X\ne\Delta V_Y\) (4.34–4.35). With \(g_m\) mismatch (the larger effect in practice), and with tail capacitance making \(R_{SS}\) small at high frequency (Fig. 4.29):`},
  {t:'formal', eq:[{tex:R`A_{CM-DM}=-\frac{\Delta g_m\,R_D}{(g_{m1}+g_{m2})R_{SS}+1}`, note:'(4.43)'},{tex:R`\text{CMRR}=\left|\frac{A_{DM}}{A_{CM-DM}}\right|\approx\frac{g_m}{\Delta g_m}\big(1+2g_mR_{SS}\big)`, note:'(4.45)–(4.48), g_m = mean value'}]},
  {t:'example', src:'ours', h:'CMRR number', given:R`\(g_m=1\) mS, 1% mismatch (\(\Delta g_m=10\,\mu\)S), \(R_{SS}=100\) kΩ.`, steps:[{tex:R`\text{CMRR}\approx100\times(1+200)=20{,}100\ \Rightarrow\ 86\ \text{dB}`, say:'At high frequency the tail capacitance lowers R_SS and CMRR drops (Example 4.7).'}]},
  {t:'check', q:{type:'mcq', q:'Which is the more serious CM effect in a differential pair?', opts:['CM-to-differential conversion due to mismatch','Output CM shift in a perfectly symmetric pair','Higher gain','Lower power'], a:0, explain:'A differential error corrupts the signal itself (p.121).'}},
  {t:'check', q:{type:'num', q:'g_m/Δg_m = 50, 2g_mR_SS = 99. CMRR (plain ratio)?', a:5000, tol:0.01, unit:'', explain:'50 × (1 + 99) = 5000 (≈ 74 dB).'}},
  {t:'recall', prompt:'Write A_v,CM, A_CM−DM (g_m mismatch) and CMRR.', model:'−(R_D/2)/(1/(2g_m)+R_SS); −Δg_mR_D/[(g_m1+g_m2)R_SS+1]; CMRR ≈ (g_m/Δg_m)(1+2g_mR_SS).'}
 ],
 cards:[['CM gain of symmetric pair (4.28)','−(R_D/2)/(1/(2g_m) + R_SS)'],['CMRR with g_m mismatch (4.48)','≈ (g_m/Δg_m)(1 + 2g_m R_SS)'],['Why CMRR falls at high frequency','Tail capacitance lowers the tail impedance']]},

{id:'4g', unit:'Ch 4 · Differential amplifiers', sec:'4.4', label:'book', title:'Differential pairs with MOS loads and cascodes', mins:4, pages:[124,126], prereq:['4e','3f','3g','3m'],
 obj:'Write the gain with diode, current-source and cascode loads.',
 blocks:[
  {t:'visual', fig:'diffPairSrc', cap:'Fig. 4.32(b): PMOS current-source loads.'},
  {t:'formal', eq:[{tex:R`A_v=-g_{mN}\Big(\frac1{g_{mP}}\Big\|r_{oN}\Big\|r_{oP}\Big)\approx-\sqrt{\frac{\mu_n(W/L)_N}{\mu_p(W/L)_P}}`, note:'(4.49)–(4.51) diode loads: half-circuit of lesson 3f'},{tex:R`A_v=-g_{mN}(r_{oN}\|r_{oP})`, note:'(4.52) current-source loads — typically 10–20 in submicron'},{tex:R`|A_v|\approx g_{m1}\big[(g_{m3}r_{o3}r_{o1})\|(g_{m5}r_{o5}r_{o7})\big]`, note:'(4.53) cascode pair (Fig. 4.34): much more gain, much less headroom'}]},
  {t:'idea', h:'Two practical points', p:R`<ul><li>Diode loads eat headroom. Trick (Fig. 4.33): let PMOS current sources supply 80% of each input device’s current. The diodes carry 1/5 of the current, so with the same overdrive their \(W/L\) and \(g_m\) drop 5× → gain ≈ 5× higher.</li><li>High-gain fully differential stages need a way to set the <b>output CM level</b> (current-source loads leave it undefined; diode loads fix it at \(V_{DD}-|V_{GSP}|\)). That is common-mode feedback, Ch 9.</li></ul>`},
  {t:'example', src:'ours', h:'Numbers (Table 2.1, 0.5 mA per side)', given:R`\(g_{mN}=3.66\) mS, \(r_{oN}=20\) kΩ, \(r_{oP}=10\) kΩ.`, steps:[{tex:R`A_v=-3.66\,\text{m}\times(20\text{k}\|10\text{k})=-3.66\,\text{m}\times6.67\,\text{k}\approx-24`, say:'Within the 10–20-ish range the book quotes for short devices.'}]},
  {t:'check', q:{type:'mcq', q:'In Fig. 4.33, PMOS sources carry 80% of the input-device current. Gain rises by about…', opts:['5×','1.25×','0.8×','25×'], a:0, explain:'Load current falls to 1/5 → load g_m falls 5× at the same overdrive (p.125).'}},
  {t:'recall', prompt:'Write the gain with current-source loads and with cascoded loads.', model:'−g_mN(r_oN‖r_oP); ≈ g_m1[(g_m3r_o3r_o1)‖(g_m5r_o5r_o7)].'}
 ],
 cards:[['Diff pair with current-source loads','−g_mN(r_oN ‖ r_oP)'],['What sets output CM with current-source loads?','Nothing — needs CMFB (Ch 9)']]},

{id:'4h', unit:'Ch 4 · Differential amplifiers', sec:'4.5', label:'book', title:'Gilbert cell: a gain you can steer from + to −', mins:3, pages:[126,128], prereq:['4e'],
 obj:'Explain how the Gilbert cell varies gain and multiplies two signals.',
 blocks:[
  {t:'idea', p:R`Two facts: a pair’s gain depends on its tail current, and a pair can steer a current between two destinations. Build two pairs with <b>opposite</b> gains, sum their output currents by tying drains together, and let a third pair split the tail current between them (Fig. 4.36).`},
  {t:'visual', fig:'gilbert', cap:'Block view of Fig. 4.36(d). Upper quad M₁–M₄ takes V_in; lower pair M₅–M₆ takes V_cont.'},
  {t:'idea', p:R`<ul><li>Large positive \(V_{cont}\): all current to one pair → gain \(+g_mR_D\). Large negative: the other pair → \(-g_mR_D\). \(V_{cont}=0\): gain 0.</li><li><b>Multiplier</b> (Example 4.8): \(V_{out}=V_{in}f(V_{cont})\approx\alpha V_{in}V_{cont}\) for small \(V_{cont}\) — used as mixers.</li><li>Headroom: stacked pairs need the control CM level at least one overdrive below the input CM level. Inputs can also be swapped (Fig. 4.37).</li></ul>`},
  {t:'check', q:{type:'mcq', q:'Why does a Gilbert cell multiply?', opts:['Its gain is a function of V_cont, so V_out ≈ α·V_in·V_cont for small V_cont','It squares the input','It uses a mirror','It has infinite gain'], a:0, explain:'Example 4.8: first-order Taylor term of f(V_cont).'}},
  {t:'recall', prompt:'Describe the three operating points of the Gilbert cell.', model:'V_cont ≫ 0: +g_mR_D; V_cont ≪ 0: −g_mR_D; V_cont = 0: zero gain.'}
 ],
 cards:[['Gilbert cell as multiplier','V_out ≈ α·V_in·V_cont (Example 4.8)']]},

/* ---- Chapter 5 ---- */
{id:'5a', unit:'Ch 5 · Current mirrors', sec:'5.1', label:'book', title:'Why not just set V_GS? Copy a reference instead', mins:3, pages:[135,137], prereq:['2h','2m'],
 obj:'Explain why resistor-divider biasing is poor and why mirrors copy a reference.',
 blocks:[
  {t:'idea', p:R`Bias a MOSFET by a resistor divider (Fig. 5.2) and \(I_{out}=\tfrac12\mu_nC_{ox}\tfrac WL\big(\tfrac{R_2V_{DD}}{R_1+R_2}-V_{TH}\big)^2\) depends on supply, \(V_{TH}\) (±100 mV wafer to wafer) and mobility (temperature). The key line: <b>“if the gate–source voltage of a MOSFET is precisely defined, then its drain current is not!”</b> (p.136)`},
  {t:'example', src:'book', h:'How bad? (p.136)', given:'Nominal overdrive 200 mV, V_TH off by 50 mV.', steps:[{tex:R`\Big(\tfrac{150}{200}\Big)^2=0.56\Rightarrow\approx44\%\ \text{error in }I_{out}`, say:'Small overdrives (to save headroom) make it worse.'}]},
  {t:'idea', p:R`So designers build <b>one</b> careful reference current (Ch 11, bandgap) and <b>copy</b> it everywhere with current mirrors (Fig. 5.3).`},
  {t:'check', q:{type:'mcq', q:'Why is fixing V_GS a poor way to set a current?', opts:['I_D still depends on V_TH and µ, which vary with process and temperature','V_GS cannot be fixed','It wastes area','It makes λ = 0'], a:0, explain:'p.136.'}},
  {t:'recall', prompt:'Give the one-sentence reason current mirrors exist.', model:'A precise V_GS does not give a precise current, so copy a well-defined reference current instead.'}
 ],
 cards:[['Razavi on biasing (p.136)','A precisely defined V_GS does NOT give a precisely defined I_D']]},

{id:'5b', unit:'Ch 5 · Current mirrors', sec:'5.1', label:'book', title:'The basic current mirror and current ratios', mins:4, pages:[137,139], prereq:['5a','3f'],
 obj:'Use I_out = I_REF·(W/L)₂/(W/L)₁ and design ratios.',
 blocks:[
  {t:'visual', fig:'mirror', cap:'Fig. 5.5(b): M₁ diode-connected turns I_REF into V_GS; M₂ turns that V_GS back into a current.'},
  {t:'formal', eq:[{tex:R`I_{out}=\frac{(W/L)_2}{(W/L)_1}\,I_{REF}`, note:'(5.4) µnCox and V_TH cancel — process- and temperature-independent to first order'}]},
  {t:'example', src:'book', h:'Example 5.1 (p.138): two mirrors in a row', given:'NMOS mirror M₁→M₂ feeds a PMOS mirror M₃→M₄.', steps:[{tex:R`|I_{D4}|=\alpha\beta I_{REF},\quad\alpha=\tfrac{(W/L)_2}{(W/L)_1},\ \beta=\tfrac{(W/L)_4}{(W/L)_3}`, say:'α = β = 5 gives ×25; α = β = 0.2 gives a small, well-defined current.'}]},
  {t:'idea', h:'Layout rule (p.139)', p:R`Keep the <b>same L</b> for all mirror devices and scale only W — and in practice scale W by placing multiple identical unit transistors (fingers) in parallel. \(L_{eff}=L_{drawn}-2L_D\) does not scale with \(L_{drawn}\), and short-channel \(V_{TH}\) depends on L.`},
  {t:'example', src:'book', h:'Example 5.2 (p.139): a mirror processes signal', given:'M₁ (CS, input) drives diode M₂, mirrored to M₃ with load R_L.', steps:[{tex:R`A_v=g_{m1}R_L\frac{(W/L)_3}{(W/L)_2}`, say:'The mirror copies the small-signal current too.'}]},
  {t:'check', q:{type:'num', q:'I_REF = 20 µA, (W/L)₁ = 10/1, (W/L)₂ = 40/1. I_out in µA?', a:80, tol:0.01, unit:'µA', explain:'Ratio 4 → 80 µA.'}},
  {t:'check', q:{type:'mcq', q:'Why keep L equal and scale only W in a mirror?', opts:['L_eff = L_drawn − 2L_D does not scale proportionally, and V_TH depends on L','Wider devices are faster','To reduce λ','Because PMOS needs it'], a:0, explain:'p.139.'}},
  {t:'recall', prompt:'Write the mirror ratio and the layout rule.', model:'I_out = I_REF(W/L)₂/(W/L)₁; same L, scale W with parallel unit devices.'}
 ],
 cards:[['Basic mirror ratio (5.4)','I_out = I_REF·(W/L)₂/(W/L)₁'],['Mirror layout rule','Same L; scale W with unit fingers']]},

{id:'5c', unit:'Ch 5 · Current mirrors', sec:'5.2', label:'book', title:'Channel-length modulation error and the cascode mirror', mins:5, pages:[139,143], prereq:['5b','3m'],
 obj:'Quantify the λ error and design a cascode mirror with V_Y = V_X.',
 blocks:[
  {t:'formal', eq:[{tex:R`\frac{I_{D2}}{I_{D1}}=\frac{(W/L)_2}{(W/L)_1}\cdot\frac{1+\lambda V_{DS2}}{1+\lambda V_{DS1}}`, note:'(5.7) V_DS1 = V_GS, but V_DS2 is set by whatever the output connects to'}]},
  {t:'example', src:'ours', h:'How big?', given:'λ = 0.1 V⁻¹, V_DS1 = V_GS = 1 V, V_DS2 = 2 V.', steps:[{tex:R`\frac{1.2}{1.1}=1.09\Rightarrow9\%\ \text{error}`, say:'Large for a bias network.'}]},
  {t:'interactive', kind:'mirror', cap:'Simple vs cascode mirror: output current vs output voltage.'},
  {t:'visual', fig:'cascMirror', cap:'Fig. 5.9(c): cascode current mirror. M₀ generates the cascode gate voltage.'},
  {t:'idea', p:R`A cascode device M₃ shields M₂: a change at the output appears at Y divided by \((g_{m3}+g_{mb3})r_{o3}\). To make \(V_Y=V_X\), give M₃ a gate voltage one \(V_{GS}\) above \(V_X\) — exactly what a second diode M₀ stacked on M₁ produces. Size \((W/L)_3/(W/L)_0=(W/L)_2/(W/L)_1\); this works even with body effect.`},
  {t:'formal', h:'Headroom cost (5.12–5.13)', eq:[{tex:R`V_{P,min}=(V_{GS0}-V_{TH})+(V_{GS1}-V_{TH})+V_{TH}`, note:'two overdrives + one V_TH — one V_TH “wasted” vs the ideal cascode (Fig. 5.11)'}]},
  {t:'example', src:'book', h:'Example 5.4 (p.142): who enters triode first?', given:'Identical devices; V_X falls from a high value.', steps:[{tex:R`M_3\ \text{first, at }V_X<V_N-V_{TH}`, say:'If M₂ went first its current would fall while M₃’s V_GS rose — impossible with M₃ saturated. Then V_B drops, M₂ follows, and output impedance collapses.'}]},
  {t:'check', q:{type:'mcq', q:'The cascode mirror’s minimum output voltage is…', opts:['2V_ov + V_TH','V_ov','2V_ov','V_DD'], a:0, explain:'(5.13).'}},
  {t:'check', q:{type:'num', q:'λ = 0.05 V⁻¹, V_DS1 = 1 V, V_DS2 = 3 V (equal sizes). I_out/I_REF?', a:1.095, tol:0.01, unit:'', explain:'1.15/1.05 = 1.095.'}},
  {t:'recall', prompt:'Why does a cascode mirror copy accurately, and what does it cost?', model:'M₃ shields M₂ so V_Y ≈ V_X (equal V_DS); costs 2V_ov + V_TH of headroom.'}
 ],
 cards:[['Simple mirror λ error (5.7)','×(1+λV_DS2)/(1+λV_DS1)'],['Cascode mirror sizing','(W/L)₃/(W/L)₀ = (W/L)₂/(W/L)₁'],['Cascode mirror headroom','2V_ov + V_TH']]},

{id:'5d', unit:'Ch 5 · Current mirrors', sec:'5.2', label:'book', title:'Low-voltage cascode: getting the V_TH back', mins:3, pages:[143,145], prereq:['5c'],
 obj:'State the condition for a low-voltage cascode and how V_b is generated.',
 blocks:[
  {t:'formal', h:'Fig. 5.13(a): cascode with output shorted to input', eq:[{tex:R`V_{GS2}+(V_{GS1}-V_{TH1})\le V_b\le V_{GS1}+V_{TH2}`, note:'(5.14) a solution exists only if V_GS2 − V_TH2 < V_TH1: keep M₂’s overdrive below one threshold'}]},
  {t:'idea', p:R`With \(V_b\) set this way, the output cascode M₃–M₄ needs only two overdrives, while M₁ and M₃ still see equal \(V_{DS}\): the “low-voltage cascode” (Fig. 5.13b). Generating \(V_b\) (Fig. 5.14–5.15): a diode plus a resistor drop, a wide diode with \(V_{GS}\approx V_{TH}\), or a low-current-density source follower. All suffer some error (body effect, poorly controlled \(R_bI_1\)), so leave margin.`},
  {t:'check', q:{type:'mcq', q:'Low-voltage cascode headroom (output side) is about…', opts:['2V_ov','2V_ov + V_TH','V_TH','3V_ov'], a:0, explain:'p.143–144.'}},
  {t:'recall', prompt:'Write the condition on M₂’s overdrive for a low-voltage cascode.', model:'V_GS2 − V_TH2 < V_TH1.'}
 ],
 cards:[['Low-voltage cascode condition','V_ov2 < V_TH1 (5.14)']]},

{id:'5e', unit:'Ch 5 · Current mirrors', sec:'5.3–5.3.1', label:'book', title:'Active current mirror: differential in, single-ended out', mins:5, pages:[145,151], prereq:['5b','4e','3i'],
 obj:'Compare current-source and active-mirror loads, and describe large-signal behaviour.',
 blocks:[
  {t:'idea', h:'First, a plain current-source load (Fig. 5.17)', p:R`With a PMOS current source on one side and output taken single-ended: \(G_m=g_{m1}/2\) and \(R_{out}\approx(2r_{o2})\|r_{o4}\), so \(|A_v|\approx\tfrac{g_{m1}}2[(2r_{o2})\|r_{o4}]\) (5.17). Half of the signal current (M₁’s) is wasted.`},
  {t:'visual', fig:'diffPairMirror', cap:'Fig. 5.20(b): M₃ (diode) mirrors M₁’s current into M₄, so both halves of the signal current reach the output.'},
  {t:'idea', p:R`If \(V_{in1}\) rises: \(I_{D1}\) up, \(I_{D2}\) down, and M₄ copies \(I_{D1}\)’s rise. At the output, M₂ pulls less while M₄ pushes more — both push \(V_{out}\) up. This converts a differential input to a single-ended output.`},
  {t:'idea', h:'Large-signal facts (pp.149–150)', p:R`<ul><li>With perfect symmetry and \(V_{in1}=V_{in2}\): \(V_{out}=V_F=V_{DD}-|V_{GS3}|\).</li><li>The output can go no lower than \(V_{in,CM}-V_{TH}\): input CM level and output swing are directly traded — a key drawback.</li><li>Tiny asymmetry (e.g., a slightly lower \(V_{TH2}\)) shifts \(V_{out}\) a lot, possibly into triode. So the circuit is rarely used open-loop for small signals.</li></ul>`},
  {t:'example', src:'ours', h:'Compare the two loads (Table 2.1, 0.5 mA per side)', given:R`\(g_m=3.66\) mS, \(r_{o2}=20\) kΩ, \(r_{o4}=10\) kΩ.`, steps:[{tex:R`\text{current-source load: }1.83\,\text{m}\times(40\text{k}\|10\text{k})=14.6`, say:'(5.17)'},{tex:R`\text{active mirror: }3.66\,\text{m}\times(20\text{k}\|10\text{k})=24.4`, say:'(5.32), next lesson.'}]},
  {t:'check', q:{type:'mcq', q:'In a symmetric active-mirror pair at equilibrium, V_out equals…', opts:['V_DD − |V_GS3| (same as node F)','V_DD','0','V_in,CM'], a:0, explain:'p.149 (proof by contradiction).'}},
  {t:'recall', prompt:'Why does the active mirror double G_m compared with a single current-source load?', model:'M₃–M₄ copy M₁’s signal current to the output with the right polarity, so both halves add.'}
 ],
 cards:[['Equilibrium output of active-mirror pair','V_out = V_DD − |V_GS3|'],['Active-mirror pair drawback','Output swing tied to input CM; sensitive to mismatch open-loop']]},

{id:'5f', unit:'Ch 5 · Current mirrors', sec:'5.3.2', label:'book', title:'Gain of the active-mirror pair: g_m(r_o2 ‖ r_o4)', mins:4, pages:[151,154], prereq:['5e','3i'],
 obj:'Derive G_m = g_m1,2 and R_out ≈ r_o2‖r_o4.',
 blocks:[
  {t:'idea', p:R`Half-circuit does not apply: node X (diode) swings little while Y swings a lot (Fig. 5.23). Use \(|A_v|=G_mR_{out}\).`},
  {t:'derive', h:'G_m and R_out', steps:[
    {tex:R`G_m=g_{m1,2}`, say:'Short the output; P ≈ virtual ground because X barely moves (Fig. 5.24). I_out = g_m V_in/2 (from M₂) + g_m V_in/2 (mirrored by M₄).', why:'Twice the G_m of Fig. 5.17.'},
    {tex:R`I_X=\frac{2V_X}{2r_{o1,2}+(1/g_{m3})\|r_{o3}}+\frac{V_X}{r_{o4}}`, say:'Test source at the output: M₁+M₂ act as a resistor 2r_o; the current through it is mirrored by M₃–M₄ (factor 2). (5.27)', why:'Ideal tail = open for small signals.', ask:{q:'For 2r_o1,2 ≫ 1/g_m3, R_out ≈ ?', opts:['r_o2 ‖ r_o4','2r_o2 ‖ r_o4','r_o4'], a:0}},
    {tex:R`\boxed{|A_v|=g_{m1,2}(r_{o2}\|r_{o4})}`, say:'(5.28), (5.32) — the Thevenin method (Fig. 5.26–5.27) gives the same result.', why:''}]},
  {t:'example', src:'book', h:'Example 5.6 (p.154)', given:'A single CS device with a current-source load (Fig. 5.28).', steps:[{tex:R`A_v=g_{m1}(r_{o1}\|r_{o2})`, say:'Same gain at half the current — but differential operation’s benefits usually outweigh the power.'}]},
  {t:'check', q:{type:'num', q:'g_m = 2 mS, r_o2 = 30 kΩ, r_o4 = 30 kΩ. Active-mirror pair gain?', a:30, tol:0.01, unit:'V/V', explain:'2 m × 15 k = 30.'}},
  {t:'recall', prompt:'Write G_m, R_out and gain of the active-mirror pair.', model:'G_m = g_m1,2; R_out ≈ r_o2‖r_o4; A_v = g_m1,2(r_o2‖r_o4).'}
 ],
 cards:[['Active-mirror pair gain (5.32)','g_m1,2 (r_o2 ‖ r_o4)'],['Active-mirror pair G_m','g_m1,2 (twice the simple current-source-load case)']]},

{id:'5g', unit:'Ch 5 · Current mirrors', sec:'5.3.3', label:'book', title:'Common-mode behaviour of the active-mirror pair', mins:4, pages:[154,158], prereq:['5f','4f'],
 obj:'Compute CM gain and CMRR, and see why the output is corrupted even with symmetry.',
 blocks:[
  {t:'formal', eq:[{tex:R`A_{CM}=\frac{\Delta V_{out}}{\Delta V_{in,CM}}\approx-\frac{1}{1+2g_{m1,2}R_{SS}}\cdot\frac{g_{m1,2}}{g_{m3,4}}`, note:'(5.35) single-ended output, symmetric circuit: nonzero even with perfect matching'},{tex:R`\text{CMRR}\approx(1+2g_{m1,2}R_{SS})\,g_{m3,4}\,(r_{o1,2}\|r_{o3,4})`, note:'(5.38)'}]},
  {t:'idea', p:R`Unlike the fully differential pair (Ch 4), here even a perfectly symmetric circuit lets CM changes reach the output. High-frequency CM noise is worse because tail capacitance lowers \(R_{SS}\). With \(g_m\) mismatch, an extra term \((g_{m1}-g_{m2})r_{o3}\) appears (5.51).`},
  {t:'example', src:'book', h:'Example 5.7 (pp.156–157): spot the flaw', given:'“A CM change raises I_D1 and I_D2 by ΔI; M₃ copies ΔI into M₄, which supplies M₂’s extra ΔI, so V_out doesn’t move.”', steps:[{tex:R`|\Delta I_{D4}|=g_{m4}\Delta I\frac{r_{o3}}{1+g_{m3}r_{o3}}<\Delta I`, say:'M₃’s r_o3 steals a little; the mismatch flows through r_o4: ΔV_out = −ΔI·r_o4/(g_m3r_o3 + 1), equal to the change at node F.'}]},
  {t:'example', src:'ours', h:'CMRR number', given:R`\(g_{m1,2}=3.66\) mS, \(R_{SS}=50\) kΩ, \(g_{m3,4}=2\) mS, \(r_{o1,2}\|r_{o3,4}=6.67\) kΩ.`, steps:[{tex:R`(1+366)\times2\,\text{m}\times6.67\,\text{k}\approx4900\Rightarrow74\ \text{dB}`, say:''}]},
  {t:'check', q:{type:'mcq', q:'Compared with a fully differential pair, the active-mirror pair’s CM response is…', opts:['worse: nonzero even with perfect symmetry','identical','always zero','better'], a:0, explain:'p.156.'}},
  {t:'recall', prompt:'Write the CMRR of the active-mirror pair.', model:'(1 + 2g_m1,2R_SS)·g_m3,4·(r_o1,2 ‖ r_o3,4).'}
 ],
 cards:[['Active-mirror pair CMRR (5.38)','(1 + 2g_m1,2 R_SS) g_m3,4 (r_o1,2 ‖ r_o3,4)'],['Active-mirror pair CM gain with perfect symmetry','Nonzero (single-ended output)']]}
);

LESSONS.push(
{id:'b-cplx', unit:'Foundations', label:'bridge', title:'Capacitors at a frequency: jω, magnitude and phase', mins:4, prereq:['b-cap'], unlocks:['b-pole','6a'],
 obj:'Use Z_C = 1/(jωC), and turn a complex number into magnitude and phase.',
 why:'Chapter 6 writes every capacitor as 1/(Cs) with s = jω. You need to read magnitude and phase from that.',
 blocks:[
  {t:'why', p:R`At DC a capacitor is an open circuit; at very high frequency it is a short. In between, its impedance depends on frequency, and the output of a circuit is both <b>scaled</b> and <b>delayed</b> (phase-shifted). Complex numbers keep track of both at once.`},
  {t:'formal', eq:[{tex:R`Z_C=\frac{1}{j\omega C}=\frac{1}{sC},\qquad s=j\omega,\ \ \omega=2\pi f`, note:'j = √−1. Bigger ω or C → smaller impedance.'},{tex:R`a+jb:\quad |a+jb|=\sqrt{a^2+b^2},\qquad \angle(a+jb)=\tan^{-1}\frac ba`, note:'magnitude = how much; phase = how far ahead/behind'},{tex:R`\left|\frac{1}{1+j x}\right|=\frac{1}{\sqrt{1+x^2}},\qquad \angle\frac{1}{1+jx}=-\tan^{-1}x`, note:'the one expression you will meet over and over'}]},
  {t:'example', src:'ours', h:'A 1 pF capacitor', given:'At f = 1 GHz.', steps:[{tex:R`|Z_C|=\frac{1}{2\pi(10^9)(10^{-12})}=159\ \Omega`, say:'At 1 MHz it would be 159 kΩ.'}]},
  {t:'check', q:{type:'mcq', q:'|1/(1 + j)| equals…', opts:['1/√2 ≈ 0.707','1','0.5','2'], a:0, explain:'1/√(1+1) = 0.707 — that is −3 dB, the classic “corner” value. The phase is −45°.'}},
  {t:'check', q:{type:'num', q:'|Z_C| of 10 pF at 100 MHz, in Ω?', a:159, tol:0.02, unit:'Ω', explain:'1/(2π·10⁸·10⁻¹¹) ≈ 159 Ω.'}},
  {t:'recall', prompt:'Write Z_C, and the magnitude and phase of 1/(1+jx).', model:'Z_C = 1/(jωC); |·| = 1/√(1+x²), phase = −tan⁻¹x.'}
 ],
 cards:[['Capacitor impedance','1/(jωC) = 1/(sC)'],['|1/(1+jx)| and phase','1/√(1+x²), −tan⁻¹x']]},

{id:'b-pole', unit:'Foundations', label:'bridge', title:'Poles, zeros and Bode plots', mins:5, prereq:['b-cplx','b-log'], unlocks:['6b','6c','6d','6e','6f'],
 obj:'Read a transfer function’s poles and zeros, and sketch its Bode plot.',
 why:'Every result in Chapter 6 is a pole or a zero. A Bode plot shows what each one does to gain and phase.',
 blocks:[
  {t:'formal', h:'One RC = one pole', eq:[{tex:R`\frac{V_{out}}{V_{in}}=\frac{1}{1+sRC}=\frac{1}{1+s/\omega_p},\qquad \omega_p=\frac1{RC}`, note:'pole frequency (rad/s); f_p = ω_p/2π. At ω_p the gain is −3 dB and the phase −45°.'},{tex:R`H(s)=A_0\frac{1+s/\omega_z}{(1+s/\omega_{p1})(1+s/\omega_{p2})}`, note:'poles in the denominator, zeros in the numerator'}]},
  {t:'interactive', kind:'bode', cap:'Build a transfer function and watch its Bode plot.'},
  {t:'idea', h:'Rules of thumb', p:R`<ul><li>Each pole: gain slope drops by <b>20 dB/decade</b>, phase falls by 90° (spread over about two decades around the pole).</li><li>Each LHP zero: slope rises by 20 dB/dec, phase <b>rises</b> 90°.</li><li>A <b>right-half-plane (RHP) zero</b> also raises the slope but <b>lowers</b> the phase like a pole. That combination is what destabilises feedback amplifiers (Ch 10).</li><li>“Dominant pole”: if one pole is far below the others, it alone sets the bandwidth.</li></ul>`},
  {t:'check', q:{type:'mcq', q:'A two-pole amplifier well above both poles falls at…', opts:['−40 dB/decade','−20 dB/decade','−6 dB/decade','0 dB/decade'], a:0, prereq:'b-log', explain:'−20 dB/dec per pole.'}},
  {t:'check', q:{type:'mcq', q:'What makes an RHP zero different from an LHP zero?', opts:['Same magnitude effect, but it subtracts phase instead of adding it','It lowers the gain slope','It has no effect on phase','It only appears in BJTs'], a:0, explain:'Magnitude +20 dB/dec either way; phase −90° for RHP, +90° for LHP.'}},
  {t:'recall', prompt:'Give the slope and phase change for a pole, an LHP zero and an RHP zero.', model:'Pole: −20 dB/dec, −90°. LHP zero: +20 dB/dec, +90°. RHP zero: +20 dB/dec, −90°.'}
 ],
 cards:[['Pole of an RC network','ω_p = 1/(RC); −3 dB and −45° at ω_p'],['Per pole on a Bode plot','−20 dB/decade, −90°'],['RHP zero','+20 dB/dec magnitude, but −90° phase']]},

{id:'6a', unit:'Ch 6 · Frequency response', sec:'6.1.1', label:'book', title:'Miller’s theorem: why a small C_GD looks huge', mins:4, pages:[166,169], prereq:['b-cplx','3c'],
 obj:'Use Z₁ = Z/(1−A_v) and know when Miller’s theorem misleads.',
 blocks:[
  {t:'visual', fig:'miller', cap:'Fig. 6.1: a floating impedance replaced by two grounded ones.'},
  {t:'derive', h:'Proof (6.1–6.3)', steps:[
    {tex:R`\frac{V_X-V_Y}{Z}=\frac{V_X}{Z_1}`, say:'The current leaving X through Z must equal the current through Z₁.', why:'Same current for equivalence.'},
    {tex:R`Z_1=\frac{Z}{1-V_Y/V_X}=\frac{Z}{1-A_v}`, say:'Divide by V_X. (6.2)', why:'', ask:{q:'If A_v = −10 and Z is a capacitor C_F, the input sees…', opts:['11 C_F','C_F/11','10 C_F'], a:0}},
    {tex:R`Z_2=\frac{Z}{1-1/A_v}`, say:'Same argument at Y. (6.3)', why:''}]},
  {t:'example', src:'book', h:'Example 6.1 (p.167)', given:'Inverting amplifier of gain −A with a feedback capacitor C_F.', steps:[{tex:R`C_{in}=(1+A)C_F`, say:'Physical picture: a step ΔV at X makes Y drop by AΔV, so C_F sees (1+A)ΔV and draws (1+A) times the charge.'}]},
  {t:'idea', h:'Use it carefully (pp.168–169)', p:R`<ul><li>The theorem says nothing about <b>when</b> the split is valid. If Z is the <i>only</i> signal path (a resistive divider, Fig. 6.3) it gives the right input impedance but the wrong gain. It works best when Z is <b>in parallel</b> with the main signal path (Fig. 6.4).</li><li>A_v should be evaluated at the frequency of interest; using the low-frequency value is an approximation that can hide zeros.</li><li>You cannot use the same split for both the transfer function and the output impedance. Example 6.2: a CG input resistance with r_o gives R_in = ∞ by Miller, matching Ch 3.</li></ul>`},
  {t:'check', q:{type:'num', q:'C_GD = 10 fF across a stage with gain −49. Effective input capacitance (fF)?', a:500, tol:0.01, unit:'fF', explain:'(1 + 49)·10 fF = 500 fF.'}},
  {t:'recall', prompt:'State Miller’s theorem and one situation where it fails.', model:'Z₁ = Z/(1−A_v), Z₂ = Z/(1−1/A_v); fails for gain when Z is the only path (resistive divider).'}
 ],
 cards:[['Miller’s theorem','Z₁ = Z/(1−A_v), Z₂ = Z/(1−1/A_v)'],['Miller capacitance (gain −A)','C_in = (1+A)C_F']]},

{id:'6b', unit:'Ch 6 · Frequency response', sec:'6.1.2', label:'book', title:'One pole per node: the fast estimate', mins:3, pages:[169,171], prereq:['6a','b-pole'],
 obj:'Estimate each pole as 1/(R·C seen at that node).',
 blocks:[
  {t:'formal', eq:[{tex:R`\frac{V_{out}}{V_{in}}=\frac{A_1A_2}{(1+R_SC_{in}s)(1+R_1C_Ns)(1+R_2C_Ps)}`, note:'(6.10) cascade of ideal amplifiers: each node gives one pole ω_j = 1/τ_j'}]},
  {t:'idea', p:R`Rule: multiply the <b>total capacitance</b> from a node to ground by the <b>total resistance</b> from that node to ground — that is the node’s time constant. It fails when nodes interact through a floating element (Fig. 6.7), but it is the best first guess you have.`},
  {t:'example', src:'book', h:'Example 6.3 (p.170): the input pole', given:'R_S drives an inverting amp (−A) with feedback C_F.', steps:[{tex:R`\omega_{in}=\frac{1}{R_S(1+A)C_F}`, say:'Miller-multiplied C_F times R_S.'}]},
  {t:'example', src:'book', h:'Example 6.4 (p.171): CG stage, λ = 0', given:'Caps C_S at the source, C_D at the drain.', steps:[{tex:R`\omega_{in}=\Big[C_S\Big(R_S\Big\|\tfrac1{g_m+g_{mb}}\Big)\Big]^{-1},\quad\omega_{out}=[C_DR_D]^{-1}`, say:'(6.11)–(6.13): input and output nodes are isolated, so the estimate is exact here.'}]},
  {t:'check', q:{type:'num', q:'A node sees 5 kΩ to ground and 200 fF total. Pole frequency f_p in MHz?', a:159, tol:0.02, unit:'MHz', explain:'1/(2π·5k·200f) = 159 MHz.'}},
  {t:'recall', prompt:'State the “one pole per node” rule and its limitation.', model:'ω = 1/(R_node·C_node); fails when floating impedances couple nodes.'}
 ],
 cards:[['One-pole-per-node estimate','ω_j = 1/(R_j C_j) at each node'],['Input pole with Miller cap (Ex. 6.3)','1/[R_S(1+A)C_F]']]},

{id:'6c', unit:'Ch 6 · Frequency response', sec:'6.2', label:'book', title:'Common-source stage: two poles and a right-half-plane zero', mins:6, pages:[172,177], prereq:['6b','3c'],
 obj:'Compare Miller estimates with the exact CS transfer function and explain the RHP zero.',
 blocks:[
  {t:'visual', fig:'csCaps', cap:'Fig. 6.10: CS stage with R_S, C_GS, C_GD, C_DB.'},
  {t:'formal', h:'Quick estimates (6.14–6.15)', eq:[{tex:R`\omega_{in}=\frac{1}{R_S[C_{GS}+(1+g_mR_D)C_{GD}]},\qquad \omega_{out}=\frac{1}{R_D(C_{GD}+C_{DB})}`, note:'Miller with the low-frequency gain'}]},
  {t:'formal', h:'Exact (6.23)', eq:[{tex:R`\frac{V_{out}}{V_{in}}=\frac{(C_{GD}s-g_m)R_D}{R_SR_D\xi s^2+[R_S(1+g_mR_D)C_{GD}+R_SC_{GS}+R_D(C_{GD}+C_{DB})]s+1}`, note:'ξ = C_GS C_GD + C_GS C_DB + C_GD C_DB. Second order, not third: the three capacitors form a loop.'},{tex:R`\omega_{p1}\approx\frac{1}{R_S(1+g_mR_D)C_{GD}+R_SC_{GS}+R_D(C_{GD}+C_{DB})}`, note:'(6.26) dominant pole = 1/(coefficient of s): Miller estimate plus one extra term'},{tex:R`\omega_{p2}\approx\frac{R_S(1+g_mR_D)C_{GD}+R_SC_{GS}+R_D(C_{GD}+C_{DB})}{R_SR_D\xi}`, note:'(6.32); reduces to the Miller output pole only if C_GS dominates'}]},
  {t:'interactive', kind:'csfreq', cap:'Exact (6.23) vs the Miller estimate. Raise R_S: the input pole drops. Add C_L: the poles move closer and Miller becomes a poor guide.'},
  {t:'idea', h:'The RHP zero ω_z = +g_m/C_GD (6.35)', p:R`C_GD is a feedforward path from input to output. At the zero frequency, the current through C_GD exactly cancels g_m v₁, so no current reaches the output — short the output and nothing flows (Fig. 6.15). It is in the right half plane because the feedforward current has the opposite sign to the transistor’s inverted current. It flattens the roll-off and causes stability trouble in feedback (Ch 10).`},
  {t:'example', src:'book', h:'Example 6.5 (pp.174–175): current-source load', given:'R_D → ∞.', steps:[{tex:R`\omega_p\approx\frac{1}{R_S(C_{GS}+C_{GD})}\ \text{for large }C_{DB}`, say:'(6.30) Miller vanishes: with heavy load capacitance the gain from X to the output has already rolled off at that frequency.'}]},
  {t:'idea', h:'Input impedance (6.36–6.38)', p:R`To first order \(Z_{in}=1/\{[C_{GS}+(1+g_mR_D)C_{GD}]s\}\) — capacitive. At higher frequency the output node matters and \(Z_{in}\) gains a real part; with large C_GD, 1/g_m and R_D appear in parallel with the input.`},
  {t:'check', q:{type:'num', q:'g_m = 2 mS, C_GD = 20 fF. RHP zero frequency (GHz)?', a:15.9, tol:0.02, unit:'GHz', explain:'g_m/(2πC_GD) = 2m/(2π·20f) ≈ 15.9 GHz.'}},
  {t:'check', q:{type:'mcq', q:'Why is the CS transfer function second order with three capacitors?', opts:['The capacitors form a loop, leaving only two independent initial conditions','C_GS is ignored','C_DB is in series','Because λ = 0'], a:0, explain:'p.174.'}},
  {t:'recall', prompt:'Write the Miller input pole, the exact dominant pole and the zero of a CS stage.', model:'1/R_S[C_GS+(1+g_mR_D)C_GD]; add R_D(C_GD+C_DB) in the denominator; ω_z = +g_m/C_GD.'}
 ],
 cards:[['CS input pole (Miller)','1/R_S[C_GS + (1+g_mR_D)C_GD]'],['CS RHP zero','+g_m/C_GD'],['Why second order?','The three caps form a loop']]},

{id:'6d', unit:'Ch 6 · Frequency response', sec:'6.3', label:'book', title:'Source follower at high frequency: a zero, negative R and an inductor', mins:5, pages:[178,182], prereq:['6c','3j'],
 obj:'Find the follower’s dominant pole, input impedance and inductive output impedance.',
 blocks:[
  {t:'formal', eq:[{tex:R`\frac{V_{out}}{V_{in}}=\frac{g_m+C_{GS}s}{R_S\xi s^2+(g_mR_SC_{GD}+C_L+C_{GS})s+g_m}`, note:'(6.42) LHP zero: C_GS passes signal with the SAME polarity as the transistor'},{tex:R`\omega_{p1}\approx\frac{1}{R_SC_{GD}+\frac{C_L+C_{GS}}{g_m}}`, note:'(6.44); with R_S = 0, ω_p1 = g_m/(C_L+C_GS)'}]},
  {t:'formal', h:'Input impedance (6.46–6.48)', eq:[{tex:R`Z_{in}\approx\frac{1}{C_{GS}s}\Big(1+\frac{g_m}{g_{mb}}\Big)+\frac1{g_{mb}}`, note:'low f: input cap = C_GD + C_GS·g_mb/(g_m+g_mb) — only a fraction of C_GS'},{tex:R`Z_{in}\approx\frac1{C_{GS}s}+\frac1{C_Ls}-\frac{g_m}{C_{GS}C_L\omega^2}`, note:'high f: a NEGATIVE resistance in series — used in oscillators (Ch 14)'}]},
  {t:'formal', h:'Output impedance looks inductive (6.52–6.55)', eq:[{tex:R`Z_{out}=\frac{R_SC_{GS}s+1}{g_m+C_{GS}s}`, note:'1/g_m at low f, R_S at high f'},{tex:R`L=\frac{C_{GS}}{g_m}\Big(R_S-\frac1{g_m}\Big)`, note:'Fig. 6.21 model: R₂ = 1/g_m, R₁ = R_S − 1/g_m, plus L'}], p:R`A buffer normally has \(1/g_m<R_S\), so \(|Z_{out}|\) <b>rises</b> with frequency (Fig. 6.20c). Driven from a large R_S into a big load capacitor, the follower can <b>ring</b> (Fig. 6.22).`},
  {t:'check', q:{type:'mcq', q:'Why does the source follower’s output impedance look inductive?', opts:['It rises from 1/g_m toward R_S as frequency increases','It falls with frequency','It contains a real inductor','Because of body effect only'], a:0, explain:'When 1/g_m < R_S, |Z_out| grows with frequency — inductive behaviour (p.181).'}},
  {t:'check', q:{type:'mcq', q:'The follower’s zero is in which half plane, and why?', opts:['Left: C_GS feeds signal with the same polarity as the transistor','Right: C_GS opposes the transistor','No zero','Right: due to body effect'], a:0, explain:'p.178.'}},
  {t:'recall', prompt:'Write the follower’s output-impedance limits and the equivalent inductance.', model:'1/g_m at DC, R_S at high f; L = (C_GS/g_m)(R_S − 1/g_m).'}
 ],
 cards:[['Source-follower dominant pole (R_S = 0)','g_m/(C_L + C_GS)'],['Source-follower Z_out inductance','L = (C_GS/g_m)(R_S − 1/g_m)'],['Follower Z_in at high f','contains a negative resistance −g_m/(C_GS C_L ω²)']]},

{id:'6e', unit:'Ch 6 · Frequency response', sec:'6.4–6.5', label:'book', title:'Common gate and cascode: escaping the Miller effect', mins:5, pages:[183,187], prereq:['6c','3m'],
 obj:'Explain why CG and cascode stages are faster than a CS stage.',
 blocks:[
  {t:'formal', h:'CG stage (6.56)', eq:[{tex:R`\frac{V_{out}}{V_{in}}=\frac{(g_m+g_{mb})R_D}{1+(g_m+g_{mb})R_S}\cdot\frac{1}{\Big(1+\frac{C_S}{g_m+g_{mb}+R_S^{-1}}s\Big)(1+R_DC_Ds)}`, note:'no Miller multiplication — but low input impedance loads the previous stage'}]},
  {t:'example', src:'book', h:'Example 6.7 (pp.183–184)', given:'CG with r_o, load C_L, input cap C_in.', steps:[{tex:R`Z_{in}=\frac1{g_m+g_{mb}}+\frac{1}{C_Ls}\cdot\frac1{(g_m+g_{mb})r_o}`, say:'(6.62) At high f, C_L shorts the output, so Z_in → 1/(g_m+g_mb): the input pole is 1/[(R_S‖1/(g_m+g_mb))C_in].'}]},
  {t:'formal', h:'Cascode poles (6.64–6.66)', eq:[{tex:R`\omega_{p,A}=\frac{1}{R_S\Big[C_{GS1}+\Big(1+\frac{g_{m1}}{g_{m2}+g_{mb2}}\Big)C_{GD1}\Big]}`, note:'C_GD1 multiplied by only ≈ 2, not by the full gain'},{tex:R`\omega_{p,X}=\frac{g_{m2}+g_{mb2}}{2C_{GD1}+C_{DB1}+C_{SB2}+C_{GS2}},\qquad\omega_{p,Y}=\frac1{R_D(C_{DB2}+C_L+C_{GD2})}`, note:'the node-X pole is usually the farthest — important for op-amp stability (Ch 10)'}]},
  {t:'idea', p:R`The cascode was invented for <b>speed</b>: it keeps the CS input impedance but the CG speed. Example 6.8: with an ideal current-source load, the node-X pole is still ≈ g_m2/C_X because at high frequency C_Y shunts the output. As a current source, its output impedance falls above 1/(r_o1C_X) (6.71).`},
  {t:'check', q:{type:'mcq', q:'In a cascode with similar M₁, M₂, C_GD1 is Miller-multiplied by roughly…', opts:['2','the full gain g_m1 R_D','1','0'], a:0, explain:'Gain from gate to node X ≈ −g_m1/(g_m2+g_mb2) ≈ −1, so factor ≈ 2 (p.185).'}},
  {t:'recall', prompt:'Why is a cascode faster than a CS stage with the same gain?', model:'Node X has low impedance (≈1/g_m2), so the gain across C_GD1 is ≈ −1 and Miller multiplication is ≈ 2.'}
 ],
 cards:[['Cascode Miller factor on C_GD1','≈ 2 (gain to node X ≈ −1)'],['Cascode node-X pole','(g_m2+g_mb2)/C_X — usually the farthest']]},

{id:'6f', unit:'Ch 6 · Frequency response', sec:'6.6', label:'book', title:'Differential pairs at high frequency: CMRR loss and the mirror pole', mins:5, pages:[187,193], prereq:['6c','4f','5f'],
 obj:'Find the high-frequency CM gain, the dominant pole, and the active mirror’s pole and zero.',
 blocks:[
  {t:'idea', p:R`Differentially, each half is a CS stage (Miller and all). For common mode, the capacitance at the tail node P lowers the tail impedance at high frequency, so mismatch converts more CM noise to differential noise (6.72, Fig. 6.28). Making the tail transistor wide to save headroom adds exactly that capacitance: a headroom–CMRR trade-off.`},
  {t:'formal', eq:[{tex:R`A_{v,CM-DM}=-\frac{\Delta g_m\big(R_D\|\tfrac{1}{C_Ls}\big)}{(g_{m1}+g_{m2})\big(r_{o3}\|\tfrac1{C_Ps}\big)+1}`, note:'(6.72) Eq. 4.43 with impedances'},{tex:R`\omega_{out}\approx\frac{1}{(r_{o1}\|r_{o3})C_L}`, note:'current-source loads: the high-resistance output node gives the DOMINANT pole'}]},
  {t:'visual', fig:'mirrorPole', cap:'Fig. 6.30: the active mirror adds a slow path through node E.'},
  {t:'formal', h:'Active mirror (6.74–6.79)', eq:[{tex:R`\omega_{p1}\approx\frac{1}{(r_{oN}\|r_{oP})C_L},\qquad\omega_{p2}\approx\frac{g_{mP}}{C_E}`, note:'mirror pole at node E; PMOS g_m/C_GS trade-off makes it matter'},{tex:R`\frac{V_{out}}{V_{in}}\approx\frac{A_0(2+s/\omega_{p2})}{2(1+s/\omega_{p1})(1+s/\omega_{p2})}`, note:'fast path + slow path → LHP zero at 2ω_p2'}]},
  {t:'example', src:'book', h:'Example 6.9 (p.192)', given:'Fully differential pair whose signal is folded through mirrors M₃–M₅ (gain K).', steps:[{tex:R`A_v=g_{m1}KR_D`, say:'Not every fully differential circuit is free of mirror poles: node X (≈1/g_m3 with large C_X) adds one.'}]},
  {t:'check', q:{type:'mcq', q:'Which pair has a mirror pole?', opts:['Pair with an active current mirror (single-ended output)','Fully differential pair with current-source loads','Both','Neither'], a:0, explain:'Comparing Figs. 6.29(a) and 6.30 (p.192).'}},
  {t:'check', q:{type:'mcq', q:'Why does CMRR fall at high frequency?', opts:['Tail-node capacitance lowers the tail impedance','g_m rises','R_D rises','Mobility drops'], a:0, explain:'p.189.'}},
  {t:'recall', prompt:'Write the dominant pole, mirror pole and zero of the active-mirror pair.', model:'1/[(r_oN‖r_oP)C_L]; g_mP/C_E; LHP zero at 2g_mP/C_E.'}
 ],
 cards:[['Mirror pole','≈ g_m3/C_E at the diode node'],['Active-mirror pair zero','LHP, at 2× the mirror pole'],['Fully differential advantage at HF','No mirror pole']]},

/* ---------------- CHAPTER 7 ---------------- */
{id:'b-rms', unit:'Foundations', label:'bridge', title:'Mean square, RMS and adding random signals', mins:3, prereq:['b-int'], unlocks:['7a','7b'],
 obj:'Compute mean-square and RMS values and add uncorrelated noise by power.',
 why:'Noise is described by average power (V²), its square root (V rms), and power per hertz (V²/Hz). Chapter 7 assumes these.',
 blocks:[
  {t:'formal', eq:[{tex:R`\overline{x^2}=\lim_{T\to\infty}\frac1T\int_{-T/2}^{T/2}x^2(t)\,dt,\qquad x_{rms}=\sqrt{\overline{x^2}}`, note:'(7.3): power in V² (dropping the load resistance)'},{tex:R`\overline{(x_1+x_2)^2}=\overline{x_1^2}+\overline{x_2^2}\ \ \text{if uncorrelated}`, note:'add POWERS, not amplitudes'}]},
  {t:'example', src:'ours', h:'Adding two noise sources', given:'3 µV rms and 4 µV rms, independent.', steps:[{tex:R`\sqrt{3^2+4^2}=5\ \mu\text{V rms}\quad(\text{not }7)`, say:'Pythagoras for noise.'}]},
  {t:'check', q:{type:'num', q:'Two independent 10 µV rms sources add to how many µV rms?', a:14.14, tol:0.01, unit:'µV', explain:'√(100+100) = 14.1 µV.'}},
  {t:'recall', prompt:'How do you add two uncorrelated noise sources?', model:'Add their mean squares (powers), then take the square root.'}
 ],
 cards:[['Adding uncorrelated noise','add mean squares: √(a² + b²)'],['RMS','√(mean of x²)']]},

{id:'7a', unit:'Ch 7 · Noise', sec:'7.1.1', label:'book', title:'Noise as a spectrum: V²/Hz, √Hz and shaping by H(f)', mins:4, pages:[201,206], prereq:['b-rms','b-pole'],
 obj:'Read a power spectral density and use S_y = S_x|H|².',
 blocks:[
  {t:'idea', p:R`Noise is random: its instantaneous value cannot be predicted, but its <b>average power</b> usually can (Fig. 7.2). Splitting that power by frequency gives the <b>power spectral density</b> (PSD): the power in a 1 Hz band around each frequency (Fig. 7.4).`},
  {t:'formal', eq:[{tex:R`S_x(f)\ \text{in V}^2/\text{Hz};\quad\sqrt{S_x}\ \text{in V}/\sqrt{\text{Hz}}`, note:'“3 nV/√Hz” means (3 nV)² of power in each 1 Hz'},{tex:R`S_y(f)=S_x(f)\,|H(f)|^2`, note:'(7.4) a linear system shapes the spectrum by |H|²'},{tex:R`P_{f_1\to f_2}=\int_{f_1}^{f_2}S_x(f)\,df`, note:'(7.6) one-sided spectrum: total power in a band = area under the PSD'}]},
  {t:'idea', p:R`<b>White noise</b> has a flat PSD. Strictly it cannot exist (infinite total power), but anything flat across your band is called white (Fig. 7.5). Telephones are a shaping example: their ~4 kHz bandwidth cuts the voice spectrum (Fig. 7.7).`},
  {t:'check', q:{type:'num', q:'White noise of 10 nV/√Hz over a 1 MHz band. Total rms (µV)?', a:10, tol:0.01, unit:'µV', hint:'Power = (10 nV)² × 10⁶ Hz; then square-root.', explain:'√(1e-16 × 1e6) = 1e-5 V = 10 µV.'}},
  {t:'recall', prompt:'What does 3 nV/√Hz mean, and how does a filter change a noise spectrum?', model:'(3 nV)² of power per hertz; S_out = S_in |H(f)|².'}
 ],
 cards:[['PSD units','V²/Hz (or V/√Hz)'],['Spectrum through a system (7.4)','S_y = S_x |H(f)|²'],['Total noise in a band','∫ S(f) df']]},

{id:'7b', unit:'Ch 7 · Noise', sec:'7.1.2–7.1.3', label:'book', title:'Gaussian amplitudes, and when noise sources add', mins:3, pages:[206,209], prereq:['7a'],
 obj:'Describe the Gaussian PDF and the role of correlation.',
 blocks:[
  {t:'formal', eq:[{tex:R`p_X(x)=\frac{1}{\sigma\sqrt{2\pi}}\exp\frac{-(x-m)^2}{2\sigma^2}`, note:'(7.8) many independent random contributions add up to a Gaussian (central limit theorem) — e.g., resistor noise from countless electrons'},{tex:R`P_{av}=P_{av1}+P_{av2}+\lim\frac1T\int 2x_1x_2\,dt`, note:'(7.11) the last term is the correlation; zero for independent devices'}]},
  {t:'idea', p:R`The PDF tells you <i>how often</i> each amplitude occurs, but nothing about <i>how fast</i> the noise varies — a violin and a drum can share a PDF. Stadium analogy (Fig. 7.11): chatter before the game is uncorrelated (powers add); a simultaneous cheer is correlated (amplitudes add, much louder). Most circuit noise sources are uncorrelated; the input-referred voltage and current of one circuit (lesson 7e) are an exception.`},
  {t:'check', q:{type:'mcq', q:'For uncorrelated sources, superposition holds for…', opts:['powers (mean squares)','instantaneous voltages only','neither','RMS values directly'], a:0, explain:'p.209.'}},
  {t:'recall', prompt:'What does the correlation term measure, and when is it zero?', model:'How similar the two waveforms are; zero when generated by independent devices.'}
 ],
 cards:[['Why resistor noise is Gaussian','Sum of many independent electron motions (central limit theorem)'],['Correlated vs uncorrelated','Correlated: amplitudes add; uncorrelated: powers add']]},

{id:'7c', unit:'Ch 7 · Noise', sec:'7.2.1', label:'book', title:'Thermal noise: 4kTR, kT/C and 4kTγg_m', mins:5, pages:[209,215], prereq:['7a','2o'],
 obj:'Use the thermal noise models of resistors and MOSFETs, including kT/C.',
 blocks:[
  {t:'visual', fig:'noiseModels', cap:'Figs. 7.12, 7.15, 7.17.'},
  {t:'formal', eq:[{tex:R`\overline{V_n^2}=4kTR,\qquad\overline{I_n^2}=\frac{4kT}{R}`, note:'(7.12) white up to ~100 THz; k = 1.38×10⁻²³ J/K'},{tex:R`\overline{I_n^2}=4kT\gamma g_m,\quad\gamma=\tfrac23\ \text{(long channel)}`, note:'(7.24) channel noise, drain to source; γ can be ~2.5 in short devices'}]},
  {t:'example', src:'book', h:'A 50 Ω resistor at 300 K (p.209)', given:'', steps:[{tex:R`4kTR=8.28\times10^{-19}\ \text{V}^2/\text{Hz}\Rightarrow0.91\ \text{nV}/\sqrt{\text{Hz}}`, say:'Remember 1 kΩ ≈ 4 nV/√Hz.'}]},
  {t:'interactive', kind:'ktc', cap:'Example 7.1: an RC low-pass. The total output noise is kT/C, independent of R.'},
  {t:'derive', h:'Why kT/C (Example 7.1)', steps:[
    {tex:R`S_{out}(f)=4kTR\cdot\frac{1}{1+4\pi^2R^2C^2f^2}`, say:'Resistor noise shaped by the RC low-pass. (7.15)', why:'S_y = S_x|H|².'},
    {tex:R`P=\int_0^\infty\frac{4kTR\,df}{1+(2\pi RCf)^2}=\frac{2kT}{\pi C}\tan^{-1}u\Big|_0^\infty`, say:'Substitute u = 2πRCf. (7.18)', why:'∫du/(1+u²) = tan⁻¹u.', ask:{q:'tan⁻¹(∞) − tan⁻¹(0) = ?', opts:['π/2','π','1'], a:0}},
    {tex:R`\boxed{P_{n,out}=\frac{kT}{C}}`, say:'(7.19) 1 pF → 64.3 µV rms.', why:'Larger R: more noise per hertz, but proportionally less bandwidth.'}]},
  {t:'example', src:'book', h:'Example 7.3 (p.213): the most noise one MOSFET can make', given:'Load = ideal current source.', steps:[{tex:R`\overline{V_{n,out}^2}=4kT\tfrac23g_mr_o^2`, say:'(7.26) The output noise does not depend on where the input is (CS or CG look the same).'}]},
  {t:'idea', h:'Gate resistance', p:R`The distributed gate resistance R_G adds noise like a lumped R_G/3 (Problem 7.3). Contacting both ends or folding cuts R_G by 4 (Fig. 7.20); we then ignore it.`},
  {t:'check', q:{type:'num', q:'Thermal noise density of a 4 kΩ resistor at 300 K (nV/√Hz)?', a:8.14, tol:0.02, unit:'nV/√Hz', explain:'√(4·1.38e-23·300·4000) = 8.14 nV/√Hz.'}},
  {t:'check', q:{type:'mcq', q:'Doubling R in an RC filter (C fixed) changes the total output noise by…', opts:['nothing — it stays kT/C','×2','×√2','÷2'], a:0, explain:'Example 7.1.'}},
  {t:'recall', prompt:'Write resistor, MOSFET and RC-filter thermal noise.', model:'4kTR (or 4kT/R as current); 4kTγg_m with γ = 2/3; kT/C total.'}
 ],
 cards:[['Resistor thermal noise','4kTR V²/Hz (50 Ω → 0.91 nV/√Hz)'],['MOSFET channel thermal noise','4kTγg_m, γ = 2/3 long-channel'],['kT/C','Total noise of an RC filter; 1 pF → 64 µV rms']]},

{id:'7d', unit:'Ch 7 · Noise', sec:'7.2.2', label:'book', title:'Flicker (1/f) noise and the corner frequency', mins:4, pages:[215,218], prereq:['7c'],
 obj:'Use K/(C_oxWLf), integrate it, and find the 1/f corner.',
 blocks:[
  {t:'idea', p:R`Dangling bonds at the oxide–silicon interface trap and release carriers at random (Fig. 7.21), adding <b>flicker noise</b> whose power rises at low frequency. Its size depends on how clean the process interface is.`},
  {t:'formal', eq:[{tex:R`\overline{V_n^2}=\frac{K}{C_{ox}WL}\cdot\frac1f`, note:'(7.28) gate-referred, K ~ 10⁻²⁵ V²F; bigger AREA → less 1/f noise'},{tex:R`f_C=\frac{K}{C_{ox}WL}\,g_m\,\frac{3}{8kT}`, note:'(7.36) where 1/f equals thermal; ~0.5–1 MHz for submicron devices (book era)'}]},
  {t:'interactive', kind:'noise', cap:'Gate-referred spectrum: 1/f (dashed orange) + thermal (dashed grey). Increase W·L to push the corner down; move the band to see total rms.'},
  {t:'example', src:'book', h:'Example 7.5 (p.216): integrate 1 kHz → 1 MHz', given:'NMOS current source.', steps:[{tex:R`\overline{I_{n,1/f,tot}^2}=\frac{Kg_m^2}{C_{ox}WL}\ln\frac{10^6}{10^3}=\frac{6.91Kg_m^2}{C_{ox}WL}`, say:'Logarithmic: going to f₁ → 0 gives infinity, but components slower than your observation window are just drift (p.217).'}]},
  {t:'example', src:'book', h:'Example 7.6 (pp.217–218): extract K', given:R`100 µm/0.5 µm, \(g_m=1/(100\ \Omega)\), \(f_C=500\) kHz, \(t_{ox}=90\) Å (\(C_{ox}=3.84\) fF/µm²).`, steps:[{tex:R`K=\frac{f_C\,C_{ox}WL\,8kT}{3g_m}=1.06\times10^{-25}\ \text{V}^2\text{F}`, say:'Rearranged (7.36).'}]},
  {t:'check', q:{type:'mcq', q:'To halve the 1/f noise POWER at fixed W/L, you…', opts:['double W·L (e.g., scale W and L by √2)','double g_m','halve L only','raise temperature'], a:0, explain:'1/f noise ∝ 1/(WL).'}},
  {t:'recall', prompt:'Write the flicker noise expression and the corner frequency idea.', model:'K/(C_oxWLf); f_C where it equals the thermal noise.'}
 ],
 cards:[['Flicker noise (7.28)','K/(C_ox W L f)'],['1/f corner','where 1/f noise = thermal noise; ~0.5–1 MHz (book era)'],['Total 1/f in a band','∝ ln(f₂/f₁)']]},

{id:'7e', unit:'Ch 7 · Noise', sec:'7.3', label:'book', title:'Input-referred noise: why you need both a voltage and a current', mins:5, pages:[218,224], prereq:['7c','7d'],
 obj:'Refer noise to the input and know when an input noise current is needed.',
 blocks:[
  {t:'example', src:'book', h:'Example 7.7 (p.218): CS output noise', given:'CS with R_D; M₁ thermal + flicker, R_D thermal.', steps:[{tex:R`\overline{V_{n,out}^2}=\Big(4kT\tfrac23g_m+\frac{K}{C_{ox}WL}\frac{g_m^2}{f}+\frac{4kT}{R_D}\Big)R_D^2`, say:'(7.38) Uncorrelated → add as powers.'}]},
  {t:'idea', h:'Why refer to the input?', p:R`Output noise grows with any later gain, but so does the signal — the SNR doesn’t change (Fig. 7.26). So we quote <b>input-referred</b> noise: one fictitious source at the input that produces the same output noise. It tells you the smallest input you can detect.`},
  {t:'formal', eq:[{tex:R`\overline{V_{n,in}^2}=\frac{\overline{V_{n,out}^2}}{A_v^2}=4kT\frac{2}{3g_m}+\frac{K}{C_{ox}WLf}+\frac{4kT}{g_m^2R_D}`, note:'(7.41) equivalent thermal noise resistance 2/(3g_m) + 1/(g_m²R_D)'}]},
  {t:'idea', h:'Voltage AND current (Figs. 7.28–7.30)', p:R`If the circuit has finite input impedance and is driven from a large source impedance, a voltage source alone would predict the noise vanishes — wrong. So use a series voltage \(\overline{V_{n,in}^2}\) (found with the input <b>shorted</b>) plus a parallel current \(\overline{I_{n,in}^2}\) (found with the input <b>open</b>). They are generally <b>correlated</b> (same physical sources), so combine them as voltages, not powers — and then nothing is counted twice (Eqs. 7.46–7.53).`},
  {t:'example', src:'book', h:'Example 7.9 (p.222)', given:'CS stage with input capacitance C_in.', steps:[{tex:R`\overline{I_{n,in}^2}=(C_{in}\omega)^2\,\frac{4kT}{g_m^2}\Big(\tfrac23g_m+\frac1{R_D}\Big)`, say:'(7.45)'}]},
  {t:'check', q:{type:'mcq', q:'How is the input-referred noise VOLTAGE found?', opts:['Short the input, compute output noise, divide by gain²','Open the input','Measure at the input pin','Add all device noises without gain'], a:0, explain:'Fig. 7.30(a).'}},
  {t:'check', q:{type:'mcq', q:'Why combine V_n,in and I_n,in as voltages, not powers?', opts:['They are correlated — they come from the same physical sources','They are uncorrelated','Because of 1/f noise','It is a convention only'], a:0, explain:'p.223.'}},
  {t:'recall', prompt:'Write the CS input-referred noise and say when an input noise current matters.', model:'4kT·2/(3g_m) + K/(C_oxWLf) + 4kT/(g_m²R_D); when the source impedance is large compared with the input impedance.'}
 ],
 cards:[['CS input-referred noise (7.41)','4kT[2/(3g_m)] + K/(C_oxWLf) + 4kT/(g_m²R_D)'],['Input noise voltage vs current test','V: input shorted; I: input open']]},

{id:'7f', unit:'Ch 7 · Noise', sec:'7.4.1', label:'book', title:'Noise in a common-source stage: maximise g_m, minimise the load’s', mins:5, pages:[224,228], prereq:['7e','3g'],
 obj:'Use the drain-current-to-gate-voltage lemma and design a low-noise CS stage.',
 blocks:[
  {t:'formal', h:'Lemma (Fig. 7.33)', eq:[{tex:R`\overline{V_n^2}=\frac{\overline{I_n^2}}{g_m^2}`, note:'a drain noise current can be moved to the gate as a voltage, for any source impedance'}]},
  {t:'idea', p:R`So M₁’s thermal noise is 4kT·2/(3g_m) at the gate: an amplifying transistor wants <b>large g_m</b>. A transistor used as a current source wants <b>small g_m</b> (Fig. 7.34). And R_D’s input-referred noise <b>falls</b> as R_D rises (its noise voltage grows as √R_D, the gain as R_D).`},
  {t:'example', src:'book', h:'Example 7.10 (pp.226–227): PMOS current-source load', given:'CS with M₂ as load, both saturated, driving C_L.', steps:[
    {tex:R`\overline{V_{n,in}^2}=4kT\Big(\frac{2}{3g_{m1}}+\frac{2g_{m2}}{3g_{m1}^2}\Big)`, say:'(7.59) M₂ contributes in proportion to g_m2.'},
    {tex:R`\overline{V_{n,out,tot}^2}=\tfrac23\frac{kT}{C_L}(g_{m1}+g_{m2})(r_{o1}\|r_{o2})`, say:'(7.61) integrate over the output pole (kT/C again).'},
    {tex:R`\text{SNR}_{out}=\frac{3C_L}{4kT}\cdot\frac{g_{m1}^2(r_{o1}\|r_{o2})}{g_{m1}+g_{m2}}V_m^2`, say:'(7.63) More C_L (less bandwidth) → better SNR: wideband AND low-noise is hard.'}]},
  {t:'example', src:'ours', h:'Problem 7.1 worked (thermal only)', given:R`50/0.5 NMOS (Table 2.1), \(I_D=1\) mA, \(R_D=2\) kΩ, 100 MHz bandwidth.`, steps:[
    {tex:R`g_m=\sqrt{2(134\mu)(100)(1\text{m})}=5.18\ \text{mS}`, say:''},
    {tex:R`\overline{V_{n,in}^2}=1.66\times10^{-20}\Big(\tfrac{2}{3\times5.18\text{m}}+\tfrac{1}{(5.18\text{m})^2\,2\text{k}}\Big)=2.44\times10^{-18}\ \text{V}^2/\text{Hz}`, say:'≈ 1.56 nV/√Hz.'},
    {tex:R`\times10^8\ \text{Hz}\Rightarrow\sqrt{2.44\times10^{-10}}\approx15.6\ \mu\text{V rms}`, say:'Treating the 100 MHz band as a brick wall.'}]},
  {t:'idea', h:'Design levers (p.228)', p:R`Thermal: raise g_m (more current → power, less swing; or wider → more capacitance), or raise R_D (headroom, speed). Flicker: raise the area WL at constant W/L (same g_m, more capacitance). Noise trades with power, headroom and speed.`},
  {t:'check', q:{type:'mcq', q:'For a transistor used as a CURRENT SOURCE load, to reduce its noise you want…', opts:['small g_m (large overdrive)','large g_m','large W/L','minimum L'], a:0, explain:'Its noise current 4kTγg_m feeds the output directly (p.225).'}},
  {t:'check', q:{type:'num', q:'g_m = 10 mS, ignore R_D. Gate-referred thermal noise density (nV/√Hz)?', a:1.05, tol:0.03, unit:'nV/√Hz', explain:'√(4kT·2/(3·0.01)) = √(1.104e-18) ≈ 1.05 nV/√Hz.'}},
  {t:'recall', prompt:'Write Example 7.10’s input noise and explain why g_m1 should be large and g_m2 small.', model:'4kT[2/(3g_m1) + 2g_m2/(3g_m1²)]. Output noise grows as √g_m1 but gain as g_m1; g_m2 only adds noise.'}
 ],
 cards:[['Drain-noise-to-gate lemma','V_n² = I_n²/g_m²'],['CS + current-source load input noise (7.59)','4kT[2/(3g_m1) + 2g_m2/(3g_m1²)]'],['SNR vs bandwidth (Ex. 7.10)','SNR ∝ C_L: less bandwidth, less noise']]},

{id:'7g', unit:'Ch 7 · Noise', sec:'7.4.2–7.4.4', label:'book', title:'Noise in CG stages, source followers and cascodes', mins:5, pages:[228,233], prereq:['7f','3l','3j','3m'],
 obj:'Find input-referred noise of CG, SF and cascode stages.',
 blocks:[
  {t:'formal', h:'Common gate (7.65–7.67)', eq:[{tex:R`\overline{V_{n,in}^2}=\frac{4kT(2g_m/3+1/R_D)}{(g_m+g_{mb})^2},\qquad\overline{I_{n,in}^2}=\frac{4kT}{R_D}`, note:'the load’s noise current goes straight to the input — no current gain'}]},
  {t:'idea', p:R`With the input open, M₁’s own noise current circulates inside M₁ and never reaches the output; only R_D’s does. The <b>bias current source</b> under a CG stage (Fig. 7.39) adds its noise current directly to the input noise current, so give it small g_m — at the cost of headroom. Example 7.12: input noise ∝ g_m of the current sources.`},
  {t:'formal', h:'Source follower (7.79)', eq:[{tex:R`\overline{V_{n,in}^2}=4kT\cdot\frac23\Big(\frac1{g_{m1}}+\frac{g_{m2}}{g_{m1}^2}\Big)`, note:'adds noise with gain < 1 — avoided in low-noise paths'}]},
  {t:'formal', h:'Cascode (7.80–7.81)', eq:[{tex:R`\overline{V_{n,in}^2}\big|_{M_1,R_D}=4kT\Big(\frac{2}{3g_{m1}}+\frac1{g_{m1}^2R_D}\Big)`, note:'same as a CS stage; M₂’s noise is negligible at low frequency'},{tex:R`\frac{V_{n,out}}{V_{n2}}\approx\frac{-R_D}{1/g_{m2}+1/(C_Xs)}`, note:'at high frequency C_X lets M₂’s noise through and shunts signal — input noise rises'}]},
  {t:'check', q:{type:'mcq', q:'Why does a CG stage refer the load’s full noise current to its input?', opts:['It has no current gain','It has huge current gain','Body effect','Because of 1/f noise'], a:0, explain:'p.229.'}},
  {t:'check', q:{type:'mcq', q:'At low frequency, the cascode device’s noise contributes…', opts:['almost nothing','as much as M₁','more than R_D','only 1/f'], a:0, explain:'I_n2 + I_D2 = 0 if λ₁ = 0 (p.233).'}},
  {t:'recall', prompt:'Write the CG input noise current and explain why the cascode device is quiet at low f.', model:'4kT/R_D; M₂ cannot change the current set by M₁, so its noise doesn’t reach the output (until C_X matters).'}
 ],
 cards:[['CG input-referred noise current','4kT/R_D (plus bias source noise)'],['Source follower input noise (7.79)','4kT(2/3)(1/g_m1 + g_m2/g_m1²)'],['Cascode device noise','negligible at low f; rises with C_X at high f']]},

{id:'7h', unit:'Ch 7 · Noise', sec:'7.5–7.6', label:'book', title:'Noise in differential pairs, and noise bandwidth', mins:5, pages:[233,239], prereq:['7f','4e'],
 obj:'Show a pair has √2× a CS stage’s input noise voltage, and use noise bandwidth.',
 blocks:[
  {t:'formal', eq:[{tex:R`\overline{V_{n,in}^2}=8kT\Big(\frac{2}{3g_m}+\frac1{g_m^2R_D}\Big)\ (+\ \frac{2K}{C_{ox}WLf})`, note:'(7.88)–(7.89) twice a CS stage’s power: two devices in the signal path'}]},
  {t:'idea', p:R`Node P is <b>not</b> a virtual ground for noise (the two noise currents are uncorrelated), so compute each source separately: half of M₁’s noise current reaches each output, and they add as correlated voltages (7.82–7.83). Or simply move each transistor’s noise to its gate (Fig. 7.46). Tail-current noise only appears as common mode near equilibrium — usually negligible (7.93).`},
  {t:'example', src:'book', h:'Example 7.13 (pp.236–239): pair with PMOS current-source loads', given:'Symmetric, all saturated.', steps:[{tex:R`\overline{V_{n,in}^2}=8kT\Big(\frac{2}{3g_{m1}}+\frac{2g_{m3}}{3g_{m1}^2}\Big)+\frac{2K_N}{C_{ox}(WL)_1f}+\frac{2K_P}{C_{ox}(WL)_3f}\frac{g_{m3}^2}{g_{m1}^2}`, say:'(7.101) M₃’s noise current is multiplied by r_o1‖r_o3 at the output — same as a half circuit.'}]},
  {t:'formal', h:'Noise bandwidth (7.102–7.103)', eq:[{tex:R`V_0^2\cdot B_n=\int_0^\infty\overline{V_{n,out}^2}\,df,\qquad B_n=\frac\pi2f_p\ \text{(one pole)}`, note:'a brick-wall bandwidth that gives the same total noise'}]},
  {t:'check', q:{type:'mcq', q:'With equal device g_m, a differential pair’s input noise VOLTAGE is how many times a CS stage’s?', opts:['√2','2','1','1/√2'], a:0, explain:'Power doubles → voltage ×√2 (p.235). It also burns twice the power for the same device size.'}},
  {t:'check', q:{type:'num', q:'One-pole amplifier with f_p = 10 MHz. Noise bandwidth (MHz)?', a:15.7, tol:0.01, unit:'MHz', explain:'(π/2)·10 MHz ≈ 15.7 MHz.'}},
  {t:'recall', prompt:'Write the pair’s input noise and the one-pole noise bandwidth.', model:'8kT[2/(3g_m) + 1/(g_m²R_D)]; B_n = (π/2) f_p.'}
 ],
 cards:[['Diff pair input noise (7.88)','8kT[2/(3g_m) + 1/(g_m²R_D)] = 2× CS'],['Noise bandwidth of one pole','(π/2)·f_p'],['Is P a virtual ground for noise?','No — the device noises are uncorrelated']]}
);
