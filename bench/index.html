LESSONS.push(
{id:'b-loop', unit:'Foundations', label:'bridge', title:'Loop gain: why A/(1+βA) ≈ 1/β', mins:4, prereq:['b-slope'], unlocks:['8a','8b'],
 obj:'Derive the closed-loop gain, and say what the loop gain βA controls.',
 why:'Chapters 8–10 and 14–15 all rest on one equation. If βA is large, the circuit stops caring about A.',
 blocks:[
  {t:'why', p:R`A transistor’s gain \(g_mr_o\) drifts with process and temperature by 20 % or more. A <b>ratio</b> of two capacitors or resistors drifts far less. Feedback lets the ratio, not the transistor, set the gain.`},
  {t:'visual', fig:'fbLoop', cap:'The four elements of every feedback loop (Fig. 8.1): amplifier, sensing, feedback network, subtraction.'},
  {t:'derive', h:'Closed-loop gain', steps:[
    {tex:R`Y=A\,(X-\beta Y)`, say:'The amplifier sees only the error: input minus the fed-back fraction of the output.', why:'Definition of the loop.'},
    {tex:R`Y(1+\beta A)=AX`, say:'Collect the Y terms on the left.', why:''},
    {tex:R`\frac YX=\frac{A}{1+\beta A}`, say:'(8.5) The closed-loop gain.', why:'', ask:{q:'If βA = 99, the closed-loop gain is what fraction of 1/β?', opts:['0.99','0.5','0.01'], a:0}},
    {tex:R`\frac YX\approx\frac1\beta\Big(1-\frac1{\beta A}\Big)`, say:'(8.6) For βA ≫ 1. The error is about 1/(βA).', why:'Expand 1/(1+1/βA) ≈ 1 − 1/βA.'}]},
  {t:'interactive', kind:'fbloop', cap:'Change A₀ by a factor of 2 and see how little the closed-loop gain moves.'},
  {t:'mis', items:[[`“Loop gain and open-loop gain are the same thing.”`,`Open-loop gain is A. Loop gain is βA: the gain all the way around the loop (footnote, p.248).`],[`“More feedback is always better.”`,`Larger β gives a more accurate gain, but a smaller one (≈ 1/β), and it is harder to keep stable (Ch 10).`]]},
  {t:'check', q:{type:'num', q:'A = 1000, β = 0.1. Closed-loop gain?', a:9.90, tol:0.01, explain:'1000/(1+100) = 9.90; ideal 1/β = 10, error ≈ 1 %.'}},
  {t:'check', q:{type:'mcq', q:'A halves from 1000 to 500 with β = 0.1. The closed-loop gain changes by about…', opts:['1 %','50 %','10 %','0 %'], a:0, explain:'9.90 → 9.80: about 1 %. That is “gain desensitization”.'}},
  {t:'recall', prompt:'Write the closed-loop gain and its approximation, and name βA.', model:'A/(1+βA) ≈ (1/β)(1 − 1/βA); βA is the loop gain.'}
 ],
 cards:[['Closed-loop gain','A/(1+βA) ≈ 1/β'],['Loop gain','βA: the gain all the way round the loop'],['Gain error','≈ 1/(βA)']]},

{id:'b-2port', unit:'Foundations', label:'bridge', title:'Two-port networks in one page', mins:3, prereq:['b-kcl'], unlocks:['8f'],
 obj:'Read the Z, Y, H and G descriptions of a linear two-port.',
 why:'Section 8.3 models the feedback network as a two-port so its loading can be included.',
 blocks:[
  {t:'idea', p:R`A <b>two-port</b> is any linear box with an input pair of terminals and an output pair. Four numbers describe it. Which four depends on what you choose as the “inputs”: <ul><li><b>Z</b>: currents in → voltages out (Z₁₁ = V₁/I₁ with I₂ = 0, port 2 <i>open</i>).</li><li><b>Y</b>: voltages in → currents out (Y₁₁ = I₁/V₁ with V₂ = 0, port 2 <i>shorted</i>).</li><li><b>H</b>: I₁ and V₂ in. <b>G</b>: V₁ and I₂ in.</li></ul>`},
  {t:'formal', eq:[{tex:R`\begin{bmatrix}V_1\\V_2\end{bmatrix}=\begin{bmatrix}Z_{11}&Z_{12}\\Z_{21}&Z_{22}\end{bmatrix}\begin{bmatrix}I_1\\I_2\end{bmatrix}`, note:'Z model (8.40–8.41)'},{tex:R`\begin{bmatrix}I_1\\V_2\end{bmatrix}=\begin{bmatrix}G_{11}&G_{12}\\G_{21}&G_{22}\end{bmatrix}\begin{bmatrix}V_1\\I_2\end{bmatrix}`, note:'G model: G₂₁ = V₂/V₁ with I₂ = 0 is a voltage ratio — exactly β for voltage-voltage feedback'}]},
  {t:'idea', p:R`Rule of thumb: “<i>with X = 0</i>” means short a port when X is a voltage, open it when X is a current. That one rule is all the loading recipe in 8.3 needs.`},
  {t:'check', q:{type:'mcq', q:'Y₁₁ is measured with port 2…', opts:['shorted (V₂ = 0)','open (I₂ = 0)','driven by a current','left as it is'], a:0, explain:'Y parameters set the other port’s voltage to zero.'}},
  {t:'recall', prompt:'How do you set “V = 0” and “I = 0” at a port?', model:'V = 0: short it. I = 0: open it.'}
 ],
 cards:[['Z₁₁','V₁/I₁ with port 2 open'],['Y₁₁','I₁/V₁ with port 2 shorted'],['G model use','voltage-voltage feedback (G₂₁ = β)']]},

/* ---- Chapter 8 ---- */
{id:'8a', unit:'Ch 8 · Feedback', sec:'8.1', label:'book', title:'Gain desensitization: let capacitors set the gain', mins:5, pages:[246,250], prereq:['b-loop','3c'],
 obj:'Explain why feedback makes gain depend on β, and find a loop gain by breaking the loop.',
 blocks:[
  {t:'why', p:R`Harold Black sketched the negative-feedback amplifier on a newspaper on the New York ferry in 1921 (p.246). The problem then is the problem now: an open-loop gain such as \(g_{m1}r_{o1}\) is poorly defined.`},
  {t:'formal', h:'Example: CS stage with capacitive feedback (Fig. 8.3b)', eq:[{tex:R`\frac{V_{out}}{V_{in}}=\frac{-1}{\big(1+\frac1{g_{m1}r_{o1}}\big)\frac{C_2}{C_1}+\frac{1}{g_{m1}r_{o1}}}\approx-\frac{C_1}{C_2}`, note:'(8.3)–(8.4) a ratio of two capacitors made of the same material: process and temperature cancel'}]},
  {t:'visual', fig:'loopBreak', cap:'Fig. 8.5: set the input to zero, break the loop, inject a test signal and follow it round.'},
  {t:'example', src:'book', h:'Loop gain of the capacitive CS stage (8.7–8.8)', given:'Break at the gate side, inject V_t, neglect C₂’s loading on the output.', steps:[{tex:R`V_t\frac{C_2}{C_1+C_2}(-g_{m1}r_{o1})=V_F\ \Rightarrow\ \beta A=\frac{C_2}{C_1+C_2}g_{m1}r_{o1}`, say:'The returned signal is −βA·V_t, so −V_F/V_t is the loop gain.'}]},
  {t:'idea', h:'Find the four elements (p.249–250)', p:R`M₁ and I₁ are the amplifier. C₂ senses the output voltage and returns a current, which adds to the current through C₁ at the gate. The feedback is negative even though the currents add, because the amplifier itself inverts.`},
  {t:'check', q:{type:'mcq', q:'Why is −C₁/C₂ a better-defined gain than g_m r_o?', opts:['A ratio of like capacitors barely changes with process and temperature','Capacitors have no noise','C₁/C₂ is always larger','It removes the need for a transistor'], a:0, explain:'p.248.'}},
  {t:'check', q:{type:'mcq', q:'To compute the loop gain you set the main input to…', opts:['zero','its maximum','the bias point','1 V'], a:0, explain:'Fig. 8.5.'}},
  {t:'recall', prompt:'Describe the loop-breaking method and what “gain desensitization” means.', model:'Input to zero, break the loop, inject V_t, the returned V_F gives −V_F/V_t = βA. The closed-loop gain varies far less than A.'}
 ],
 cards:[['Capacitive-feedback CS gain','≈ −C₁/C₂ (8.4)'],['Loop-gain recipe','input = 0, break, inject, return: βA = −V_F/V_t'],['Gain desensitization','closed-loop gain ≈ 1/β, insensitive to A']]},

{id:'8b', unit:'Ch 8 · Feedback', sec:'8.1.1', label:'book', title:'Feedback changes impedances and widens bandwidth', mins:5, pages:[250,254], prereq:['8a','b-pole'],
 obj:'Use the factor (1 + loop gain) to scale impedances and bandwidth.',
 blocks:[
  {t:'idea', p:R`Everything feedback does follows from desensitization. Whatever disturbs A — process, temperature, a heavy load, or simply rising frequency — is suppressed by the loop gain.`},
  {t:'example', src:'book', h:'Terminal impedance (Fig. 8.7)', given:'CG stage; C₁–C₂ sense the output and drive current source M₂.', steps:[{tex:R`R_{in,closed}=\frac{1}{g_{m1}+g_{mb1}}\cdot\frac{1}{1+g_{m2}R_D\frac{C_1}{C_1+C_2}}`, say:'(8.15) The input resistance falls by 1 + loop gain. In Fig. 8.8 similar feedback lowers the output resistance (8.17).'}]},
  {t:'formal', h:'Bandwidth (8.18–8.21)', eq:[{tex:R`A(s)=\frac{A_0}{1+s/\omega_0}\ \Rightarrow\ \frac YX=\frac{\frac{A_0}{1+\beta A_0}}{1+\frac{s}{(1+\beta A_0)\omega_0}}`, note:'gain ÷ (1+βA₀), bandwidth × (1+βA₀): the gain–bandwidth product is unchanged for one pole'}]},
  {t:'interactive', kind:'fbloop', cap:'Watch the closed-loop corner move to (1+βA₀)·f₀.'},
  {t:'example', src:'book', h:'Why bother if GBW is fixed? (Fig. 8.10)', given:'Amplify a 20 MHz square wave by 100. We have one amp: gain 100, f₃dB = 10 MHz (τ ≈ 16 ns).', steps:[{tex:R`2\times(\text{gain }10,\ 100\text{ MHz})\ \Rightarrow\ \text{gain }100,\ \text{far faster edges}`, say:'Close a loop around two copies (gain 10 each, 100 MHz each) and cascade them: same total gain, much shorter rise time, at twice the power.'}]},
  {t:'check', q:{type:'num', q:'A₀ = 1000 with one pole at 1 MHz; β = 0.1. Closed-loop bandwidth (MHz)?', a:101, tol:0.01, unit:'MHz', explain:'(1 + 100)·1 MHz = 101 MHz; closed-loop gain ≈ 9.9.'}},
  {t:'check', q:{type:'mcq', q:'Nonlinearity reduction by feedback is studied in…', opts:['Chapter 13','Chapter 8','Chapter 9','Chapter 2'], a:0, explain:'p.254.'}},
  {t:'recall', prompt:'What does feedback do to bandwidth and to the gain–bandwidth product of a one-pole amplifier?', model:'Bandwidth × (1+βA₀), gain ÷ (1+βA₀); GBW unchanged.'}
 ],
 cards:[['One-pole amp with feedback','gain ÷ (1+βA₀), bandwidth × (1+βA₀)'],['Why feedback widens bandwidth','the gain drop at high f is just another variation of A that feedback suppresses']]},

{id:'8c', unit:'Ch 8 · Feedback', sec:'8.1.2–8.1.3', label:'book', title:'Four amplifier types, and how to sense and return signals', mins:4, pages:[254,258], prereq:['8b'],
 obj:'Match each amplifier type with its ideal impedances, and recognise voltage vs current sensing and summing.',
 blocks:[
  {t:'visual', fig:'ampTypes', cap:'Fig. 8.11: sensing a voltage needs a high input impedance (like a voltmeter); producing a current needs a high output impedance (like a current source).'},
  {t:'idea', h:'Simple versions (Fig. 8.12)', p:R`<ul><li>CS stage: voltage → voltage.</li><li>CG stage: current at the source → voltage at the drain (transimpedance; optical receivers use these for photodiodes).</li><li>CS transistor alone: voltage → drain current (transconductance).</li><li>CG device: current → current.</li></ul>Example 8.1: a CS stage driving a second transistor gives \(G_m=-g_{m1}(r_{o1}\|R_D)g_{m2}\).`},
  {t:'idea', h:'Sensing and returning (Figs. 8.14–8.16)', p:R`<ul><li>Sense a <b>voltage</b>: in <b>parallel</b> with the port (a divider) — “shunt”.</li><li>Sense a <b>current</b>: in <b>series</b> (a small resistor) — “series”.</li><li>Add <b>voltages</b> in series (e.g., input on the gate, feedback on the source; or a differential pair). Add <b>currents</b> in parallel at <b>one node</b>.</li></ul>Quick test: input and feedback on <b>two different nodes</b> → voltage subtraction. On the <b>same node</b> → current subtraction (p.258).`},
  {t:'check', q:{type:'mcq', q:'A transimpedance amplifier ideally has…', opts:['low input and low output impedance','high input and high output impedance','high input, low output','low input, high output'], a:0, explain:'Senses current (low R_in), produces voltage (low R_out).'}},
  {t:'check', q:{type:'mcq', q:'The input drives a gate and the feedback drives the source of the same transistor. The subtraction is of…', opts:['voltages','currents','charges','powers'], a:0, explain:'I_D depends on V_in − V_F (Fig. 8.16e).'}},
  {t:'recall', prompt:'Give the ideal R_in and R_out for the four amplifier types.', model:'V-amp: high/low; TIA: low/low; G_m: high/high; current amp: low/high.'}
 ],
 cards:[['Sense voltage / sense current','in parallel (shunt) / in series'],['Two nodes vs one node','voltage subtraction vs current subtraction'],['Transimpedance gain units','ohms (e.g., 2 kΩ: 1 mA → 2 V)']]},

{id:'8d', unit:'Ch 8 · Feedback', sec:'8.2.1', label:'book', title:'Voltage-voltage feedback: a near-ideal voltage amplifier', mins:5, pages:[258,263], prereq:['8c'],
 obj:'Show that voltage-voltage feedback divides R_out and multiplies R_in by 1 + βA₀.',
 blocks:[
  {t:'visual', fig:'vvFb', cap:'Fig. 8.18: a differential amplifier with a resistive divider. Also called series-shunt feedback.'},
  {t:'derive', h:'Output resistance (Fig. 8.20)', steps:[
    {tex:R`V_F=\beta V_X,\quad V_e=-\beta V_X,\quad V_M=-\beta A_0V_X`, say:'Set V_in = 0 and apply V_X at the output. The amplifier drives its internal source V_M in the opposite direction.', why:''},
    {tex:R`I_X=\frac{V_X-(-\beta A_0V_X)}{R_{out}}`, say:'The current through the amplifier’s own R_out.', why:''},
    {tex:R`\frac{V_X}{I_X}=\frac{R_{out}}{1+\beta A_0}`, say:'(8.25) Lower, by the same factor as the gain.', why:'', ask:{q:'R_out = 10 kΩ, βA₀ = 99. Closed-loop R_out?', opts:['100 Ω','1 MΩ','10 kΩ'], a:0}}]},
  {t:'formal', h:'Input resistance (8.31)', eq:[{tex:R`\frac{V_X}{I_X}=R_{in}(1+\beta A_0)`, note:'R_in now sees only the small error voltage, so it draws less current'}]},
  {t:'example', src:'book', h:'Example 8.2 (pp.260–261)', given:'Fig. 8.21: pair M₁–M₄ with capacitive divider C₁–C₂.', steps:[{tex:R`A_{closed}=\frac{g_{m1}(r_{o2}\|r_{o4})}{1+\frac{C_1}{C_1+C_2}g_{m1}(r_{o2}\|r_{o4})}\approx1+\frac{C_2}{C_1}`, say:'(8.28)'},{tex:R`R_{out,closed}\approx\Big(1+\frac{C_2}{C_1}\Big)\frac{1}{g_{m1}}`, say:'(8.30) Independent of r_o2‖r_o4 — the open-loop gain grows with r_o just as R_out does. A useful lesson for op-amp design.'}]},
  {t:'idea', p:R`Intuition (p.259): load the output with a smaller and smaller resistor. Open loop, V_out falls. Closed loop, V_out stays ≈ V_in/β as long as βA ≫ 1 — that is what a voltage source does, so R_out is low. Summary: a good <b>buffer</b> between a high-impedance source and a low-impedance load.`},
  {t:'check', q:{type:'mcq', q:'Voltage-voltage feedback makes R_in and R_out…', opts:['R_in higher, R_out lower','both lower','both higher','R_in lower, R_out higher'], a:0, explain:'p.263.'}},
  {t:'recall', prompt:'Write the closed-loop R_in and R_out for voltage-voltage feedback.', model:'R_in(1+βA₀); R_out/(1+βA₀).'}
 ],
 cards:[['Voltage-voltage feedback','R_in × (1+βA₀), R_out ÷ (1+βA₀)'],['Example 8.2 closed-loop R_out','≈ (1 + C₂/C₁)/g_m1, independent of r_o']]},

{id:'8e', unit:'Ch 8 · Feedback', sec:'8.2.2–8.2.4', label:'book', title:'The other three topologies: one rule for all impedances', mins:6, pages:[263,270], prereq:['8d'],
 obj:'Predict how each feedback type changes R_in and R_out.',
 blocks:[
  {t:'idea', h:'The rule', p:R`<b>Sensing</b> a quantity at the output makes the output behave like an ideal source of that quantity: sensing voltage → low R_out; sensing current → high R_out. <b>Returning</b> a voltage (in series) raises R_in; returning a current (in parallel) lowers R_in. Each change is by the factor 1 + loop gain.`},
  {t:'idea', h:'Summary (book order: sensed–returned)', p:R`<div class="tbl"><table><tr><th>Topology</th><th>Also called</th><th>R_in</th><th>R_out</th><th>β units</th></tr><tr><td>voltage-voltage</td><td>series-shunt</td><td>× (1+βA)</td><td>÷ (1+βA)</td><td>V/V</td></tr><tr><td>current-voltage</td><td>series-series</td><td>× (1+G_mR_F)</td><td>× (1+G_mR_F)</td><td>Ω</td></tr><tr><td>voltage-current</td><td>shunt-shunt</td><td>÷ (1+g_mFR₀)</td><td>÷ (1+g_mFR₀)</td><td>S</td></tr><tr><td>current-current</td><td>shunt-series</td><td>÷ (1+βA_I)</td><td>× (1+βA_I)</td><td>A/A</td></tr></table></div>`},
  {t:'formal', eq:[{tex:R`\frac{I_{out}}{V_{in}}=\frac{G_m}{1+G_mR_F}`, note:'(8.33) current-voltage: R_out(1+G_mR_F) (8.34)'},{tex:R`\frac{V_{out}}{I_{in}}=\frac{R_0}{1+g_{mF}R_0}`, note:'(8.38) voltage-current: transimpedance and both impedances ÷ (1+g_mF R₀)'}]},
  {t:'example', src:'book', h:'Example 8.4 (p.265): boost a CS output impedance', given:'Small r in the source path; amplifier A₁ subtracts its voltage from V_in.', steps:[{tex:R`R_{out,closed}=(1+g_mrA_1)r_{o1}`, say:'(8.36) This is the gain-boosting idea of Ch 9.'}]},
  {t:'example', src:'book', h:'Example 8.6 (pp.268–269): resistive shunt-shunt feedback', given:'CS stage with R_F from drain to gate, R_F ≫ R_D.', steps:[{tex:R`R_{in}\approx\frac{R_F}{1+g_{m1}R_D},\qquad R_{out}\approx\frac{R_D}{1+g_{m1}R_D}`, say:'The open-loop R_in is R_F (current must flow through it), the loop gain is g_m1R_D. A photodiode TIA (Fig. 8.34) uses this to avoid the R_D trade-off of bandwidth vs gain.'}]},
  {t:'check', q:{type:'mcq', q:'Which topology raises BOTH R_in and R_out?', opts:['current-voltage (series-series)','voltage-current (shunt-shunt)','voltage-voltage','current-current'], a:0, explain:'Returns a voltage (R_in up) and senses a current (R_out up).'}},
  {t:'check', q:{type:'mcq', q:'Shunt-shunt feedback suits a photodiode front end because…', opts:['it gives a low input impedance for a current input','it raises R_in','it removes all noise','it has no loop gain'], a:0, explain:'Sensing a current needs a low R_in.'}},
  {t:'recall', prompt:'State the sense/return rule for impedances.', model:'Sense V → R_out down; sense I → R_out up; return V → R_in up; return I → R_in down; by 1 + loop gain.'}
 ],
 cards:[['Sense current at output','R_out × (1 + loop gain)'],['Return current at input','R_in ÷ (1 + loop gain)'],['Shunt-shunt with R_F (Ex. 8.6)','R_in ≈ R_F/(1+g_mR_D), R_out ≈ R_D/(1+g_mR_D)']]},

{id:'8f', unit:'Ch 8 · Feedback', sec:'8.3', label:'book', title:'Loading: the feedback network is not ideal', mins:6, pages:[270,284], prereq:['8e','b-2port'],
 obj:'Open a feedback loop with correct loading using the three-step recipe.',
 blocks:[
  {t:'why', p:R`Real β networks (resistor dividers, transistors) draw current from the output and present an impedance to the input. Ignoring that gives wrong gains and impedances.`},
  {t:'idea', h:'Pick the model that fits the topology (p.272)', p:R`voltage-voltage → <b>G</b>; voltage-current → <b>Y</b>; current-voltage → <b>Z</b>; current-current → <b>H</b>. In each case the ideal network has the “right” impedances when its 11 and 22 terms vanish, and the reverse term (12) can be dropped if the amplifier’s forward gain dominates.`},
  {t:'visual', fig:'loadRecipe', cap:'Fig. 8.54 as a recipe.'},
  {t:'example', src:'book', h:'Example 8.7 (p.275): two CS stages with R_F–R_S feedback', given:'Fig. 8.41: R_F and R_S sense V_out and return a fraction to the source of M₁.', steps:[
    {tex:R`\text{input side: short the right end of }R_F\ \Rightarrow\ R_F\|R_S\text{ degenerates }M_1`, say:'V_out is sensed by a shunt connection, so short it to see the loading on the input.'},
    {tex:R`\text{output side: open the left end of }R_F\ \Rightarrow\ R_F+R_S\text{ loads }R_{D2}`, say:'The voltage is returned in series, so open that port to see the loading on the output.'},
    {tex:R`A_{v,open}=\frac{-R_{D1}}{R_F\|R_S+1/g_{m1}}\cdot\{-g_{m2}[R_{D2}\|(R_F+R_S)]\},\quad \beta=\frac{R_S}{R_F+R_S}`, say:'(8.59) then A_closed = A_open/(1 + βA_open).'}]},
  {t:'mis', items:[[`“Just break the loop anywhere.”`,`Breaking at an arbitrary point gives the loop gain but cannot place the loading correctly, because it does not identify the real input and output ports. The two-port method is preferred (p.284).`]]},
  {t:'check', q:{type:'mcq', q:'Voltage-voltage feedback is modelled with which two-port?', opts:['G','Z','Y','H'], a:0, explain:'Ideal: G₁₁ = 0, G₂₂ = 0, G₂₁V₁ ≠ 0 (p.272).'}},
  {t:'check', q:{type:'order', q:'Order the loading recipe.', items:['Open the loop, keeping the β network’s loading','Compute A_open and the open-loop R_in, R_out','Find β from the two-port; loop gain = βA_open','Scale gain and impedances by 1 + βA_open'], explain:'§8.3.6.'}},
  {t:'recall', prompt:'How do you include the feedback network’s loading at the input and at the output?', model:'Input loading: set the output-side port to “sensed quantity = 0” (short for voltage, open for current). Output loading: same for the input-side port.'}
 ],
 cards:[['Two-port per topology','V-V: G; V-I: Y; I-V: Z; I-I: H'],['Loading rule','shunt port → short it; series port → open it'],['Why not break anywhere?','it ignores loading and port identity']]},

{id:'8g', unit:'Ch 8 · Feedback', sec:'8.4', label:'book', title:'Feedback does not reduce noise', mins:3, pages:[284,285], prereq:['8f','7e'],
 obj:'Show that a noiseless feedback network leaves the input-referred noise unchanged.',
 blocks:[
  {t:'formal', eq:[{tex:R`V_{out}=(V_{in}+V_n)\frac{A_1}{1+\beta A_1}`, note:'(8.75) the noise enters exactly where the signal does, so it is divided by the same factor'}]},
  {t:'idea', p:R`Feedback lowers the output noise and the gain by the same factor, so the input-referred noise stays \(V_n\). A <b>noisy</b> feedback network (resistors, transistors) can only add noise. Exception (Fig. 8.56): if the output you use is not the quantity the loop senses, the input-referred noise can change.`},
  {t:'check', q:{type:'mcq', q:'Adding feedback around a noisy amplifier with a noiseless β network changes the input-referred noise by…', opts:['nothing','÷ (1+βA)','× (1+βA)','√(1+βA)'], a:0, explain:'p.284.'}},
  {t:'recall', prompt:'Why does feedback not improve noise?', model:'Input-referred noise enters like the signal; both are scaled by the same factor.'}
 ],
 cards:[['Feedback and noise','input-referred noise unchanged (noiseless β); a noisy β only adds']]},

/* ---- Chapter 9 ---- */
{id:'9a', unit:'Ch 9 · Op amps', sec:'9.1', label:'book', title:'Op-amp specifications: what “good enough” means', mins:5, pages:[291,296], prereq:['8b'],
 obj:'Turn a closed-loop accuracy and settling requirement into open-loop gain and bandwidth.',
 blocks:[
  {t:'why', p:R`An op amp is “a high-gain differential amplifier” (p.291). Modern design does not chase an ideal op amp; it finds the <b>adequate</b> value of each spec, because gain, speed, swing, noise and power all trade against each other.`},
  {t:'example', src:'book', h:'Example 9.1 (pp.292–293): gain', given:'Non-inverting amp, 1 + R₁/R₂ = 10; gain error < 1 %.', steps:[{tex:R`\frac{V_{out}}{V_{in}}\approx\Big(1+\frac{R_1}{R_2}\Big)\Big(1-\frac{1+R_1/R_2}{A_1}\Big)\ \Rightarrow\ A_1>1000`, say:'(9.3) An open-loop CS stage of gain 10 would have more than 20 % error.'}]},
  {t:'example', src:'book', h:'Example 9.2 (pp.294–295): small-signal bandwidth', given:'Same circuit, single-pole op amp; settle to 1 % in 5 ns.', steps:[{tex:R`\tau\approx\Big(1+\frac{R_1}{R_2}\Big)\frac1{A_0\omega_0},\qquad t_{1\%}=\tau\ln100\approx4.6\tau`, say:'(9.9)–(9.11)'},{tex:R`\tau=1.09\text{ ns}\ \Rightarrow\ A_0\omega_0=9.21\text{ Grad/s}=1.47\text{ GHz}`, say:'The required bandwidth depends on BOTH the accuracy and the closed-loop gain.'}]},
  {t:'interactive', kind:'opspec', cap:'Your own spec sheet: closed-loop gain, accuracy and settling time → minimum A₀ and GBW.'},
  {t:'idea', h:'The other specs (pp.295–296)', p:R`<ul><li><b>Large-signal speed</b>: a big step drives the op amp nonlinear — slewing (9.8).</li><li><b>Output swing</b>: the main challenge in low-voltage design; fully differential outputs roughly double it.</li><li><b>Linearity</b>: often sets the open-loop gain, rather than gain error.</li><li><b>Noise and offset</b>: set the smallest signal; the input pair and load devices dominate. Low overdrive for swing → higher g_m in the loads → more noise.</li><li><b>Supply rejection</b>: fully differential circuits help.</li></ul>`},
  {t:'check', q:{type:'num', q:'Closed-loop gain 4, gain error < 0.1 %. Minimum A₀?', a:4000, tol:0.01, explain:'A > (1 + R₁/R₂)/error = 4/0.001 = 4000.'}},
  {t:'check', q:{type:'mcq', q:'How many time constants for 1 % linear settling?', opts:['≈ 4.6','1','2.3','10'], a:0, explain:'ln 100 ≈ 4.6.'}},
  {t:'recall', prompt:'Write the gain-error and settling relations from Examples 9.1–9.2.', model:'Error ≈ (1+R₁/R₂)/A₁; τ ≈ (1+R₁/R₂)/(A₀ω₀), t_1% ≈ 4.6τ.'}
 ],
 cards:[['Relative gain error','≈ (1 + R₁/R₂)/A'],['Closed-loop time constant (one pole)','τ ≈ (1 + R₁/R₂)/(A₀ω₀)'],['1 % settling','≈ 4.6 τ']]},

{id:'9b', unit:'Ch 9 · Op amps', sec:'9.2', label:'book', title:'One-stage op amps: simple pair and telescopic cascode', mins:5, pages:[296,299], prereq:['9a','5f','4g'],
 obj:'Compare gain and swing of the simple and telescopic one-stage op amps, and explain the unity-gain-buffer problem.',
 blocks:[
  {t:'formal', eq:[{tex:R`A_v=g_{mN}(r_{oN}\|r_{oP})`, note:'simple pair (Fig. 9.6): hardly above 10–20 in submicron devices'},{tex:R`A_v\approx g_{m1}\big[(g_{m3}r_{o3}r_{o1})\|(g_{m5}r_{o5}r_{o7})\big]`, note:'telescopic cascode (Fig. 9.8): gain like (g_m r_o)², but less swing and extra poles'},{tex:R`\text{swing}_{diff}=2\big[V_{DD}-(V_{OD1}+V_{OD3}+V_{CSS}+|V_{OD5}|+|V_{OD7}|)\big]`, note:'fully differential telescopic: five overdrives are stacked'}]},
  {t:'example', src:'book', h:'Example 9.3 (p.297): unity-gain buffer', given:'Simple pair with mirror, output tied to the inverting input; V_TH = 0.7, every overdrive 0.3 V, V_DD = 3 V.', steps:[{tex:R`V_{in,min}=V_{CSS}+V_{GS1}=1.3\text{ V},\quad V_{in,max}=V_{DD}-|V_{GS3}|+V_{TH1}=2.7\text{ V}`, say:'Input CM range 1.4 V.'},{tex:R`R_{out,closed}\approx\frac{r_{oP}\|r_{oN}}{g_{mN}(r_{oP}\|r_{oN})}=\frac1{g_{mN}}`, say:'Voltage feedback: the closed-loop R_out does not depend on the open-loop R_out. So we can raise R_out for gain and still get a low closed-loop R_out.'}]},
  {t:'idea', h:'Why telescopic cascodes make poor buffers (Fig. 9.9)', p:R`With output shorted to input, M₂ and M₄ are both saturated only for \(V_b-V_{TH4}\le V_{out}\le V_b-(V_{GS4}-V_{TH2})\): a window of less than one threshold voltage (Example 9.4). Switched-capacitor circuits (Ch 12) do short input and output, which pushes designers to the folded cascode.`},
  {t:'check', q:{type:'mcq', q:'The single-ended telescopic op amp suffers from…', opts:['a mirror pole at node X','no output swing at all','zero gain','a missing tail current'], a:0, explain:'p.297.'}},
  {t:'check', q:{type:'mcq', q:'Example 9.3: with large open-loop gain, closed-loop R_out ≈', opts:['1/g_mN','r_oP‖r_oN','g_mN r_o²','∞'], a:0, explain:'Divide by 1 + g_mN(r_oP‖r_oN).'}},
  {t:'recall', prompt:'Write the telescopic op amp gain and its main drawback.', model:'g_m1[(g_m3r_o3r_o1)‖(g_m5r_o5r_o7)]; limited swing and hard to short input to output.'}
 ],
 cards:[['Telescopic op-amp gain','g_m1[(g_m3r_o3r_o1)‖(g_m5r_o5r_o7)]'],['Unity-gain buffer output R','≈ 1/g_mN'],['Telescopic buffer window','< V_TH (Fig. 9.9)']]},

{id:'9c', unit:'Ch 9 · Op amps', sec:'9.2 (Ex. 9.5)', label:'book', title:'Designing a telescopic op amp, step by step', mins:5, pages:[299,300], prereq:['9b'],
 obj:'Follow the book’s design order: power → swing → overdrives → W/L → gain fix.',
 blocks:[
  {t:'example', src:'book', h:'Specs (Example 9.5)', given:'V_DD = 3 V, differential swing 3 V, P = 10 mW, A_v = 2000. µnCox = 60 µA/V², µpCox = 30 µA/V², λn = 0.1 V⁻¹, λp = 0.2 V⁻¹ (L = 0.5 µm), V_TH = 0.7 V.', steps:[]},
  {t:'derive', h:'Design order', steps:[
    {tex:R`I_{M9}=3\text{ mA},\quad 1.5\text{ mA per branch},\quad 330\ \mu\text{A for mirrors}`, say:'1. Spend the power budget: 10 mW / 3 V ≈ 3.33 mA.', why:''},
    {tex:R`|V_{OD7}|+|V_{OD5}|+V_{OD3}+V_{OD1}+V_{OD9}=1.5\text{ V}`, say:'2. Each output swings 1.5 V p-p single-ended, so 1.5 V is left for the stack.', why:''},
    {tex:R`V_{OD9}\approx0.5,\ \ |V_{OD5,7}|\approx0.3,\ \ V_{OD1,3}\approx0.2\text{ V}`, say:'3. The tail carries the most current; the PMOS devices have low mobility, so give them more.', why:'', ask:{q:'Why give M₉ the largest overdrive?', opts:['It carries the largest current, so its width would otherwise be huge','It has the lowest mobility','It is in the signal path'], a:0}},
    {tex:R`(W/L)_{1-4}=1250,\ (W/L)_{5-8}=1111,\ (W/L)_9=400`, say:'4. From I_D = ½µC_ox(W/L)V_OD² at minimum L.', why:''},
    {tex:R`A_v\approx g_{m1}[(g_{m3}r_{o3}r_{o1})\|(g_{m5}r_{o5}r_{o7})]=1416<2000`, say:'5. Check the gain: too low.', why:''},
    {tex:R`g_mr_o\propto\sqrt{WL/I_D}\ \Rightarrow\ \text{double }W\text{ and }L\text{ of }M_{5-8}\ \Rightarrow\ A_v\approx4000`, say:'6. Lengthen the PMOS loads (they are not in the signal path, so their capacitance matters less). Doubling W and L keeps V_OD and doubles g_m r_o.', why:''}]},
  {t:'idea', h:'Bias windows (p.300)', p:R`Input CM ≥ \(V_{GS1}+V_{OD9}=1.4\) V. \(V_{b1,min}=V_{GS3}+V_{OD1}+V_{OD9}\) puts M₁–M₂ at the edge of triode; \(V_{b2,max}=V_{DD}-(|V_{GS5}|+|V_{OD7}|)=1.7\) V. Leave margin for process variation and body effect.`},
  {t:'check', q:{type:'mcq', q:'To raise g_m r_o without changing V_OD, the book…', opts:['scales W and L together','raises the current','shrinks L','adds a third stage'], a:0, explain:'g_m r_o ∝ √(WL/I_D).'}},
  {t:'check', q:{type:'order', q:'Order the design steps of Example 9.5.', items:['Allocate currents from the power budget','Split the headroom into overdrives','Compute W/L at minimum length','Check gain and lengthen the load devices'], explain:'pp.299–300.'}},
  {t:'recall', prompt:'What fixed the gain shortfall in Example 9.5, and why those devices?', model:'Doubling W and L of the PMOS loads M₅–M₈; they are outside the signal path so their larger capacitance hurts less.'}
 ],
 cards:[['Op-amp design order (Ex. 9.5)','power → swing → overdrives → W/L → check gain'],['Raise g_m r_o at fixed V_OD','scale W and L together (g_m r_o ∝ √(WL/I))']]},

{id:'9d', unit:'Ch 9 · Op amps', sec:'9.2 (folded)', label:'book', title:'Folded-cascode op amp: shorting input to output', mins:5, pages:[301,307], prereq:['9c','3n'],
 obj:'Weigh the folded cascode’s input range and swing against its gain, poles, power and noise.',
 blocks:[
  {t:'visual', fig:'folded', cap:'The folded idea from Ch 3 (Fig. 9.11): the input device is the opposite type, so the cascode is not stacked on top of it.'},
  {t:'formal', eq:[{tex:R`|A_v|\approx g_{m1}\Big\{\big[(g_{m3}+g_{mb3})r_{o3}(r_{o1}\|r_{o5})\big]\big\|\big[(g_{m7}+g_{mb7})r_{o7}r_{o9}\big]\Big\}`, note:'(9.12) r_o1 and r_o5 now appear in parallel: gain 2–3× lower than telescopic'},{tex:R`\text{swing per side}=V_{DD}-(V_{OD3}+V_{OD5}+|V_{OD7}|+|V_{OD9}|)`, note:'one overdrive more than telescopic, because there is no tail stacked under the cascode'}]},
  {t:'idea', h:'The trade (p.305)', p:R`<b>Costs</b>: two bias currents (more power), lower gain, a lower pole at the folding point (M₅ is wide and carries both currents), more noise. <b>Benefits</b>: input and output can be shorted; an NMOS-input version accepts CM levels up to V_DD, a PMOS-input version down to 0 V; only the two cascode biases are critical. That is why it is used even more than the telescopic op amp.`},
  {t:'example', src:'book', h:'Example 9.6 (pp.305–306): folded cascode with NMOS inputs', given:'Same specs as Example 9.5.', steps:[{tex:R`I_{pair}=1.5\text{ mA},\ I_{casc}=1.5\text{ mA};\ V_{OD5,6}=0.5,\ V_{OD3,4}=0.4,\ |V_{OD7-10}|=0.3`, say:'Output range 0.6–2.1 V, so the best output CM is 1.35 V.'},{tex:R`R_{up}=8.8\text{ M}\Omega,\ \ R_{down}=66.5\text{ k}\Omega\ \Rightarrow\ A_v\approx400`, say:'The NMOS cascode side is weak because r_o5 is low and M₃’s intrinsic gain is small: lengthen M₅–M₆, widen M₁–M₂.'}]},
  {t:'check', q:{type:'mcq', q:'Compared with a telescopic op amp, a folded cascode usually has…', opts:['lower gain and higher power, but an easier input CM range','higher gain and lower power','the same everything','no folding pole'], a:0, explain:'p.305.'}},
  {t:'check', q:{type:'mcq', q:'A PMOS-input folded cascode can accept an input CM level as low as…', opts:['0 V','V_DD','V_TH + V_OD','V_DD/2'], a:0, explain:'p.306.'}},
  {t:'recall', prompt:'List the folded cascode’s benefits and costs.', model:'Benefits: input/output shortable, wide CM range, fewer critical biases. Costs: power, gain, folding pole, noise.'}
 ],
 cards:[['Folded-cascode gain','g_m1{[g_m3r_o3(r_o1‖r_o5)]‖[g_m7r_o7r_o9]}'],['Why folded cascodes are popular','inputs and outputs can be shorted; easy CM range']]},

{id:'9e', unit:'Ch 9 · Op amps', sec:'9.3', label:'book', title:'Two-stage op amps: separate gain from swing', mins:4, pages:[307,309], prereq:['9d'],
 obj:'Explain why a second stage is added and why we stop at two.',
 blocks:[
  {t:'visual', fig:'twoStage', cap:'Fig. 9.20: stage 1 for gain, stage 2 for swing.'},
  {t:'formal', eq:[{tex:R`A_v=g_{m1,2}(r_{o1,2}\|r_{o3,4})\cdot g_{m5,6}(r_{o5,6}\|r_{o7,8})`, note:'Fig. 9.21: simple stages; output swing V_DD − |V_OD5,6| − V_OD7,8'},{tex:R`A_v\approx\{g_{m1}[(g_{m3}r_{o3}r_{o1})\|(g_{m5}r_{o5}r_{o7})]\}\cdot g_{m9}(r_{o9}\|r_{o11})`, note:'(9.13) cascode first stage: its tiny swing (output ÷ stage-2 gain) lets you optimise M₁–M₈ for gain'}]},
  {t:'idea', p:R`A hearing-aid op amp may run from 0.9 V and still need 0.5 V output swing (p.307): no cascode can do that. A two-stage design isolates the requirements. <b>Why not three stages?</b> Each stage adds at least one pole, making the feedback loop hard to stabilise (Ch 10). A single-ended version (Fig. 9.23) converts with a mirror; as a buffer its minimum output is V_GS1 + V_ISS.`},
  {t:'check', q:{type:'mcq', q:'The second stage of a two-stage op amp is usually a…', opts:['common-source stage, for maximum swing','source follower','cascode','common-gate stage'], a:0, explain:'p.308.'}},
  {t:'check', q:{type:'mcq', q:'Op amps rarely use more than two stages because…', opts:['each stage adds a pole, making stability hard','they would have too little gain','they would have too much swing','the supply is too high'], a:0, explain:'p.309.'}},
  {t:'recall', prompt:'Why does a two-stage op amp beat a cascode on swing?', model:'Only the CS output stage must swing (two overdrives from the rails); the high-gain first stage sees a small signal.'}
 ],
 cards:[['Two-stage op amp idea','stage 1 = gain, stage 2 (CS) = swing'],['Two-stage output swing','V_DD − |V_OD,P| − V_OD,N']]},

{id:'9f', unit:'Ch 9 · Op amps', sec:'9.4–9.5', label:'book', title:'Gain boosting, and choosing a topology', mins:5, pages:[309,314], prereq:['9e','8e'],
 obj:'Show how an auxiliary amplifier multiplies a cascode’s output resistance, and compare the four op-amp families.',
 blocks:[
  {t:'derive', h:'Regulated cascode (Fig. 9.24–9.25)', steps:[
    {tex:R`R_{out}=g_{m2}r_{o2}r_{o1}`, say:'Plain cascode: M₁ is a degeneration resistor that senses the output current (current-voltage feedback, Example 8.4).', why:''},
    {tex:R`R_{out}\approx A_1g_{m2}r_{o2}r_{o1}`, say:'(9.14) Drive M₂’s gate with an amplifier A₁ that holds node X fixed. Less variation at X → more constant current → A₁ times higher R_out.', why:'', ask:{q:'With A₁ = g_m3r_o3 (one transistor), the stage gain resembles…', opts:['a triple cascode','a CS stage','a source follower'], a:0}}]},
  {t:'idea', h:'In a differential op amp (Figs. 9.26–9.29)', p:R`One differential auxiliary amp can serve both sides. An NMOS-pair booster costs headroom (min V_X = V_OD3 + V_GS5 + V_ISS2), so the book uses a <b>folded cascode with a PMOS pair</b> as the booster: its input can sit near 0 V. The result (Example 9.7) is like a quadruple cascode: \(R_{out}\approx g_{m3}r_{o3}r_{o1}\cdot g_{m5}R_{out1}\). Boost the PMOS loads too (Fig. 9.29). Is it still one-stage? Mostly: the main signal goes straight through the cascodes; only a small error is processed (and slowed) by the booster.`},
  {t:'idea', h:'Table 9.1 (p.314)', p:R`<div class="tbl"><table><tr><th></th><th>Gain</th><th>Swing</th><th>Speed</th><th>Power</th><th>Noise</th></tr><tr><td>Telescopic</td><td>Medium</td><td>Medium</td><td>Highest</td><td>Low</td><td>Low</td></tr><tr><td>Folded cascode</td><td>Medium</td><td>Medium</td><td>High</td><td>Medium</td><td>Medium</td></tr><tr><td>Two-stage</td><td>High</td><td>Highest</td><td>Low</td><td>Medium</td><td>Low</td></tr><tr><td>Gain-boosted</td><td>High</td><td>Medium</td><td>Medium</td><td>High</td><td>Medium</td></tr></table></div>`},
  {t:'check', q:{type:'mcq', q:'Which family gives the highest speed in Table 9.1?', opts:['telescopic','two-stage','gain-boosted','folded cascode'], a:0, explain:'Fewest poles, NMOS signal path.'}},
  {t:'check', q:{type:'mcq', q:'Gain boosting increases R_out by about…', opts:['the auxiliary amplifier gain A₁','2','g_m','1/A₁'], a:0, explain:'(9.14).'}},
  {t:'recall', prompt:'Write the regulated-cascode R_out and say why the booster uses a PMOS-input folded cascode.', model:'R_out ≈ A₁g_m2r_o2r_o1; a PMOS input can sit near ground, so it does not eat output swing.'}
 ],
 cards:[['Regulated cascode R_out','≈ A₁ g_m2 r_o2 r_o1 (9.14)'],['Table 9.1 highest swing','two-stage'],['Table 9.1 highest speed','telescopic']]},

{id:'9g', unit:'Ch 9 · Op amps', sec:'9.6', label:'book', title:'Common-mode feedback: who sets the output CM level?', mins:6, pages:[314,324], prereq:['9f','4f'],
 obj:'Explain why high-gain differential op amps need CMFB, and describe sensing and returning schemes.',
 blocks:[
  {t:'why', p:R`With resistor loads the output CM level is obvious: \(V_{DD}-I_{SS}R_D/2\). With current-source loads, a p-type source must balance an n-type source exactly. Any difference flows through the huge output resistance.`},
  {t:'example', src:'book', h:'Example 9.8 (p.316)', given:'Example 9.5 op amp, R_out = 266 kΩ per side; the tail is 1 % low: 2.97 mA.', steps:[{tex:R`\Delta V=266\text{ k}\Omega\times15\ \mu\text{A}=3.99\text{ V}`, say:'Impossible — the outputs rise until the PMOS loads enter triode and their current falls to 1.485 mA.'}]},
  {t:'idea', h:'Rule (p.315)', p:R`If the output CM level cannot be found “by inspection” and needs device-parameter calculations, it is poorly defined. <b>Differential feedback cannot define the CM level.</b>`},
  {t:'visual', fig:'cmfb', cap:'Fig. 9.34: sense the CM level, compare with V_REF, return the error to a bias current.'},
  {t:'idea', h:'Sensing', p:R`<ul><li>Resistive divider (Fig. 9.35): R must be ≫ R_out (MΩ) — large and capacitive.</li><li>Source followers + resistors (Fig. 9.36): no loading, but costs about V_TH of swing, and the followers can starve for large swings.</li><li>Deep-triode MOSFETs (Fig. 9.38): \(R_{tot}\) depends on \(V_{out1}+V_{out2}\) only — but they leave deep triode for large swings.</li><li>Capacitors (Ch 12): no DC loading.</li></ul>`},
  {t:'idea', h:'Returning', p:R`Adjust the NMOS current sources (Fig. 9.39), the PMOS loads, or the tail of a folded cascode’s input pair (Fig. 9.40). Often only a fraction of the current is controlled, for better settling. Example 9.9: with triode sensing, \(dV_{out,CM}/dV_b\) is minimised by maximising \(V_{DS7,8}\). Fig. 9.44 mirrors a reference so the CM level tracks V_REF. Two-stage differential op amps need <b>two</b> CMFB loops.`},
  {t:'check', q:{type:'mcq', q:'Why does a high-gain differential op amp need CMFB?', opts:['Current mismatch × huge R_out pushes the CM level to a rail','The differential gain is too low','The input CM is undefined','The tail current is too large'], a:0, explain:'p.315.'}},
  {t:'check', q:{type:'num', q:'R_out = 500 kΩ per side, current error 10 µA. CM error if nothing limits it (V)?', a:5, tol:0.01, unit:'V', explain:'500 k × 10 µ = 5 V: far beyond the supply, so the devices leave saturation.'}},
  {t:'recall', prompt:'Name the three operations of CMFB and one sensing method with its drawback.', model:'Sense, compare with V_REF, return to a bias. E.g., source followers + resistors: lose ≈ V_TH of swing.'}
 ],
 cards:[['Why CMFB?','differential feedback cannot set the CM level; current mismatch × R_out is huge'],['CMFB steps','sense → compare with V_REF → adjust a bias current'],['Two-stage fully differential op amp','needs two CMFB loops']]},

{id:'9h', unit:'Ch 9 · Op amps', sec:'9.7–9.8', label:'book', title:'Input range and slew rate', mins:6, pages:[325,334], prereq:['9g'],
 obj:'Extend the input CM range, and tell slewing from linear settling.',
 blocks:[
  {t:'idea', h:'9.7 Input range', p:R`In a unity-gain buffer the input swings as much as the output, so the input pair sets the limit: \(V_{in,min}=V_{GS1,2}+V_{ISS}\). Below it, the tail enters triode and g_m collapses. Fix (Fig. 9.48): put an NMOS and a PMOS pair in parallel — one is alive when the other dies. Cost: total g_m varies with CM level (Fig. 9.49), and so do gain, speed and noise.`},
  {t:'idea', h:'9.8 Linear settling vs slewing', p:R`In a <b>linear</b> circuit the slope of the step response is proportional to the final value: double the step, double the slope (9.25, 9.28). With a large step, one input transistor takes <b>all</b> of I_SS and the other turns off. The loop is effectively broken: a constant current charges the load and the output ramps at the <b>slew rate</b> (Fig. 9.54).`},
  {t:'formal', eq:[{tex:R`SR=\frac{I_{SS}}{C_L}`, note:'simple pair with mirror (Fig. 9.53); telescopic: differential SR = I_SS/C_L (Fig. 9.57); folded: I_SS/C_L if I_P ≥ I_SS'},{tex:R`SR>V_0\,\omega_0`, note:'to amplify V₀ sin ω₀t without slew distortion (p.329)'}]},
  {t:'interactive', kind:'slew', cap:'Make the step big, or the slew rate small, and watch the ramp appear.'},
  {t:'example', src:'book', h:'Example 9.10 (pp.329–331)', given:'Capacitive-feedback amp (C₁, C₂), pair with mirror.', steps:[{tex:R`SR=\frac{I_{SS}}{C_1C_2/(C_1+C_2)}`, say:'M₂ turns off, and I_SS charges the series combination of C₁ and C₂.'}]},
  {t:'idea', h:'Trade-offs (p.333)', p:R`Raise SR → raise I_SS; to keep the swing, scale every width with it: more power and input capacitance (g_m r_o unchanged). In a folded cascode with I_SS > I_P, node X crashes during slewing and takes long to recover (Fig. 9.59); clamp transistors fix it (Fig. 9.60). Where slewing ends is somewhat arbitrary (Example 9.11).`},
  {t:'check', q:{type:'num', q:'I_SS = 200 µA, C_L = 2 pF. Slew rate (V/µs)?', a:100, tol:0.01, unit:'V/µs', explain:'200 µ/2 p = 10⁸ V/s = 100 V/µs.'}},
  {t:'check', q:{type:'mcq', q:'Why is slewing nonlinear?', opts:['The ramp slope does not scale with the input amplitude','The output is a sine wave','The gain is negative','Noise increases'], a:0, explain:'p.329.'}},
  {t:'recall', prompt:'Write the slew rate of a simple pair and the condition for an undistorted sine.', model:'I_SS/C_L; SR > V₀ω₀.'}
 ],
 cards:[['Slew rate (simple pair)','I_SS/C_L'],['No slew distortion','SR > V₀ ω₀'],['Rail-to-rail input','NMOS + PMOS pairs in parallel; g_m varies with CM']]},

{id:'9i', unit:'Ch 9 · Op amps', sec:'9.9–9.10', label:'book', title:'Power-supply rejection and op-amp noise', mins:5, pages:[334,339], prereq:['9h','7h'],
 obj:'Compute low-frequency PSRR and find the dominant noise sources of op-amp topologies.',
 blocks:[
  {t:'formal', h:'PSRR (9.39)', eq:[{tex:R`PSRR=\frac{A_{in\to out}}{A_{V_{DD}\to out}}\approx g_{mN}(r_{oP}\|r_{oN})`, note:'simple pair with mirror: the diode clamps node X to V_DD, so supply noise reaches the output with gain ≈ 1'}]},
  {t:'example', src:'book', h:'Example 9.12 (pp.335–336)', given:'Capacitive-feedback amp built on that pair.', steps:[{tex:R`\frac{V_{out}}{V_{DD}}=\frac{1}{g_{m2}r_{o4}\frac{C_1}{C_1+C_2}+1},\qquad PSRR\approx\Big(1+\frac{C_2}{C_1}\Big)\Big(g_{m2}r_{o4}\frac{C_1}{C_1+C_2}+1\Big)`, say:'(9.43)–(9.44) Feedback shrinks the supply gain by 1 + loop gain, but it shrinks the signal gain too, so the PSRR stays ≈ g_m2r_o4.'}]},
  {t:'idea', h:'Find noise sources by inspection (p.336)', p:R`Mentally wiggle each gate. If the output moves a lot, that device matters. Cascode devices contribute little at low frequency.`},
  {t:'formal', eq:[{tex:R`\overline{V_{n,tel}^2}=8kT\Big(\frac{2}{3g_{m1}}+\frac{2g_{m7}}{3g_{m1}^2}\Big)+\frac{2K_N}{(WL)_1C_{ox}f}+\frac{2K_P}{(WL)_7C_{ox}f}\frac{g_{m7}^2}{g_{m1}^2}`, note:'(9.45) telescopic: input pair + PMOS loads'},{tex:R`\overline{V_{n,fold}^2}=8kT\Big(\frac{2}{3g_{m1}}+\frac{2g_{m7}}{3g_{m1}^2}+\frac{2g_{m9}}{3g_{m1}^2}\Big)`, note:'(9.48) folded cascode: BOTH current-source pairs add noise'}]},
  {t:'idea', p:R`Noise trade-off: for a given current, a small overdrive in the current sources (for swing) means a <b>larger</b> g_m and more noise. In a two-stage op amp the second stage’s noise is divided by the first stage’s gain and is usually negligible (9.52).`},
  {t:'check', q:{type:'mcq', q:'Which op amp is usually noisier: telescopic or folded cascode?', opts:['folded cascode','telescopic','they are identical','depends only on C_L'], a:0, explain:'Extra current-source pair (9.48).'}},
  {t:'check', q:{type:'mcq', q:'Why is the second stage of a two-stage op amp usually negligible for noise?', opts:['Its noise is divided by the first-stage gain when referred to the input','It has no transistors','It is cascoded','Its current is zero'], a:0, explain:'p.339.'}},
  {t:'recall', prompt:'Write the simple PSRR and the telescopic op-amp thermal noise.', model:'PSRR ≈ g_mN(r_oP‖r_oN); 8kT[2/(3g_m1) + 2g_m7/(3g_m1²)].'}
 ],
 cards:[['PSRR definition','gain from input ÷ gain from supply'],['Telescopic op-amp thermal noise','8kT[2/(3g_m1) + 2g_m7/(3g_m1²)]'],['Swing–noise trade-off','small V_OD in current sources → large g_m → more noise']]},

/* ---- Chapter 10 ---- */
{id:'10a', unit:'Ch 10 · Stability', sec:'10.1', label:'book', title:'When negative feedback oscillates: Barkhausen’s criteria', mins:5, pages:[345,348], prereq:['b-loop','b-pole'],
 obj:'State Barkhausen’s criteria and read gain and phase crossovers on a Bode plot.',
 blocks:[
  {t:'formal', eq:[{tex:R`\frac YX=\frac{H(s)}{1+\beta H(s)}\ \to\ \infty\ \text{ if }\ \beta H(j\omega_1)=-1`, note:'(10.1)'},{tex:R`|\beta H(j\omega_1)|=1,\qquad\angle\beta H(j\omega_1)=-180^\circ`, note:'(10.2)–(10.3) Barkhausen: 180° from the loop + 180° from the negative sign = 360°, and enough gain for the oscillation to grow'}]},
  {t:'visual', fig:'gxpx', cap:'A three-pole loop where PX comes before GX: the phase reaches −180° while |βH| is still above 1 — this loop oscillates (Fig. 10.2a).'},
  {t:'idea', p:R`<b>GX</b> (gain crossover): where |βH| = 1. <b>PX</b> (phase crossover): where ∠βH = −180°. A stable loop needs GX <b>well before</b> PX (Fig. 10.2). Lowering β shifts the magnitude plot down, moving GX in while PX stays put — so <b>unity feedback (β = 1) is the worst case</b> and is what we analyse.`},
  {t:'idea', h:'Bode rules again (p.347)', p:R`A pole’s phase starts falling at ≈ 0.1ω_p, is −45° at ω_p and −90° at ≈ 10ω_p. Its magnitude only bends near ω_p. So high-frequency poles hurt the <b>phase</b> much more than the magnitude. Poles in the right half plane give growing exponentials; on the jω axis, sustained oscillation (Fig. 10.3).`},
  {t:'example', src:'book', h:'Example 10.1 (p.348): one pole', given:'H(s) = A₀/(1 + s/ω₀).', steps:[{tex:R`s_p=-\omega_0(1+\beta A_0)`, say:'The closed-loop pole stays on the negative real axis and moves left as βA₀ grows: one pole gives at most −90°, so the loop is unconditionally stable.'}]},
  {t:'check', q:{type:'mcq', q:'Why is β = 1 the worst case for stability?', opts:['It puts the gain crossover at the highest frequency','It has the most phase shift','It makes the poles complex','It has no feedback'], a:0, explain:'PX does not depend on β; GX moves out as β grows.'}},
  {t:'check', q:{type:'mcq', q:'Can a one-pole feedback loop oscillate?', opts:['No: its phase never reaches −180°','Yes, always','Only for β = 1','Only with a zero'], a:0, explain:'p.348.'}},
  {t:'recall', prompt:'State Barkhausen’s criteria and define GX and PX.', model:'|βH| = 1 and ∠βH = −180° at the same frequency. GX: |βH| = 1; PX: ∠βH = −180°.'}
 ],
 cards:[['Barkhausen criteria','|βH(jω)| = 1 and ∠βH = −180°'],['Stable loop','GX well below PX'],['Worst case for stability','β = 1 (unity-gain feedback)']]},

{id:'10b', unit:'Ch 10 · Stability', sec:'10.2', label:'book', title:'Two and three poles: where the trouble starts', mins:4, pages:[349,351], prereq:['10a'],
 obj:'Explain why two poles are stable but may ring, and why a third pole can cause oscillation.',
 blocks:[
  {t:'formal', eq:[{tex:R`s_{1,2}=\frac{-(\omega_{p1}+\omega_{p2})\pm\sqrt{(\omega_{p1}+\omega_{p2})^2-4(1+\beta A_0)\omega_{p1}\omega_{p2}}}{2}`, note:'(10.8) closed-loop poles of a two-pole loop'}]},
  {t:'visual', fig:'rootLocus2', cap:'Example 10.2: as β grows the poles meet, then split vertically — but stay in the left half plane.'},
  {t:'idea', p:R`Two poles give at most −180° only at infinite frequency, so the loop is stable, but GX can sit close to PX → ringing. A <b>third</b> pole adds phase shift starting a decade below it, pulling PX below GX while barely changing the magnitude (Fig. 10.8): oscillation. Weaker feedback (smaller β) always helps.`},
  {t:'interactive', kind:'pm', cap:'Bring pole 3 down below a few times GX and watch the phase margin vanish.'},
  {t:'check', q:{type:'mcq', q:'A third pole hurts stability mainly because…', opts:['it adds phase shift a decade below its frequency, before it reduces the magnitude much','it raises the DC gain','it adds a zero','it lowers β'], a:0, explain:'p.350.'}},
  {t:'recall', prompt:'Describe the two-pole root locus.', model:'Poles start at −ω_p1 and −ω_p2, meet at β₁, then become complex with constant real part — always in the LHP.'}
 ],
 cards:[['Two-pole loop','stable for all β, but can ring'],['Third pole','phase falls a decade early → PX < GX possible']]},

{id:'10c', unit:'Ch 10 · Stability', sec:'10.3', label:'book', title:'Phase margin: 45° rings, 60° settles', mins:5, pages:[351,354], prereq:['10b'],
 obj:'Define phase margin, and link it to frequency peaking and step-response ringing.',
 blocks:[
  {t:'formal', eq:[{tex:R`PM=180^\circ+\angle\beta H(\omega_1),\quad |\beta H(\omega_1)|=1`, note:'phase left over at the gain crossover'}]},
  {t:'derive', h:'How much is enough?', steps:[
    {tex:R`\angle\beta H=-175^\circ:\quad\Big|\frac YX\Big|\approx\frac{11.5}{\beta}`, say:'(10.10)–(10.14) PM = 5°: a sharp peak — the loop is nearly oscillating.', why:''},
    {tex:R`PM=45^\circ:\quad\Big|\frac YX\Big|=\frac1\beta\frac{1}{|0.29-0.71j|}\approx\frac{1.3}{\beta}`, say:'(10.15)–(10.18) A 30 % frequency peak.', why:'', ask:{q:'Two poles with |βH(ω_p2)| = 1 and ω_p1 ≪ ω_p2. PM?', opts:['45°','90°','0°'], a:0}},
    {tex:R`PM=60^\circ:\quad\Big|\frac YX\Big|=\frac1\beta`, say:'No peaking; little ringing; fast settling — the usual target.', why:''}]},
  {t:'interactive', kind:'pm', cap:'Slide pole 2 until PM ≈ 60°, then compare the step response with PM ≈ 45° and 30°.'},
  {t:'idea', p:R`More PM is more stable but slower (Fig. 10.12). PM describes <b>small signals</b>. With large steps, slewing and bias excursions shift poles during the transient — the unity-gain buffer of Fig. 10.13 has 65° PM but rings badly on large steps. Simulate the closed loop in the time domain.`},
  {t:'check', q:{type:'mcq', q:'Frequency peaking at PM = 45° is about…', opts:['30 %','0 %','100 %','5 %'], a:0, explain:'(10.18).'}},
  {t:'check', q:{type:'mcq', q:'The usual “optimum” phase margin is…', opts:['60°','45°','90°','30°'], a:0, explain:'p.354.'}},
  {t:'recall', prompt:'Define phase margin and give the peaking at 45° and 60°.', model:'PM = 180° + ∠βH at GX; ≈ 30 % peaking at 45°, none at 60°.'}
 ],
 cards:[['Phase margin','180° + ∠βH at the gain crossover'],['PM 45°','≈ 30 % peaking, ringing'],['PM 60°','no peaking: typical target']]},

{id:'10d', unit:'Ch 10 · Stability', sec:'10.4', label:'book', title:'Frequency compensation: move the dominant pole in', mins:6, pages:[355,361], prereq:['10c','6f','6e'],
 obj:'Compensate a one-stage op amp and explain why fully differential cascodes are easy to stabilise.',
 blocks:[
  {t:'idea', h:'Two ways out (Fig. 10.14)', p:R`(1) Push PX out by having fewer poles (fewer stages: less gain or swing). (2) Pull GX in by making the gain fall earlier. In practice: first minimise poles by design, then compensate.`},
  {t:'idea', h:'Where are the poles? (Fig. 10.15–10.16)', p:R`Single-ended telescopic: the high-R <b>output node</b> is the dominant pole. Next is the <b>mirror pole</b> at node A (big PMOS capacitance, 1/g_m5). Then node N (PMOS cascode source), then nodes X, Y (NMOS cascode sources: high g_m, small C).`},
  {t:'derive', h:'Compensating for 45° PM (Fig. 10.19)', steps:[
    {tex:R`\angle\beta H(\omega_{p,A})=-135^\circ`, say:'Assume the other nondominant poles are far away; at the mirror pole the phase is −90° (dominant) −45°.', why:''},
    {tex:R`\text{draw }-20\text{ dB/dec from }(\omega_{p,A},0\text{ dB})\text{ back to }A_0`, say:'That line gives the new dominant pole ω′_p,out. Raise C_L by ω_p,out/ω′_p,out.', why:''},
    {tex:R`\text{unity-gain BW}=\omega_{p,A}`, say:'Fundamental result: after compensation the unity-gain bandwidth equals the first nondominant pole. Push it as far out as possible — so the mirror pole is unwelcome.', why:'', ask:{q:'Raising R_out (not C_L) of the op amp…', opts:['raises gain but does not compensate','compensates it','lowers the gain'], a:0}}]},
  {t:'idea', h:'Fully differential telescopic (Figs. 10.21–10.22)', p:R`No mirror pole. And the PMOS cascode node N <b>merges</b> with the output pole: \(Z_{out}\|C_L\) has one time constant \((1+g_{m5}r_{o5})r_{o7}C_L+r_{o7}C_N\). The only nondominant pole is at X (high NMOS g_m). Hence fully differential cascodes are very stable. Cancelling a pole with a zero is possible but mismatch leaves slow settling tails.`},
  {t:'check', q:{type:'mcq', q:'After dominant-pole compensation for 45° PM, the unity-gain bandwidth equals…', opts:['the first nondominant pole','the dominant pole','twice the DC gain','the mirror zero'], a:0, explain:'p.358.'}},
  {t:'check', q:{type:'mcq', q:'The fully differential telescopic op amp avoids which two poles?', opts:['the mirror pole and the PMOS cascode-node pole (merged)','the output pole and node X pole','all poles','none'], a:0, explain:'p.361.'}},
  {t:'recall', prompt:'How do you compensate a one-stage op amp, and what limits its bandwidth?', model:'Increase C_L to lower the dominant (output) pole; the unity-gain BW then equals the first nondominant pole.'}
 ],
 cards:[['Dominant-pole compensation (one-stage)','add C_L to lower the output pole'],['Compensated unity-gain BW (45° PM)','= first nondominant pole'],['Fully differential telescopic','no mirror pole; cascode pole merges with the output']]},

{id:'10e', unit:'Ch 10 · Stability', sec:'10.5', label:'book', title:'Miller compensation of two-stage op amps', mins:6, pages:[361,367], prereq:['10d','6c','9e'],
 obj:'Explain pole splitting, the RHP zero, and the series resistor R_z.',
 blocks:[
  {t:'idea', p:R`A two-stage op amp has <b>two</b> dominant poles: at E (first-stage output, very high R) and at the output A (big C_L). The phase nears −180° before any third pole. Moving one to the origin with a grounded capacitor would need a huge C and give tiny bandwidth.`},
  {t:'visual', fig:'millerOut', cap:'Fig. 10.27: put C_c across the second stage. The Miller effect makes it look like (1 + A_v2)C_c at node E.'},
  {t:'formal', eq:[{tex:R`\omega_{p1}\approx\frac{1}{R_S[(1+g_{m9}R_L)(C_c+C_{GD9})+C_E]+R_L(C_c+C_{GD9}+C_L)}`, note:'(10.23)'},{tex:R`\omega_{p1}\approx\frac1{R_Sg_{m9}R_LC_c}`, note:'dominant pole moves IN (Miller-multiplied C_c at node E)'},{tex:R`\omega_{p2}\approx\frac{g_{m9}C_c}{C_EC_L+C_EC_c+C_LC_c}\approx\frac{g_{m9}}{C_E+C_L}`, note:'(10.24) output pole moves OUT by ≈ g_m9R_L: “pole splitting”'},{tex:R`\omega_z=\frac{g_{m9}}{C_c+C_{GD9}}\ (\text{RHP})`, note:'C_c is a feedforward path: phase like a pole, magnitude like a zero'}]},
  {t:'visual', fig:'poleSplit', cap:'Fig. 10.26: pole splitting.'},
  {t:'formal', h:'Taming the zero with R_z (10.25–10.28)', eq:[{tex:R`\omega_z=\frac{1}{C_c\big(g_{m9}^{-1}-R_z\big)}`, note:'R_z = 1/g_m9 → zero at ∞; R_z > 1/g_m9 → LHP zero'},{tex:R`R_z\approx\frac{C_L+C_c}{g_{m9}C_c}`, note:'zero lands on ω_p2 and cancels it'}]},
  {t:'interactive', kind:'miller2', cap:'Sweep C_c and R_z: watch the poles split, the zero move, and the phase margin respond.'},
  {t:'idea', h:'Practical catches (pp.365–367)', p:R`R_z is a triode MOSFET whose resistance changes with large output swings. C_L may change between clock phases (Ch 12). Bias tricks (Figs. 10.31–10.32) make R_z track 1/g_m9, but they assume the square law. And unlike one-stage op amps, <b>more C_L hurts</b> a two-stage op amp: it lowers ω_p2 and reduces PM (Fig. 10.33).`},
  {t:'check', q:{type:'mcq', q:'Pole splitting means…', opts:['the dominant pole moves down and the output pole moves up','both poles move up','both move down','the zero cancels the dominant pole'], a:0, explain:'Fig. 10.26.'}},
  {t:'check', q:{type:'num', q:'g_m9 = 5 mS, C_c = 1 pF, R_z = 0. RHP zero frequency (MHz)?', a:796, tol:0.02, unit:'MHz', explain:'5m/(2π·1p) ≈ 796 MHz.'}},
  {t:'check', q:{type:'mcq', q:'Increasing C_L in a Miller-compensated two-stage op amp…', opts:['lowers ω_p2 and degrades PM','improves PM','has no effect','removes the zero'], a:0, explain:'p.367.'}},
  {t:'recall', prompt:'Write the two split poles, the zero, and the R_z that removes the zero.', model:'ω_p1 ≈ 1/(R_S g_m9 R_L C_c); ω_p2 ≈ g_m9/(C_E + C_L); ω_z = g_m9/C_c (RHP); R_z = 1/g_m9.'}
 ],
 cards:[['Miller-compensated dominant pole','≈ 1/(R_S g_m9 R_L C_c)'],['Split output pole','≈ g_m9/(C_E + C_L)'],['RHP zero','g_m9/C_c; R_z = 1/g_m9 moves it to ∞'],['Unity-gain BW of two-stage','≈ g_m1/C_c']]},

{id:'10f', unit:'Ch 10 · Stability', sec:'10.5.1–10.6', label:'book', title:'Two-stage slewing, and compensation without the RHP zero', mins:5, pages:[368,372], prereq:['10e','9h'],
 obj:'Find the slew rate of a two-stage op amp and explain the follower and common-gate compensation tricks.',
 blocks:[
  {t:'formal', eq:[{tex:R`SR^+=\frac{I_{SS}}{C_c}`, note:'node X is a virtual ground (second-stage gain), so I_SS charges C_c (Fig. 10.34b); M₅ must carry I_SS + I₁'},{tex:R`SR^-=\frac{\min(I_{SS},I_1)}{C_c}`, note:'I₁ must sink I_SS as well; if I₁ < I_SS the rate falls to about I₁/C_c (Fig. 10.34c)'}]},
  {t:'idea', h:'Kill the feedforward path (Fig. 10.35–10.36)', p:R`The RHP zero exists because C_c carries current forward. Make it one-way: insert a <b>source follower</b> in series. Now the zero is in the LHP (10.33) and the poles stay about where the Miller formula puts them; the output pole goes from \((R_LC_L)^{-1}\) to about g_m/C_L of the output transistor (10.37). Cost: the follower raises the minimum output to V_GS2 + V_I2.`},
  {t:'idea', h:'Common-gate feedback (Fig. 10.37)', p:R`Feed C_c through a common-gate device into the gate of M₁. The output is isolated in DC, the zero is in the LHP (10.41), and the second pole rises by g_m2R_S (10.43). Variant (Fig. 10.40): connect C_c to the <b>source of a cascode device</b> in the first stage — zero at \((g_{m4}R_{eq})(g_{m9}/C_c)\), much farther out. Slewing: equal slew rates need I₁ ≈ I_SS (more power).`},
  {t:'check', q:{type:'num', q:'Two-stage op amp: I_SS = 100 µA, C_c = 1 pF, I₁ ≫ I_SS. Positive slew rate (V/µs)?', a:100, tol:0.01, unit:'V/µs', explain:'100 µ/1 p = 10⁸ V/s.'}},
  {t:'check', q:{type:'mcq', q:'A source follower in series with C_c helps because…', opts:['C_c can then carry current only from output back to E, not forward','it adds gain','it removes C_L','it lowers g_m'], a:0, explain:'p.369.'}},
  {t:'recall', prompt:'Write the two-stage slew rate and name two ways to remove the RHP zero.', model:'I_SS/C_c (limited also by I₁); series R_z, source follower in series with C_c, or common-gate / cascode-node compensation.'}
 ],
