<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><meta name="description" content="Short-step study site for Razavi, Design of Analog CMOS Integrated Circuits (1st ed.)"></head><body>
<title>Razavi Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+Math&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
/* Layout: engineering-notebook graph paper; left rail (desktop) / bottom tabs (phone); one reading column ~68ch; lesson context panel on wide screens. */
:root{
  --paper:#f3f5f8; --sheet:#ffffff; --ink:#16203a; --muted:#566079; --line:#d6dce6; --grid:rgba(31,95,191,.07);
  --book:#1f5fbf; --book-soft:#e7effc; --bridge:#9a5b00; --bridge-soft:#fbf0dc; --deep:#7442ad; --deep-soft:#f1e8fb;
  --good:#1d7a42; --good-soft:#e2f4e8; --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00;
  --hl:#fff4b8; --shadow:0 1px 2px rgba(22,32,58,.06),0 4px 14px rgba(22,32,58,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --fs:16px; --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1320; --sheet:#151b2a; --ink:#e5e9f2; --muted:#9aa4b8; --line:#2a3347; --grid:rgba(127,176,255,.06);
  --book:#86b4ff; --book-soft:#1a2741; --bridge:#f0b252; --bridge-soft:#2e2414; --deep:#c7a2f2; --deep-soft:#261d36;
  --good:#62cf8f; --good-soft:#15291e; --bad:#ff8173; --bad-soft:#331a18; --warn:#f0b252; --hl:#3a3410;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1320; --sheet:#151b2a; --ink:#e5e9f2; --muted:#9aa4b8; --line:#2a3347; --grid:rgba(127,176,255,.06);
  --book:#86b4ff; --book-soft:#1a2741; --bridge:#f0b252; --bridge-soft:#2e2414; --deep:#c7a2f2; --deep-soft:#261d36;
  --good:#62cf8f; --good-soft:#15291e; --bad:#ff8173; --bad-soft:#331a18; --warn:#f0b252; --hl:#3a3410;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--paper)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
a{color:var(--book)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--book);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.card p .mono,.prose .mono{overflow-wrap:anywhere}
.small{font-size:.86rem}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
math{font-family:"Noto Sans Math","STIX Two Math","Cambria Math",math;font-size:1.06em}
.eqblock{overflow-x:auto;padding:.6rem .2rem;text-align:center}
.eqblock math{font-size:1.22em}

/* app frame */
.app{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;align-items:center;gap:4px;padding-block:14px;
  border-right:1px solid var(--line);background:var(--sheet);z-index:20}
.rail .logo{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1;margin-bottom:10px;text-align:center}
.rail .logo small{display:block;font-family:var(--f-mono);font-size:.55rem;font-weight:400;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:2px;width:64px;padding:8px 2px;border:0;background:none;border-radius:10px;color:var(--muted);font-size:.68rem;text-decoration:none}
.navbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.navbtn[aria-current="page"]{color:var(--ink);background:var(--book-soft)}
.navbtn:hover{color:var(--ink)}
.rail .spacer{flex:1}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.wrap{max-width:1180px;margin:0 auto}
.col{max-width:720px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.topbar .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:.84rem}
button.chip:hover{border-color:var(--muted)}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.syncdot.ok{background:var(--good)} .syncdot.local{background:var(--warn)}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line)}
  .rail .logo,.rail .spacer,.rail .hide-sm{display:none}
  .navbtn{width:auto;flex:1}
  h1{font-size:1.55rem}
}

/* generic surfaces */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:9px;padding:9px 16px;font-weight:500;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.primary:hover{opacity:.92}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sheet);border-color:var(--line)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 7px;border:1px solid currentColor;white-space:nowrap}
.tag.book{color:var(--book);background:var(--book-soft)}
.tag.bridge{color:var(--bridge);background:var(--bridge-soft)}
.tag.deep{color:var(--deep);background:var(--deep-soft)}
.tag.ai{color:var(--deep);background:var(--deep-soft)}
.tag.good{color:var(--good);background:var(--good-soft)}
.tag.plain{color:var(--muted);background:transparent}
input[type=text],input[type=number],textarea,select{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--book)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
hr.soft{border:0;border-top:1px dashed var(--line);margin:4px 0}

/* today */
.hero-continue{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.hero-continue h2{font-size:1.6rem}
@media (max-width:620px){.hero-continue{grid-template-columns:1fr}}
.progressbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progressbar>i{display:block;height:100%;background:var(--book);border-radius:99px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.5rem}
.list{display:flex;flex-direction:column}
.list>*{border-top:1px solid var(--line);padding:10px 0}
.list>*:first-child{border-top:0}

/* path graph */
.graphwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);touch-action:pan-x pan-y}
.graphwrap svg{display:block}
.node rect{fill:var(--sheet);stroke:var(--line);stroke-width:1.5}
.node.book rect{stroke:var(--book)} .node.bridge rect{stroke:var(--bridge);stroke-dasharray:5 3} .node.deep rect{stroke:var(--deep)}
.node.mapped rect{stroke:var(--line);fill:var(--paper)}
.node text{fill:var(--ink);font-family:var(--f-body);font-size:12px}
.node .sub{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.node.done rect{fill:var(--good-soft)}
.node.focus rect{stroke-width:3}
.node{cursor:pointer}
.node.mapped{cursor:default}
.edge{fill:none;stroke:var(--muted);stroke-width:1.2;opacity:.45}
.edge.hot{stroke:var(--book);opacity:1;stroke-width:2}

/* lesson */
.lesson-grid{display:grid;grid-template-columns:minmax(0,720px) minmax(0,300px);gap:28px;align-items:start}
@media (max-width:1100px){.lesson-grid{grid-template-columns:minmax(0,1fr)}.ctx{order:-1}}
.ctx{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
@media (max-width:1100px){.ctx{position:static}}
.ldots{display:flex;gap:4px;flex-wrap:wrap}
.ldots i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.ldots i.seen{background:var(--book)} .ldots i.cur{background:var(--ink)}
.block{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:80px}
.block.cur{border-color:var(--ink);box-shadow:var(--shadow)}
.block .bhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.block .bkind{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.block p+p{margin-top:.2rem}
.block ul{margin:0;padding-left:1.2rem}
.block li+li{margin-top:.3rem}
.prose{max-width:68ch}
.prose b{font-weight:600}
.keyline{border-left:3px solid var(--book);padding:4px 0 4px 12px;font-weight:500}
.bridge-note{border-left:3px solid var(--bridge);padding:4px 0 4px 12px}
.stopnote{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.86rem;padding:2px 4px}
.stopnote::before,.stopnote::after{content:"";flex:1;border-top:1px dashed var(--line)}
.fig{border:1px solid var(--line);border-radius:8px;background:var(--paper);position:relative;overflow:hidden;touch-action:none}
.fig .zoomer{transform-origin:0 0}
.fig svg{display:block;width:100%;height:auto}
.fig .zoomhint{position:absolute;right:8px;bottom:6px;font-size:.7rem;color:var(--muted);font-family:var(--f-mono);pointer-events:none;background:var(--paper);padding:0 4px;border-radius:4px}
.fig .zreset{position:absolute;right:6px;top:6px}
.figcap{font-size:.84rem;color:var(--muted)}
.fig img{display:block;width:100%;height:auto}
.dstep{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.dstep .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.dstep .why{font-size:.88rem;color:var(--muted)}
.mis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mis>div{border-radius:8px;padding:10px 12px;font-size:.93rem}
.mis .w{background:var(--bad-soft)} .mis .r{background:var(--good-soft)}
@media (max-width:560px){.mis{grid-template-columns:1fr}}
.exgiven{font-size:.92rem;background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
.toolsrow{display:flex;gap:6px;flex-wrap:wrap}
.aibox{border:1px dashed var(--deep);border-radius:8px;padding:12px;background:var(--deep-soft);display:flex;flex-direction:column;gap:6px;white-space:pre-wrap}

/* questions */
.q{display:flex;flex-direction:column;gap:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:var(--muted)}
.opt .k{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);min-width:1.3em;padding-top:.15em}
.opt.sel{border-color:var(--ink);background:var(--sheet)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.conf{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.conf button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:.84rem}
.conf button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.fb{border-radius:8px;padding:10px 12px;font-size:.94rem}
.fb.ok{background:var(--good-soft);border:1px solid var(--good)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.hint{background:var(--hl);border:1px solid var(--line)}
.orderlist{display:flex;flex-direction:column;gap:6px}
.orderitem{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px}
.orderitem .txt{flex:1;min-width:0}
.orderitem button{border:1px solid var(--line);background:var(--sheet);border-radius:6px;width:34px;height:34px}

/* bench */
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:800px){.bench{grid-template-columns:1fr}}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.readout div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.readout b{display:block;font-family:var(--f-mono);font-size:1rem;font-weight:500}
.readout span{font-size:.72rem;color:var(--muted)}
.region{font-family:var(--f-mono);font-weight:500;padding:2px 8px;border-radius:5px}
.region.cut{background:var(--line)} .region.tri{background:var(--bridge-soft);color:var(--bridge)} .region.sat{background:var(--book-soft);color:var(--book)}

/* svg diagram tokens */
.sv-ink{stroke:var(--ink);fill:none} .sv-fill-ink{fill:var(--ink)} .sv-muted{stroke:var(--muted);fill:none} .sv-txt{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.sv-txt-m{fill:var(--muted);font-family:var(--f-mono);font-size:11px} .sv-book{stroke:var(--book);fill:none} .sv-fill-book{fill:var(--book)}
.sv-bridge{stroke:var(--bridge);fill:none} .sv-fill-bridge{fill:var(--bridge)} .sv-grid{stroke:var(--line);fill:none}
.sv-sheet{fill:var(--sheet)} .sv-paper{fill:var(--paper)} .sv-good{stroke:var(--good);fill:none} .sv-bad{stroke:var(--bad);fill:none}
.sv-n{fill:var(--book-soft);stroke:var(--book)} .sv-p{fill:var(--bridge-soft);stroke:var(--bridge)} .sv-ox{fill:var(--line);stroke:var(--muted)} .sv-poly{fill:var(--muted);stroke:var(--ink)}
.sv-deep{stroke:var(--deep);fill:none} .sv-fill-deep{fill:var(--deep)}

/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* flashcards */
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;font-size:1.08rem}
.flash .back{border-top:1px dashed var(--line);padding-top:12px}

/* timer dock */
.dock{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:760px){.dock{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
.dock .pill{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--sheet);border-radius:999px;padding:8px 14px;border:0;box-shadow:var(--shadow);font-family:var(--f-mono)}
.panel{width:min(340px,calc(100vw - 32px));background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.ring{font-family:var(--f-display);font-size:2.4rem;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:4px 9px;font-family:var(--f-mono);font-size:.82rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--sheet);border-radius:14px;border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:999px;font-size:.9rem;box-shadow:var(--shadow)}
@media (max-width:760px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

/* sketch */
.sketchbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sketchbar button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
canvas.sketch{width:100%;height:440px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);touch-action:none;display:block}

.big-text{--fs:18.5px}
.reduce-motion *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:no-preference){.block.enter{animation:rise .28s ease-out}@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}}
.kbd{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}

.pns-cv{width:100%;display:block;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
/* animated previews */
.pv{display:flex;flex-direction:column;gap:8px}
.pv-stage{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sheet);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
.pv-scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:4% 5% 12%}
.pv-cap{position:absolute;left:4%;right:4%;bottom:3%;text-align:center;background:var(--ink);color:var(--sheet);border-radius:8px;padding:6px 10px;font-size:clamp(.78rem,1.8vw,1rem);line-height:1.35}
.pv-big{position:absolute;inset:auto 0 6% 0;margin:auto;width:max-content;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--ink);color:var(--sheet);padding:10px 18px;font-weight:600;box-shadow:var(--shadow)}
.pv-big svg{width:20px;height:20px;fill:currentColor}
.pv-hook{text-align:center;display:flex;flex-direction:column;gap:12px;max-width:90%}
.pv-q{font-size:clamp(1.1rem,3.6vw,2rem);min-height:2.4em}
.pv-title{color:var(--muted);font-size:clamp(.8rem,1.8vw,1rem)}
.pv-fig{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.pv-fig svg,.pv-fig img{max-width:100%;max-height:100%;width:auto;height:100%}
.pv-idea,.pv-goal{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;max-width:92%}
.pv-line{font-family:var(--f-display);font-weight:600;font-size:clamp(1rem,3vw,1.6rem);text-wrap:balance}
.pv-eq{font-size:clamp(.9rem,2.4vw,1.35rem);overflow:hidden;max-width:100%}
.pv-obj{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;max-width:560px;display:flex;flex-direction:column;gap:4px}
.pv-path{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;max-width:100%}
.pv-col{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.pv-chip{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 8px;font-size:clamp(.62rem,1.5vw,.85rem);text-align:center}
.pv-chip.pv-me{border:2px solid var(--book);background:var(--book-soft);font-weight:600}
.pv-arrow{font-size:1.4rem;color:var(--muted)}
.pv-end{position:absolute;inset:auto 0 16% 0;display:flex;gap:8px;justify-content:center}
.pv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pv-dots{display:flex;gap:4px}.pv-dots i{width:22px;height:6px;border-radius:3px;background:var(--line);cursor:pointer}.pv-dots i.seen{background:var(--book)}.pv-dots i.cur{background:var(--ink)}
.pv-speed{width:auto;padding:4px 6px}
.pv-script ol{margin:.4rem 0 0;padding-left:1.2rem}
@media (max-width:560px){.pv-scene{padding:3% 3% 16%}.pv-path{gap:4px}.pv-arrow{font-size:1rem}}
</style>
<script>
/* ---- visuals.js ---- */
/* ===== SVG helpers & diagrams (all colors via CSS tokens) ===== */
const V = {};
V.fmt = (v, d=2) => (Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(d)).replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1');
V.subs = svg => svg.replace(/>([^<>]+)</g,(m,t)=>'>'+t.replace(/([A-Za-zµ\u0370-\u03FF0-9′])_([A-Za-z0-9]+?(?=[A-Za-z]_|[^A-Za-z0-9]|$))/g,'$1<tspan baseline-shift="sub" font-size="72%">$2</tspan>').replace(/([A-Za-z0-9)])\^([-−]?[0-9.½]+)/g,(m,a,b)=>a+'<tspan baseline-shift="super" font-size="70%">'+b.replace(/^-/,'−')+'</tspan>')+'<');
V.esc = s =>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
/* Generic 2-D plot. series: {f:x=>y | pts:[[x,y]], cls, dash, w, label, lx}; marks: {x,y,label,cls}; vl: {x,label}; hl:{y,label} */
V.plot = function(o){
  const W=o.w||520,H=o.h||300,L=o.ml||56,R=o.mr||16,T=o.mt||16,B=o.mb||42;
  const [x0,x1]=o.x,[y0,y1]=o.y; const lg=!!o.logy;
  const ty=v=>lg?Math.log10(Math.max(v,1e-30)):v; const Y0=ty(y0),Y1=ty(y1);
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R), sy=y=>T+(1-(ty(y)-Y0)/(Y1-Y0))*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${V.esc(o.aria||o.yl+' versus '+o.xl)}">`;
  (o.yt||[]).forEach(v=>{s+=`<line class="sv-grid" x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke-width="1"/><text class="sv-txt-m" x="${L-6}" y="${sy(v)+4}" text-anchor="end">${o.ytf?o.ytf(v):V.fmt(v)}</text>`});
  (o.xt||[]).forEach(v=>{s+=`<line class="sv-grid" y1="${T}" y2="${H-B}" x1="${sx(v)}" x2="${sx(v)}" stroke-width="1"/><text class="sv-txt-m" x="${sx(v)}" y="${H-B+15}" text-anchor="middle">${o.xtf?o.xtf(v):V.fmt(v)}</text>`});
  s+=`<line class="sv-ink" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke-width="1.4"/><line class="sv-ink" x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke-width="1.4"/>`;
  s+=`<text class="sv-txt" x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle">${o.xl}</text>`;
  s+=`<text class="sv-txt" transform="translate(14 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle">${o.yl}</text>`;
  (o.fills||[]).forEach(f=>{s+=`<rect x="${sx(f.x0)}" y="${T}" width="${sx(f.x1)-sx(f.x0)}" height="${H-T-B}" class="${f.cls}" opacity="${f.op||.5}"/>${f.label?`<text class="sv-txt-m" x="${(sx(f.x0)+sx(f.x1))/2}" y="${T+14}" text-anchor="middle">${f.label}</text>`:''}`});
  (o.series||[]).forEach(se=>{
    let pts=se.pts; if(!pts){pts=[];const n=se.n||160;const a=se.from??x0,b=se.to??x1;for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;const y=se.f(x);if(isFinite(y))pts.push([x,y]);}}
    const clip=pts.filter(p=>p[1]>=y0-1e-12&&(lg||p[1]<=y1*1.0001+1e-12)&&(!lg||p[1]<=y1));
    if(!clip.length) return;
    const d=clip.map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join(' ');
    s+=`<path d="${d}" class="${se.cls||'sv-book'}" stroke-width="${se.w||2.2}" ${se.dash?`stroke-dasharray="${se.dash}"`:''} fill="none"/>`;
    if(se.label){const p=clip[Math.min(clip.length-1,Math.round((se.lx??.92)*(clip.length-1)))];s+=`<text class="sv-txt-m" x="${sx(p[0])+4}" y="${sy(p[1])-6}">${se.label}</text>`}
  });
  (o.vl||[]).forEach(v=>{s+=`<line class="sv-muted" x1="${sx(v.x)}" x2="${sx(v.x)}" y1="${T}" y2="${H-B}" stroke-dasharray="4 4"/>${v.label?`<text class="sv-txt-m" x="${sx(v.x)+4}" y="${T+(v.dy||12)}">${v.label}</text>`:''}`});
  (o.hl||[]).forEach(v=>{s+=`<line class="sv-muted" y1="${sy(v.y)}" y2="${sy(v.y)}" x1="${L}" x2="${W-R}" stroke-dasharray="4 4"/>${v.label?`<text class="sv-txt-m" x="${W-R-4}" y="${sy(v.y)-5}" text-anchor="end">${v.label}</text>`:''}`});
  (o.marks||[]).forEach(m=>{s+=`<circle cx="${sx(m.x)}" cy="${sy(m.y)}" r="${m.r||5}" class="${m.cls||'sv-fill-ink'}"/>${m.label?`<text class="sv-txt" font-size="12" x="${sx(m.x)+(m.dx??8)}" y="${sy(m.y)+(m.dy??-8)}" ${m.anchor?`text-anchor="${m.anchor}"`:''}>${m.label}</text>`:''}`});
  if(o.extra) s+=o.extra(sx,sy);
  return s+'</svg>';
};
/* circuit primitives */
V.w=(pts,cls='sv-ink',sw=1.8)=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" class="${cls}" stroke-width="${sw}" fill="none" stroke-linejoin="round"/>`;
V.t=(x,y,txt,a='start',cls='sv-txt',extra='')=>`<text x="${x}" y="${y}" class="${cls}" text-anchor="${a}" ${extra}>${txt}</text>`;
V.res=(x,y1,y2,lab)=>{const m=(y1+y2)/2,h=Math.min(36,(y2-y1)*.7),a=m-h/2;let d=`M${x} ${y1} L${x} ${a}`;for(let i=0;i<6;i++){d+=` L${x+(i%2?-7:7)} ${a+h*(i+.5)/6}`}d+=` L${x} ${a+h} L${x} ${y2}`;return `<path d="${d}" class="sv-ink" stroke-width="1.8" fill="none"/>`+(lab?V.t(x+12,m+4,lab):'')};
V.gnd=(x,y)=>V.w([[x,y],[x,y+8]])+V.w([[x-10,y+8],[x+10,y+8]])+V.w([[x-6,y+12],[x+6,y+12]])+V.w([[x-2,y+16],[x+2,y+16]]);
V.dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="3" class="sv-fill-ink"/>`;
V.arrowHead=(x,y,dir,cls='sv-fill-ink',s=6)=>{const P={r:[[x,y],[x-s,y-s*.6],[x-s,y+s*.6]],l:[[x,y],[x+s,y-s*.6],[x+s,y+s*.6]],d:[[x,y],[x-s*.6,y-s],[x+s*.6,y-s]],u:[[x,y],[x-s*.6,y+s],[x+s*.6,y+s]]}[dir];return `<polygon points="${P.map(p=>p.join(',')).join(' ')}" class="${cls}"/>`};
/* NMOS: gate input at (x-34,y); drain terminal (x+20,y-36); source terminal (x+20,y+36) */
V.nmos=(x,y,lab='M₁',pmos=false)=>{let s=V.w([[x-34,y],[x-9,y]])+V.w([[x-9,y-18],[x-9,y+18]],'sv-ink',2.2)+V.w([[x,y-20],[x,y+20]],'sv-ink',2.6)+V.w([[x,y-13],[x+20,y-13],[x+20,y-36]])+V.w([[x,y+13],[x+20,y+13],[x+20,y+36]]);
  s+= pmos? V.arrowHead(x+3,y+13,'l'): V.arrowHead(x+15,y+13,'r'); if(pmos) s+=`<circle cx="${x-14}" cy="${y}" r="4" class="sv-sheet sv-ink" stroke-width="1.6"/>`; s+=V.t(x+26,y+5,lab); return s};
V.vccs=(x,y,lab,dir='d')=>`<polygon points="${x},${y-16} ${x+13},${y} ${x},${y+16} ${x-13},${y}" class="sv-sheet sv-ink" stroke-width="1.8"/>`+V.w([[x,y-8],[x,y+6]])+V.arrowHead(x,dir==='d'?y+9:y-9,dir,'sv-fill-ink',5)+(lab?V.t(x+18,y+5,lab):'');
V.src=(x,y,lab)=>`<circle cx="${x}" cy="${y}" r="14" class="sv-sheet sv-ink" stroke-width="1.8"/>`+V.t(x,y-2,'+','middle','sv-txt-m')+V.t(x,y+10,'−','middle','sv-txt-m')+(lab?V.t(x-20,y+5,lab,'end'):'');

V.abstraction=()=>{const box=(x,y,w,h,t,s)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" class="sv-sheet sv-ink" stroke-width="1.5"/>`+V.t(x+w/2,y+22,t,'middle','sv-txt','font-weight="600"')+V.t(x+w/2,y+40,s,'middle','sv-txt-m');
  return `<svg viewBox="0 0 560 150">${box(8,30,124,70,'Device','fields, charge')}${box(148,30,124,70,'Circuit','transistors + R, C')}${box(288,30,124,70,'Architecture','blocks: ADC, filter')}${box(428,30,124,70,'System','whole receiver')}
  ${[132,272,412].map(x=>V.w([[x,65],[x+16,65]])+V.arrowHead(x+16,65,'r')).join('')}${V.t(280,128,'This book starts at device level (Ch 2) and climbs toward circuits & blocks','middle','sv-txt-m')}</svg>`};

V.structure=(opts={})=>{ /* cross-section of NMOS, Fig 2.2/2.3 style */
  const s=`<svg viewBox="0 0 560 270" role="img" aria-label="NMOS cross-section">
  <rect x="20" y="110" width="520" height="140" class="sv-p" stroke-width="1.2"/>
  ${V.t(40,238,'p-substrate (bulk / body)','start','sv-txt')}
  <path d="M120 110 h110 v26 q0 18 -18 18 h-74 q-18 0 -18 -18 z" class="sv-n" stroke-width="1.2"/>
  <path d="M330 110 h110 v26 q0 18 -18 18 h-74 q-18 0 -18 -18 z" class="sv-n" stroke-width="1.2"/>
  ${V.t(175,138,'n⁺ source','middle','sv-txt')}${V.t(385,138,'n⁺ drain','middle','sv-txt')}
  <rect x="460" y="110" width="50" height="20" class="sv-p" stroke-width="1.6"/>${V.t(485,124,'p⁺','middle','sv-txt-m')}
  <rect x="215" y="100" width="130" height="10" class="sv-ox" stroke-width="1"/>
  <rect x="215" y="62" width="130" height="38" class="sv-poly" stroke-width="1.2" opacity=".85"/>
  ${V.t(280,86,'n⁺ poly gate','middle','sv-txt','style="fill:var(--sheet)"')}
  ${V.w([[280,62],[280,30]])}${V.t(280,24,'G','middle','sv-txt','font-weight="600"')}
  ${V.w([[175,110],[175,30]])}${V.t(175,24,'S','middle','sv-txt','font-weight="600"')}
  ${V.w([[385,110],[385,30]])}${V.t(385,24,'D','middle','sv-txt','font-weight="600"')}
  ${V.w([[485,110],[485,30]])}${V.t(485,24,'B','middle','sv-txt','font-weight="600"')}
  ${V.w([[352,100],[372,100]],'sv-muted',1)}${V.w([[352,110],[372,110]],'sv-muted',1)}${V.t(376,108,'t_ox (thin SiO₂)','start','sv-txt-m')}
  ${V.w([[230,176],[330,176]],'sv-book',1.6)}${V.arrowHead(230,176,'l','sv-fill-book')}${V.arrowHead(330,176,'r','sv-fill-book')}${V.t(280,195,'L_eff = L_drawn − 2L_D','middle','sv-txt-m')}
  ${V.w([[215,160],[215,170]],'sv-muted',1)}${V.w([[345,160],[345,170]],'sv-muted',1)}
  ${V.t(40,60,'W runs into the page','start','sv-txt-m')}
  ${V.t(280,128,'channel forms here','middle','sv-txt-m')}
  </svg>`;return s};

V.symbols=()=>`<svg viewBox="0 0 560 150" role="img" aria-label="NMOS and PMOS symbols">
  ${V.nmos(90,70,'NMOS')}${V.t(56,66,'G','end','sv-txt-m')}${V.t(116,30,'D','start','sv-txt-m')}${V.t(116,118,'S','start','sv-txt-m')}
  ${(()=>{let x=300,y=70;let s=V.w([[x-34,y],[x-18,y]])+`<circle cx="${x-14}" cy="${y}" r="4" class="sv-sheet sv-ink" stroke-width="1.6"/>`+V.w([[x-9,y-18],[x-9,y+18]],'sv-ink',2.2)+V.w([[x,y-20],[x,y+20]],'sv-ink',2.6)+V.w([[x,y-13],[x+20,y-13],[x+20,y-36]])+V.w([[x,y+13],[x+20,y+13],[x+20,y+36]])+V.arrowHead(x+3,y-13,'l');s+=V.t(x+26,y+5,'PMOS')+V.t(x+26,y-24,'S (on top)','start','sv-txt-m')+V.t(x+26,y+34,'D','start','sv-txt-m');return s})()}
  ${V.t(440,40,'Razavi’s style:','start','sv-txt-m')}${V.t(440,58,'arrow marks the source;','start','sv-txt-m')}${V.t(440,76,'bulk is not drawn when','start','sv-txt-m')}${V.t(440,94,'NMOS→ground, PMOS→V_DD','start','sv-txt-m')}
</svg>`;

V.capacitor=()=>`<svg viewBox="0 0 560 190" role="img" aria-label="Parallel plate capacitor">
  <rect x="60" y="40" width="200" height="14" class="sv-poly" opacity=".85"/><rect x="60" y="120" width="200" height="14" class="sv-n"/>
  <rect x="60" y="54" width="200" height="66" class="sv-paper" stroke="var(--line)"/>
  ${[0,1,2,3,4,5,6].map(i=>V.t(76+i*28,50,'+','middle','sv-txt','style="fill:var(--sheet)" font-weight="700"')+V.t(76+i*28,132,'−','middle','sv-txt','font-weight="700"')).join('')}
  ${V.t(160,92,'insulator, thickness t','middle','sv-txt-m')}
  ${V.t(300,60,'Q = C·V','start','sv-txt','font-size="18" font-weight="600"')}
  ${V.t(300,88,'C per unit area = ε/t','start','sv-txt')}
  ${V.t(300,112,'thinner insulator → more charge','start','sv-txt-m')}
  ${V.t(300,130,'for the same voltage','start','sv-txt-m')}
  ${V.t(300,160,'MOS gate: C_ox ≈ 6.9 fF/µm² at t_ox = 50 Å','start','sv-txt-m')}
</svg>`;

V.pn=(vr)=>{ const wd=22+Math.sqrt(0.7+vr)*24; const x=280;
  return `<svg viewBox="0 0 560 170" role="img" aria-label="pn junction depletion width">
  <rect x="40" y="40" width="${x-40}" height="80" class="sv-p"/><rect x="${x}" y="40" width="${520-x}" height="80" class="sv-n"/>
  <rect x="${x-wd*.6}" y="40" width="${wd*1.6}" height="80" class="sv-paper" stroke="var(--muted)" stroke-dasharray="4 3"/>
  ${V.t(120,86,'p side (holes)','middle')}${V.t(440,86,'n side (electrons)','middle')}
  ${V.t(x+wd/2-wd*.1,30,'depletion: no free carriers','middle','sv-txt-m')}
  ${V.t(280,150,'reverse bias = '+vr.toFixed(1)+' V → depletion width grows ∝ √(Φ+V_R)','middle','sv-txt-m')}
  </svg>`};

V.drift=()=>{let s=`<svg viewBox="0 0 560 170" role="img" aria-label="Charge moving in a bar"><rect x="30" y="50" width="500" height="60" rx="6" class="sv-paper" stroke="var(--ink)"/>`;
  for(let i=0;i<24;i++){s+=`<circle cx="${50+i*20}" cy="${70+(i%3)*10}" r="4" class="sv-fill-book"/>`}
  s+=V.w([[210,124],[410,124]],'sv-bridge',2)+V.arrowHead(410,124,'r','sv-fill-bridge')+V.arrowHead(210,124,'l','sv-fill-bridge')+V.t(310,145,'v metres = distance charge travels in 1 s','middle','sv-txt-m');
  s+=V.w([[410,40],[410,120]],'sv-ink',2)+V.t(410,34,'cross-section','middle','sv-txt-m')+V.t(40,30,'Q_d = charge per metre (C/m)','start','sv-txt-m');
  s+=V.w([[460,80],[520,80]],'sv-ink',2)+V.arrowHead(520,80,'r')+V.t(490,72,'v','middle');
  return s+'</svg>'};

V.threshold=(vg,vth=0.7)=>{ const dep=Math.min(vg,vth)/vth; const inv=Math.max(0,vg-vth);
  const dd=8+dep*44; const it=Math.min(10,inv*6);
  let s=`<svg viewBox="0 0 560 230" role="img" aria-label="Depletion and inversion under the gate">
  <rect x="20" y="90" width="520" height="130" class="sv-p"/>
  <path d="M80 90 h100 v22 q0 14 -14 14 h-72 q-14 0 -14 -14 z" class="sv-n"/><path d="M380 90 h100 v22 q0 14 -14 14 h-72 q-14 0 -14 -14 z" class="sv-n"/>
  <rect x="170" y="80" width="220" height="10" class="sv-ox"/><rect x="170" y="44" width="220" height="36" class="sv-poly" opacity=".85"/>
  ${V.t(280,67,'V_G = '+vg.toFixed(2)+' V','middle','sv-txt','style="fill:var(--sheet)" font-weight="600"')}
  <rect x="180" y="90" width="200" height="${dd}" class="sv-paper" stroke="var(--muted)" stroke-dasharray="4 3"/>`;
  for(let i=0;i<9;i++) for(let j=0;j<Math.round(dep*3);j++) s+=V.t(194+i*22,104+j*14,'−','middle','sv-txt-m');
  if(it>0){s+=`<rect x="170" y="90" width="220" height="${it}" class="sv-fill-book" opacity=".75"/>`;}
  s+=V.t(130,82,'S (0 V)','middle','sv-txt-m')+V.t(430,82,'D (0.1 V)','middle','sv-txt-m');
  const st= vg<0.05?'No field yet: holes everywhere':vg<vth?'Holes pushed away → depletion region (fixed − ions). No current.':'Inversion layer of electrons links S and D → current can flow';
  s+=V.t(280,212,st,'middle','sv-txt','font-size="12.5"');
  if(it>0) s+=V.t(400,100,'electron channel','start','sv-txt-m');
  return s+'</svg>'};

V.parabolas=(mark)=>{const k=1;const vovs=[0.4,0.6,0.8,1.0];
  return V.plot({w:520,h:300,x:[0,1.4],y:[0,0.55],xl:'V_DS (V)',yl:'I_D (∝ k)',xt:[0,.2,.4,.6,.8,1,1.2,1.4],yt:[0,.1,.2,.3,.4,.5],
   series:[...vovs.map((v,i)=>({f:x=>x<=v?k*(v*x-x*x/2):NaN,cls:'sv-book',label:'V_ov='+v,lx:1})),...vovs.map(v=>({f:x=>x>=v?k*(v*x-x*x/2):NaN,cls:'sv-muted',dash:'3 4',w:1.4})),
     {f:x=>x*x/2,cls:'sv-bridge',dash:'6 4',w:1.6,to:1.05,label:'peaks: V_DS = V_ov',lx:.9}],
   aria:'Triode parabolas for several overdrives'})};

V.ron=()=>V.plot({w:520,h:280,x:[1.5,4],y:[0,12],xl:'V_G (V)',yl:'R_on (kΩ)',xt:[1.5,1.7,2,2.5,3,3.5,4],yt:[0,2,4,6,8,10,12],
  series:[{f:x=>x>1.72?1/(50e-6*10*(x-1.7))/1000:NaN,cls:'sv-book',from:1.72}],vl:[{x:1.7,label:'1 V + V_TH'}],marks:[{x:2.7,y:2,label:'V_G=2.7 V → 2 kΩ'}]});

V.pinch=()=>{ return V.channel(1.5,1.4,0.7,0,true) };
/* channel picture for bench: draws inversion thickness ∝ local overdrive */
V.channel=(vgs,vds,vth,lam,compact)=>{
  const vov=vgs-vth, L0=140,L1=420; const W=560,H=compact?210:230;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Channel charge along the MOSFET">
  <rect x="20" y="96" width="520" height="${H-106}" class="sv-p"/>
  <path d="M40 96 h110 v24 q0 14 -14 14 h-82 q-14 0 -14 -14 z" class="sv-n"/><path d="M410 96 h110 v24 q0 14 -14 14 h-82 q-14 0 -14 -14 z" class="sv-n"/>
  <rect x="${L0}" y="86" width="${L1-L0}" height="10" class="sv-ox"/><rect x="${L0}" y="50" width="${L1-L0}" height="36" class="sv-poly" opacity=".85"/>
  ${V.t((L0+L1)/2,73,'V_GS = '+vgs.toFixed(2)+' V','middle','sv-txt','style="fill:var(--sheet)" font-weight="600"')}
  ${V.t(95,88,'S','middle','sv-txt','font-weight="600"')}${V.t(465,88,'D: V_DS = '+vds.toFixed(2)+' V','middle','sv-txt')}`;
  if(vov>0){
    const vd=Math.min(vds,vov); const tot=vov*vd-vd*vd/2; const sat=vds>=vov;
    const Lp = sat? (1-Math.min(0.25,lam*(vds-vov)*0.8+0.03)) : 1;
    const pts=[]; const N=60;
    for(let i=0;i<=N;i++){const f=i/N; /* solve vov*V - V^2/2 = f*tot */ const disc=vov*vov-2*f*tot; const Vx=vov-Math.sqrt(Math.max(0,disc)); const q=Math.max(0,vov-Vx); pts.push([L0+f*Lp*(L1-L0), q]);}
    const sc=26/Math.max(vov,0.3);
    let d=`M${L0} 96 `+pts.map(p=>`L${p[0].toFixed(1)} ${(96+Math.min(26,p[1]*sc)).toFixed(1)}`).join(' ')+` L${pts[N][0].toFixed(1)} 96 Z`;
    s+=`<path d="${d}" class="sv-fill-book" opacity=".75"/>`;
    if(sat){const xp=pts[N][0];s+=V.w([[xp,96],[xp,150]],'sv-bridge',1.6)+V.t(xp,166,'pinch-off point','middle','sv-txt-m')+V.t(xp,180,'(local V_G − V(x) = V_TH)','middle','sv-txt-m');}
    else s+=V.t((L0+L1)/2,160,vds<0.05?'uniform channel (V_DS ≈ 0)':'channel thins toward drain','middle','sv-txt-m');
  } else s+=V.t((L0+L1)/2,160,'no inversion layer: device off','middle','sv-txt-m');
  return s+'</svg>'};

V.csTransfer=(vin,p)=>{ /* p: {vdd,rd,k,vth} k = µnCox W/L */
  const out=x=>{ if(x<=p.vth) return p.vdd; const vov=x-p.vth; const vs=p.vdd-p.rd*0.5*p.k*vov*vov; if(vs>=vov) return vs;
    /* triode: Vout = Vdd - Rd k (vov Vout - Vout^2/2) -> quadratic */ const a=p.rd*p.k/2, b=-(1+p.rd*p.k*vov), c=p.vdd; const disc=b*b-4*a*c; return (-b-Math.sqrt(disc))/(2*a); };
  const vin1=(()=>{let lo=p.vth,hi=p.vdd;for(let i=0;i<60;i++){const m=(lo+hi)/2;const vov=m-p.vth;const vs=p.vdd-p.rd*0.5*p.k*vov*vov;(vs>vov)?lo=m:hi=m}return lo})();
  const y=out(vin); const h=1e-4; const gain=(out(vin+h)-out(vin-h))/(2*h);
  const svg=V.plot({w:520,h:290,x:[0,p.vdd],y:[0,p.vdd*1.05],xl:'V_in (V)',yl:'V_out (V)',xt:[0,.5,1,1.5,2,2.5,3].filter(v=>v<=p.vdd),yt:[0,1,2,3].filter(v=>v<=p.vdd),
    series:[{f:out,cls:'sv-book',n:240}],vl:[{x:p.vth,label:'V_TH'},{x:vin1,label:'A: edge of triode',dy:28}],
    fills:[{x0:0,x1:p.vth,cls:'sv-paper',op:0,label:'off'},{x0:p.vth,x1:vin1,cls:'sv-fill-book',op:.06,label:'saturation'},{x0:vin1,x1:p.vdd,cls:'sv-fill-bridge',op:.07,label:'triode'}],
    marks:[{x:vin,y,label:'slope = '+gain.toFixed(2)}],
    extra:(sx,sy)=>{const d=.25;return V.w([[sx(Math.max(0,vin-d)),sy(y-gain*d)],[sx(Math.min(p.vdd,vin+d)),sy(y+gain*d)]].map(q=>[q[0],Math.max(0,Math.min(290,q[1]))]),'sv-bridge',2)},aria:'CS stage input-output characteristic'});
  return {svg,y,gain,vin1,region: vin<=p.vth?'cut':vin<vin1?'sat':'tri'};
};

V.degenGainPlot=(rs)=>{const p={vdd:3,rd:2000,k:NM.k*20,vth:0.7};
  const solve=(vin,R)=>{let lo=0,hi=p.vdd/(p.rd+R+1e-9);for(let i=0;i<60;i++){const id=(lo+hi)/2;const vs=id*R,vd=p.vdd-id*p.rd;const f=mos(vin-vs,Math.max(0,vd-vs),20,0).id;(f>id)?lo=id:hi=id}return p.vdd-lo*p.rd};
  const gain=(vin,R)=>{const h=1e-3;return -(solve(vin+h,R)-solve(vin-h,R))/(2*h)};
  return V.plot({w:520,h:290,x:[0.6,3],y:[0,6],xl:'V_in bias (V)',yl:'|A_v|',xt:[1,1.5,2,2.5,3],yt:[0,1,2,3,4,5,6],

V.bode=(p1,p2,z,ztype,a0)=>{ /* frequencies in Hz (log10 values given) */
  const H=f=>{const w=f;let re=1,im=0;const mul=(a,b)=>{const r=re*a-im*b,i=re*b+im*a;re=r;im=i};const div=(a,b)=>{const d=a*a+b*b;mul(a/d,-b/d)};
    div(1,w/Math.pow(10,p1));if(p2!==null)div(1,w/Math.pow(10,p2));if(ztype==='lhp')mul(1,w/Math.pow(10,z));if(ztype==='rhp')mul(1,-w/Math.pow(10,z));return [a0*Math.hypot(re,im),Math.atan2(im,re)*180/Math.PI]};
  const fx=x=>Math.pow(10,x);let ph0=0;
  const mag=V.plot({w:520,h:230,mb:30,x:[2,11],y:[-60,Math.ceil((20*Math.log10(a0)+10)/20)*20],xl:'',yl:'|A| (dB)',xt:[3,6,9],xtf:V.lx,yt:[-60,-40,-20,0,20,40,60].filter(v=>v<=20*Math.log10(a0)+10),
    series:[{f:x=>20*Math.log10(H(fx(x))[0]),cls:'sv-book',n:300}],vl:[{x:p1,label:'p₁'}].concat(p2!==null?[{x:p2,label:'p₂',dy:28}]:[]).concat(ztype!=='off'?[{x:z,label:(ztype==='rhp'?'RHP ':'LHP ')+'zero',dy:44}]:[]),hl:[{y:0,label:'0 dB (unity gain)'}],aria:'Bode magnitude'});
  /* unwrap phase */
  const pts=[];let prev=0,off=0;for(let i=0;i<=300;i++){const x=2+9*i/300;let p=H(fx(x))[1];if(i&&p-prev>180)off-=360;if(i&&p-prev<-180)off+=360;prev=p;pts.push([x,p+off])}
  const phase=V.plot({w:520,h:200,mt:8,x:[2,11],y:[-270,90],xl:'frequency (Hz, log scale)',yl:'phase (°)',xt:[3,6,9],xtf:V.lx,yt:[-270,-180,-90,0,90],series:[{pts,cls:'sv-bridge',w:2}],vl:[{x:p1},...(p2!==null?[{x:p2}]:[])],aria:'Bode phase'});
  const ugf=(()=>{for(let i=0;i<=900;i++){const x=2+9*i/900;if(H(fx(x))[0]<1)return x}return null})();
  return {svg:mag+phase,ugf};
};

V.csFreq=(rs,cl)=>{ /* exact (6.23) vs Miller estimate; gm=2mS RD=10k CGS=100f CGD=20f CDB=30f */
  const gm=2e-3,RD=1e4,CGS=100e-15,CGD=20e-15,CDB=30e-15+cl;const xi=CGS*CGD+CGS*CDB+CGD*CDB;
  const b1=rs*(1+gm*RD)*CGD+rs*CGS+RD*(CGD+CDB),b2=rs*RD*xi;
  const Hx=f=>{const w=2*Math.PI*f;const nr=-gm*RD,ni=w*CGD*RD;const dr=1-b2*w*w,di=b1*w;return Math.hypot(nr,ni)/Math.hypot(dr,di)};
  const wi=1/(rs*(CGS+(1+gm*RD)*CGD)),wo=1/(RD*(CGD+CDB));const Hm=f=>{const w=2*Math.PI*f;return gm*RD/Math.sqrt((1+(w/wi)**2)*(1+(w/wo)**2))};
  const p1=1/b1,p2=b1/b2,z=gm/CGD;const L=x=>Math.log10(x/(2*Math.PI));
  const svg=V.plot({w:520,h:280,x:[5,11.5],y:[-40,30],xl:'frequency (Hz, log)',yl:'|A_v| (dB)',xt:[6,7,8,9,10,11],xtf:v=>({6:'1M',7:'10M',8:'100M',9:'1G',10:'10G',11:'100G'}[v]||''),yt:[-40,-20,0,20],
    series:[{f:x=>20*Math.log10(Hm(Math.pow(10,x))),cls:'sv-muted',dash:'5 4',n:300,label:'Miller estimate',lx:.72},{f:x=>20*Math.log10(Hx(Math.pow(10,x))),cls:'sv-book',n:300,label:'exact (6.23)',lx:.8}],
    vl:[{x:L(p1),label:'ω_p1'},{x:L(p2),label:'ω_p2',dy:28},{x:L(z),label:'ω_z (RHP)',dy:44}],aria:'CS frequency response'});
  return {svg,p1:p1/(2*Math.PI),p2:p2/(2*Math.PI),z:z/(2*Math.PI),wi:wi/(2*Math.PI),wo:wo/(2*Math.PI)};
};

V.noiseSpec=(wlum2,gm,f1,f2)=>{const kT=1.38e-23*300,K=1e-25,Cox=3.84e-3;const WL=wlum2*1e-12;
  const th=4*kT*(2/3)/gm; /* gate-referred thermal V²/Hz */ const fl=f=>K/(Cox*WL*f);const fc=K*gm*3/(Cox*WL*8*kT);
  const svg=V.plot({w:520,h:280,x:[0,9],y:[-190,-120],xl:'frequency (Hz, log)',yl:'gate-referred PSD (dB V²/Hz)',xt:[0,3,6,9],xtf:V.lx,yt:[-190,-170,-150,-130],
    series:[{f:x=>10*Math.log10(fl(Math.pow(10,x))),cls:'sv-bridge',dash:'5 4',w:1.5,label:'1/f',lx:.15},{f:x=>10*Math.log10(th),cls:'sv-muted',dash:'5 4',w:1.5,label:'thermal',lx:.9},{f:x=>10*Math.log10(th+fl(Math.pow(10,x))),cls:'sv-book',n:300}],

  const tot=th*(f2-f1)+K/(Cox*WL)*Math.log(f2/f1);return {svg,fc,vrms:Math.sqrt(tot),thd:Math.sqrt(th)}};

const CX={mul:(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],div:(a,b)=>{const d=b[0]*b[0]+b[1]*b[1];return [(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d]},abs:a=>Math.hypot(a[0],a[1]),arg:a=>Math.atan2(a[1],a[0])*180/Math.PI};

/* generic Bode plot of a loop gain; returns svg, gain-crossover (Hz), phase margin */
V.bodeGen=(H,lo,hi,o={})=>{
  const N=400,xs=[],mag=[],ph=[];let prev=null,off=0;
  for(let i=0;i<=N;i++){const x=lo+(hi-lo)*i/N,f=Math.pow(10,x),h=H(f);let p=CX.arg(h);if(prev!==null){if(p+off-prev>180)off-=360;if(p+off-prev<-180)off+=360}p+=off;prev=p;xs.push(x);mag.push(20*Math.log10(CX.abs(h)));ph.push(p)}
  let gx=null,pm=null,px=null;for(let i=1;i<=N;i++){if(gx===null&&mag[i-1]>=0&&mag[i]<0){const t=mag[i-1]/(mag[i-1]-mag[i]);gx=xs[i-1]+t*(xs[i]-xs[i-1]);pm=180+ph[i-1]+t*(ph[i]-ph[i-1])}if(px===null&&ph[i-1]>-180&&ph[i]<=-180){const t=(ph[i-1]+180)/(ph[i-1]-ph[i]);px=xs[i-1]+t*(xs[i]-xs[i-1])}}
  const top=Math.max(20,Math.ceil((Math.max(...mag)+5)/20)*20),bot=Math.min(-40,Math.floor((Math.min(...mag))/20)*20);const yt=[];for(let v=bot;v<=top;v+=20)yt.push(v);
  const xt=[];for(let v=Math.ceil(lo);v<=hi;v++)if(v%3===0)xt.push(v);
  const vl=[];if(gx!==null)vl.push({x:gx,label:'GX',dy:14});if(px!==null)vl.push({x:px,label:'PX',dy:30});
  const s1=V.plot({w:520,h:200,mb:26,x:[lo,hi],y:[Math.max(bot,-80),top],xl:'',yl:o.yl||'|βH| (dB)',xt,xtf:V.lx,yt:yt.filter(v=>v>=-80),series:[{pts:xs.map((x,i)=>[x,mag[i]]),cls:'sv-book'}],hl:[{y:0,label:'0 dB'}],vl,aria:'loop gain magnitude'});
  const pb=Math.min(-180,Math.floor(Math.min(...ph)/90)*90),pt=Math.max(0,Math.ceil(Math.max(...ph)/90)*90);const pyt=[];for(let v=pb;v<=pt;v+=90)pyt.push(v);
  const s2=V.plot({w:520,h:180,mt:8,x:[lo,hi],y:[pb,pt],xl:'frequency (Hz, log scale)',yl:'phase (°)',xt,xtf:V.lx,yt:pyt,series:[{pts:xs.map((x,i)=>[x,ph[i]]),cls:'sv-bridge',w:2}],hl:[{y:-180,label:'−180°'}],vl:vl.map(v=>({x:v.x})),
    marks:(gx!==null?[{x:gx,y:pm-180,r:4,label:'PM = '+pm.toFixed(0)+'°',dx:8,dy:16}]:[]),aria:'loop gain phase'});
  return {svg:s1+s2,gx:gx===null?null:Math.pow(10,gx),pm,px:px===null?null:Math.pow(10,px)};
};
/* step response of closed loop T = L/(1+L), L = L0 / Π(1+s/ωi) (all poles, Hz). Normalized to final value. */
V.stepSim=(L0,poles,T)=>{
  const w=poles.filter(Boolean).map(p=>2*Math.PI*p);let d=[1];w.forEach(wi=>{const n=new Array(d.length+1).fill(0);d.forEach((c,i)=>{n[i]+=c;n[i+1]+=c/wi});d=n});
  d[0]+=L0;const n=d.length-1,an=d[n];const a=d.map(c=>c/an); /* s^n + a[n-1]s^{n-1}+...+a0 ; numerator L0/an */
  const b0=L0/an,fin=L0/(1+L0);let x=new Array(n).fill(0);
  const fx=x=>{const dx=new Array(n);for(let i=0;i<n-1;i++)dx[i]=x[i+1];let s=b0;for(let i=0;i<n;i++)s-=a[i]*x[i];dx[n-1]=s;return dx};
  const wmax=Math.max(...w,1);let dt=Math.min(0.05/wmax,T/3000);const steps=Math.min(30000,Math.ceil(T/dt));dt=T/steps;
  const pts=[[0,0]],every=Math.max(1,Math.floor(steps/400));let peak=0,ts=null;
  for(let k=1;k<=steps;k++){const k1=fx(x),x2=x.map((v,i)=>v+dt/2*k1[i]),k2=fx(x2),x3=x.map((v,i)=>v+dt/2*k2[i]),k3=fx(x3),x4=x.map((v,i)=>v+dt*k3[i]),k4=fx(x4);
    x=x.map((v,i)=>v+dt/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]));const y=x[0]/fin;if(!isFinite(y))break;peak=Math.max(peak,y);if(Math.abs(y-1)>0.01)ts=null;else if(ts===null)ts=k*dt;
    if(k%every===0)pts.push([k*dt,y])}
  return {pts,peak,ts};
};

const R = String.raw;

{id:'o1', unit:'Start', sec:'1.1–1.5', label:'book', title:'Why analog, and how this book climbs', mins:3, pages:[1,8], prereq:[],
 obj:'Say what analog circuits are still needed for and how the book is organised.',
 blocks:[
  {t:'why', p:R`Every real signal — sound, radio, a sensor voltage — is analog. Before a processor can touch it, something has to <b>amplify</b>, <b>filter</b> and <b>convert</b> it. Razavi opens by arguing that this front end can never go fully digital (Fig. 1.1, p.2), and that CMOS won analog design mainly because device scaling kept making MOSFETs faster (§1.3, p.6).`},
  {t:'visual', fig:'abstraction', cap:'Levels of abstraction (after Fig. 1.8, p.8). You will switch between these constantly.'},
  {t:'idea', h:'Three habits the book expects', p:R`<ul><li><b>Intuition first, rigor second.</b> Razavi deliberately teaches a simplified device model first (Preface, p.x) and returns to the hard physics in Ch 16.</li><li><b>Robust design (PVT).</b> Process, supply Voltage and Temperature all vary, so a design must work across a range, e.g. a 2.7–3.3 V supply and 0–70 °C (§1.5.2, p.7).</li><li><b>One notation for everything.</b> The book uses uppercase letters for bias, signal, and bias+signal alike (\(I_D\), \(V_{GS}\)) and lets context decide (§1.5.3, p.8). When you are unsure, ask yourself “is this the DC value or the small wiggle?”</li></ul>`},
  {t:'check', q:{type:'mcq', q:R`In Razavi’s notation, what does \(V_{GS}\) mean?`, opts:['Always the DC bias only','Always the small signal only','Bias, signal or both — decided by context','The gate-to-substrate voltage'], a:2, hint:'Look at §1.5.3: he chose not to use lowercase for signals.', explain:R`The book intentionally uses uppercase for all three and relies on context (p.8). This trips up students used to \(v_{gs}\) for signals.`}},
  {t:'recall', prompt:'Without looking: name the four levels of abstraction and one reason analog front ends cannot disappear.', model:'Device → circuit → architecture → system. Natural signals are analog and must be amplified/filtered/converted (ADC) before digital processing.'},
  {t:'book', p:R`Skim Chapter 1 (pp.1–8) once for the story; nothing in it is examined in depth. Fig. 1.8 on p.8 is the picture worth remembering.`}
 ],
 cards:[['What does PVT stand for?','Process, supply Voltage, Temperature — the variations a robust analog design must tolerate (p.7).'],['Razavi’s notation for bias vs signal?','Uppercase for both; context decides (p.8).']]},

{id:'b-cap', unit:'Foundations', label:'bridge', title:'A capacitor stores charge: Q = C·V', mins:2, prereq:[], unlocks:['2d','2e','2n'],
 obj:'Use Q = CV and capacitance per unit area to reason about the gate.',
 why:'Ch 2 builds the whole I/V law from one idea: the gate is a capacitor, so channel charge = capacitance × voltage (Eq. 2.3).',

  {t:'why', p:R`Razavi assumes you are comfortable with capacitors. The MOSFET’s gate, oxide and channel are literally a parallel-plate capacitor, and the amount of channel charge comes straight from \(Q = CV\).`},
  {t:'visual', fig:'capacitor', cap:'Two conductors separated by an insulator. Apply V and equal, opposite charges appear on the plates.'},
  {t:'formal', p:R`For plates of area \(A\) separated by thickness \(t\) of an insulator with permittivity \(\varepsilon\):`, eq:[{tex:R`Q = C\,V,\qquad C = \frac{\varepsilon A}{t}`, note:'Units: Q in coulombs, C in farads, V in volts.'},{tex:R`C_{ox} = \frac{\varepsilon_{ox}}{t_{ox}}\ \ \text{(capacitance per unit area, F/m}^2)`, note:'Razavi’s C_ox is per unit AREA, so the gate capacitance is W·L·C_ox.'}]},
  {t:'example', src:'ours', h:'Gate charge of a small transistor', given:R`\(W = 10\,\mu\text{m}\), \(L = 1\,\mu\text{m}\), \(C_{ox} = 6.9\ \text{fF}/\mu\text{m}^2\) (the book’s value for 50 Å oxide, p.14), 1 V across the oxide.`,
   steps:[{tex:R`C = W L C_{ox} = 10\times1\times6.9 = 69\ \text{fF}`, say:'Area times capacitance per area.'},{tex:R`Q = C V = 69\ \text{fF}\times1\ \text{V} = 69\ \text{fC}`, say:'That is about 430,000 electrons — the channel charge if the full volt lands across the oxide.'}]},
  {t:'check', q:{type:'mcq', q:'If the oxide is made half as thick (same area, same voltage), the stored charge…', opts:['halves','stays the same','doubles','quadruples'], a:2, hint:'C = εA/t — what happens to C when t halves?', explain:'C ∝ 1/t, so halving t doubles C and therefore doubles Q. This is why technology keeps shrinking t_ox (p.11).'}},
  {t:'recall', prompt:'Write Q = ? and C_ox = ? and say what “per unit area” means for a W×L gate.', model:'Q = CV; C_ox = ε_ox/t_ox (F/m²); total gate capacitance = W·L·C_ox.'}
 ],
 cards:[['C_ox is capacitance per…','unit area (F/m²); total gate cap = W·L·C_ox.'],['Value of C_ox for t_ox ≈ 50 Å (book)','≈ 6.9 fF/µm² (p.14); scale inversely with t_ox.']]},

{id:'b-semi', unit:'Foundations', label:'bridge', title:'Doping, carriers and a reverse-biased pn junction', mins:4, prereq:[], unlocks:['2b','2d','2k','2n'],
 obj:'Explain n/p doping, depletion regions, and why reverse bias widens them.',
 why:'Razavi writes “we assume the reader is familiar with doping, mobility, and pn junctions” (p.9). Threshold, body effect and junction capacitance all rest on this.',
 blocks:[
  {t:'why', p:R`Chapter 2 says up front that it assumes doping, mobility and pn junctions (p.9). These three minutes give you exactly the pieces it uses — no more.`},
  {t:'idea', h:'Carriers', p:R`<ul><li>Pure silicon has very few free carriers.</li><li><b>n-type</b>: add donor atoms → extra free <b>electrons</b> (negative). <b>p-type</b>: add acceptors → free <b>holes</b> (positive, they behave like missing electrons).</li><li>A “+” superscript (n⁺, p⁺) means <b>heavily</b> doped → a good conductor.</li><li><b>Mobility μ</b> = how easily a carrier drifts in an electric field. Electrons are 2–4× more mobile than holes, which is why PMOS is weaker (p.20).</li></ul>`},
  {t:'interactive', kind:'pnsim', cap:'Animated walk-through in four steps: doping → junction forms → reverse bias → drift and mobility. Use the step buttons or “Next step”.'},
  {t:'interactive', kind:'pn', cap:'Drag the reverse bias. Free carriers are pushed away from the junction, leaving fixed charged ions: the depletion region.'},
  {t:'idea', h:'What the book needs from this', p:R`<ul><li>The MOSFET source and drain (n⁺) sit in a p substrate, forming two pn junctions. They must stay <b>reverse-biased</b> (no forward conduction), so the NMOS substrate goes to the most negative supply (p.11).</li><li>A depletion region holds <b>fixed charge</b> \(Q_{dep}\) and grows with reverse voltage roughly as \(\sqrt{\Phi + V_R}\). That square root reappears in the body-effect equation (2.22).</li><li>A depletion region is two charge layers with no carriers between them — a capacitor whose value <b>drops</b> as reverse bias grows: \(C_j = C_{j0}/[1+V_R/\Phi_B]^m\) (p.30).</li></ul>`},
  {t:'check', q:{type:'mcq', q:'Why is the NMOS substrate tied to the most negative supply?', opts:['To increase mobility','So the source/drain pn junctions stay reverse-biased','To lower the threshold voltage','Because holes need a path to the drain'], a:1, hint:'What must never happen to the n⁺/p junctions?', explain:'Forward-biased S/D junctions would conduct into the substrate. Grounding the p-substrate (most negative) keeps them reverse-biased (p.11).'}},
  {t:'recall', prompt:'In two lines: what is a depletion region, and what happens to it when reverse bias increases?', model:'A region near the junction emptied of free carriers, leaving fixed ionised dopants (charge). More reverse bias → wider region, more fixed charge, less capacitance.'}
 ],
 cards:[['Why is PMOS weaker than NMOS?','Hole mobility is ≈ ½–¼ of electron mobility → less current drive (p.20, p.37).'],['Depletion width vs reverse bias','Grows ≈ √(Φ + V_R): more fixed charge, lower junction capacitance.']]},
