 why:'Section 2.4.3 and Eq. 3.1–3.2 linearise curves around an operating point. That idea is the entire basis of small-signal models.',
 blocks:[
  {t:'why', p:R`A MOSFET’s \(I_D\)–\(V_{GS}\) curve is a parabola, not a line. Yet amplifier analysis treats it as linear. The trick: bias it at a point and only wiggle a little. Up close, every smooth curve looks straight.`},
  {t:'interactive', kind:'tangent', cap:'Pick a bias point. A small wiggle in x around it moves y along the tangent — that tangent’s slope is the small-signal gain.'},
  {t:'formal', eq:[{tex:R`y \approx \alpha_0 + \alpha_1 x \quad\text{for small } x`, note:'Eq. 3.2: α₀ = operating (bias) point, α₁ = small-signal gain (the slope).'},{tex:R`\Delta y \approx \frac{dy}{dx}\Big|_{\text{bias}}\Delta x`, note:'Change in output ≈ slope × change in input.'}]},
  {t:'mis', items:[[`“Small signal means the signal is unimportant.”`,`It means small enough that the slope barely changes over the swing (p.47–48).`],[`“The small-signal model works for any input.”`,`If the gain changes with the signal level, you are in large-signal territory and get distortion (p.50).`]]},
  {t:'check', q:{type:'mcq', q:'A circuit’s gain measured with a 1 mV input is 10, but with a 200 mV input the output is clearly distorted. Why?', opts:['The 200 mV swing moves far enough along the curve that the slope changes','Small-signal gain is always wrong','The bias point is zero','The input impedance dropped'], a:0, hint:'Is the curve still “straight” over a 200 mV range?', explain:'Over a large swing the slope (gain) varies, so higher-order terms matter: nonlinearity (p.48, p.50).'}},
  {t:'recall', prompt:'Explain “small signal” to a friend using the words bias point, slope and wiggle.', model:'Fix the circuit at a DC bias point; a small wiggle at the input moves the output along the curve’s tangent, so output wiggle ≈ slope × input wiggle.'}
 ],
 cards:[['Small-signal gain is…','the slope of the large-signal curve at the bias point.']]},

{id:'b-kcl', unit:'Foundations', label:'bridge', title:'Dependent sources, KCL and parallel resistors', mins:4, prereq:[], unlocks:['2o','3c','3d'],
 obj:'Solve a node with a voltage-controlled current source and two resistors.',
 why:'Every small-signal analysis in Ch 3 is: replace the MOSFET with g_m·v_gs and r_o, then write KCL at the output node.',
 blocks:[
  {t:'why', p:R`Fig. 3.5 (p.52) solves the CS amplifier in one line: \(-g_m v_1 (r_o\|R_D) = v_{out}\). That line uses three tools: a dependent source, KCL, and parallel resistors.`},
  {t:'visual', fig:'vccsBridge', cap:'A voltage-controlled current source (diamond) pushes G·v₁ into two resistors in parallel.'},
  {t:'formal', eq:[{tex:R`\text{VCCS: } i = G\cdot v_{control}`, note:'Its current is set by a voltage elsewhere in the circuit. G (or g_m) has units of A/V = siemens.'},{tex:R`\sum i_{\text{leaving node}} = 0\quad\text{(KCL)}`, note:'Charge does not pile up at a node.'},{tex:R`R_1\|R_2 = \frac{R_1R_2}{R_1+R_2}`, note:'Always smaller than the smaller of the two.'}]},
  {t:'example', src:'ours', h:'Solve the node', given:R`\(G = 2\) mA/V, \(v_1 = 10\) mV, \(R_1 = 10\) kΩ, \(R_2 = 40\) kΩ, current of \(G v_1\) flows <i>down</i> out of the top node.`,
   steps:[{tex:R`R_1\|R_2 = \frac{10\cdot40}{50} = 8\ \text{k}\Omega`, say:'Combine the resistors first.'},{tex:R`v_{out} = -G v_1 (R_1\|R_2) = -(2\,\text{mA/V})(10\,\text{mV})(8\,\text{k}\Omega)`, say:'The source pulls current out of the node, so the node voltage goes negative.'},{tex:R`v_{out} = -160\ \text{mV}`, say:'Gain = −16. Notice: this is exactly the CS amplifier shape you will meet in §3.2.'}]},
  {t:'check', q:{type:'num', q:'R₁ = 20 kΩ in parallel with R₂ = 20 kΩ. Result in kΩ?', a:10, tol:0.01, unit:'kΩ', hint:'Equal resistors in parallel → half.', explain:'20·20/40 = 10 kΩ.'}},
  {t:'recall', prompt:'Write KCL for a node fed by G·v₁ and loaded by R₁ and R₂, then solve for v_out.', model:'G v₁ + v_out/R₁ + v_out/R₂ = 0 → v_out = −G v₁ (R₁‖R₂).'}
 ],
 cards:[['R₁‖R₂','R₁R₂/(R₁+R₂) — smaller than either.'],['VCCS units','A/V = S (siemens), like g_m.']]},

{id:'b-log', unit:'Foundations', label:'bridge', title:'Log scales and “per decade”', mins:2, prereq:[], unlocks:['2m'],
 obj:'Read a log-scale plot and interpret “80 mV per decade”.',
 why:'Subthreshold current (Fig. 2.27) is plotted on a log axis; the key number is mV per decade.',
 blocks:[
  {t:'why', p:R`Fig. 2.27 (p.27) plots \(\log I_D\). On a log axis, an exponential becomes a straight line — so the slope is quoted as “mV per decade”.`},
  {t:'formal', eq:[{tex:R`\text{one decade} = \times 10`, note:'Going up one grid line on a log axis multiplies the value by 10.'},{tex:R`I_D \propto e^{V_{GS}/(\zeta V_T)} \Rightarrow \log_{10} I_D \text{ is linear in } V_{GS}`, note:'Exponential → straight line on a log plot.'}]},
  {t:'example', src:'ours', h:'Reading 80 mV/decade', given:'A device leaks 1 nA at V_GS = 0.3 V with an 80 mV/decade slope.', steps:[{tex:R`V_{GS}=0.22\ \text{V} \Rightarrow 0.1\ \text{nA}`, say:'Drop 80 mV → current ÷ 10.'},{tex:R`V_{GS}=0.14\ \text{V} \Rightarrow 0.01\ \text{nA}`, say:'Another 80 mV → another ÷ 10.'}]},
  {t:'check', q:{type:'mcq', q:'With 80 mV/decade, lowering V_GS by 240 mV reduces subthreshold current by…', opts:['3×','30×','1000×','240×'], a:2, hint:'240/80 = how many decades?', explain:'Three decades → 10³ = 1000×.'}},
  {t:'recall', prompt:'What does “80 mV per decade” mean in one sentence?', model:'Every 80 mV decrease in V_GS cuts the subthreshold current by a factor of 10.'}
 ],
 cards:[['One decade = ?','A factor of 10.']]},
];

/* ---- content2.js ---- */
LESSONS.push(
/* ---------------- CHAPTER 2 ---------------- */
{id:'2a', unit:'Ch 2 · MOS device physics', sec:'2.1.1', label:'book', title:'The MOSFET as a switch — and the questions it raises', mins:2, pages:[9,10], prereq:['o1'],
 obj:'State the five questions §2.1.1 asks about a MOSFET switch.',
 blocks:[
  {t:'why', p:R`Razavi starts with the crudest possible model — a switch — because it immediately forces the right questions. Everything in Chapter 2 answers one of them.`},
  {t:'idea', h:'The switch picture (Fig. 2.1, p.10)', p:R`An NMOS has gate (G), source (S) and drain (D). With the gate “high”, S and D are connected; with the gate “low”, they are isolated. S and D are interchangeable because the device is physically symmetric.`},
  {t:'idea', h:'The questions (p.10)', p:R`<ul><li>At what gate voltage does it turn on? → <b>threshold voltage</b> (§2.2.1)</li><li>What is the S–D resistance when on/off? → <b>triode region</b> (§2.2.2)</li><li>How does that resistance depend on terminal voltages? → <b>I/V equations</b></li><li>Is the S–D path always a linear resistor? → <b>saturation</b>, no</li><li>What limits its speed? → <b>capacitances</b> (§2.4.2)</li></ul>`},
  {t:'check', q:{type:'order', q:'Put these in the order Chapter 2 answers them.', items:['Threshold voltage','Triode (resistor) behaviour','Saturation and g_m','Second-order effects (body, CLM, subthreshold)','Capacitances and small-signal model'], explain:'§2.2.1 → §2.2.2 → §2.2.2 (sat) → §2.3 → §2.4.'}},
  {t:'recall', prompt:'List as many of the five “switch questions” as you can.', model:'Turn-on voltage? On/off resistance? Dependence on terminal voltages? Always linear? Speed limit?'}
 ],
 cards:[['Why are S and D interchangeable?','The MOS structure is symmetric (p.10).']]},

{id:'2b', unit:'Ch 2 · MOS device physics', sec:'2.1.2', label:'book', title:'Inside the MOSFET: W, L, oxide and the fourth terminal', mins:4, pages:[10,12], prereq:['2a','b-semi'],
 obj:'Label an NMOS cross-section and define L_eff, t_ox, source vs drain, and the bulk.',
 blocks:[
  {t:'why', p:R`Every equation later contains \(W\), \(L\) and \(C_{ox}\). This lesson is where they physically live.`},
  {t:'visual', fig:'structure', cap:'NMOS cross-section after Fig. 2.2–2.3 (pp.10–11). Pinch or Ctrl+scroll to zoom.'},
  {t:'idea', h:'Read the picture', p:R`<ul><li>A <b>p-type substrate</b> (also “bulk” or “body”) holds two heavily doped <b>n⁺</b> regions: source and drain.</li><li>A conductive <b>polysilicon gate</b> sits on a thin insulating <b>SiO₂</b> layer of thickness \(t_{ox}\).</li><li>\(L\) = gate length along S→D; \(W\) = width, into the page. Side-diffusion shortens the real channel: \(L_{eff} = L_{drawn} - 2L_D\). From here on the book writes \(L\) for \(L_{eff}\) (p.11).</li><li><b>Source vs drain</b> is defined by carriers: the source <i>supplies</i> them (electrons for NMOS), the drain <i>collects</i> them. Roles can swap as voltages change.</li><li>The substrate is a <b>fourth terminal</b>. NMOS bulk → most negative supply; PMOS sits in an <b>n-well</b> tied to the most positive supply (p.12).</li></ul>`},
  {t:'mis', items:[['“The drain is whichever terminal is labelled D.”','It is whichever terminal collects carriers; at the circuit level that can change (p.11, Example 2.7).'],['“MOSFETs have three terminals.”','Four: the bulk changes behaviour (body effect, §2.3).']]},
  {t:'check', q:{type:'mcq', q:'In an NMOS, which terminal is the source?', opts:['The one at higher voltage','The one that supplies electrons — normally the lower-voltage n⁺ side','Always the left one in the drawing','The p⁺ bulk contact'], a:1, prereq:'b-semi', hint:'Source supplies carriers; electrons flow from low potential toward high potential.', explain:'The source provides the charge carriers (p.11). For NMOS, electrons leave the lower-potential n⁺ region.'}},
  {t:'check', q:{type:'mcq', q:'Why can each PMOS have its own independent n-well while all NMOS share one substrate?', opts:['PMOS are bigger','PMOS are built inside separate local n-wells on the common p-substrate','NMOS have no substrate','Because holes are faster'], a:1, hint:'Look at Fig. 2.4(b).', explain:'NMOS sit directly in the shared p-substrate; each PMOS can be placed in its own n-well — a flexibility some analog circuits exploit (p.12).'}},
  {t:'recall', prompt:'Sketch the cross-section from memory: label S, D, G, B, n⁺, p-sub, t_ox, L.', model:'p-sub with two n⁺ wells; thin oxide + poly gate between them; L along S→D under the gate; p⁺ bulk contact.'},
  {t:'book', p:R`Typical values “at the time of writing”: \(L_{eff}\approx0.15\,\mu\text{m}\), \(t_{ox}\approx50\) Å (p.11). Your lab uses a 180 nm process — same era.`}
 ],
 cards:[['L_eff = ?','L_drawn − 2L_D (side diffusion), p.11'],['NMOS bulk connects to…','the most negative supply (keeps S/D junctions reverse-biased)'],['PMOS n-well connects to…','the most positive supply']]},

{id:'2c', unit:'Ch 2 · MOS device physics', sec:'2.1.3', label:'book', title:'MOS symbols the book uses', mins:2, pages:[12,13], prereq:['2b'],
 obj:'Recognise Razavi’s 3- and 4-terminal NMOS/PMOS symbols.',
 blocks:[
  {t:'visual', fig:'symbols', cap:'After Fig. 2.5(b), p.13. PMOS source drawn on top because it sits at the higher potential.'},
  {t:'idea', p:R`Razavi omits the bulk connection when NMOS bulk is at ground and PMOS bulk at \(V_{DD}\) — which is “unless otherwise stated” for the rest of the book (p.36). He avoids the digital “switch” symbols because seeing which end is the source helps you understand circuits (p.12).`},
  {t:'check', q:{type:'mcq', q:'In Razavi’s PMOS symbol, why is the source drawn on top?', opts:['Convention from bipolar','It is at a higher potential than its gate','The drain must always be grounded','It has the arrow'], a:1, explain:'“The source of the PMOS device is positioned on top as a visual aid because it has a higher potential than its gate” (p.12).'}},
  {t:'recall', prompt:'Draw an NMOS and a PMOS symbol and mark S, D, G.', model:'Arrow on the source; PMOS has a bubble/arrow inward and the source at the top.'}
 ],
 cards:[['When is the bulk terminal omitted from symbols?','When NMOS bulk = ground and PMOS bulk = V_DD (the book’s default).']]},

{id:'2d', unit:'Ch 2 · MOS device physics', sec:'2.2.1', label:'book', title:'Threshold voltage: from depletion to inversion', mins:4, pages:[13,15], prereq:['2b','b-cap','b-semi'],
 obj:'Describe what happens under the gate as V_G rises, and what V_TH means.',
 blocks:[
  {t:'why', p:R`“For what value of \(V_G\) does the device turn on?” was question one. The answer, \(V_{TH}\), appears in every equation from now on.`},
  {t:'interactive', kind:'threshold', cap:'Fig. 2.6 (p.13) as a slider. Watch three stages: nothing → depletion → inversion.'},
  {t:'idea', h:'What you just watched', p:R`<ul><li>Gate and substrate form a capacitor. As \(V_G\) rises, holes are repelled, leaving fixed negative ions: a <b>depletion region</b>. No carriers → no current.</li><li>The structure acts like two capacitors in series: oxide and depletion (Fig. 2.6(c)).</li><li>When the surface potential is high enough, electrons flow in from the source and form a <b>channel</b> (the surface is “inverted”). That gate voltage is \(V_{TH}\).</li><li>Above \(V_{TH}\), depletion charge stays roughly constant while channel charge keeps growing.</li></ul>`},
  {t:'formal', p:R`Razavi quotes (proof in his ref. [1]):`, eq:[{tex:R`V_{TH} = \Phi_{MS} + 2\Phi_F + \frac{Q_{dep}}{C_{ox}}`, note:'(2.1) Φ_MS: gate–substrate work-function difference; Φ_F = (kT/q) ln(N_sub/n_i); Q_dep = √(4qε_si|Φ_F|N_sub). You will not need to compute this — only know it depends on doping and oxide.'}]},
  {t:'idea', h:'Practical points', p:R`<ul><li>The “native” \(V_{TH}\) may be unusable (e.g. ≈ 0), so fabs adjust it with a channel implant (Fig. 2.7).</li><li>Turn-on is really gradual; the book <b>assumes abrupt turn-on</b> for now (p.15) and fixes this later with subthreshold conduction (§2.3).</li><li>PMOS: same story with polarities reversed; a negative \(V_{GS}\) forms a hole channel (Fig. 2.8).</li></ul>`},
  {t:'mis', items:[['“Current starts as soon as V_G > 0.”','Below V_TH you only get depletion — fixed ions, no carriers (p.14).'],['“V_TH is a sharp physical line.”','It is a definition; turn-on is gradual and V_TH is ambiguous to measure (pp.14–15, 27).']]},
  {t:'check', q:{type:'mcq', q:'With 0 < V_G < V_TH, why does no drain current flow?', opts:['The oxide breaks down','The depletion region has only fixed ions, no mobile carriers','The source is floating','Holes block the drain'], a:1, prereq:'b-semi', hint:'What kind of charge is left behind when holes are pushed away?', explain:'Depletion = fixed negative ions; no mobile charge carriers are available, so no current (p.14).'}},
  {t:'recall', prompt:'Describe the three stages under the gate as V_G rises from 0.', model:'1) holes repelled → depletion of fixed ions; 2) surface potential rises, two series caps; 3) at V_TH electrons form an inversion channel linking S and D.'}
 ],
 cards:[['What is the “inversion layer”?','A thin layer of electrons at the oxide–silicon surface (in p-substrate) that links S and D once V_GS > V_TH.'],['Below V_TH (simple model) the device is…','off — depletion only, no carriers (book assumes abrupt turn-on for now).']]},

{id:'2e', unit:'Ch 2 · MOS device physics', sec:'2.2.2', label:'book', title:'Channel charge: Q_d = W·C_ox·(V_GS − V_TH)', mins:3, pages:[15,16], prereq:['2d','b-drift','b-cap'],
 obj:'Write the channel charge per unit length with and without a drain voltage.',
 blocks:[
  {t:'why', p:R`This is the first of the two observations Razavi uses to derive the I/V law (p.15). Get it, and Eq. 2.8 becomes four short steps.`},
  {t:'idea', h:'Observation 1 — I = Q_d·v', p:R`Charge density \(Q_d\) (C/m) moving at velocity \(v\) gives current \(I = Q_d\,v\) (Eq. 2.2, Fig. 2.9). You met this in the bridge lesson.`},
  {t:'idea', h:'Observation 2 — how much charge is in the channel?', p:R`With S and D both grounded, the gate–channel capacitor has \(V_{GS}\) across it, but the first \(V_{TH}\) is “used up” creating the depletion region. Only the <b>overdrive</b> \(V_{GS}-V_{TH}\) produces mobile charge. Capacitance per unit length is \(W C_{ox}\).`},
  {t:'formal', eq:[{tex:R`Q_d = W C_{ox}\,(V_{GS} - V_{TH})`, note:'(2.3) uniform channel, V_DS = 0'},{tex:R`Q_d(x) = W C_{ox}\,\big[V_{GS} - V(x) - V_{TH}\big]`, note:'(2.4) with V_DS > 0: the channel potential V(x) rises from 0 at the source to V_DS at the drain, so the local gate–channel voltage shrinks toward the drain.'}]},
  {t:'interactive', kind:'bench', mini:true, cap:'Fig. 2.10 live: raise V_DS and watch the channel thin toward the drain (thickness ∝ local overdrive).'},
  {t:'check', q:{type:'mcq', q:'Why is the channel thinner near the drain when V_DS > 0?', opts:['The gate oxide is thicker there','The local gate-to-channel voltage V_GS − V(x) is smaller there','Electrons move slower near the drain','Mobility is lower at the drain'], a:1, prereq:'b-cap', hint:'Q = C·V, and V(x) increases toward the drain.', explain:'Q_d(x) ∝ V_GS − V(x) − V_TH, and V(x) grows from 0 to V_DS (p.16).'}},
  {t:'recall', prompt:'Write Q_d(x) and explain each term in words.', model:'Q_d(x) = WC_ox[V_GS − V(x) − V_TH]: capacitance per length × (local gate-channel voltage minus what is used to deplete).'}
 ],
 cards:[['Q_d(x) = ?','W C_ox [V_GS − V(x) − V_TH] (Eq. 2.4)'],['Overdrive voltage','V_GS − V_TH (“effective voltage”)']]},

{id:'2f', unit:'Ch 2 · MOS device physics', sec:'2.2.2', label:'book', title:'Deriving the triode equation — one step at a time', mins:5, pages:[16,17], prereq:['2e','b-drift','b-int'],
 obj:'Follow (and reproduce) the four moves from Q_d(x) to Eq. 2.8.',
 blocks:[
  {t:'why', p:R`This derivation is the backbone of the book. You do not have to love it — but each step is small, and every step has a reason. Take one at a time; there is a checkpoint before each reveal.`},
  {t:'derive', h:'From charge to current (Eqs. 2.4 → 2.8)', steps:[
    {tex:R`I_D = -W C_{ox}\big[V_{GS} - V(x) - V_{TH}\big]\,v`, say:'Plug Q_d(x) into I = Q_d·v. (2.5)', why:'The minus sign: carriers are electrons (negative charge).'},
    {tex:R`v = \mu_n E = -\mu_n\frac{dV}{dx}`, say:'Drift velocity = mobility × field, and the field is −dV/dx.', why:'From the drift bridge lesson.', ask:{q:'Substitute v. What happens to the two minus signs?', opts:['They cancel → positive I_D','They add → −2','One remains → I_D negative'], a:0}},
    {tex:R`I_D = W C_{ox}\,\mu_n\big[V_{GS} - V(x) - V_{TH}\big]\frac{dV(x)}{dx}`, say:'Minus × minus = plus. (2.6)', why:'Boundary conditions: V(0) = 0 at the source, V(L) = V_DS at the drain.'},
    {tex:R`\int_{0}^{L} I_D\,dx = \int_{0}^{V_{DS}} W C_{ox}\mu_n\big[V_{GS} - V_{TH} - V\big]\,dV`, say:'Multiply both sides by dx and integrate along the channel. (2.7)', why:'I_D is the same at every x (charge cannot pile up — KCL), so it is a constant inside the left integral.', ask:{q:'Why can I_D be pulled out of the left-hand integral?', opts:['It is constant along the channel (current continuity)','It is zero','Because L is small'], a:0}},
    {tex:R`I_D\,L = W C_{ox}\mu_n\Big[(V_{GS}-V_{TH})V_{DS} - \tfrac12 V_{DS}^2\Big]`, say:'Left: ∫I_D dx = I_D·L. Right: the integral ∫(A − V)dV with A = V_GS − V_TH.', why:'∫₀^X (A − V)dV = A·X − X²/2 (integration bridge).', ask:{q:'∫₀^{V_DS} (A − V) dV equals…', opts:['A·V_DS − V_DS²/2','A − V_DS','A·V_DS²'], a:0}},
    {tex:R`\boxed{I_D = \mu_n C_{ox}\frac{W}{L}\Big[(V_{GS}-V_{TH})V_{DS} - \tfrac12 V_{DS}^2\Big]}`, say:'Divide by L. This is Eq. (2.8), the triode-region law.', why:'Assumes µ_n and V_TH constant along the channel — revisited in Ch 16 (p.18).'}
  ]},
  {t:'stop'},
  {t:'formal', h:'Read the result like a designer', p:R`Every factor is a design knob: technology (\(\mu_n C_{ox}\)), geometry (\(W/L\), the <b>aspect ratio</b>), and terminal voltages measured from the source.`, eq:[{tex:R`I_D = \mu_n C_{ox}\frac{W}{L}\Big[V_{ov}V_{DS} - \tfrac12V_{DS}^2\Big],\quad V_{ov}\equiv V_{GS}-V_{TH}`, note:'Valid while V_DS ≤ V_GS − V_TH (triode).'}]},
  {t:'check', q:{type:'mcq', q:'Which assumption does the integration in (2.7) make?', opts:['µ_n and V_TH do not vary along the channel','V_DS is always zero','The drain is grounded','Electrons have zero velocity'], a:0, hint:'Razavi says it on p.18.', explain:'“The integration in (2.7) assumes µ_n and V_TH are independent of x and the gate and drain voltages” — revisited in Ch 16.'}},
  {t:'recall', prompt:'Blank page: rebuild Eq. 2.8 from I = Q_d·v. Write the four moves (substitute, field, integrate, divide).', model:'I = −WC_ox[V_GS−V−V_TH]v; v = −µ dV/dx → I = WC_oxµ[...]dV/dx; integrate 0→L, 0→V_DS; I_D L = WC_oxµ[V_ov V_DS − V_DS²/2]; divide by L.'}
 ],
 simpler:'Think of the channel as a conveyor belt. How much charge sits on each metre of belt depends on how hard the gate pulls (V_GS − V(x) − V_TH). How fast the belt runs depends on how steep the voltage slope is (dV/dx). Current = charge per metre × speed. Because the belt is continuous, current is the same everywhere, so you can add up (integrate) along the belt and divide by its length.',
 cards:[['Triode equation (2.8)','I_D = µnCox(W/L)[(V_GS−V_TH)V_DS − V_DS²/2]'],['Why does I_D come out of the integral?','Current is constant along the channel (continuity).']]},

{id:'2g', unit:'Ch 2 · MOS device physics', sec:'2.2.2', label:'book', title:'Parabolas, overdrive, and the MOSFET as a resistor', mins:4, pages:[17,19], prereq:['2f','b-slope'],
 obj:'Find the parabola peak, define aspect ratio/overdrive, and compute R_on in deep triode.',
 blocks:[
  {t:'visual', fig:'parabolas', cap:'Eq. 2.8 for four overdrives (Fig. 2.11, p.17). Solid = where 2.8 is valid; dotted = mathematical continuation the real device does not follow.'},
  {t:'derive', h:'Where is the peak? (2.9)', steps:[
    {tex:R`\frac{\partial I_D}{\partial V_{DS}} = \mu_nC_{ox}\frac WL\big(V_{ov} - V_{DS}\big)`, say:'Differentiate 2.8 with respect to V_DS.', why:'Derivative of V_ov·V_DS is V_ov; of ½V_DS² is V_DS.'},
    {tex:R`= 0 \Rightarrow V_{DS} = V_{GS}-V_{TH}`, say:'The top of a parabola has zero slope.', ask:{q:'Setting the slope to zero gives V_DS = ?', opts:['V_GS − V_TH','V_TH','2(V_GS − V_TH)'], a:0}},
    {tex:R`I_{D,max} = \tfrac12\mu_nC_{ox}\frac WL(V_{GS}-V_{TH})^2`, say:'Substitute back. (2.9)', why:'This value will reappear as the saturation current.'}
  ]},
  {t:'idea', h:'Deep triode = voltage-controlled resistor', p:R`If \(V_{DS} \ll 2(V_{GS}-V_{TH})\), the \(\tfrac12V_{DS}^2\) term is negligible, so \(I_D\) is linear in \(V_{DS}\) (Fig. 2.12) — the device is a resistor whose value the gate controls (Fig. 2.13). Unlike a bipolar transistor, a MOSFET can be <b>on</b> while carrying <b>zero current</b>.`},
  {t:'formal', eq:[{tex:R`I_D \approx \mu_nC_{ox}\frac WL(V_{GS}-V_{TH})V_{DS}`, note:'(2.10)'},{tex:R`R_{on} = \frac{1}{\mu_nC_{ox}\frac WL(V_{GS}-V_{TH})}`, note:'(2.11) valid for V_DS ≪ 2(V_GS − V_TH)'}]},
  {t:'example', src:'book', h:'Example 2.1 (pp.18–19)', given:R`Plot \(R_{on}\) of \(M_1\) vs \(V_G\). \(\mu_nC_{ox}=50\,\mu\text{A/V}^2\), \(W/L=10\), \(V_{TH}=0.7\) V. Drain open, source at 1 V (Fig. 2.14).`, steps:[
    {tex:R`I_D = 0 \Rightarrow V_{DS}=0`, say:'Open drain: no current, so if on, the device is deep in triode.'},
    {tex:R`V_G < 1\,\text{V}+V_{TH} = 1.7\,\text{V} \Rightarrow R_{on}=\infty`, say:'V_GS = V_G − 1 V must exceed V_TH.'},
    {tex:R`R_{on} = \frac{1}{50\,\mu\text{A/V}^2\times10\times(V_G - 1.7\,\text{V})}`, say:'(2.12). At V_G = 2.7 V: 1/(500 µA/V × 1 V) = 2 kΩ.'}]},
  {t:'visual', fig:'ron', cap:'Example 2.1 result (Fig. 2.14b): R_on falls as 1/(V_G − 1.7 V).'},
  {t:'check', q:{type:'num', q:'Same device as Example 2.1. V_G = 2.2 V. R_on in kΩ?', a:4, tol:0.02, unit:'kΩ', prereq:'b-slope', hint:'V_G − 1.7 = 0.5 V; multiply 500 µA/V × 0.5 V and invert.', explain:'R_on = 1/(500e-6 × 0.5) = 4 kΩ.'}},
  {t:'check', q:{type:'mcq', q:'Doubling the overdrive in deep triode makes R_on…', opts:['double','halve','stay constant','quadruple'], a:1, explain:'R_on ∝ 1/(V_GS − V_TH).'}},
  {t:'recall', prompt:'Write R_on and the condition for deep triode.', model:'R_on = 1/[µnCox(W/L)(V_GS − V_TH)], valid when V_DS ≪ 2(V_GS − V_TH).'}
 ],
 cards:[['Peak of triode parabola occurs at','V_DS = V_GS − V_TH'],['R_on (deep triode)','1/[µnCox(W/L)(V_GS−V_TH)]'],['Aspect ratio','W/L']]},

{id:'2h', unit:'Ch 2 · MOS device physics', sec:'2.2.2', label:'book', title:'Saturation: pinch-off and the square law', mins:4, pages:[19,21], prereq:['2g'],
 obj:'Explain pinch-off and use I_D = ½µnCox(W/L)(V_GS − V_TH)².',
 blocks:[
  {t:'why', p:R`Amplifiers live in saturation. This is the equation you will use more than any other in the book.`},
  {t:'interactive', kind:'bench', mini:true, start:{vgs:1.5,vds:1.4}, cap:'Pinch-off (Fig. 2.16): once V_DS > V_GS − V_TH the channel no longer reaches the drain.'},
  {t:'idea', h:'What pinch-off means', p:R`Local channel charge \(\propto V_{GS}-V(x)-V_{TH}\). When \(V(x)\) reaches \(V_{GS}-V_{TH}\), the charge at that point is zero: the channel <b>pinches off</b> before reaching the drain. Raising \(V_{DS}\) further just moves the pinch-off point slightly toward the source — the current barely changes (Fig. 2.15).`},
  {t:'formal', p:R`Integrate only up to the pinch-off point, where \(V = V_{GS}-V_{TH}\) (equivalently, set \(V_{DS}=V_{ov}\) in 2.8):`, eq:[{tex:R`I_D = \tfrac12\mu_nC_{ox}\frac WL(V_{GS}-V_{TH})^2`, note:'(2.13) — independent of V_DS while L′ ≈ L'},{tex:R`I_D = -\tfrac12\mu_pC_{ox}\frac WL(V_{GS}-V_{TH})^2`, note:'(2.15) PMOS: I_D taken as flowing drain→source, hence the minus. µ_p ≈ ½–¼ µ_n.'}]},
  {t:'idea', p:R`A saturated MOSFET is therefore a <b>current source</b> between D and S (Fig. 2.17) — but note one terminal of each such source is tied to ground or \(V_{DD}\); only one end “floats” (p.21).`},
  {t:'example', src:'ours', h:'A number to anchor it', given:R`NMOS with \(\mu_nC_{ox}=134\,\mu\text{A/V}^2\) (from Table 2.1’s UO and TOX), \(W/L = 10\), \(V_{TH}=0.7\) V, \(V_{GS}=1.2\) V, \(V_{DS}=1.5\) V.`, steps:[
    {tex:R`V_{ov} = 1.2-0.7 = 0.5\ \text{V};\quad V_{DS}=1.5 > 0.5\ \Rightarrow\ \text{saturation}`, say:'Always check the region first.'},
    {tex:R`I_D = \tfrac12(134\,\mu)(10)(0.5)^2 = 167.5\ \mu\text{A}`, say:'Square law.'}]},
  {t:'mis', items:[['“Saturation means the transistor is fully on (like a BJT).”','MOS saturation = current saturates with V_DS. Razavi footnotes this difference (p.19).'],['“In saturation I_D is exactly constant.”','Channel-length modulation adds a small slope (§2.3).']]},
  {t:'check', q:{type:'num', q:'Same NMOS, but V_GS = 1.0 V (V_DS = 1.5 V). I_D in µA?', a:60.3, tol:0.03, unit:'µA', hint:'V_ov = 0.3 V. Check region, then ½·134µ·10·0.09.', explain:'V_ov = 0.3 < 1.5 → saturation. I_D = 0.5·134e-6·10·0.09 = 60.3 µA.'}},
  {t:'check', q:{type:'mcq', q:'Doubling the overdrive in saturation multiplies I_D by…', opts:['2','4','√2','1 (unchanged)'], a:1, explain:'Square law: (2V_ov)² = 4V_ov².'}},
  {t:'recall', prompt:'Explain pinch-off in one sentence and write the saturation current.', model:'Where V(x) reaches V_GS−V_TH the channel charge vanishes; beyond that, extra V_DS hardly changes I_D = ½µnCox(W/L)(V_GS−V_TH)².'}
 ],
 cards:[['Saturation current (2.13)','I_D = ½µnCox(W/L)(V_GS − V_TH)²'],['Saturation condition (NMOS)','V_DS ≥ V_GS − V_TH'],['A saturated MOSFET acts as a…','current source between D and S (Fig. 2.17)']]},

{id:'2i', unit:'Ch 2 · MOS device physics', sec:'2.2.2', label:'book', title:'Transconductance g_m — three ways to write it', mins:4, pages:[21,22], prereq:['2h','b-slope'],
 obj:'Compute g_m three ways and know which form to use when.',
 blocks:[
  {t:'why', p:R`\(g_m\) measures how well a transistor converts a voltage change into a current change. Gain of nearly every amplifier in this book is \(g_m\) × some resistance.`},
  {t:'formal', eq:[{tex:R`g_m = \frac{\partial I_D}{\partial V_{GS}}\Big|_{V_{DS}\,\text{const}}`, note:'(2.16) definition — a slope (see the derivative bridge)'},{tex:R`g_m = \mu_nC_{ox}\frac WL(V_{GS}-V_{TH})`, note:'(2.17) differentiate the square law'},{tex:R`g_m = \sqrt{2\mu_nC_{ox}\frac WL I_D}`, note:'(2.18) eliminate V_ov using I_D'},{tex:R`g_m = \frac{2I_D}{V_{GS}-V_{TH}}`, note:'(2.19) eliminate µnCox(W/L)'}]},
  {t:'visual', fig:'gm3', cap:'Fig. 2.18: the same g_m looks different depending on what you hold constant.'},
  {t:'idea', h:'Which form when?', p:R`<ul><li>Fixed geometry, changing bias voltage → (2.17): \(g_m\) rises with overdrive.</li><li>Fixed geometry, changing current → (2.18): \(g_m \propto \sqrt{I_D}\).</li><li>Fixed current, choosing overdrive → (2.19): \(g_m\) <b>falls</b> as overdrive rises. Small overdrive = efficient (but see subthreshold, §2.3).</li><li>Curiosity: \(g_m\) in saturation equals \(1/R_{on}\) in deep triode at the same overdrive (p.21).</li></ul>`},
  {t:'example', src:'ours', h:'All three agree', given:R`Previous device: \(\mu_nC_{ox}W/L = 1.34\) mA/V², \(V_{ov}=0.5\) V, \(I_D=167.5\,\mu\)A.`, steps:[
    {tex:R`(2.17):\ 1.34\,\text{m}\times0.5 = 0.67\ \text{mS}`, say:''},
    {tex:R`(2.18):\ \sqrt{2\times1.34\,\text{m}\times167.5\,\mu} = 0.67\ \text{mS}`, say:''},
    {tex:R`(2.19):\ 2\times167.5\,\mu/0.5 = 0.67\ \text{mS}`, say:'Same number — they are one quantity written three ways.'}]},
  {t:'example', src:'book', h:'Example 2.2 (p.22): g_m in triode', given:'Plot g_m vs V_DS for a device with fixed gate voltage V_b (Fig. 2.19).', steps:[
    {tex:R`V_{DS} > V_b - V_{TH}:\ g_m \approx \text{const}`, say:'Saturation: I_D roughly constant, so is g_m.'},
    {tex:R`V_{DS} < V_b - V_{TH}:\ g_m = \mu_nC_{ox}\frac WL V_{DS}`, say:'(2.21): differentiate 2.8 w.r.t. V_GS. g_m collapses as V_DS falls.'}]},
  {t:'visual', fig:'gmTriode', cap:'Example 2.2 result: entering triode destroys g_m — so amplifiers keep MOSFETs saturated.'},
  {t:'check', q:{type:'num', q:'A saturated NMOS carries 200 µA with V_ov = 0.2 V. g_m in mS?', a:2, tol:0.02, unit:'mS', hint:'Use the form that needs only I_D and V_ov.', explain:'(2.19): 2·200µ/0.2 = 2 mS.'}},
  {t:'check', q:{type:'mcq', q:'Holding I_D fixed, you double W/L. Overdrive and g_m become…', opts:['V_ov ÷√2, g_m ×√2','V_ov ×2, g_m ×2','V_ov same, g_m same','V_ov ÷2, g_m ×4'], a:0, hint:'I_D ∝ (W/L)V_ov² fixed; then use 2.18.', explain:'V_ov ∝ 1/√(W/L) → ÷√2; g_m = √(2k′(W/L)I_D) → ×√2.'}},
  {t:'recall', prompt:'Write all three g_m expressions and say which one shows g_m falling with overdrive.', model:'µnCox(W/L)V_ov; √(2µnCox(W/L)I_D); 2I_D/V_ov — the last, at constant I_D.'}
 ],
 cards:[['g_m (overdrive form)','µnCox(W/L)(V_GS−V_TH)'],['g_m (current form)','√(2µnCox(W/L)I_D)'],['g_m (I_D, V_ov form)','2I_D/(V_GS−V_TH)'],['Why keep amplifier MOSFETs in saturation?','g_m drops in triode (Ex. 2.2): g_m = µnCox(W/L)V_DS.']]},

{id:'2j', unit:'Ch 2 · MOS device physics', sec:'2.2.2', label:'book', title:'Triode or saturation? The gate–drain test', mins:2, pages:[22,23], prereq:['2h'],
 obj:'Decide the region using V_G − V_D, for NMOS and PMOS.',
 blocks:[
  {t:'visual', fig:'gateDrain', cap:'After Fig. 2.20 (p.23).'},
  {t:'idea', p:R`Pinch-off happens when the gate–drain voltage is too small to invert the channel at the drain end. So you can decide the region from \(V_G\) and \(V_D\) alone. This is the fastest test when analysing circuits by inspection.`},
  {t:'check', q:{type:'mcq', q:'NMOS, V_TH = 0.5 V, V_G = 1.2 V, V_D = 0.9 V. Region?', opts:['Saturation (V_G − V_D = 0.3 V < V_TH)','Triode','Off','Cannot tell without V_S'], a:0, hint:'Compute V_G − V_D and compare with V_TH.', explain:'0.3 V < 0.5 V → pinched off → saturation (assuming it is on).'}},
  {t:'check', q:{type:'mcq', q:'PMOS, |V_THP| = 0.6 V, V_G = 1.0 V, V_D = 1.4 V. Region?', opts:['Triode','Saturation (V_D − V_G = 0.4 V < 0.6 V)','Off','Breakdown'], a:1, explain:'For PMOS: if V_D − V_G < |V_THP| the device is saturated (p.23).'}},
  {t:'recall', prompt:'State the gate–drain test for NMOS and PMOS.', model:'NMOS saturated if V_G − V_D < V_TH; PMOS saturated if V_D − V_G < |V_THP|.'}
 ],
 cards:[['NMOS saturation via gate–drain test','V_G − V_D < V_TH'],['PMOS saturation via gate–drain test','V_D − V_G < |V_THP|']]},

{id:'2k', unit:'Ch 2 · MOS device physics', sec:'2.3', label:'book', title:'Body effect: the bulk is a second gate', mins:4, pages:[23,25], prereq:['2h','b-semi'],
 obj:'Use Eq. 2.22 and explain why V_TH rises when V_SB > 0.',
 blocks:[
  {t:'why', p:R`In real circuits the source of many transistors is <i>not</i> at the bulk voltage (source followers, cascodes). Then \(V_{TH}\) shifts.`},
  {t:'idea', p:R`If the bulk drops below the source, the S/D junctions are more reverse-biased, the depletion region under the gate widens (Fig. 2.22), and \(Q_{dep}\) grows. Since \(V_{TH}\) contains \(Q_{dep}/C_{ox}\) (Eq. 2.1), the threshold <b>rises</b>. The same happens if the source rises above a grounded bulk.`},
  {t:'formal', eq:[{tex:R`V_{TH} = V_{TH0} + \gamma\Big(\sqrt{|2\Phi_F + V_{SB}|} - \sqrt{|2\Phi_F|}\Big)`, note:'(2.22) γ = √(2qε_si N_sub)/C_ox, typically 0.3–0.4 V^½'}]},
  {t:'visual', fig:'body', cap:'V_TH versus V_SB (square-root rise). The marked point is Example 2.3’s turn-off threshold.'},
  {t:'example', src:'book', h:'Example 2.3 (pp.24–25)', given:R`Gate at 1.2 V, source at 0, bulk at \(V_X\) swept from \(-\infty\) to 0. \(V_{TH0}=0.6\) V, \(\gamma=0.4\,\text{V}^{1/2}\), \(2\Phi_F=0.7\) V. When does it turn off?`, steps:[
    {tex:R`1.2 = 0.6 + 0.4\Big(\sqrt{0.7 - V_{X1}} - \sqrt{0.7}\Big)`, say:'Off when V_TH reaches V_GS = 1.2 V. Here V_SB = −V_X. (2.23)'},
    {tex:R`\sqrt{0.7-V_{X1}} = 1.5 + 0.837 = 2.337`, say:'Isolate the square root.'},
    {tex:R`V_{X1} = 0.7 - 5.46 = -4.76\ \text{V}`, say:'Square both sides. For V_X1 < V_X < 0, I_D rises as V_X rises (Eq. 2.24).'}]},
  {t:'idea', h:'Why designers dislike it', p:R`In Fig. 2.24, a source-follower-like circuit: without body effect \(V_{in}-V_{out}\) is constant; with body effect it grows as \(V_{out}\) rises, because \(V_{TH}\) rises. Usually undesirable (p.25).`},
  {t:'check', q:{type:'mcq', q:'An NMOS source rises from 0 to 1 V while its bulk stays grounded. V_TH…', opts:['decreases','increases','is unchanged','becomes negative'], a:1, prereq:'b-semi', explain:'V_SB = 1 V > 0 → wider depletion → larger Q_dep → higher V_TH.'}},
  {t:'check', q:{type:'num', q:'V_TH0 = 0.6 V, γ = 0.4, 2Φ_F = 0.7 V, V_SB = 1 V. V_TH in volts?', a:0.787, tol:0.01, unit:'V', hint:'√1.7 = 1.304, √0.7 = 0.837.', explain:'0.6 + 0.4(1.304 − 0.837) = 0.6 + 0.187 = 0.787 V.'}},
  {t:'recall', prompt:'Write Eq. 2.22 and explain the physics in one sentence.', model:'V_TH = V_TH0 + γ(√(2Φ_F+V_SB) − √(2Φ_F)); larger V_SB widens depletion → more Q_dep → higher V_TH.'}
 ],
 cards:[['Body effect equation','V_TH = V_TH0 + γ(√(2Φ_F+V_SB) − √(2Φ_F))'],['Typical γ (book)','0.3–0.4 V^½'],['Example 2.3 turn-off point','V_X = −4.76 V']]},

{id:'2l', unit:'Ch 2 · MOS device physics', sec:'2.3', label:'book', title:'Channel-length modulation: the slope in saturation', mins:4, pages:[25,27], prereq:['2h','b-slope'],
 obj:'Use I_D(1+λV_DS), know λ ∝ 1/L, and see why longer L is a better current source.',
 blocks:[
  {t:'interactive', kind:'clm', cap:'Fig. 2.25: λ tilts the saturation curve. Extend the tilt backwards and it hits zero at V_DS = −1/λ.'},
  {t:'idea', p:R`In saturation the pinch-off point moves toward the source as \(V_{DS}\) rises, so the effective length \(L' = L-\Delta L\) shrinks and current rises slightly. Razavi assumes \(\Delta L/L = \lambda V_{DS}\).`},
  {t:'formal', eq:[{tex:R`I_D \approx \tfrac12\mu_nC_{ox}\frac WL(V_{GS}-V_{TH})^2(1+\lambda V_{DS})`, note:'(2.26)'},{tex:R`\lambda \propto \frac1L \ \Rightarrow\ \frac{\partial I_D}{\partial V_{DS}} \propto \frac{\lambda}{L} \propto \frac{1}{L^2}`, note:'Example 2.4: doubling L divides the slope by FOUR (at fixed overdrive) — but also halves current, so W may need to double.'},{tex:R`g_m = \sqrt{\frac{2\mu_nC_{ox}(W/L)I_D}{1+\lambda V_{DS}}}`, note:'(2.28). (2.19) is unchanged.'}]},
  {t:'mis', items:[['“So I can set I_D by choosing V_DS.”','The V_DS dependence is weak; it is treated as an error, not a control (p.27).'],['“λ is a fixed constant of the process.”','λ depends on L, and the linear model gets worse in short-channel devices (p.27, Ch 16).']]},
  {t:'check', q:{type:'mcq', q:'You double L (same W, same overdrive). The saturation-region slope ∂I_D/∂V_DS…', opts:['halves','is divided by 4','doubles','stays the same'], a:1, explain:'Slope ∝ λ/L and λ ∝ 1/L → ∝ 1/L² (Example 2.4).'}},
  {t:'check', q:{type:'mcq', q:'Why does a longer channel make a “better” current source?', opts:['Its current is larger','Its output current changes less with V_DS','It has higher mobility','It turns on faster'], a:1, explain:'Smaller λ → flatter saturation curve → closer to an ideal current source (p.26).'}},
  {t:'recall', prompt:'Write the CLM-corrected saturation current and how λ scales with L.', model:'I_D = ½µnCox(W/L)V_ov²(1+λV_DS); λ ∝ 1/L.'}
 ],
 cards:[['CLM saturation current','½µnCox(W/L)V_ov²(1+λV_DS)'],['λ scales as','1/L (Example 2.4: slope ∝ 1/L²)']]},

{id:'2m', unit:'Ch 2 · MOS device physics', sec:'2.3', label:'book', title:'Subthreshold conduction and voltage limits', mins:3, pages:[27,28], prereq:['2i','b-log'],
 obj:'Describe weak inversion, the 80 mV/decade slope, and g_m = I_D/(ζV_T).',
 blocks:[
  {t:'idea', p:R`The device does not switch off abruptly. Near and below \(V_{TH}\) a weak inversion layer still carries current that depends <b>exponentially</b> on \(V_{GS}\).`},
  {t:'formal', eq:[{tex:R`I_D = I_0\exp\frac{V_{GS}}{\zeta V_T},\quad V_T=\frac{kT}{q},\ \zeta>1`, note:'(2.30) for V_DS ≳ 200 mV'}]},
  {t:'visual', fig:'subth', cap:'Fig. 2.27 sketch: exponential (straight on a log axis) below V_TH, square-law above. Typical slope ≈ 80 mV per decade at room temperature.'},
  {t:'idea', h:'Consequences', p:R`<ul><li>With \(V_{TH}=0.3\) V, setting \(V_{GS}=0\) only cuts current by \(10^{3.75}\) — leakage power in large chips (p.27).</li><li>Rough rule: a device is near threshold when \(I_D/W \approx 1\,\mu\text{A}/\mu\text{m}\) in saturation.</li><li>You cannot get unlimited \(g_m\) by widening W at fixed \(I_D\): the device enters subthreshold where \(g_m = I_D/(\zeta V_T)\) — worse than a BJT’s \(I_C/V_T\). Subthreshold also means big W or tiny current → slow (p.28).</li><li><b>Voltage limits:</b> gate-oxide breakdown at high \(V_{GS}\); punchthrough at high \(V_{DS}\) in short devices; hot-electron effects (Ch 16).</li></ul>`},
  {t:'check', q:{type:'num', q:'V_TH = 0.3 V and slope = 80 mV/decade. By what factor does I_D fall from V_GS = V_TH to V_GS = 0? Give the exponent n in 10ⁿ.', a:3.75, tol:0.02, unit:'(10ⁿ)', prereq:'b-log', hint:'300 mV ÷ 80 mV per decade.', explain:'300/80 = 3.75 decades → 10^3.75, matching p.27.'}},
  {t:'check', q:{type:'mcq', q:'Why can’t you make g_m arbitrarily large by increasing W at constant I_D?', opts:['W is limited by the mask','The device enters subthreshold, where g_m = I_D/(ζV_T) stops growing','Mobility drops to zero','λ becomes negative'], a:1, explain:'Eq. 2.18 is derived from the square law; once V_GS approaches V_TH the exponential law holds and g_m saturates at I_D/(ζV_T) (p.28).'}},
  {t:'recall', prompt:'Write the subthreshold law and its key slope number.', model:'I_D = I_0 exp(V_GS/(ζV_T)); ≈ 80 mV per decade.'}
 ],
 cards:[['Subthreshold slope (book, room T)','≈ 80 mV per decade'],['Max g_m at a given I_D (MOS, subthreshold)','I_D/(ζV_T)']]},

{id:'2n', unit:'Ch 2 · MOS device physics', sec:'2.4.1–2.4.2', label:'book', title:'Layout and the four kinds of MOS capacitance', mins:5, pages:[28,33], prereq:['2h','b-cap','b-semi'],
 obj:'Name C1–C4 and junction caps, and sketch C_GS, C_GD vs region.',
 blocks:[
  {t:'why', p:R`“What limits the speed?” Capacitance. Every node in an analog circuit sees these, and Chapter 6 is built on them.`},
  {t:'idea', h:'Layout in one paragraph (§2.4.1)', p:R`S, D and gate are reached through <b>contact windows</b> to metal wires; the gate poly extends past the channel. One dimension of each S/D junction is \(W\); the other must fit the contacts (typically 3–4× minimum L). Smaller junction area → smaller capacitance (Fig. 2.28).`},
  {t:'visual', fig:'caps', cap:'Capacitances inside the device (after Fig. 2.31).'},
  {t:'formal', h:'The pieces (p.30)', eq:[{tex:R`C_1 = WLC_{ox}`, note:'gate–channel oxide'},{tex:R`C_2 = WL\sqrt{q\varepsilon_{si}N_{sub}/(4\Phi_F)}`, note:'channel–substrate depletion'},{tex:R`C_3 = C_4 = WC_{ov}`, note:'gate overlap with S and D (fringing: not simply WL_D·C_ox)'},{tex:R`C_j = \frac{C_{j0}}{\big[1+V_R/\Phi_B\big]^m}`, note:'junction caps: bottom-plate (per area) + sidewall C_jsw (per length); m ≈ 0.3–0.4'}]},
  {t:'example', src:'book', h:'Example 2.6 (p.31): folding a transistor', given:'Two layouts of the same W/L (Fig. 2.32): one wide device vs two parallel fingers of W/2 sharing a drain.', steps:[
    {tex:R`(a):\ C_{DB}=C_{SB}=WEC_j + 2(W+E)C_{jsw}`, say:'E = the S/D region length.'},
    {tex:R`(b):\ C_{DB} = \frac W2 EC_j + 2\Big(\frac W2+E\Big)C_{jsw}`, say:'The shared drain has half the area: the “folded” structure.'},
    {tex:R`C_{SB} = WEC_j + 2(W+2E)C_{jsw}`, say:'Two outer sources. Folding substantially cuts drain capacitance for the same W/L.'}]},
  {t:'stop'},
  {t:'idea', h:'How C_GS and C_GD depend on region (p.32)', p:R`<ul><li><b>Off:</b> \(C_{GS}=C_{GD}=C_{ov}W\); gate–bulk = oxide in series with depletion.</li><li><b>Deep triode:</b> channel charge splits equally: \(C_{GS}=C_{GD}=\tfrac12WLC_{ox}+WC_{ov}\).</li><li><b>Saturation:</b> \(C_{GD}\approx WC_{ov}\); \(C_{GS}=\tfrac23WLC_{ox}+WC_{ov}\) (non-uniform field along the channel).</li><li>Gate–bulk is usually neglected when on: the inversion layer shields the bulk.</li></ul>`},
  {t:'visual', fig:'cgscgd', cap:'Fig. 2.33 sketch (V_DS fixed, sweeping V_GS): note the jumps — simple models don’t transition smoothly, which troubles simulators (p.32).'},
  {t:'check', q:{type:'mcq', q:'In saturation, the gate–drain capacitance is roughly…', opts:['WLC_ox','½WLC_ox + WC_ov','WC_ov (overlap only)','zero'], a:2, explain:'The channel is pinched off near the drain, so only overlap remains (p.32).'}},
  {t:'check', q:{type:'mcq', q:'Why does a folded (two-finger, shared-drain) layout help?', opts:['It lowers V_TH','It roughly halves the drain junction area/capacitance for the same W/L','It increases mobility','It removes overlap capacitance'], a:1, explain:'Example 2.6 — and folding also cuts gate resistance by ~4× (p.35).'}},
  {t:'recall', prompt:'Give C_GS and C_GD in off, deep-triode and saturation.', model:'Off: WC_ov each. Deep triode: ½WLC_ox + WC_ov each. Saturation: C_GS = ⅔WLC_ox + WC_ov, C_GD ≈ WC_ov.'}
 ],
 cards:[['C_GS in saturation','⅔WLC_ox + WC_ov'],['C_GD in saturation','≈ WC_ov'],['C_GS = C_GD in deep triode','½WLC_ox + WC_ov'],['Junction cap vs reverse bias','C_j = C_j0/[1+V_R/Φ_B]^m']]},

{id:'2o', unit:'Ch 2 · MOS device physics', sec:'2.4.3', label:'book', title:'The small-signal model: g_m, r_o, g_mb', mins:5, pages:[33,36], prereq:['2i','2k','2l','b-ss','b-kcl'],
 obj:'Draw the MOS small-signal model and compute r_o and g_mb.',
 blocks:[
  {t:'why', p:R`From Chapter 3 on, you will replace every saturated MOSFET with this little circuit and write KCL. This is the tool.`},
  {t:'idea', p:R`Nudge a bias point slightly and ask how the other quantities respond (b-ss bridge). Gate voltage change → drain current change \(g_m v_{gs}\) (a VCCS). Drain voltage change → current change through CLM, which acts like a resistor \(r_o\). Bulk voltage change → current change via body effect, \(g_{mb}v_{bs}\).`},
  {t:'interactive', kind:'ssbuild', cap:'Build Fig. 2.36 one element at a time.'},
  {t:'formal', eq:[{tex:R`r_o = \frac{\partial V_{DS}}{\partial I_D} = \frac{1}{\tfrac12\mu_nC_{ox}\frac WL(V_{GS}-V_{TH})^2\lambda}\approx\frac{1}{\lambda I_D}`, note:'(2.35)–(2.38) r_o limits the maximum gain of most amplifiers'},{tex:R`g_{mb} = \frac{\partial I_D}{\partial V_{BS}} = g_m\frac{\gamma}{2\sqrt{2\Phi_F+V_{SB}}} = \eta\,g_m`, note:'(2.39)–(2.44) η falls as V_SB grows; g_m·v_gs and g_mb·v_bs have the same polarity'}]},
  {t:'example', src:'ours', h:'Numbers for our running device', given:R`\(I_D=167.5\,\mu\)A, \(g_m=0.67\) mS, \(\lambda=0.1\,\text{V}^{-1}\), \(\gamma=0.45\), \(2\Phi_F=0.9\) V (Table 2.1), \(V_{SB}=0\).`, steps:[
    {tex:R`r_o \approx \frac{1}{0.1\times167.5\,\mu} = 59.7\ \text{k}\Omega`, say:''},
    {tex:R`g_mr_o = 0.67\,\text{m}\times59.7\,\text{k} \approx 40`, say:'The intrinsic gain — remember this name for Ch 3.'},
    {tex:R`\eta = \frac{0.45}{2\sqrt{0.9}} = 0.237\ \Rightarrow\ g_{mb}\approx0.16\ \text{mS}`, say:'Body transconductance ~ a quarter of g_m here.'}]},
  {t:'idea', h:'Complete model & Example 2.8', p:R`Add the capacitances \(C_{GS}, C_{GD}, C_{GB}, C_{SB}, C_{DB}\) for the full model (Fig. 2.38). In Example 2.8 (p.36), with a current source biasing a device: \(g_m\propto\sqrt{I_1}\), while \(g_{mb}\) also depends on how \(V_{SB}\) shifts with current. Rule of thumb from the end of Ch 3: use the <b>simplest model that captures each transistor’s role</b>.`},
  {t:'check', q:{type:'num', q:'λ = 0.2 V⁻¹, I_D = 0.5 mA. r_o in kΩ?', a:10, tol:0.02, unit:'kΩ', prereq:'b-kcl', explain:'1/(0.2 × 0.5e-3) = 10 kΩ.'}},
  {t:'check', q:{type:'mcq', q:'In the small-signal model, what connects gate to source at low frequency?', opts:['A short circuit','An open circuit (infinite impedance)','r_o','g_m'], a:1, explain:'The insulated gate draws no DC/low-frequency current (p.33).'}},
  {t:'recall', prompt:'Draw the small-signal model with all three elements and write r_o and g_mb.', model:'D–S: g_m v_gs ‖ r_o ‖ g_mb v_bs; G open. r_o ≈ 1/(λI_D); g_mb = ηg_m, η = γ/(2√(2Φ_F+V_SB)).'}
 ],
 cards:[['r_o ≈','1/(λI_D)'],['g_mb = ?','η·g_m, η = γ/(2√(2Φ_F+V_SB))'],['Intrinsic gain','g_m·r_o — max gain of a single transistor (Ex. 3.2)']]},

{id:'2p', unit:'Ch 2 · MOS device physics', sec:'2.4.4–2.4.6', label:'book', title:'SPICE Level 1, NMOS vs PMOS, long vs short channel', mins:4, pages:[36,38], prereq:['2o'],
 obj:'Read Table 2.1, compare NMOS/PMOS numbers, and know the limits of the simple model.',
 blocks:[
  {t:'idea', h:'Table 2.1 (0.5 µm process, Level 1)', p:R`<div class="tbl"><table><tr><th>Param</th><th>Meaning</th><th>NMOS</th><th>PMOS</th></tr>
  <tr><td class="num">VTO</td><td>V_TH at V_SB = 0</td><td class="num">0.7 V</td><td class="num">−0.8 V</td></tr>
  <tr><td class="num">GAMMA</td><td>body-effect γ</td><td class="num">0.45 V^½</td><td class="num">0.4 V^½</td></tr>
  <tr><td class="num">PHI</td><td>2Φ_F</td><td class="num">0.9 V</td><td class="num">0.8 V</td></tr>
  <tr><td class="num">TOX</td><td>oxide thickness</td><td class="num">9 nm</td><td class="num">9 nm</td></tr>
  <tr><td class="num">UO</td><td>mobility</td><td class="num">350 cm²/V·s</td><td class="num">100 cm²/V·s</td></tr>
  <tr><td class="num">LAMBDA</td><td>CLM λ</td><td class="num">0.1 V⁻¹</td><td class="num">0.2 V⁻¹</td></tr>
  <tr><td class="num">CJ / CJSW</td><td>junction caps</td><td class="num">0.56e-3 F/m² / 0.35e-11 F/m</td><td class="num">0.94e-3 / 0.32e-11</td></tr>
  <tr><td class="num">CGDO</td><td>overlap per width</td><td class="num">0.4e-9 F/m</td><td class="num">0.3e-9 F/m</td></tr></table></div>
  <p class="small muted">Selected rows; full table on p.37.</p>`},
  {t:'derive', h:'Turning UO and TOX into µnCox (our working)', steps:[
    {tex:R`C_{ox} = \frac{\varepsilon_{ox}}{t_{ox}} = \frac{3.9\times8.854\times10^{-12}}{9\times10^{-9}} = 3.84\times10^{-3}\ \text{F/m}^2`, say:'= 3.84 fF/µm².', why:'ε_ox = 3.9 ε₀.'},
    {tex:R`\mu_nC_{ox} = 0.035\ \tfrac{\text{m}^2}{\text{V·s}}\times3.84\times10^{-3} = 134\ \mu\text{A/V}^2`, say:'350 cm²/V·s = 0.035 m²/V·s.', why:'This is where the 134 µA/V² in our examples comes from.'},
    {tex:R`\mu_pC_{ox} = 0.010\times3.84\times10^{-3} = 38\ \mu\text{A/V}^2`, say:'PMOS ≈ 0.29× NMOS here; the book quotes ≈ 0.25 in modern processes (p.37).', why:''}]},
  {t:'example', src:'ours', h:'Problem 2.2 worked (W/L = 50/0.5, |I_D| = 0.5 mA)', given:'Compute g_m, r_o and intrinsic gain for NMOS and PMOS with Table 2.1.', steps:[
    {tex:R`\text{NMOS: } g_m=\sqrt{2(134\mu)(100)(0.5\text{m})}=3.66\ \text{mS},\ r_o=\tfrac{1}{0.1\times0.5\text{m}}=20\ \text{k}\Omega`, say:'g_m r_o ≈ 73.'},
    {tex:R`\text{PMOS: } g_m=\sqrt{2(38\mu)(100)(0.5\text{m})}=1.96\ \text{mS},\ r_o=\tfrac{1}{0.2\times0.5\text{m}}=10\ \text{k}\Omega`, say:'g_m r_o ≈ 20. NMOS wins on both counts — prefer NFETs where possible (p.37).'}]},
  {t:'idea', h:'A warning the book gives you (§2.4.6)', p:R`The square law is valid for long channels (≈ 4 µm). Intrinsic gain from Table 2.1 is “quite higher than actual values” for short devices. Razavi keeps the simple model because it builds intuition; Ch 16 fixes the rigor (p.38). You will see this in your own lab data in lesson 3e.`},
  {t:'check', q:{type:'mcq', q:'For equal size and current, why are NMOS preferred over PMOS in analog paths?', opts:['Higher g_m and higher r_o','Lower capacitance only','Smaller V_TH only','They need no well'], a:0, explain:'µ_pC_ox ≈ 0.25µ_nC_ox → lower g_m; NMOS also show higher r_o → more ideal current sources and higher gain (p.37).'}},
  {t:'recall', prompt:'Name 5 Level-1 parameters and what each controls.', model:'VTO (V_TH0), GAMMA (body effect), PHI (2Φ_F), UO & TOX (µCox), LAMBDA (CLM), CJ/CJSW (junction caps), CGDO (overlap).'}
 ],
 cards:[['µnCox from Table 2.1','≈ 134 µA/V² (UO = 350, TOX = 9 nm)'],['µpCox vs µnCox (book, modern)','≈ 0.25×']]}
);

{id:'3a', unit:'Ch 3 · Single-stage amplifiers', sec:'3.1', label:'book', title:'What an amplifier is: bias point, slope, trade-offs', mins:3, pages:[47,48], prereq:['b-ss'],

  {t:'interactive', kind:'tangent', cap:'Fig. 3.1 idea: the gain is the slope at the bias point; if the slope changes over your signal swing, the circuit is nonlinear.'},

{id:'3b', unit:'Ch 3 · Single-stage amplifiers', sec:'3.2.1', label:'book', title:'Common-source stage: sweeping V_in from 0 to V_DD', mins:5, pages:[48,50], prereq:['3a','2h','2g','2j'],

  {t:'visual', fig:'csSchem', cap:'Fig. 3.3(a): the common-source stage with resistive load.'},
  {t:'interactive', kind:'cs', cap:'Fig. 3.3(b) live. Drag V_in and watch the region change. The orange line is the local slope = small-signal gain.'},
  {t:'formal', h:'The three regions (pp.49–50)', eq:[{tex:R`V_{in}<V_{TH}:\quad V_{out}=V_{DD}`, note:'M₁ off, no current through R_D'},{tex:R`V_{out}=V_{DD}-R_D\,\tfrac12\mu_nC_{ox}\tfrac WL(V_{in}-V_{TH})^2`, note:'(3.3) saturation, CLM neglected'},{tex:R`V_{in1}-V_{TH}=V_{DD}-R_D\,\tfrac12\mu_nC_{ox}\tfrac WL(V_{in1}-V_{TH})^2`, note:'(3.4) point A: V_out has fallen to V_in − V_TH (edge of triode)'},{tex:R`V_{out}=V_{DD}\frac{R_{on}}{R_{on}+R_D}`, note:'(3.6) deep triode: M₁ is a resistor, so a voltage divider'}]},
  {t:'example', src:'ours', h:'Find point A', given:R`\(V_{DD}=3\) V, \(R_D=2\) kΩ, \(\mu_nC_{ox}W/L = 2.68\) mA/V² (Table 2.1 device with W/L = 20), \(V_{TH}=0.7\) V.`, steps:[
    {tex:R`V_{ov} = 3 - (2\,\text{k})(\tfrac12)(2.68\,\text{m})V_{ov}^2 = 3-2.68V_{ov}^2`, say:'At A, V_out = V_ov. Substitute into (3.4).'},
    {tex:R`2.68V_{ov}^2+V_{ov}-3=0\ \Rightarrow\ V_{ov}=\frac{-1+\sqrt{1+32.2}}{5.36}=0.888\ \text{V}`, say:'Quadratic formula, positive root.'},

 ],
 cards:[['CS stage output in saturation (3.3)','V_out = V_DD − R_D·½µnCox(W/L)(V_in−V_TH)²'],['Point A condition','V_out = V_in − V_TH']]},

{id:'3c', unit:'Ch 3 · Single-stage amplifiers', sec:'3.2.1', label:'book', title:'CS gain: A_v = −g_m R_D and its trade-offs', mins:4, pages:[50,51], prereq:['3b','2i','b-slope','b-kcl'],
 obj:'Derive −g_m R_D two ways and explain what limits gain.',
 blocks:[
  {t:'derive', h:'Gain as the slope of (3.3)', steps:[
    {tex:R`A_v=\frac{\partial V_{out}}{\partial V_{in}}`, say:'Small-signal gain = slope of the transfer curve. (3.8)', why:'Small-signal bridge.'},
    {tex:R`A_v=-R_D\,\mu_nC_{ox}\frac WL(V_{in}-V_{TH})`, say:'Differentiate the square term: the ½ and the 2 cancel. (3.9)', why:'Derivative bridge: d/dV[½k(V−a)²] = k(V−a).', ask:{q:'What is µnCox(W/L)(V_in − V_TH)?', opts:['g_m','r_o','I_D'], a:0}},
    {tex:R`\boxed{A_v=-g_mR_D}`, say:'(3.10)', why:'Intuition: ΔV_in → ΔI_D = g_mΔV_in → ΔV_out = −g_mR_DΔV_in. The small-signal model (Fig. 3.3d) gives the same in one line.'}]},
  {t:'example', src:'book', h:'Example 3.1 (p.50): I_D and g_m vs V_in', given:'Sketch drain current and g_m of M₁ as V_in sweeps.', steps:[
    {tex:R`I_D\ \text{rises after } V_{TH},\ \to V_{DD}/R_D\ \text{if } R_{on}\ll R_D`, say:'Fig. 3.4(a).'},
    {tex:R`g_m:\ \text{rises in saturation, then falls as } \mu_nC_{ox}\tfrac WL V_{DS}\ \text{in triode}`, say:'Fig. 3.4(b): a peak at point A.'}]},
  {t:'formal', h:'How to get more gain (3.11)', eq:[{tex:R`A_v=-\sqrt{2\mu_nC_{ox}\frac WL I_D}\,\frac{V_{RD}}{I_D}=-\sqrt{\frac{2\mu_nC_{ox}W/L}{I_D}}\;V_{RD}`, note:'V_RD = drop across R_D'}]},
  {t:'idea', h:'Every knob costs something', p:R`<ul><li>Bigger \(W/L\) → more capacitance (slower).</li><li>Bigger \(V_{RD}\) → less room for output swing; if \(V_{DD}-V_{RD}=V_{in}-V_{TH}\) you are already at the edge of triode.</li><li>Smaller \(I_D\) at fixed \(V_{RD}\) → larger \(R_D\) → bigger time constant at the output.</li><li>And since \(g_m\) varies with signal, a large swing changes the gain → <b>nonlinearity</b>. Good designs make gain a weak function of signal-dependent quantities (p.50).</li></ul>`},
  {t:'example', src:'ours', h:'Numbers', given:R`Same CS stage, biased at \(V_{in}=1.2\) V.`, steps:[
    {tex:R`I_D=\tfrac12(2.68\,\text{m})(0.5)^2=0.335\ \text{mA},\ V_{out}=3-0.67=2.33\ \text{V}`, say:'2.33 V > V_ov = 0.5 V → saturation ✓'},
    {tex:R`g_m=2.68\,\text{m}\times0.5=1.34\ \text{mS}\ \Rightarrow\ A_v=-1.34\,\text{m}\times2\,\text{k}=-2.68`, say:'Compare with the slope readout on the CS slider at V_in = 1.2 V.'}]},
  {t:'check', q:{type:'num', q:'g_m = 1 mS, R_D = 10 kΩ (λ = 0). Small-signal gain A_v?', a:-10, tol:0.01, unit:'V/V', prereq:'b-kcl', hint:'Mind the sign.', explain:'A_v = −g_m R_D = −10. Inverting.'}},
  {t:'check', q:{type:'mcq', q:'To double the gain at constant V_RD and W/L, the drain current must…', opts:['double','be divided by 4','be divided by 2','stay the same'], a:1, hint:'A_v ∝ 1/√I_D at fixed V_RD.', explain:'From (3.11): |A_v| ∝ V_RD/√I_D, so I_D → I_D/4 (and R_D ×4 — a slower output node).'}},
  {t:'recall', prompt:'Explain −g_m R_D in words (no equations) and give two costs of raising gain.', model:'Input wiggle → current wiggle g_m·Δv → flows through R_D → output wiggle, inverted. Costs: capacitance (bigger W/L), swing (bigger V_RD), speed (bigger R_D).'}
 ],
 cards:[['CS gain (λ = 0)','A_v = −g_m R_D'],['CS gain at fixed V_RD (3.11)','−√(2µnCox(W/L)/I_D)·V_RD']]},

{id:'3e', unit:'Ch 3 · Single-stage amplifiers', sec:'3.2.1 + lab', label:'deep', title:'Your lab: the CS amplifier you built in Virtuoso', mins:5, pages:[48,53], prereq:['3d'],
 obj:'Check your own simulation against −g_m(r_o‖R_D) and explain any gap.',

  {t:'why', p:R`These are your files from <span class="mono">Lab&#95;/Outputs/CS&#95;Amp&#95;ResistiveLoad</span>: an NMOS with \(R_D = 10\) kΩ, a 10 mV, 1 kHz sine on the gate, run in Cadence (gpdk 180 nm). Theory is only useful if it predicts this.`},

  {t:'stop'},
  {t:'idea', h:'Where the square law misleads you', p:R`Try the textbook formula (2.19) on the same point: \(V_{ov}=582.5-482.2\approx100\) mV, so \(g_m=2I_D/V_{ov}=2(103.6\,\mu)/0.100\approx2.07\) mS — about <b>60% higher</b> than the simulator’s 1.28 mS. With only ~100 mV of overdrive the device is close to weak/moderate inversion (§2.3), and a 180 nm device has short-channel effects the Level-1 model ignores (§2.4.6, Ch 16). This is exactly Razavi’s warning on p.38. The simulator is right; the square law gives you intuition, not 10% accuracy.`},

    {tex:R`|V_{ov2}|=\sqrt{\tfrac{2(0.5\text{m})}{38\mu\times25}}=1.02\ \text{V}\Rightarrow V_{out}\in[0.27,\,1.98]\ \text{V}`, say:'Problem 3.2(b): ≈ 1.7 V of swing.'}]},
  {t:'idea', h:'Two warnings', p:R`<ul><li>The output DC level is <b>not well-defined</b> — two current sources fighting. In practice a feedback loop sets it (p.59, Ch 8).</li><li>Making \(L_2\) longer raises \(r_{o2}\) but needs more \(|V_{DS2}|\); making \(L_1\) longer without widening raises the overdrive or lowers \(g_{m1}\).</li></ul>`},
  {t:'formal', h:'Triode load (§3.2.4, Fig. 3.15)', eq:[{tex:R`R_{on2}=\frac{1}{\mu_pC_{ox}(W/L)_2(V_{DD}-V_b-|V_{THP}|)}`, note:'(3.45) M₂ biased in deep triode acts as a resistor'}], p:R`Drawback: \(R_{on2}\) depends on \(\mu_p C_{ox}\), \(V_{TH}\) and \(V_b\), which all vary with process and temperature. Advantage: \(V_{out,max}=V_{DD}\), more headroom than a diode load.`},
  {t:'check', q:{type:'num', q:'g_m1 = 1 mS, r_o1 = 50 kΩ, r_o2 = 50 kΩ. A_v?', a:-25, tol:0.01, unit:'V/V', explain:'−1 m × 25 k = −25.'}},
  {t:'check', q:{type:'mcq', q:'Why does the current-source-load CS stage need feedback in practice?', opts:['Its output DC level is not well-defined','It oscillates','Its gain is too low','PMOS cannot be biased'], a:0, explain:'Two saturated current sources in series: any tiny mismatch pushes the output to a rail unless a loop sets it (p.59).'}},
  {t:'recall', prompt:'Write the current-source-load gain and how g_m r_o depends on W, L, I_D.', model:'A_v = −g_m1(r_o1‖r_o2); g_m r_o ∝ √(WL/I_D).'}
 ],
 cards:[['CS with current-source load gain','−g_m1 (r_o1 ‖ r_o2)'],['Intrinsic gain scaling (3.44)','g_m r_o ∝ √(WL/I_D)'],['Triode load drawback','R_on depends on µCox, V_TH, V_b → process/temperature sensitive']]},

{id:'3h', unit:'Ch 3 · Single-stage amplifiers', sec:'3.2.5', label:'book', title:'Source degeneration: trading gain for linearity', mins:5, pages:[60,63], prereq:['3d','b-kcl'],
 obj:'Derive G_m = g_m/(1+g_mR_S) and read gain as “drain R over source-path R”.',
 blocks:[
  {t:'visual', fig:'degen', cap:'Fig. 3.16: a resistor R_S in the source.'},
  {t:'idea', p:R`As \(V_{in}\) rises, \(I_D\) rises and so does the drop across \(R_S\). Part of the input change appears across \(R_S\) instead of across \(V_{GS}\), which softens the square law. In gain terms: make the gain a <b>weaker function of \(g_m\)</b>.`},
  {t:'derive', h:'Equivalent transconductance (3.46–3.49)', steps:[
    {tex:R`G_m=\frac{\partial I_D}{\partial V_{in}}=\frac{\partial I_D}{\partial V_{GS}}\cdot\frac{\partial V_{GS}}{\partial V_{in}}`, say:'Chain rule.', why:'I_D is a function of V_GS only (λ = 0).'},
    {tex:R`V_{GS}=V_{in}-I_DR_S\ \Rightarrow\ \frac{\partial V_{GS}}{\partial V_{in}}=1-R_SG_m`, say:'KVL from gate to ground.', why:''},
    {tex:R`G_m = g_m(1-R_SG_m)`, say:'Substitute; ∂I_D/∂V_GS = g_m.', why:'', ask:{q:'Solve G_m = g_m(1 − R_S G_m) for G_m:', opts:['g_m/(1 + g_m R_S)','g_m(1 + g_m R_S)','g_m − R_S'], a:0}},
    {tex:R`\boxed{G_m=\frac{g_m}{1+g_mR_S}},\qquad A_v=-\frac{g_mR_D}{1+g_mR_S}=-\frac{R_D}{\frac1{g_m}+R_S}`, say:'(3.49), (3.51), (3.56)', why:'If R_S ≫ 1/g_m: G_m ≈ 1/R_S, A_v ≈ −R_D/R_S — almost independent of the transistor.'}]},
  {t:'interactive', kind:'degen', cap:'Example 3.4 (Fig. 3.19) live: gain vs input bias. Near V_TH the gain looks like −g_mR_D; as g_m grows, it flattens toward −R_D/R_S; at high V_in M₁ enters triode and gain drops.'},
  {t:'idea', h:'Gain by inspection (p.63)', p:R`\(|A_v| = \dfrac{\text{resistance seen at the drain}}{\text{total resistance in the source path}}\). The source path “looking up” from ground through \(R_S\) into the source is \(R_S + 1/g_m\).`},
  {t:'example', src:'book', h:'Example 3.5 (p.63): a diode as the degeneration', given:R`\(M_2\) diode-connected in the source of \(M_1\), \(\lambda=\gamma=0\).`, steps:[
    {tex:R`A_v=-\frac{R_D}{\frac1{g_{m1}}+\frac1{g_{m2}}}`, say:'(3.57) M₂ looks like 1/g_m2 — just another source-path resistance.'}]},
  {t:'example', src:'ours', h:'Numbers', given:R`\(g_m=2\) mS, \(R_S=1\) kΩ, \(R_D=10\) kΩ.`, steps:[{tex:R`A_v=-\frac{10\text{k}}{0.5\text{k}+1\text{k}}=-6.7\quad(\text{vs }-20\text{ without }R_S)`, say:'We gave up 3× gain; in return the gain depends much less on g_m.'}]},
  {t:'check', q:{type:'num', q:'g_m = 4 mS, R_S = 250 Ω, R_D = 5 kΩ. A_v?', a:-10, tol:0.01, unit:'V/V', hint:'1/g_m = 250 Ω.', explain:'−5k/(250 + 250) = −10.'}},
  {t:'check', q:{type:'mcq', q:'For R_S ≫ 1/g_m, the drain current change is approximately…', opts:['ΔV_in / R_S','g_m ΔV_in','zero','ΔV_in · R_D'], a:0, explain:'G_m → 1/R_S: most of ΔV_in appears across R_S (p.61). Cost: lower gain and more noise.'}},
  {t:'recall', prompt:'Write G_m and A_v for a degenerated CS stage and the “by inspection” rule.', model:'G_m = g_m/(1+g_mR_S); A_v = −R_D/(1/g_m + R_S) = drain R ÷ source-path R.'}
 ],
 cards:[['Degenerated G_m','g_m/(1 + g_m R_S)'],['Degenerated CS gain','−R_D/(1/g_m + R_S)'],['Gain by inspection (degenerated CS)','|A_v| = R at drain ÷ R in source path']]},

{id:'3i', unit:'Ch 3 · Single-stage amplifiers', sec:'3.2.5', label:'book', title:'Degeneration boosts output resistance; the G_m·R_out lemma', mins:5, pages:[64,67], prereq:['3h','b-test','2o'],
 obj:'Derive R_out = [1+(g_m+g_mb)R_S]r_o + R_S and use A_v = −G_mR_out.',
 blocks:[
  {t:'why', p:R`This one result, Eq. 3.60, is why cascodes and good current sources work. Razavi calls it “an important and useful result” (p.64).`},
  {t:'derive', h:'Test-source analysis (Fig. 3.22)', steps:[
    {tex:R`v_1 = -I_XR_S`, say:'Gate at AC ground; the source sits at I_X·R_S above ground, so v_gs = −I_X R_S. Also v_bs = −I_X R_S.', why:'All of I_X flows through R_S.'},
    {tex:R`i_{r_o} = I_X-(g_m+g_{mb})v_1 = I_X+(g_m+g_{mb})R_SI_X`, say:'KCL at the drain: current through r_o is I_X minus what the two dependent sources carry.', why:''},
    {tex:R`V_X = r_o\big[I_X+(g_m+g_{mb})R_SI_X\big]+I_XR_S`, say:'Add the drops across r_o and R_S. (3.58)', why:'', ask:{q:'Divide by I_X. R_out = ?', opts:['[1+(g_m+g_mb)R_S]r_o + R_S','r_o + R_S','r_o ‖ R_S'], a:0}},
    {tex:R`\boxed{R_{out}=[1+(g_m+g_{mb})R_S]\,r_o+R_S\ \approx\ [1+(g_m+g_{mb})R_S]\,r_o}`, say:'(3.59)–(3.62) r_o multiplied by 1 + (g_m+g_mb)R_S.', why:'Intuition: when V_X rises, the source rises too, which reduces V_GS and fights the current increase.'}]},
  {t:'example', src:'ours', h:'Numbers', given:R`\(g_m=2\) mS, \(g_{mb}=0.4\) mS, \(r_o=20\) kΩ, \(R_S=1\) kΩ.`, steps:[{tex:R`R_{out}=[1+2.4\text{m}\times1\text{k}]\times20\text{k}+1\text{k}=69\ \text{k}\Omega`, say:'3.4× the bare r_o, from a 1 kΩ resistor.'}]},
  {t:'formal', h:'The lemma (p.66, Fig. 3.25)', p:R`Model the output port by a Norton equivalent: short the output to find \(G_m = I_{out}/V_{in}\); zero the input to find \(R_{out}\). Then:`, eq:[{tex:R`A_v=-G_mR_{out}`, note:'Works for any linear circuit — often much faster than one big KCL.'},{tex:R`G_m=\frac{g_mr_o}{R_S+[1+(g_m+g_{mb})R_S]r_o}`, note:'(3.55) degenerated G_m including r_o and body effect'}]},
  {t:'example', src:'book', h:'Example 3.6 (p.67): ideal current-source load with R_S', given:'Degenerated device, load = ideal current source.', steps:[{tex:R`A_v=-G_mR_{out}=-g_mr_o`, say:'(3.75) Independent of R_S! With an ideal current source, the current in R_S cannot change, so its small-signal drop is zero — as if R_S were not there.'}]},
  {t:'check', q:{type:'mcq', q:'Why does R_S raise the output resistance?', opts:['A rise in V_out raises the source voltage, reducing V_GS and opposing the current change','R_S adds in series only','R_S increases g_m','R_S removes body effect'], a:0, explain:'Local negative feedback through the source (p.64).'}},
  {t:'check', q:{type:'num', q:'r_o = 10 kΩ, g_m + g_mb = 5 mS, R_S = 2 kΩ. R_out (kΩ), ignoring the lone +R_S term?', a:110, tol:0.02, unit:'kΩ', explain:'(1 + 5m·2k)·10k = 11 × 10k = 110 kΩ.'}},
  {t:'recall', prompt:'Write R_out of a degenerated device and state the G_m R_out lemma.', model:'R_out = [1+(g_m+g_mb)R_S]r_o + R_S; A_v = −G_m R_out with G_m from shorted output, R_out with zeroed input.'}
 ],
 cards:[['R_out of a degenerated MOSFET (3.60)','[1+(g_m+g_mb)R_S] r_o + R_S'],['G_m R_out lemma','A_v = −G_m·R_out (short output for G_m, zero input for R_out)']]},

{id:'3j', unit:'Ch 3 · Single-stage amplifiers', sec:'3.3', label:'book', title:'Source follower: a buffer that is never quite unity', mins:5, pages:[67,72], prereq:['3d','b-test','2k'],
 obj:'Derive the follower gain and output resistance, including body effect.',
 blocks:[
  {t:'visual', fig:'sf', cap:'Fig. 3.27/3.30: source follower (common drain) with a current-source load.'},
  {t:'why', p:R`A high-gain CS stage has a large output resistance and cannot drive a small load. A <b>buffer</b> placed after it should pass the voltage through with little loss. That is the source follower’s job.`},
  {t:'derive', h:'Small-signal gain (Fig. 3.28)', steps:[
    {tex:R`v_1=v_{in}-v_{out},\qquad v_{bs}=-v_{out}`, say:'Gate at v_in, source at v_out, bulk grounded.', why:''},
    {tex:R`g_mv_1-g_{mb}v_{out}=\frac{v_{out}}{R_S}`, say:'KCL at the source: both dependent currents flow into R_S.', why:'', ask:{q:'Substitute v₁ and solve for v_out/v_in:', opts:['g_mR_S / [1 + (g_m + g_mb)R_S]','g_mR_S','1'], a:0}},
    {tex:R`\boxed{A_v=\frac{g_mR_S}{1+(g_m+g_{mb})R_S}}`, say:'(3.80)', why:'As R_S → ∞, A_v → g_m/(g_m+g_mb) = 1/(1+η) — below 1 even with an ideal load. Typically η ≳ 0.2 (p.69).'}]},
  {t:'visual', fig:'sfGain', cap:'Fig. 3.29 sketch: gain rises from 0 at V_TH toward 1/(1+η).'},
  {t:'formal', h:'Output resistance (3.84–3.87)', eq:[{tex:R`R_{out}=\frac{1}{g_m+g_{mb}}=\frac1{g_m}\Big\|\frac1{g_{mb}}`, note:'Body effect LOWERS R_out: the g_mb·v_bs source sits across its own voltage, so it is a resistor 1/g_mb at the output (Fig. 3.32).'},{tex:R`A_v=\frac{1/g_{mb}}{1/g_{mb}+1/g_m}`, note:'(3.88)–(3.89) Thevenin view of the intrinsic follower: a voltage divider → less than 1.'}]},
  {t:'example', src:'book', h:'Example 3.7 (p.70)', given:R`\((W/L)_1=20/0.5\), \(I_1=200\,\mu\)A, \(V_{TH0}=0.6\) V, \(2\Phi_F=0.7\) V, \(\mu_nC_{ox}=50\,\mu\)A/V², \(\gamma=0.4\). (a) \(V_{out}\) for \(V_{in}=1.2\) V. (b) Min \((W/L)_2\) if \(I_1\) is an NMOS current source.`, steps:[
    {tex:R`V_{in}-V_{TH}-V_{out}=\sqrt{\tfrac{2I_D}{\mu_nC_{ox}W/L}}=\sqrt{\tfrac{400\mu}{50\mu\times40}}=0.447\ \text{V}`, say:'Square law solved for overdrive.'},
    {tex:R`V_{TH}\approx0.6\Rightarrow V_{out}=0.153\ \text{V}`, say:'First guess ignores body effect.'},
    {tex:R`V_{TH}=0.6+0.4(\sqrt{0.853}-\sqrt{0.7})=0.635\Rightarrow V_{out}\approx0.119\ \text{V}`, say:'Iterate: V_SB = 0.153 V raises V_TH by 35 mV.'},
    {tex:R`V_{ov2}\le0.119\ \text{V}\Rightarrow (W/L)_2\ge\frac{2(200\mu)}{50\mu\,(0.119)^2}\approx\frac{283}{0.5}`, say:'(b) A huge device — with large capacitance at the output.'}]},
  {t:'check', q:{type:'num', q:'g_m = 2 mS, g_mb = 0.4 mS, ideal current-source load. Follower gain?', a:0.833, tol:0.01, unit:'V/V', explain:'g_m/(g_m+g_mb) = 2/2.4 = 0.833.'}},
  {t:'check', q:{type:'mcq', q:'Including body effect, the follower’s output resistance…', opts:['decreases to 1/(g_m+g_mb)','increases','is unchanged at 1/g_m','becomes r_o'], a:0, explain:'Body effect adds 1/g_mb in parallel with 1/g_m (p.71).'}},
  {t:'recall', prompt:'Write the follower gain, its limit as R_S → ∞, and R_out.', model:'g_mR_S/[1+(g_m+g_mb)R_S]; → 1/(1+η); R_out = 1/(g_m+g_mb).'}
 ],
 cards:[['Source follower gain (3.80)','g_mR_S/[1+(g_m+g_mb)R_S] → 1/(1+η)'],['Source follower R_out','1/(g_m + g_mb)'],['Example 3.7 V_out','≈ 0.119 V (after body-effect iteration)']]},

{id:'3k', unit:'Ch 3 · Single-stage amplifiers', sec:'3.3', label:'book', title:'Why source followers disappoint: nonlinearity, headroom, drive', mins:4, pages:[73,76], prereq:['3j'],
 obj:'List the three drawbacks of source followers and their one common use.',
 blocks:[
  {t:'idea', h:'1. Nonlinearity', p:R`Even with an ideal current-source bias, \(V_{TH}\) depends on \(V_{out}\) through body effect, and in short devices \(r_o\) varies with \(V_{DS}\). Typical followers show several percent nonlinearity (p.73). Fix for body effect: tie bulk to source — possible only for PMOS in their own n-well (Fig. 3.36), at the cost of higher \(R_{out}\) (lower mobility).`},
  {t:'idea', h:'2. Headroom (Fig. 3.37)', p:R`A follower shifts the level down by \(V_{GS}\). After a CS stage, node X must now stay above \(V_{GS2}+(V_{GS3}-V_{TH3})\) instead of just \(V_{GS1}-V_{TH1}\): the allowed swing shrinks by about \(V_{GS}\).`},
  {t:'formal', h:'3. Poor driver for low-resistance loads (3.92–3.93)', eq:[{tex:R`A_{SF}=\frac{R_L}{R_L+1/g_{m1}}\qquad A_{CS}=-g_{m1}R_L`, note:'Same bias current. If 1/g_m1 = R_L: follower gives 0.5, CS gives ≈ 1.'}]},
  {t:'example', src:'book', h:'Example 3.9 (p.75): followers as level shifters', given:R`CS stage \(M_1\) with a PMOS diode load \(M_2\) and current source; \(C_1\) is an AC short.`, steps:[
    {tex:R`A_v=-g_{m1}\big(r_{o1}\|r_{o2}\|1/g_{m2}\big)`, say:'(3.94)'},
    {tex:R`V_{in,max}=V_{DD}-|V_{GS2}|+V_{TH1}`, say:'For M₁ to stay saturated. In (b), a follower M₃ shifts the input down so V_in can approach V_DD if V_GS3 + V_TH1 ≥ |V_GS2|.'}]},
  {t:'check', q:{type:'mcq', q:'Most common real use of a source follower, according to Razavi?', opts:['Voltage level shifting','High-gain amplification','Driving 50 Ω efficiently','Low-noise front ends'], a:0, explain:'“Perhaps the most common application of source followers is in performing voltage level shift” (p.75). They also add noise (Ch 7).'}},
  {t:'check', q:{type:'num', q:'Follower driving R_L = 500 Ω with g_m = 2 mS (ignore body effect). Gain?', a:0.5, tol:0.01, unit:'V/V', explain:'1/g_m = 500 Ω = R_L → 0.5.'}},
  {t:'recall', prompt:'Name the three drawbacks of source followers.', model:'Nonlinearity (body effect, r_o), headroom loss (level shift by V_GS), poor drive efficiency vs CS for low R_L.'}
 ],
 cards:[['Three source-follower drawbacks','Nonlinearity, headroom (V_GS level shift), poor driving efficiency'],['Removing follower body effect','PMOS in its own n-well with bulk tied to source']]},

{id:'3l', unit:'Ch 3 · Single-stage amplifiers', sec:'3.4', label:'book', title:'Common-gate stage: input at the source', mins:5, pages:[76,83], prereq:['3i','b-test'],
 obj:'Find CG gain and input resistance, and see how the load sets R_in.',
 blocks:[
  {t:'visual', fig:'cg', cap:'Fig. 3.40(a): common-gate stage. The bias current flows through the signal source.'},
  {t:'formal', h:'Large signal and gain (3.95–3.100)', eq:[{tex:R`V_{out}=V_{DD}-\tfrac12\mu_nC_{ox}\tfrac WL(V_b-V_{in}-V_{TH})^2R_D`, note:'(3.97) saturation'},{tex:R`A_v=g_m(1+\eta)R_D`, note:'(3.100) POSITIVE gain; body effect helps here (the source moves, so V_TH moves the helpful way).'}]},
  {t:'idea', h:'Input resistance', p:R`With a small \(R_D\), the source looks like the follower’s output: \(R_{in}=1/(g_m+g_{mb})\). Low input resistance is useful: Example 3.10 terminates a 50 Ω line with a CG stage by making \(1/(g_m+g_{mb})=50\ \Omega\), then uses a large \(R_D\) for gain — impossible with a plain 50 Ω resistor.`},
  {t:'derive', h:'General R_in (3.108–3.110)', steps:[
    {tex:R`R_DI_X+r_o\big[I_X-(g_m+g_{mb})V_X\big]=V_X`, say:'Test source at the source; add drops across R_D and r_o.', why:'v_gs = v_bs = −V_X.'},
    {tex:R`R_{in}=\frac{R_D+r_o}{1+(g_m+g_{mb})r_o}\approx\frac{R_D}{(g_m+g_{mb})r_o}+\frac1{g_m+g_{mb}}`, say:'(3.109)–(3.110) The drain resistance appears at the source divided by the intrinsic gain.', why:'', ask:{q:'If R_D is replaced by an ideal current source, R_in becomes…', opts:['infinite','1/g_m','zero'], a:0}},
    {tex:R`R_D\to\infty\Rightarrow R_{in}\to\infty`, say:'With a fixed total current, changing the source voltage cannot change the current (Fig. 3.46). CG input resistance is low only if the drain load is small.', why:''}]},
  {t:'formal', h:'General gain and output resistance', eq:[{tex:R`\frac{V_{out}}{V_{in}}=\frac{(g_m+g_{mb})r_o+1}{r_o+(g_m+g_{mb})r_oR_S+R_S+R_D}\,R_D`, note:'(3.104) with source resistance R_S; compare with degenerated CS (3.71)'},{tex:R`A_v=(g_m+g_{mb})r_o+1`, note:'(3.113) Example 3.12: current-source load'},{tex:R`R_{out}=\{[1+(g_m+g_{mb})r_o]R_S+r_o\}\,\|\,R_D`, note:'(3.114)'}]},
  {t:'example', src:'ours', h:'Numbers', given:R`\(g_m=2\) mS, \(\eta=0.2\), \(R_D=5\) kΩ, \(r_o\) large.`, steps:[{tex:R`A_v=2\text{m}\times1.2\times5\text{k}=12,\qquad R_{in}=\frac1{2.4\text{m}}=417\ \Omega`, say:'Positive gain of 12 with a low input resistance.'}]},
  {t:'check', q:{type:'mcq', q:'A CG stage has a large positive gain. What is the sign relation between v_in and v_out?', opts:['In phase (non-inverting)','Inverted','90° shifted','Depends on η'], a:0, explain:'A_v = g_m(1+η)R_D > 0 (p.77).'}},
  {t:'check', q:{type:'num', q:'Example 3.10 needs R_in = 50 Ω. Required g_m + g_mb (mS)?', a:20, tol:0.01, unit:'mS', explain:'1/50 Ω = 20 mS.'}},
  {t:'recall', prompt:'Write the CG gain, its R_in for small R_D, and what happens to R_in with a current-source load.', model:'A_v = g_m(1+η)R_D; R_in = 1/(g_m+g_mb); → ∞ with an ideal current-source load.'}
 ],
 cards:[['CG gain (simple)','g_m(1+η)R_D — non-inverting'],['CG input resistance (small R_D)','1/(g_m + g_mb)'],['CG R_in general (approx.)','R_D/[(g_m+g_mb)r_o] + 1/(g_m+g_mb)']]},

{id:'3m', unit:'Ch 3 · Single-stage amplifiers', sec:'3.5', label:'book', title:'The cascode: CS + CG, gain ≈ (g_m r_o)²', mins:5, pages:[83,90], prereq:['3i','3l'],
 obj:'Find cascode headroom, output resistance, gain and the shielding property.',
 blocks:[
  {t:'visual', fig:'cascode', cap:'Fig. 3.50: M₁ converts voltage to current; M₂ routes it to the output.'},
  {t:'idea', h:'Headroom (Fig. 3.51)', p:R`With \(V_b\) chosen so \(M_1\) sits at the edge of saturation, the lowest output that keeps both devices saturated is \(V_{ov1}+V_{ov2}\). Stacking \(M_2\) costs at least one overdrive of swing.`},
  {t:'idea', h:'Gain with a resistor load', p:R`With \(\lambda=0\), the gain is just \(-g_{m1}R_D\): the current \(M_1\) produces must flow through \(M_2\) (Fig. 3.53). The cascode device changes nothing — until you need high output resistance.`},
  {t:'formal', h:'Output resistance (3.119)', p:R`View the cascode as a CS device \(M_2\) degenerated by \(r_{o1}\) and reuse Eq. 3.60:`, eq:[{tex:R`R_{out}=[1+(g_{m2}+g_{mb2})r_{o2}]\,r_{o1}+r_{o2}\ \approx\ (g_{m2}+g_{mb2})\,r_{o2}\,r_{o1}`, note:'M₂ multiplies r_o1 by its intrinsic gain.'},{tex:R`|A_v|\approx g_{m1}R_{out}\approx(g_mr_o)^2`, note:'with an ideal current-source load (Fig. 3.57); exact: g_m1 r_o1[(g_m2+g_mb2)r_o2 + 1] (3.123)'}]},
  {t:'example', src:'ours', h:'Numbers', given:R`\(g_{m1}=g_{m2}=2\) mS, \(g_{mb2}=0.4\) mS, \(r_{o1}=r_{o2}=20\) kΩ, ideal current-source load.`, steps:[
    {tex:R`R_{out}=[1+2.4\text{m}\times20\text{k}]\times20\text{k}+20\text{k}=1.0\ \text{M}\Omega`, say:'vs 20 kΩ for one device.'},
    {tex:R`|A_v|=g_{m1}r_{o1}[(g_{m2}+g_{mb2})r_{o2}+1]=2\text{m}\times20\text{k}\times49\approx1960`, say:'vs g_m r_o = 40 for a simple CS stage.'}]},
  {t:'visual', fig:'cascodeCompare', cap:'Fig. 3.59 argument: quadrupling L costs the same headroom as a cascode but only doubles g_m r_o; cascoding squares it.'},
  {t:'idea', h:'Cascode loads and shielding', p:R`A PMOS cascode load gives \(|A_v|\approx g_{m1}[(g_{m2}r_{o2}r_{o1})\|(g_{m3}r_{o3}r_{o4})]\) (3.126) at the cost of four overdrives of swing. <b>Shielding:</b> a change \(\Delta V\) at the output appears at node X divided by about \((g_{m2}+g_{mb2})r_{o2}\). Example 3.16: two current-source transistors whose drains differ by \(\Delta V\) mismatch by \(\tfrac12\mu_nC_{ox}\tfrac WL V_{ov}^2\lambda\Delta V\); cascoding divides that by \((g_{m3}+g_{mb3})r_{o3}\). Shielding fails if the cascode device enters triode (Fig. 3.62).`},
  {t:'check', q:{type:'mcq', q:'With λ = 0 and a resistor load R_D, the cascode gain is…', opts:['−g_m1 R_D, same as a CS stage','−g_m1 R_D (1+η)','(g_m r_o)²','+g_m2 R_D'], a:0, explain:'All of M₁’s signal current flows through M₂ into R_D (p.84).'}},
  {t:'check', q:{type:'num', q:'g_m2 r_o2 = 30 (ignore g_mb), r_o1 = 25 kΩ. R_out ≈ ? (MΩ)', a:0.75, tol:0.03, unit:'MΩ', explain:'≈ 30 × 25 kΩ = 750 kΩ (exact adds ~50 kΩ: 31×25k + r_o2).'}},
  {t:'recall', prompt:'Give the cascode’s min output voltage, R_out, and max gain.', model:'V_ov1 + V_ov2; ≈ (g_m2+g_mb2)r_o2 r_o1; ≈ (g_m r_o)².'}
 ],
 cards:[['Cascode R_out','≈ (g_m2+g_mb2) r_o2 · r_o1'],['Cascode min output voltage','V_ov1 + V_ov2'],['Cascode max gain','≈ (g_m r_o)²'],['Cascode vs 4×L','Same headroom; 4×L only doubles g_m r_o, cascode squares it']]},

{id:'3n', unit:'Ch 3 · Single-stage amplifiers', sec:'3.5.1–3.6', label:'book', title:'Folded cascode, and choosing how detailed a model to use', mins:4, pages:[90,93], prereq:['3m'],
 obj:'Explain the folded cascode, its large-signal behaviour, and Razavi’s model-choice rules.',
 blocks:[
  {t:'visual', fig:'folded', cap:'Fig. 3.63(b): PMOS input M₁, NMOS cascode M₂, bias current source I₁.'},
  {t:'idea', p:R`The input and cascode devices need not be the same type. If \(V_{in}\) rises, \(|I_{D1}|\) falls, so \(I_{D2}=I_1-|I_{D1}|\) rises and \(V_{out}\) drops. The signal current is “folded”. Cost: \(I_1\) must supply both branches, so total bias current is higher.`},
  {t:'formal', h:'Large-signal edge (3.133–3.135)', eq:[{tex:R`I_{D2}=I_1-\tfrac12\mu_pC_{ox}\big(\tfrac WL\big)_1(V_{DD}-V_{in}-|V_{THP}|)^2`, note:'(3.133)'},{tex:R`V_{in1}=V_{DD}-\sqrt{\frac{2I_1}{\mu_pC_{ox}(W/L)_1}}-|V_{THP}|`, note:'(3.135) below this, I_D2 = 0 and M₁ goes into triode (Fig. 3.64)'}]},
  {t:'example', src:'book', h:'Example 3.17 (p.92)', given:'Folded cascode with M₃ as the bias current source.', steps:[{tex:R`R_{out}=[1+(g_{m2}+g_{mb2})r_{o2}](r_{o1}\|r_{o3})+r_{o2}`, say:'(3.136) Lower than a non-folded cascode, because r_o1 ‖ r_o3 degenerates M₂. A cascode load raises gain again (Fig. 3.66, Ch 9).'}]},
  {t:'idea', h:'§3.6 How detailed should your model be?', p:R`<ol style="margin:0;padding-left:1.2rem"><li>Break the circuit into familiar topologies (CS, CG, follower, cascode).</li><li>Start every saturated FET as just \(g_mv_{gs}\).</li><li>Add \(r_o\) where a drain sees a high impedance (e.g., another drain).</li><li>Second pass: add body effect where source or bulk is not at AC ground.</li><li>For bias, ignore λ and γ first, then refine.</li></ol>Simulate, but first understand: <b>“Don’t let the computer think for you”</b> (p.93).`},
  {t:'check', q:{type:'mcq', q:'Compared with the non-folded cascode, the folded cascode’s R_out is…', opts:['lower, since M₂ is degenerated by r_o1 ‖ r_o3','higher','identical','infinite'], a:0, explain:'Example 3.17.'}},
  {t:'check', q:{type:'order', q:'Order Razavi’s model-building steps.', items:['Split into familiar topologies','Use only g_m·v_gs for each saturated FET','Add r_o where a drain sees high impedance','Add body effect where source/bulk is not AC ground','Verify with simulation'], explain:'§3.6, p.93.'}},
  {t:'recall', prompt:'Explain “folded” in one sentence and give the model-choice rule of thumb.', model:'The input device’s signal current is folded into an opposite-type cascode device fed by a bias source. Start simple (g_m only), add r_o at high-impedance drains, then body effect.'}
 ],
 cards:[['Folded cascode R_out (Ex. 3.17)','[1+(g_m2+g_mb2)r_o2](r_o1‖r_o3) + r_o2'],['Razavi’s motto (§3.6)','“Don’t let the computer think for you.”']]}
);
