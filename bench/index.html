/* Narrated preview scripts: h = the question the lesson answers; l = three short spoken lines.
   Written for text-to-speech, so symbols are spelled out in words. */
const INTROS={
'o1':{h:'Why do we still need analog circuits in a digital world?',l:['Every real signal, from sound to radio, starts out analog.','Before a processor can use it, something must amplify, filter and convert it.','This lesson shows how Razavi climbs from single devices up to whole systems.']},
'b-cap':{h:'How much charge sits on a gate?',l:['A capacitor is two conductors separated by an insulator.','Put a voltage across it, and charge appears: Q equals C times V.','The MOSFET gate is exactly this capacitor, and its charge becomes the channel.']},
'b-semi':{h:'What is a depletion region, and why does reverse bias widen it?',l:['Doping adds free electrons or holes to silicon.','Where p meets n, carriers leave, and fixed charged ions stay behind.','More reverse bias pushes carriers further away, so the depletion region grows.']},
'b-drift':{h:'How does moving charge become current?',l:['Current is charge per metre times how fast that charge moves.','In a field, carriers drift with velocity mobility times field.','These two facts are all you need to derive the MOSFET equation.']},
'b-slope':{h:'What does a derivative mean on a graph?',l:['A derivative is just a slope: how much the output moves per tiny nudge.','Transconductance, output resistance and gain are all slopes.','If you can read a slope, you already understand them.']},
'b-int':{h:'What does integration actually do?',l:['Integration adds up many thin slices under a curve.','More slices, thinner slices, and the sum becomes the exact area.','Only one step in Chapter 2 needs it, and this makes that step readable.']},
'b-ss':{h:'How can a curved device behave like a straight line?',l:['Fix the circuit at a DC bias point.','Wiggle the input a little, and the output follows the tangent line.','That slope is the small-signal gain. Big wiggles bend away and distort.']},
'b-kcl':{h:'How do we solve a node with a dependent source?',l:['A dependent current source is controlled by a voltage somewhere else.','Currents leaving a node must add to zero.','Combine parallel resistors, and the CS amplifier gain appears in one line.']},
'b-log':{h:'What does eighty millivolts per decade mean?',l:['On a log scale, each grid line is ten times the last.','An exponential becomes a straight line.','So the slope is quoted per decade: how much voltage for a factor of ten.']},
'b-test':{h:'What resistance do you see looking into a node?',l:['Turn off the independent sources.','Apply a test voltage, and find the current it supplies.','Their ratio is the resistance. A diode-connected transistor looks like one over g m.']},
'b-cmdm':{h:'How do we split two inputs into common and differential parts?',l:['Any pair of signals is an average plus an equal-and-opposite difference.','The average is the common mode. The difference is the signal.','A good differential amplifier amplifies the difference and ignores the rest.']},
'b-cplx':{h:'How does a capacitor behave at a given frequency?',l:['A capacitor’s impedance is one over j omega C.','Complex numbers track two things at once: how much, and how delayed.','At the corner, gain drops to point seven and the phase lags forty-five degrees.']},
'b-pole':{h:'What do poles and zeros do to gain and phase?',l:['Each pole bends the gain down twenty decibels per decade.','Each pole also takes away ninety degrees of phase.','A right-half-plane zero is the troublemaker: it raises gain but still steals phase.']},
'b-rms':{h:'How do you add two noise sources?',l:['Noise is measured by its average power, or its RMS value.','Independent noises add by power, not by amplitude.','So three microvolts and four microvolts make five, not seven.']},
'2a':{h:'What questions does a simple MOS switch raise?',l:['Imagine the MOSFET as a switch: gate high, on; gate low, off.','When exactly does it turn on? What is its resistance? How fast is it?','The whole of Chapter 2 answers these questions one by one.']},
'2b':{h:'What is inside a MOSFET?',l:['Two heavily doped regions sit in a p-type substrate.','A thin oxide and a poly gate sit between them, length L and width W.','The substrate is a fourth terminal, and it matters later.']},
'2c':{h:'How does Razavi draw MOS transistors?',l:['The arrow marks the source.','The PMOS source is drawn on top, because it sits at a higher voltage.','The bulk is usually not drawn: ground for NMOS, supply for PMOS.']},
'2d':{h:'When does a MOSFET actually turn on?',l:['As the gate rises, holes are pushed away, leaving a depletion region.','At the threshold voltage, electrons gather and form a channel.','From here, extra gate voltage adds channel charge and current can flow.']},
'2e':{h:'How much charge is in the channel?',l:['Only the overdrive, gate voltage above threshold, creates mobile charge.','With a drain voltage, the channel thins toward the drain.','This charge picture is half of the MOSFET equation.']},
'2f':{h:'Where does the triode equation come from?',l:['Start with current equals charge times velocity.','Substitute the drift velocity, then add up slices along the channel.','Four small steps, and the most important equation in the book appears.']},
'2g':{h:'When does a MOSFET act like a resistor?',l:['Plot the triode equation and you get a family of parabolas.','Each parabola peaks where the drain voltage equals the overdrive.','For tiny drain voltages the device is a resistor controlled by the gate.']},
'2h':{h:'Why does the current stop rising with drain voltage?',l:['When the drain voltage exceeds the overdrive, the channel pinches off.','After that, extra drain voltage barely changes the current.','This is saturation, and its square law runs every amplifier in the book.']},
'2i':{h:'How well does a MOSFET turn voltage into current?',l:['Transconductance is the slope of current versus gate voltage.','It can be written three ways, depending on what you hold constant.','Almost every amplifier gain is g m times some resistance.']},
'2j':{h:'Triode or saturation: how do you decide fast?',l:['Look only at the gate and the drain.','If the gate is less than one threshold above the drain, the channel is pinched off.','That means saturation, and you never needed the source voltage.']},
'2k':{h:'How can the substrate change the threshold?',l:['When the source rises above the bulk, the depletion region widens.','More depletion charge means a higher threshold voltage.','The bulk behaves like a second, weaker gate.']},
'2l':{h:'Why is the saturation curve not perfectly flat?',l:['As the drain voltage rises, the pinch-off point creeps toward the source.','The effective channel shortens, so the current rises slightly.','Longer channels make a flatter, better current source.']},
'2m':{h:'Does the transistor really switch off at threshold?',l:['Below threshold, a weak current still flows, rising exponentially.','About eighty millivolts lowers it by a factor of ten.','This leakage matters, and it limits how much g m you can buy.']},
'2n':{h:'What limits a MOSFET’s speed?',l:['Capacitances: gate to channel, overlaps, and junctions.','Their values change between off, triode and saturation.','Folding the layout cuts junction capacitance for the same device.']},
'2o':{h:'How do we turn a MOSFET into a simple linear circuit?',l:['Around a bias point, the transistor becomes a few linear elements.','A controlled current g m v g s, an output resistance r o, and a body source.','From Chapter 3 on, every analysis starts here.']},
'2p':{h:'How do simulators describe a transistor, and when does it break?',l:['Level 1 SPICE uses a handful of parameters from Table 2.1.','NMOS beats PMOS on both current drive and output resistance.','But short-channel devices break the simple square law.']},
'3a':{h:'What makes a circuit an amplifier?',l:['An amplifier’s output is a curve of its input.','At a bias point, the slope of that curve is the gain.','Gain, speed, power, noise and swing all trade against each other.']},
'3b':{h:'What happens as you sweep a common-source input?',l:['Below threshold, the output sits at the supply.','In saturation it falls along a parabola.','At point A the transistor enters triode, and the gain collapses.']},
'3c':{h:'Where does the gain minus g m R D come from?',l:['An input wiggle becomes a current wiggle, g m times the input.','That current flows through R D and becomes an inverted output.','More gain costs swing, speed or capacitance.']},
'3d':{h:'What limits a single transistor’s gain?',l:['Add the output resistance r o in parallel with R D.','The gain becomes minus g m times r o parallel R D.','With an ideal load, you reach the intrinsic gain, g m r o.']},
'3e':{h:'Does the theory predict your own lab result?',l:['Your Virtuoso CS amplifier gave a gain of about eleven.','The operating-point table predicts about twelve.','And the square law overestimates g m. Here is why.']},
'3f':{h:'What if the load is a transistor wired as a diode?',l:['A diode-connected transistor looks like one over g m.','The gain becomes a ratio of transistor sizes, so it is fairly linear.','But high gain needs a huge load overdrive, and the swing disappears.']},
'3g':{h:'How do we get high gain without a huge resistor?',l:['Replace the resistor with a current source.','The output sees r o parallel r o, so the gain jumps.','But the output level is no longer defined by itself.']},
'3h':{h:'How can a source resistor make an amplifier more linear?',l:['Part of the input now drops across R S instead of the gate-source voltage.','The gain becomes R D over the resistance in the source path.','You trade gain for linearity.']},
'3i':{h:'How does degeneration raise output resistance?',l:['When the drain rises, the source rises too, and fights the change.','The output resistance multiplies by one plus g m R S.','And any gain can be found as G m times R out.']},
'3j':{h:'Why is a source follower never quite unity gain?',l:['The output follows the gate, one gate-source voltage lower.','Body effect leaks part of the signal away.','Even with a perfect load, the gain stops at one over one plus eta.']},
'3k':{h:'Why are source followers used so sparingly?',l:['They are nonlinear, because the threshold moves with the output.','They waste headroom by shifting the level down.','And they drive low resistances poorly. Their best job is level shifting.']},
'3l':{h:'What if the input goes into the source?',l:['In a common-gate stage, the gate is held at a fixed voltage.','The gain is positive, and the input resistance is low.','But that input resistance depends on the load at the drain.']},
'3m':{h:'How do two stacked transistors square the gain?',l:['The bottom transistor turns voltage into current.','The top one shields it and multiplies the output resistance.','The gain can reach g m r o squared, at the cost of headroom.']},
'3n':{h:'What is a folded cascode, and how detailed should our models be?',l:['The cascode device can be the opposite type, folding the current.','It saves headroom but costs bias current.','And Razavi’s advice: start simple, add detail only where it matters.']},
'4a':{h:'Why send a signal on two wires instead of one?',l:['Noise that hits both wires equally cancels in the difference.','Supply noise and coupled clocks are rejected.','And the differential swing is twice as large.']},
'4b':{h:'How does a tail current make a differential pair work?',l:['A current source under both transistors fixes their total current.','The input difference simply steers that current left or right.','The gain is highest at balance, and fades for large inputs.']},
'4c':{h:'How much input can a differential pair handle?',l:['Using the square law, we solve for the current difference.','At a certain input difference, one transistor takes all the current.','A wider linear range costs overdrive, and so g m.']},
'4d':{h:'How do we get the pair’s gain one input at a time?',l:['Drive just one input.','One side acts as a degenerated common-source stage, the other as common gate.','Add the effects, and the gain is g m R D.']},
'4e':{h:'Why is the tail node a virtual ground?',l:['With equal and opposite inputs, the tail node does not move.','So each half is just a common-source stage.','This half-circuit trick turns pages of algebra into one line.']},
'4f':{h:'How well does a pair reject common-mode noise?',l:['A finite tail resistance lets common-mode signals move the outputs.','Worse, any mismatch turns common-mode noise into a differential error.','CMRR measures how well the pair resists this.']},
'4g':{h:'How do transistor loads and cascodes change the pair?',l:['Diode loads are linear but eat headroom.','Current-source loads give more gain, and cascodes much more.','But the output common-mode level then needs its own control loop.']},
'4h':{h:'How can a gain be steered from positive to negative?',l:['Two pairs with opposite gains share their outputs.','A third pair splits the current between them.','The result, the Gilbert cell, also multiplies two signals.']},
'5a':{h:'Why not set a current by fixing the gate voltage?',l:['The drain current depends on threshold and mobility, which vary.','A fifty millivolt threshold error can change the current by forty-four percent.','So we build one good reference and copy it.']},
'5b':{h:'How does a current mirror copy a current?',l:['A diode-connected transistor turns the reference into a gate voltage.','A second transistor turns that voltage back into a current.','The copy ratio is just the ratio of transistor widths.']},
'5c':{h:'Why does a simple mirror copy inaccurately?',l:['Channel-length modulation makes the copy depend on the output voltage.','A cascode shields the copying transistor and fixes this.','The price is headroom: two overdrives plus a threshold.']},
'5d':{h:'Can we cascode without wasting a threshold voltage?',l:['Bias the cascode gate lower, with careful sizing.','Then the output needs only two overdrives.','This is the low-voltage cascode.']},
'5e':{h:'How does a mirror load turn two outputs into one?',l:['The mirror copies one side’s current to the other.','Both halves of the signal current now push the output the same way.','You get a single-ended output, and twice the transconductance.']},
'5f':{h:'What is the gain of the active-mirror pair?',l:['Its transconductance is the full g m of one input device.','Its output resistance is r o two parallel r o four.','So the gain is g m times r o two parallel r o four.']},
'5g':{h:'Does the active-mirror pair reject common-mode noise?',l:['Even when perfectly matched, some common-mode change reaches the output.','The CMRR depends on the tail resistance and the mirror.','At high frequency it gets worse.']},
'6a':{h:'Why does a tiny gate-drain capacitance look huge?',l:['A capacitor across an inverting gain sees both ends move in opposite directions.','It draws one plus A times more charge.','Miller’s theorem turns it into a large capacitor at the input.']},
'6b':{h:'How can we guess the poles quickly?',l:['Each node has a resistance and a capacitance to ground.','Their product is a time constant, and so a pole.','It is not always exact, but it is the best first guess.']},
'6c':{h:'What really sets the common-source bandwidth?',l:['The Miller effect makes the input pole dominant.','The exact answer has two poles and a zero.','That zero is in the right half plane, and it will matter for stability.']},
'6d':{h:'What surprises hide in a source follower at high frequency?',l:['Its gate-source capacitance creates a helpful zero.','Its input can show negative resistance.','And its output looks like an inductor, which can ring.']},
'6e':{h:'How do common-gate and cascode stages escape Miller?',l:['In a cascode, the input transistor sees a gain of only about minus one.','So its gate-drain capacitance is doubled, not multiplied by the full gain.','That is why the cascode was invented: speed.']},
'6f':{h:'What happens to a differential pair at high frequency?',l:['Tail capacitance lets common-mode noise through, so CMRR falls.','With an active mirror, a second pole appears at the mirror node.','Fully differential circuits avoid this mirror pole.']},
'7a':{h:'How do we describe something as random as noise?',l:['We cannot predict noise, but we can predict its average power.','Spreading that power over frequency gives the spectrum, in volts squared per hertz.','A circuit shapes that spectrum by its gain squared.']},
'7b':{h:'What does noise look like, and when do sources add?',l:['Noise amplitudes usually follow a Gaussian bell curve.','Independent sources add by power.','Correlated sources add by amplitude, and get much louder.']},
'7c':{h:'Why is every resistor and transistor noisy?',l:['Random electron motion creates thermal noise: four k T R.','A transistor channel adds four k T gamma g m.','And an RC filter always ends up with k T over C, whatever R is.']},
'7d':{h:'Why does noise rise at low frequencies?',l:['Traps at the oxide interface catch and release carriers at random.','This flicker noise grows as one over frequency.','Bigger transistor area reduces it.']},
'7e':{h:'How do we compare the noise of different circuits fairly?',l:['Output noise grows with gain, but so does the signal.','So we move all noise to one equivalent source at the input.','And sometimes we need both a noise voltage and a noise current.']},
'7f':{h:'How do we design a quiet common-source stage?',l:['Move each drain noise current to the gate as a voltage.','The amplifying transistor wants large g m. Current sources want small g m.','And less bandwidth means less total noise.']},
'7g':{h:'How noisy are common gate, followers and cascodes?',l:['Common-gate stages pass the load’s noise current straight to the input.','Source followers add noise while giving no gain.','The cascode device is quiet, until high frequency.']},
'7h':{h:'How noisy is a differential pair?',l:['It has two transistors in the signal path.','So its input noise voltage is root two times a common-source stage.','Noise bandwidth tells you how much spectrum really counts.']}
};

/* ---- intros2.js ---- */
Object.assign(INTROS,{
'b-loop':{h:'Why does feedback make gain so accurate?',l:['An amplifier sees only the error between the input and a fraction of its output.','Solve the loop, and the gain becomes A over one plus beta A.','When beta A is large, that is just one over beta, a ratio of resistors or capacitors.']},
'b-2port':{h:'How do we describe a box with two ports?',l:['Any linear network with an input and an output needs four numbers.','Z, Y, H and G models differ only in which quantities you treat as inputs.','To set a voltage to zero, short the port. To set a current to zero, open it.']},
'8a':{h:'How does feedback make a sloppy transistor precise?',l:['A transistor’s gain drifts with process and temperature.','Wrap it in capacitive feedback, and the gain becomes C one over C two.','We will also measure loop gain by breaking the loop and injecting a test signal.']},
'8b':{h:'What else does feedback change?',l:['Feedback divides or multiplies impedances by one plus the loop gain.','It also widens bandwidth by the same factor that it cuts the gain.','Two fast amplifiers in cascade can beat one slow one.']},
'8c':{h:'What kinds of amplifiers and feedback are there?',l:['Amplifiers can sense a voltage or a current, and produce a voltage or a current.','Sensing a voltage is done in parallel. Sensing a current is done in series.','Two separate nodes mean voltage subtraction. One node means current subtraction.']},
'8d':{h:'How does voltage feedback build a near-ideal voltage amplifier?',l:['A resistive divider senses the output and returns a voltage in series with the input.','The output resistance drops by one plus the loop gain.','The input resistance rises by the same factor.']},
'8e':{h:'Is there one rule for all four feedback types?',l:['Sensing a voltage lowers output resistance. Sensing a current raises it.','Returning a voltage raises input resistance. Returning a current lowers it.','We will see each case, including the photodiode transimpedance amplifier.']},
'8f':{h:'What if the feedback network loads the amplifier?',l:['Real resistor dividers draw current and add impedance.','Model the network as a two-port, and open the loop with its loading kept.','Then find beta, and scale everything by one plus the loop gain.']},
'8g':{h:'Can feedback reduce noise?',l:['Noise enters the amplifier exactly where the signal does.','So feedback shrinks both by the same factor.','The input-referred noise does not change, and a noisy feedback network only adds more.']},
'9a':{h:'How good does an op amp need to be?',l:['A gain error of one percent at a gain of ten needs an open-loop gain above one thousand.','Settling in five nanoseconds sets the unity-gain bandwidth.','Swing, linearity, noise and supply rejection all trade against each other.']},
'9b':{h:'What do one-stage op amps look like?',l:['The simple differential pair gives a gain of g m times r o.','The telescopic cascode gives roughly g m r o squared, but less swing.','It also makes a poor unity-gain buffer, and we will see why.']},
'9c':{h:'How do you actually design an op amp?',l:['Start from the power budget and the output swing.','Split the headroom into overdrive voltages, then size each transistor.','If the gain falls short, lengthen the devices outside the signal path.']},
'9d':{h:'Why is the folded cascode so popular?',l:['Folding puts the cascode beside the input device instead of on top of it.','Inputs and outputs can then be shorted, and the input range reaches a supply rail.','The price is power, gain, noise and a lower folding pole.']},
'9e':{h:'Why add a second stage?',l:['A cascode first stage gives gain but little swing.','A simple common-source second stage gives swing almost to the rails.','We stop at two stages, because every stage adds a pole.']},
'9f':{h:'How can we raise gain without stacking more devices?',l:['An auxiliary amplifier can hold the cascode node still.','That multiplies the output resistance by the auxiliary gain.','Then we compare the four op-amp families side by side.']},
'9g':{h:'Who decides the output common-mode level?',l:['With current-source loads, a tiny current mismatch drives the outputs to a rail.','Differential feedback cannot fix it.','A common-mode feedback loop senses the average output and adjusts a bias current.']},
'9h':{h:'Why do big steps look like ramps?',l:['A large input steers the whole tail current to one side.','A constant current then charges the load, so the output ramps at the slew rate.','We will also widen the input range with two complementary pairs.']},
'9i':{h:'How well does an op amp reject supply noise, and how noisy is it?',l:['Power supply rejection compares the signal gain with the supply gain.','To find noise sources, imagine wiggling each gate.','Folded cascodes are noisier than telescopic ones.']},
'10a':{h:'When does negative feedback oscillate?',l:['If the loop gain reaches minus one, the closed-loop gain becomes infinite.','That means a gain of one and a phase of minus one eighty degrees.','Unity-gain feedback is the worst case, so we study it.']},
'10b':{h:'How many poles can a feedback loop tolerate?',l:['One pole is always stable.','Two poles are stable, but they can ring.','A third pole steals phase early and can make the loop oscillate.']},
'10c':{h:'How much phase margin is enough?',l:['Phase margin is the phase left before minus one eighty, where the loop gain is one.','Forty-five degrees gives about thirty percent peaking.','Sixty degrees settles fast with little ringing.']},
'10d':{h:'How do we compensate a one-stage op amp?',l:['Lower the dominant pole by adding load capacitance.','The unity-gain bandwidth then equals the first nondominant pole.','Fully differential cascodes avoid the mirror pole, so they are very stable.']},
'10e':{h:'How does a Miller capacitor stabilise a two-stage op amp?',l:['A capacitor across the second stage looks huge at the first-stage output.','It pushes the dominant pole down and the output pole up. That is pole splitting.','It also creates a right-half-plane zero, which a series resistor can remove.']},
'10f':{h:'How fast can a two-stage op amp slew, and can we avoid the zero?',l:['The tail current charges the compensation capacitor, so the slew rate is I S S over C c.','The zero comes from current flowing forward through C c.','A follower or a common-gate device makes that path one-way.']}
});

/* ---- app1.js ---- */
/* ===== STATE & PERSISTENCE ===== */
const LKEY='razavi-bench-v1';
const DEF={v:1,cur:null,lessons:{},answers:{},cards:{},journal:[],wraps:[],dump:[],recall:{},days:{},sprints:0,
  settings:{focus:5,theme:'system',big:false,reduce:false,sound:false,rewards:true,goal:'1l',ai:true},updatedAt:0};
let S=structuredClone(DEF);
const LMAP=Object.fromEntries(LESSONS.map(l=>[l.id,l]));
const today=()=>new Date().toISOString().slice(0,10);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function mergeDefaults(o){const s=Object.assign(structuredClone(DEF),o||{});s.settings=Object.assign(structuredClone(DEF.settings),(o||{}).settings||{});return s}
(function loadLocal(){const raw=lsGet(LKEY);if(raw){try{S=mergeDefaults(JSON.parse(raw))}catch(e){}}})();

const SYNC={mode:'local',ref:null,sketchRef:null,chain:Promise.resolve(),timer:null,label:'Saved on this device'};
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use) return setSync('local');
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return setSync('local');
    const id=await user.id(); if(!id) return setSync('local');
    const col=db.collection('data/users/'+id); SYNC.ref=col.doc('progress'); SYNC.sketchRef=col.doc('sketch');
    const snap=await SYNC.ref.get();
    if(snap.exists){const d=snap.data();if(d&&d.state&&(d.updatedAt||0)>(S.updatedAt||0)){S=mergeDefaults(structuredClone(d.state));lsSet(LKEY,JSON.stringify(S));applySettings();render();}
      else if((S.updatedAt||0)>(d.updatedAt||0)) queueRemote();}
    else if(S.updatedAt) queueRemote();
    setSync('cloud');
  }catch(e){setSync('local')}
}
function setSync(m){SYNC.mode=m;SYNC.label=m==='cloud'?'Synced to your account':'Saved on this device only';const el=document.getElementById('syncchip');if(el)el.innerHTML=`<span class="syncdot ${m==='cloud'?'ok':'local'}"></span>${SYNC.label}`}
function save(){S.updatedAt=Date.now();lsSet(LKEY,JSON.stringify(S));queueRemote()}
function queueRemote(){if(!SYNC.ref)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>{const body={state:structuredClone(S),updatedAt:S.updatedAt};SYNC.chain=SYNC.chain.then(()=>SYNC.ref.set(body)).then(()=>setSync('cloud')).catch(()=>setSync('local'))},1500)}
function dayLog(){const d=today();S.days[d]=S.days[d]||{lessons:0,first:0,reviews:0};return S.days[d]}

/* ===== UTIL ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function tex(t,display){try{if(window.katex)return katex.renderToString(t,{output:'mathml',displayMode:!!display,throwOnError:false});}catch(e){}return `<code class="mono">${esc(t)}</code>`}
const SUBRE=/([A-Za-zµ\u0370-\u03FF′)\]])_(\{[^}<]*\}|[A-Za-z0-9]+?(?=[A-Za-z]_|[^A-Za-z0-9]|$))/g;
const SUPRE=/([A-Za-z0-9µ\u0370-\u03FF\u2080-\u2089′)\]])\^(\{[^}<]*\}|[-−+]?[0-9.½⁄]+|[A-Za-z]+)/g;
const unbrace=x=>x.replace(/^\{|\}$/g,'');
function scriptText(t){return t.replace(SUBRE,(m,a,b)=>a+'<sub>'+unbrace(b)+'</sub>').replace(SUPRE,(m,a,b)=>a+'<sup>'+unbrace(b).replace(/^-/,'−')+'</sup>')}
function subText(seg){return ('>'+seg+'<').replace(/>([^<]*)</g,(m,t)=>'>'+scriptText(t)+'<').slice(1,-1)}
function M(html){const parts=String(html??'').split(/(\\\(.+?\\\))/s);return parts.map(p=>p.startsWith('\\(')&&p.endsWith('\\)')?tex(p.slice(2,-2),false):subText(p)).join('')}
const MT=s=>M(esc(s));
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function pageRef(l){if(!l.pages)return '';const[a,b]=l.pages;return `Book pp.${a}–${b} · PDF p.${a+BOOK.offset}–${b+BOOK.offset}`}
const LABEL={book:['book','From the book'],bridge:['bridge','Foundation bridge'],deep:['deep','Optional deeper dive']};
function tagHTML(lab){const[c,t]=LABEL[lab];return `<span class="tag ${c}">${t}</span>`}
function lstate(id){return S.lessons[id]||{seen:0,done:false}}
function prereqsDone(l){return (l.prereq||[]).every(p=>lstate(p).done)}
function nextLesson(){
  const order=LESSONS; const cur=S.cur&&LMAP[S.cur.id]&&!lstate(S.cur.id).done?S.cur.id:null;
  if(cur) return LMAP[cur];
  return order.find(l=>!lstate(l.id).done&&prereqsDone(l)&&l.label!=='deep') || order.find(l=>!lstate(l.id).done) || null;
}
function blocksOf(l){return l.blocks}
function cardsOf(l){return (l.cards||[]).map((c,i)=>({id:l.id+'#'+i,front:c[0],back:c[1],lesson:l.id}))}
const ALLCARDS=()=>LESSONS.flatMap(cardsOf);

/* ===== REVIEW SCHEDULER (documented in Review → How review works) ===== */
const INTERVALS=[10*60e3,864e5,3*864e5,7*864e5,16*864e5,35*864e5];
function unlockCards(l){cardsOf(l).forEach(c=>{if(!S.cards[c.id])S.cards[c.id]={box:0,due:Date.now()+INTERVALS[0],reps:0,lapses:0}})}
function dueCards(){const now=Date.now();return ALLCARDS().filter(c=>S.cards[c.id]&&S.cards[c.id].due<=now)}
function rateCard(id,r){const c=S.cards[id];if(!c)return;c.reps++;c.last=Date.now();
  if(r==='again'){c.box=0;c.lapses++;c.due=Date.now()+INTERVALS[0]}
  else if(r==='hard'){c.due=Date.now()+Math.max(INTERVALS[0],INTERVALS[c.box]/2)}
  else if(r==='good'){c.box=Math.min(5,c.box+1);c.due=Date.now()+INTERVALS[c.box]}
  else {c.box=Math.min(5,c.box+2);c.due=Date.now()+INTERVALS[c.box]}
  dayLog().reviews++;save()}
function cardSecure(c){return c&&c.box>=3&&c.reps>=3}
function lessonEvidence(id){const l=LMAP[id];const qs=Object.entries(S.answers).filter(([k])=>k.startsWith(id+':'));
  const right=qs.filter(([,a])=>a.correct).length, total=l.blocks.filter(b=>b.t==='check').length;
  const cs=cardsOf(l).map(c=>S.cards[c.id]);const reviewed=cs.some(c=>c&&c.reps>0);const secure=cs.length&&cs.every(cardSecure);
  return {taught:lstate(id).done,practised:total>0&&right>=total,right,total,reviewed,secure}}

/* ===== FIGURE ZOOM (pinch / ctrl+wheel / drag when zoomed / double-tap reset) ===== */
function makeZoom(fig){
  const z=fig.querySelector('.zoomer');let sc=1,tx=0,ty=0;const pts=new Map();let start=null;
  const apply=()=>{z.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;fig.style.touchAction=sc>1.01?'none':'pan-y';const b=fig.querySelector('.zreset');if(b)b.hidden=sc<=1.01};
  const zoomAt=(f,cx,cy)=>{const r=fig.getBoundingClientRect();const x=cx-r.left,y=cy-r.top;const ns=Math.min(5,Math.max(1,sc*f));tx=x-(x-tx)*(ns/sc);ty=y-(y-ty)*(ns/sc);sc=ns;if(sc===1){tx=0;ty=0}apply()};
  fig.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey||document.activeElement===fig))return;e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
  fig.addEventListener('pointerdown',e=>{if(e.target.closest('button,input'))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const[a,b]=[...pts.values()];start={d:Math.hypot(a.x-b.x,a.y-b.y),sc}}else start=null});
  fig.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const prev=pts.get(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&start){const[a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt((start.sc*d/start.d)/sc,(a.x+b.x)/2,(a.y+b.y)/2)}
    else if(pts.size===1&&sc>1.01&&e.pointerType!=='mouse'||pts.size===1&&sc>1.01&&e.buttons===1){tx+=e.clientX-prev.x;ty+=e.clientY-prev.y;apply()}});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)start=null};fig.addEventListener('pointerup',up);fig.addEventListener('pointercancel',up);fig.addEventListener('pointerleave',up);
  fig.addEventListener('dblclick',()=>{sc=1;tx=0;ty=0;apply()});
  const b=fig.querySelector('.zreset');if(b)b.onclick=()=>{sc=1;tx=0;ty=0;apply()};apply();

function subify(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest('svg,math,textarea,script,style,input,.mono-raw'))return NodeFilter.FILTER_REJECT;return /[A-Za-z0-9µ\u0370-\u03FF′)\]][_^][-−{A-Za-z0-9.½]/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});const list=[];while(w.nextNode())list.push(w.currentNode);
 list.forEach(n=>{const sp=document.createElement('span');sp.innerHTML=scriptText(esc(n.nodeValue));n.replaceWith(...sp.childNodes)})}
new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)subify(n);else if(n.nodeType===3&&n.parentElement)subify(n.parentElement)}))}).observe(document.documentElement,{childList:true,subtree:true});

/* Render AI text: normalise $…$ / \[…\] to \(…\), keep math raw for KaTeX, escape the rest, light markdown, sub/superscripts. */
function aiFormat(txt){let t=String(txt||'');
  t=t.replace(/\\\[([\s\S]+?)\\\]/g,(m,x)=>'\\('+x+'\\)').replace(/\$\$([\s\S]+?)\$\$/g,(m,x)=>'\\('+x+'\\)').replace(/(^|[^\\\w])\$([^$\n]+?)\$/g,(m,p,x)=>p+'\\('+x+'\\)');
  return t.split(/(\\\([\s\S]+?\\\))/).map(p=>{if(p.startsWith('\\(')&&p.endsWith('\\)'))return tex(p.slice(2,-2),false);
    let h=esc(p).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>');return subText(h)}).join('')}

function qHTML(qid,q){const a=S.answers[qid]||{};let body='';

  if(q.type==='order'){const idx=q.items.map((_,i)=>i);let sh=idx.slice();for(let k=0;k<6&&sh.every((v,i)=>v===i);k++)sh=sh.map(v=>({v,r:((v*7+3)%5)+Math.random()})).sort((x,y)=>x.r-y.r).map(o=>o.v);

   <div class="conf" role="group" aria-label="How sure are you?"><span class="small muted">How sure?</span><button data-c="guess" aria-pressed="false">Guessing</button><button data-c="fair" aria-pressed="false">Fairly sure</button><button data-c="sure" aria-pressed="false">Sure</button></div>
   <div class="row"><button class="btn primary sm" data-act="check">Check</button>${q.hint?'<button class="btn ghost sm" data-act="hint">Hint</button>':''}</div><div class="fbx" aria-live="polite"></div>
   ${a.correct?`<div class="fb ok">You answered this correctly before. Try again any time.</div>`:''}</div>`}
function mountQ(root,qid,q,lesson){const el=$(`.q[data-qid="${CSS.escape(qid)}"]`,root);if(!el)return;let sel=null,conf=null,tries=0;

    tries++;const rec=S.answers[qid]||{attempts:0,correct:false,firstTry:null};rec.attempts++;rec.last=Date.now();rec.conf=conf;if(rec.firstTry===null){rec.firstTry=ok;rec.firstConf=conf||'none';if(ok)dayLog().first++}
    if(ok)rec.correct=true;S.answers[qid]=rec;
    if(q.type==='mcq')$$('.opt',el).forEach((b,i)=>{if(i===sel)b.classList.add(ok?'right':'wrong');if(ok&&i===q.a)b.classList.add('right')});

    else{const pre=q.prereq&&LMAP[q.prereq];

        (pre?`<div class="fb hint">This often comes from a missing foundation: <a href="#lesson-${pre.id}">${MT(pre.title)}</a> (${pre.mins} min). Open it, then come back — your place here is saved.</div>`:'');
        S.journal.unshift({t:Date.now(),qid,lesson:lesson.id,q:q.q,given,conf:conf||'none',fix:q.explain||''});S.journal=S.journal.slice(0,200)}}
    save()}}

Current passage:\n${blockText(b)}\n\nTask: ${ask}\nFormatting rules: plain sentences, no markdown headings. Put EVERY formula, symbol with a subscript, and number in scientific notation inside LaTeX delimiters \( and \), for example \(C_{ox}=\varepsilon_{ox}/t_{ox}\), \(\varepsilon_0=8.85\times10^{-12}\,\text{F/m}\), \(\mu_nC_{ox}\), \(\text{SiO}_2\). Never write a caret or underscore outside \( \). Use \times, not * or x, for multiplication. If unsure about anything, say so.`;

function mountStepper(sec,b,kind,startAll){const box=$(kind==='derive'?'.dsteps':'.esteps',sec);if(!box)return;let shown=startAll?b.steps.length:1;

function depthMap(){const d={};const f=id=>{if(d[id]!=null)return d[id];const l=LMAP[id];d[id]=0;const ps=(l.prereq||[]).filter(p=>LMAP[p]);d[id]=ps.length?1+Math.max(...ps.map(f)):0;return d[id]};LESSONS.forEach(l=>f(l.id));return d}
function renderPath(){const d=depthMap();for(let it=0;it<5;it++)LESSONS.forEach(l=>{if(l.label==='book')return;const deps=LESSONS.filter(x=>(x.prereq||[]).includes(l.id));if(deps.length){const m=Math.min(...deps.map(x=>d[x.id]))-1;if(m>d[l.id])d[l.id]=m}});const cols={};LESSONS.forEach(l=>{(cols[d[l.id]]=cols[d[l.id]]||[]).push(l)});
  const maxC=Math.max(...Object.keys(cols).map(Number));const NW=196,NH=48,GX=40,GY=16,P=16;

function renderReview(){const due=dueCards();const unlocked=ALLCARDS().filter(c=>S.cards[c.id]);
  const A=Object.values(S.answers).filter(a=>a.firstTry!==null);const mat={sr:0,sw:0,gr:0,gw:0};A.forEach(a=>{const sure=a.firstConf==='sure'||a.firstConf==='fair';const k=(sure?'s':'g')+(a.firstTry?'r':'w');mat[k]++});
  const missed=Object.entries(S.answers).filter(([,a])=>!a.correct);
  $('#main').innerHTML=`<div class="wrap stack" style="gap:18px"><div class="col stack" style="gap:18px"><div><span class="eyebrow">Review</span><h1>Bring it back from memory</h1></div>
   <div class="card stack" id="flashzone">${due.length?`<p><b>${due.length}</b> due now.</p><button class="btn primary" id="startrev">Start (one card at a time)</button>`:unlocked.length?`<p>Nothing due right now. Next card comes back ${nextDue()}.</p><button class="btn" id="startrev">Practise all ${unlocked.length} anyway</button>`:'<p>Finish a lesson and its cards appear here.</p>'}</div>
   <div class="card stack"><h3>Confidence vs correctness (first tries)</h3><div class="tbl"><table><tr><th></th><th>Right</th><th>Wrong</th></tr><tr><td>Sure / fairly sure</td><td class="num">${mat.sr}</td><td class="num">${mat.sw} ${mat.sw?'<span class="tag" style="color:var(--bad)">confident but mistaken</span>':''}</td></tr><tr><td>Guessing / not stated</td><td class="num">${mat.gr} ${mat.gr?'<span class="tag plain">guessed right</span>':''}</td><td class="num">${mat.gw}</td></tr></table></div><p class="small muted">“Confident but mistaken” is the most valuable row to fix — those are misconceptions, not gaps.</p></div>
   ${missed.length?`<div class="card stack"><h3>Questions to retry</h3><div class="list">${missed.slice(0,12).map(([k])=>{const id=k.split(':')[0];return `<a href="#lesson-${id}">${MT(LMAP[id]?LMAP[id].title:id)}</a>`}).join('')}</div></div>`:''}
   <div class="card stack"><h3>Error journal</h3>${S.journal.length?`<div class="list">${S.journal.slice(0,10).map(j=>`<div class="small"><div>${M(j.q)}</div><div class="muted">You answered: ${esc(j.given)} ${j.conf==='sure'?'(sure)':''}</div><div>Correction: ${M(j.fix)}</div></div>`).join('')}</div>`:'<p class="small muted">Wrong answers land here automatically with the correction.</p>'}</div>
   ${S.wraps.length?`<div class="card stack"><h3>Session wrap-ups</h3><div class="list">${S.wraps.slice(0,6).map(w=>`<div class="small"><span class="mono muted">${new Date(w.t).toLocaleDateString()}</span><br><b>Learned:</b> ${esc(w.learned||'—')}<br><b>Unclear:</b> ${esc(w.unclear||'—')}</div>`).join('')}</div></div>`:''}
   <details class="card"><summary><b>How review works</b></summary><div class="small stack" style="margin-top:8px"><p>Each finished lesson adds its flashcards. A card sits in a box 0–5; boxes come back after 10 min, 1, 3, 7, 16 and 35 days.</p><p><b>Again</b> → box 0 (10 min) · <b>Hard</b> → same box, half the wait · <b>Good</b> → next box · <b>Easy</b> → skip a box. A card is “provisionally secure” after 3+ reviews and reaching box 3 — not permanently mastered. A right answer marked “guessing” or a recall marked “partly/missed” brings that lesson’s cards back sooner. This is a simple Leitner-style schedule, not a scientifically tuned algorithm.</p></div></details>
  </div></div>`;
  const s=$('#startrev');if(s)s.onclick=()=>flashRun(due.length?due:unlocked)}
function nextDue(){const ds=Object.values(S.cards).map(c=>c.due).filter(Boolean);if(!ds.length)return 'later';const m=Math.min(...ds)-Date.now();return m<36e5?'in '+Math.max(1,Math.round(m/6e4))+' min':m<864e5?'in '+Math.round(m/36e5)+' h':'in '+Math.round(m/864e5)+' days'}
function flashRun(list){let i=0;const z=$('#flashzone');const draw=()=>{if(i>=list.length){z.innerHTML=`<p><b>Done — ${list.length} card${list.length>1?'s':''}.</b> That counts. Stop here or start a lesson.</p><a class="btn" href="#today">Back to Today</a>`;return}

  $('#fl-show').onclick=()=>{$('.back',z).hidden=false;$('#fl-show').hidden=true;$('#fl-rate').hidden=false;$('[data-r=good]',z).focus()};
  $$('[data-r]',z).forEach(b=>b.onclick=()=>{rateCard(c.id,b.dataset.r);if(b.dataset.r==='again'){const l=LMAP[c.lesson];const p=(l.prereq||[]).map(x=>LMAP[x]).find(x=>x&&x.label==='bridge');if(p)toast('Tip: the bridge “'+p.title+'” supports this card')}i++;draw()});$('#fl-stop').onclick=()=>renderReview()};draw()}

   const sel=$('#tb-l'),ta=$('#tb-t');const load=()=>{ta.value=(S.recall['teach:'+sel.value]||{}).text||'';$('#tb-o').innerHTML=''};sel.value=(S.cur&&S.cur.id)||'2h';load();sel.onchange=load;let tm;ta.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{S.recall['teach:'+sel.value]={text:ta.value,t:Date.now()};save()},800)};
   $('#tb-c').onclick=()=>{const l=LMAP[sel.value];$('#tb-o').innerHTML=`<div class="fb ok"><b>Key points:</b><ul>${cardsOf(l).map(c=>`<li>${M(c.front)} → ${M(c.back)}</li>`).join('')}</ul></div>`}}

function sketchpad(body){body.innerHTML=`<div class="card stack"><div class="sketchbar" role="toolbar"><button class="btn sm" data-tool="pen" aria-pressed="true">Pen</button><button class="btn sm" data-tool="line" aria-pressed="false">Line</button><button class="btn sm" data-tool="rect" aria-pressed="false">Box</button><button class="btn sm" data-tool="text" aria-pressed="false">Label</button><button class="btn sm" data-tool="erase" aria-pressed="false">Eraser</button>
  <span class="small muted">Colour</span>${['ink','book','bridge','bad'].map((c,i)=>`<button class="btn sm" data-col="${c}" aria-pressed="${i===0}" aria-label="${c}"><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--${c})"></span></button>`).join('')}
  <button class="btn sm" id="sk-undo">Undo</button><button class="btn sm" id="sk-redo">Redo</button><button class="btn sm" id="sk-clear">Clear</button><button class="btn sm" id="sk-exp">Save PNG</button></div>
  <canvas class="sketch" id="sk" aria-label="Sketch area"></canvas><p class="small muted">Pen pressure works on your tablet. Saved ${SYNC.sketchRef?'to your account':'on this device'} automatically. Try: redraw Fig. 2.16 (pinch-off) from memory.</p></div>`;
  const cv=$('#sk');const ctx=cv.getContext('2d');let strokes=[],redo=[],tool='pen',col='ink',cur=null;const dpr=window.devicePixelRatio||1;
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();
  const size=()=>{const r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;draw()};
  const draw=()=>{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.lineCap='round';ctx.lineJoin='round';
    for(const s of strokes.concat(cur?[cur]:[])){ctx.strokeStyle=s.tool==='erase'?css('sheet'):css(s.col);ctx.fillStyle=css(s.col);
      if(s.tool==='pen'||s.tool==='erase'){for(let i=1;i<s.p.length;i++){ctx.lineWidth=(s.tool==='erase'?18:1+3*(s.p[i][2]||.5));ctx.beginPath();ctx.moveTo(s.p[i-1][0],s.p[i-1][1]);ctx.lineTo(s.p[i][0],s.p[i][1]);ctx.stroke()}}
      if(s.tool==='line'&&s.p.length>1){ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(...s.p[0]);ctx.lineTo(...s.p[s.p.length-1].slice(0,2));ctx.stroke()}
      if(s.tool==='rect'&&s.p.length>1){ctx.lineWidth=2;const[a,b]=[s.p[0],s.p[s.p.length-1]];ctx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1])}
      if(s.tool==='text'){ctx.font='16px '+css('f-body');ctx.fillText(s.text,s.p[0][0],s.p[0][1])}}};
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top,e.pressure||.5]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);if(tool==='text'){const p=pt(e);const t=document.createElement('input');t.type='text';t.placeholder='label, Enter';Object.assign(t.style,{position:'fixed',left:e.clientX+'px',top:e.clientY-16+'px',width:'160px',zIndex:80});document.body.appendChild(t);t.focus();const fin=()=>{if(t.value.trim()){strokes.push({tool:'text',col,p:[p],text:t.value.trim()});redo=[];draw();persist()}t.remove()};t.onkeydown=k=>{if(k.key==='Enter')fin();if(k.key==='Escape')t.remove()};t.onblur=fin;return}
    cur={tool,col,p:[pt(e)]}};
  cv.onpointermove=e=>{if(!cur)return;const p=pt(e);if(cur.tool==='line'||cur.tool==='rect')cur.p=[cur.p[0],p];else cur.p.push(p);draw()};
  cv.onpointerup=()=>{if(cur&&cur.p.length>1){strokes.push(cur);redo=[];persist()}cur=null;draw()};
  $$('[data-tool]',body).forEach(b=>b.onclick=()=>{tool=b.dataset.tool;$$('[data-tool]',body).forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $$('[data-col]',body).forEach(b=>b.onclick=()=>{col=b.dataset.col;$$('[data-col]',body).forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#sk-undo').onclick=()=>{if(strokes.length){redo.push(strokes.pop());draw();persist()}};$('#sk-redo').onclick=()=>{if(redo.length){strokes.push(redo.pop());draw();persist()}};
  $('#sk-clear').onclick=()=>{if(!strokes.length)return;modal('<h2>Clear the sketch?</h2><p>You can undo right after.</p><div class="row"><button class="btn primary" id="cl-y">Clear</button><button class="btn ghost" data-close>Keep it</button></div>',(s,close)=>{$('#cl-y',s).onclick=()=>{redo=strokes.slice().reverse();strokes=[];draw();persist();close()}})};
  $('#sk-exp').onclick=()=>{const off=document.createElement('canvas');off.width=cv.width;off.height=cv.height;const o=off.getContext('2d');o.fillStyle=css('sheet');o.fillRect(0,0,off.width,off.height);o.drawImage(cv,0,0);off.toBlob(b=>saveFile('razavi-sketch.png',b,'image/png'),'image/png')};
  let pt2;const persist=()=>{clearTimeout(pt2);pt2=setTimeout(()=>{const data=JSON.stringify(strokes.map(s=>Object.assign({},s,{p:s.p.map(q=>q.map(v=>Math.round(v*10)/10))}))).slice(0,240000);lsSet(LKEY+'-sketch',data);if(SYNC.sketchRef)SYNC.sketchRef.set({strokes:data,updatedAt:Date.now()}).catch(()=>{})},700)};
  const restore=d=>{try{strokes=JSON.parse(d)||[];draw()}catch(e){}};const local=lsGet(LKEY+'-sketch');if(local)restore(local);
  if(SYNC.sketchRef)SYNC.sketchRef.get().then(s=>{if(s.exists&&s.data().strokes&&!strokes.length)restore(s.data().strokes)}).catch(()=>{});
  new ResizeObserver(size).observe(cv);size()}

/* ===== FOCUS TIMER (1–25 min, never coercive) ===== */
const TIMER={left:null,total:null,run:false,brk:false,iv:null,open:false,noise:null,
  reset(){this.stop();this.total=S.settings.focus*60;this.left=this.total;this.brk=false;this.paint()},
  start(){if(this.left==null)this.reset();if(this.run)return;this.run=true;const end=Date.now()+this.left*1000;if(S.settings.tick){try{audio().resume()}catch(e){}}this.iv=setInterval(()=>{const prev=this.left;this.left=Math.max(0,Math.round((end-Date.now())/1000));if(this.left!==prev&&this.left>0&&!this.brk&&S.settings.tick)tick(this.left%2===0);if(this.left<=0)this.finish(true);this.paint()},250);this.paint()},
  pause(){this.run=false;clearInterval(this.iv);this.paint()},stop(){this.run=false;clearInterval(this.iv)},
  finish(auto){this.stop();if(!this.brk){S.sprints++;save()}if(auto&&S.settings.sound)chime();const wasBreak=this.brk;this.left=0;this.paint();
    if(auto){modal(wasBreak?'<h2>Break over</h2><p>Come back when you’re ready. Your place is saved.</p><div class="row"><button class="btn primary" data-close>OK</button></div>':`<h2>Sprint done</h2><p>That was a real piece of work. Stop here, take a short break, or do one more.</p><div class="row"><button class="btn primary" id="tm-more">One more sprint</button><button class="btn" id="tm-brk">2-min break</button><button class="btn" id="tm-wrap">Wrap up</button><button class="btn ghost" data-close>Close</button></div>`,(m,close)=>{const a=$('#tm-more',m);if(a)a.onclick=()=>{close();TIMER.reset();TIMER.start()};const b=$('#tm-brk',m);if(b)b.onclick=()=>{close();TIMER.startBreak(2)};const w=$('#tm-wrap',m);if(w)w.onclick=()=>{close();wrapModal()}})}},
  startBreak(min){this.stop();this.brk=true;this.total=min*60;this.left=this.total;this.start();this.open=true;this.paint()},
  paint(){const d=$('#dock');if(!d)return;const t=this.left==null?S.settings.focus*60:this.left;const mm=String(Math.floor(t/60)),ss=String(t%60).padStart(2,'0');
    d.innerHTML=`${this.open?`<div class="panel" role="dialog" aria-label="Focus timer"><div class="row" style="justify-content:space-between"><b>${this.brk?'Break':'Focus sprint'}</b><button class="btn ghost sm" id="tm-x" aria-label="Close timer panel">Close</button></div>
     <div class="ring" aria-live="off">${mm}:${ss}</div><div class="progressbar"><i style="width:${this.total?100*(1-t/this.total):0}%"></i></div>
     ${this.run||this.brk?'':`<div class="seg" aria-label="Sprint length">${[1,2,3,5,8,10,15,25].map(m=>`<button data-m="${m}" aria-pressed="${S.settings.focus===m}">${m}</button>`).join('')}</div>`}
     <div class="row">${this.run?'<button class="btn sm primary" id="tm-p">Pause</button>':`<button class="btn sm primary" id="tm-s">${this.left!=null&&this.left<this.total&&this.left>0?'Resume':'Start'}</button>`}<button class="btn sm" id="tm-r">Reset</button>${this.brk?'':'<button class="btn sm" id="tm-f">Finish</button><button class="btn sm" id="tm-b">Break</button>'}</div>
     <hr class="soft"><div class="row" style="justify-content:space-between;gap:6px"><span class="small">Clock tick</span><div class="seg" role="group" aria-label="Clock tick volume">${[[0,"Off"],[1,"Soft"],[2,"Normal"],[3,"Loud"]].map(([v,t])=>`<button data-tk="${v}" aria-pressed="${(S.settings.tick||0)===v}">${t}</button>`).join("")}</div></div>
     <div class="row" style="justify-content:space-between"><span class="small">Ambient brown noise</span><button class="btn sm" id="tm-n" aria-pressed="${!!this.noise}">${this.noise?'Stop':'Play'}</button></div>
     <a class="small" href="https://open.spotify.com/search/focus%20music" target="_blank" rel="noopener">Open Spotify in a new tab ↗</a><span class="small muted">Music players can’t be embedded in this page.</span></div>`:''}
     <button class="pill" id="tm-pill" aria-expanded="${this.open}" aria-label="Focus timer ${mm}:${ss}">${this.run?'●':'○'} ${this.brk?'break':'focus'} ${mm}:${ss}</button>`;
    $('#tm-pill').onclick=()=>{this.open=!this.open;this.paint()};if(!this.open)return;
    $('#tm-x').onclick=()=>{this.open=false;this.paint()};const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
    on('tm-s',()=>this.start());on('tm-p',()=>this.pause());on('tm-r',()=>this.reset());on('tm-f',()=>this.finish(false));on('tm-b',()=>this.startBreak(S.settings.focus>=10?5:2));on('tm-n',()=>{toggleNoise();this.paint()});
    $$('[data-tk]',d).forEach(b=>b.onclick=()=>{S.settings.tick=+b.dataset.tk;save();if(S.settings.tick){try{audio().resume()}catch(e){};tick(true)}this.paint()});
    $$('[data-m]',d).forEach(b=>b.onclick=()=>{S.settings.focus=+b.dataset.m;save();this.reset()})}};
let AC=null;function audio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function chime(){try{const a=audio(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(0.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(0.12,a.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+1.2);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+1.3)}catch(e){}}
/* Mechanical-clock tick: a short filtered noise burst plus a faint resonant click; "tock" is slightly lower. Volume levels 1–3. */
let TICKBUF=null;
function tick(isTick){try{const a=audio();if(a.state==='suspended')a.resume();const lvl=[0,0.05,0.11,0.2][S.settings.tick||0];if(!lvl)return;const t=a.currentTime;
  if(!TICKBUF){TICKBUF=a.createBuffer(1,Math.floor(a.sampleRate*0.03),a.sampleRate);const d=TICKBUF.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(a.sampleRate*0.0025))}
  const n=a.createBufferSource();n.buffer=TICKBUF;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=isTick?3200:2500;bp.Q.value=4;const g=a.createGain();g.gain.value=lvl*2.2;n.connect(bp).connect(g).connect(a.destination);n.start(t);
  const o=a.createOscillator(),og=a.createGain();o.type='sine';o.frequency.value=isTick?1500:1150;og.gain.setValueAtTime(0.0001,t);og.gain.exponentialRampToValueAtTime(lvl*0.5,t+0.002);og.gain.exponentialRampToValueAtTime(0.0001,t+0.045);o.connect(og).connect(a.destination);o.start(t);o.stop(t+0.06)}catch(e){}}
function toggleNoise(){try{if(TIMER.noise){TIMER.noise.stop();TIMER.noise=null;return}const a=audio();const len=a.sampleRate*4,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.2}
  const src=a.createBufferSource();src.buffer=buf;src.loop=true;const g=a.createGain();g.gain.value=0.18;src.connect(g).connect(a.destination);src.start();TIMER.noise=src}catch(e){toast('Audio is not available here')}}

/* ===== PN JUNCTION ANIMATION (canvas) =====
   Steps: 1 doping · 2 junction forms (diffusion → depletion + built-in field) · 3 reverse bias · 4 drift & mobility.
   Visual model, not a device simulator: widths follow w ∝ √(V_bi + V_R) and x_n/x_p = N_A/N_D. */
WIDGETS.pnsim=function(el){
  const STEPS=[
    {t:'1 · Doping', cap:'Doping adds free carriers. Donors give electrons, so the n side has n ≈ N_D. Acceptors give holes, so the p side has p ≈ N_A. Each carrier leaves behind a fixed ion of opposite charge.'},
    {t:'2 · Junction forms', cap:'Put p and n together. Carriers diffuse across and recombine, leaving fixed ionized atoms near the junction: the depletion region. Its charge creates a built-in field (arrows) that stops further diffusion.'},
    {t:'3 · Reverse bias', cap:'Reverse bias V_R adds to the built-in potential. The depletion region widens (w ∝ √(V_bi + V_R)) and only a tiny leakage current flows: rare minority carriers swept across by the field.'},
    {t:'4 · Drift & mobility', cap:'Mobility µ measures how fast carriers drift in a field: v = µE. Electrons drift against E, holes along E. Holes have lower mobility, so they drift more slowly. The drift is a small bias on top of fast random thermal motion.'}];
  el.innerHTML=`<div class="stack pns">
   <div class="seg" role="tablist" aria-label="Animation step">${STEPS.map((s,i)=>`<button data-st="${i}" aria-pressed="${i===0}">${s.t}</button>`).join('')}</div>
   <canvas class="pns-cv" aria-label="Animated pn junction"></canvas>
   <div class="pns-cap fb hint" aria-live="polite"></div>
   <div class="row pns-ctl" style="gap:16px">
    <div class="pns-c" data-for="0 1 2">${slider('pn-ratio','Doping ratio N_A / N_D',0.25,4,0.25,1,'')}</div>
    <div class="pns-c" data-for="2">${slider('pn-vr','Reverse bias V_R (V)',0,5,0.1,0,'')}</div>
    <div class="pns-c" data-for="3">${slider('pn-e','Field E (relative)',0,1,0.05,0.5,'')}</div>
    <div class="pns-c" data-for="3">${slider('pn-mu','Electron mobility µ_n (relative)',0.2,1,0.05,1,'')}</div>
   </div>
   <div class="row"><button class="btn sm primary" data-pn-play>Pause</button><button class="btn sm" data-pn-next>Next step →</button><button class="btn sm ghost" data-pn-restart>Restart this step</button><span class="small muted pns-read"></span></div>
   <p class="small muted">Picture, not a device simulation: sizes and speeds are scaled for clarity. Depletion width follows w ∝ √(V_bi + V_R) with V_bi ≈ 0.7 V, and it extends further into the lighter-doped side (x_n/x_p = N_A/N_D).</p></div>`;

  const depl=()=>{const r=g('pn-ratio');const vr=step>=2?g('pn-vr'):0;const G=geom();const L=G.x1-G.x0;const w=L*0.085*Math.sqrt(0.7+vr)/Math.sqrt(0.7);/* x_n/x_p = NA/ND */const xn=w*r/(1+r),xp=w/(1+r);return {w,xn,xp,r,vr}};

    const rows=W<560?3:4;const place=(xa,xb,n,type)=>{const cols=Math.max(2,Math.min(Math.round(n/rows),Math.floor((xb-xa)/26)));for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){const x=xa+(i+0.5)*(xb-xa)/cols+rnd(-3,3),y=G.top+(j+0.5)*(G.bot-G.top)/rows+rnd(-4,4);ions.push({x,y,type});car.push({x:x+rnd(-8,8),y:y+rnd(-8,8),vx:0,vy:0,type:type==='A'?'h':'e',home:x,alive:1})}};

  const arrow=(x1,y1,x2,y2,c,w=1.6)=>{ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-7*Math.cos(a-0.4),y2-7*Math.sin(a-0.4));ctx.lineTo(x2-7*Math.cos(a+0.4),y2-7*Math.sin(a+0.4));ctx.fill()};

    let cx=al==='center'?x-tot/2:al==='right'?x-tot:x;parts.forEach((p,i)=>{ctx.font=(i%2?px*0.72:px)+'px'+fam;ctx.fillText(p,cx,i%2?y+px*0.28:y);cx+=meas[i]})};
  const ion=(x,y,type,dim)=>{ctx.globalAlpha=dim?0.35:1;ctx.strokeStyle=type==='D'?col.n:col.p;ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(x,y,6.5,0,7);ctx.stroke();ctx.strokeStyle=type==='D'?col.n:col.p;ctx.beginPath();ctx.moveTo(x-3.5,y);ctx.lineTo(x+3.5,y);if(type==='D'){ctx.moveTo(x,y-3.5);ctx.lineTo(x,y+3.5)}ctx.stroke();ctx.globalAlpha=1};

  const frame=now=>{raf=null;if(!el.isConnected)return;const G=geom();const dt=Math.min(0.05,(now-(frame.last||now))/1000);frame.last=now;const k=(now-tStep)/1000;
    frame.n=(frame.n||0)+1;if(frame.n%30===0)readCol();ctx.clearRect(0,0,W,H);ctx.fillStyle=col.sheet;ctx.fillRect(0,0,W,H);

      const nar=W<600;txt(nar?'p: p ≈ N_A':'p-type  (acceptors, p ≈ N_A)',(G.x0+G.mid)/2+offL,G.top-12,col.p);txt(nar?'n: n ≈ N_D':'n-type  (donors, n ≈ N_D)',(G.mid+G.x1)/2+offR,G.top-12,col.n);
      /* ions */

      /* carriers: thermal motion, excluded from depletion region */
      car.forEach(c=>{if(!c.alive)return;c.vx+=rnd(-1,1)*60*jit*dt*6;c.vy+=rnd(-1,1)*60*jit*dt*6;c.vx*=0.9;c.vy*=0.9;c.x+=c.vx*dt*4;c.y+=c.vy*dt*4;
        const lo=G.top+5,hi=G.bot-5;if(c.y<lo){c.y=lo;c.vy*=-1}if(c.y>hi){c.y=hi;c.vy*=-1};
        if(c.type==='h'){const xa=G.x0+5,xb=step>0?G.mid-xp-4:G.mid-5;if(c.x<xa)c.x=xa;if(c.x>xb){if(step===1&&grow<1&&Math.random()<0.02){c.alive=0;return}c.x=xb-rnd(0,6)}}

      if(step===1&&grow<1){/* diffusing carriers crossing and recombining */const n=6;for(let i=0;i<n;i++){const ph=((k*0.9+i/n)%1);const y=G.top+12+((i*37)%((G.bot-G.top)-24));carrier(G.mid+xn+6-ph*(xn+xp+12),y,'e',1-ph);carrier(G.mid-xp-6+ph*(xn+xp+12),y+8,'h',1-ph)}

      /* step 3: battery and leakage */
      if(step===2){const vr=D.vr;ctx.strokeStyle=col.ink;ctx.lineWidth=1.5;const by=G.bot+40;ctx.beginPath();ctx.moveTo(G.x0+8,G.bot);ctx.lineTo(G.x0+8,by);ctx.lineTo(G.mid-14,by);ctx.moveTo(G.mid+14,by);ctx.lineTo(G.x1-8,by);ctx.lineTo(G.x1-8,G.bot);ctx.stroke();
        ctx.beginPath();ctx.moveTo(G.mid-6,by-10);ctx.lineTo(G.mid-6,by+10);ctx.moveTo(G.mid+6,by-6);ctx.lineTo(G.mid+6,by+6);ctx.lineWidth=2.2;ctx.stroke();txt('−',G.mid-16,by-8,col.ink);txt('+',G.mid+18,by-8,col.ink);txt('V_R = '+vr.toFixed(1)+' V  (+ to n, − to p)',G.mid,by+24,col.ink);
        if(Math.random()<0.012*(1+vr*0.1)*(playing?1:0))leak.push({x:G.mid-xp-2,y:rnd(G.top+10,G.bot-10),type:'e',dir:1},{x:G.mid+xn+2,y:rnd(G.top+10,G.bot-10),type:'h',dir:-1});
        leak=leak.filter(L=>{L.x+=L.dir*90*dt;carrier(L.x,L.y,L.type);return L.dir>0?L.x<G.mid+xn+10:L.x>G.mid-xp-10})}
      /* plots: charge density and field */
      if(step>0){const py0=G.plotTop,py1=G.plotBot,pm=(py0+py1)/2;ctx.strokeStyle=col.line;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(G.x0,pm);ctx.lineTo(G.x1,pm);ctx.stroke();
        const r=D.r;const hA=Math.min((pm-py0-4),(pm-py0-4)*Math.sqrt(r)/2),hD=Math.min((pm-py0-4),(pm-py0-4)/Math.sqrt(r)/2);
        ctx.fillStyle=col.p;ctx.globalAlpha=0.5;ctx.fillRect(G.mid-xp,pm,xp,hA);ctx.fillStyle=col.n;ctx.fillRect(G.mid,pm-hD,xn,hD);ctx.globalAlpha=1;
        txt('ρ(x): −qN_A',G.mid-xp-6,pm+hA,col.p,'right','11px');txt('+qN_D',G.mid+xn+6,pm-hD+10,col.n,'left','11px');
        const Ep=(pm-py0-4)*Math.min(1,(xp+xn)/(D.w||1))*0.9;ctx.strokeStyle=col.bad;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(G.mid-xp-30,pm);ctx.lineTo(G.mid-xp,pm);ctx.lineTo(G.mid,pm+Ep*0.9);ctx.lineTo(G.mid+xn,pm);ctx.lineTo(G.mid+xn+30,pm);ctx.stroke();
        txt('|E(x)| peaks at the junction',G.x1-4,py1,col.bad,'right','11px');txt('x_p',G.mid-xp,pm-6,col.muted,'center','10px');txt('x_n',G.mid+xn,pm+14,col.muted,'center','10px')}
      const D2=depl();$('.pns-read',el).textContent=step===0?`N_A/N_D = ${D2.r}`:`depletion width w ∝ √(${(0.7+D2.vr).toFixed(1)} V) · x_n/x_p = ${D2.r} ${step===2?'· leakage ≈ tiny, nearly independent of V_R':''}`;
    } else {
      /* step 4: drift in a uniform bar */
      const E=g('pn-e'),mun=g('pn-mu'),mup=mun/3;ctx.fillStyle=col.paper;ctx.fillRect(G.x0,G.top,G.x1-G.x0,G.bot-G.top);ctx.strokeStyle=col.line;ctx.strokeRect(G.x0,G.top,G.x1-G.x0,G.bot-G.top);
      for(let j=0;j<3;j++){const y=G.top+(j+0.5)*(G.bot-G.top)/3;if(E>0.02)arrow(G.x0+40+j*30,y,G.x0+40+j*30+40+E*80,y,col.bad,1.4)}txt('E →',G.x0+30,G.top-10,col.bad,'left');

        if(d.x<G.x0+4)d.x=G.x1-4;if(d.x>G.x1-4)d.x=G.x0+4;if(d.y<G.top+4)d.y=G.top+4;if(d.y>G.bot-4)d.y=G.bot-4;carrier(d.x,d.y,d.type)});
      const by=G.plotTop+10;const bw=(G.x1-G.x0)/2-20;
      txt('average drift velocity v = µE',G.x0,by,col.ink,'left');ctx.fillStyle=col.n;ctx.fillRect(G.x0,by+12,bw*mun*E,12);txt('electrons: µ_n·E ← (against E)',G.x0+bw*mun*E+6,by+22,col.n,'left','11px');
      ctx.fillStyle=col.p;ctx.fillRect(G.x0,by+34,bw*mup*E,12);txt('holes: µ_p·E → (µ_p ≈ µ_n/3 here)',G.x0+bw*mup*E+6,by+44,col.p,'left','11px');
      $('.pns-read',el).textContent=`v_n = µ_n E ∝ ${(mun*E).toFixed(2)} · v_p ∝ ${(mup*E).toFixed(2)}`}
    /* legend */
    ctx.save();const ly=H-6;ion(G.x0+8,ly-6,'D');txt('donor ion',G.x0+18,ly-2,col.muted,'left','10px');ion(G.x0+92,ly-6,'A');txt('acceptor ion',G.x0+102,ly-2,col.muted,'left','10px');carrier(G.x0+184,ly-6,'e');txt('electron',G.x0+192,ly-2,col.muted,'left','10px');carrier(G.x0+252,ly-6,'h');txt('hole',G.x0+260,ly-2,col.muted,'left','10px');ctx.restore();
    if(playing&&visible)raf=requestAnimationFrame(frame)};
  const setStep=i=>{step=i;$$('[data-st]',el).forEach(b=>b.setAttribute('aria-pressed',+b.dataset.st===i));$('.pns-cap',el).innerHTML=M(STEPS[i].cap);
    $$('.pns-c',el).forEach(c=>c.hidden=!c.dataset.for.split(' ').includes(String(i)));build();kick()};
  const kick=()=>{if(!raf){frame.last=performance.now();raf=requestAnimationFrame(frame)}};
  $$('[data-st]',el).forEach(b=>b.onclick=()=>setStep(+b.dataset.st));

  $('[data-pn-play]',el).onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play';if(playing)kick()};
  ['pn-ratio','pn-vr','pn-e','pn-mu'].forEach(id=>{const s=$('#'+id,el);const lab=$('#'+id+'-v',el);const upd=()=>{lab.textContent=(+s.value).toFixed(id==='pn-ratio'?2:id==='pn-vr'?1:2)};s.addEventListener('input',()=>{upd();if(id==='pn-ratio')build();kick()});upd()});
  if('IntersectionObserver' in window){new IntersectionObserver(es=>{visible=es[0].isIntersecting;if(visible&&playing)kick()}).observe(cv)}

};

const fmtT=t=>t>=1e-6?(t*1e6).toFixed(2)+' µs':t>=1e-9?(t*1e9).toFixed(1)+' ns':(t*1e12).toFixed(0)+' ps';

WIDGETS.fbloop=function(el){el.innerHTML=`<div class="stack"><div class="row" style="gap:16px">${slider('fl-a','open-loop gain A₀ (dB)',20,100,1,60,'')}${slider('fl-b','feedback factor β: log₁₀',-3,0,0.05,-1,'')}</div>

WIDGETS.opspec=function(el){el.innerHTML=`<div class="stack"><div class="row" style="gap:16px">${slider('os-g','closed-loop gain 1 + R₁/R₂',1,100,1,10,'')}${slider('os-e','allowed gain error: log₁₀ %',-2,1,0.1,0,'')}</div>

 const up=()=>{const G=+$('#os-g',el).value,e=Math.pow(10,+$('#os-e',el).value)/100,acc=Math.pow(10,+$('#os-a',el).value)/100,ts=+$('#os-t',el).value*1e-9;
  $('#os-g-v',el).textContent=G;$('#os-e-v',el).textContent=pct(e*100);$('#os-a-v',el).textContent=pct(acc*100);$('#os-t-v',el).textContent=(ts*1e9)+' ns';

  $('.readout',el).innerHTML=`<div><span>minimum A₀ = G / error</span><b>${V.fmt(G/e)}</b></div><div><span>allowed τ = t_s / ln(1/accuracy)</span><b>${fmtT(tau)}</b></div><div><span>required unity-gain bandwidth</span><b>${fmtHz(gbw)}</b></div>`;
  const T=ts*1.6;$('.out',el).innerHTML=figHTML(V.plot({w:520,h:240,x:[0,T*1e9],y:[0,1.1],xl:'time (ns)',yl:'V_out / final',xt:[0,ts*1e9/2,ts*1e9,T*1e9].map(v=>+v.toPrecision(2)),yt:[0,0.5,1],

WIDGETS.slew=function(el){el.innerHTML=`<div class="stack"><div class="row" style="gap:16px">${slider('sl-v','input step (V at output)',0.05,2,0.05,1,'')}${slider('sl-s','slew rate: log₁₀ V/µs',0.5,3,0.05,1.3,'')}</div>${slider('sl-t','small-signal τ (ns)',1,50,1,10,'')}

WIDGETS.pm=function(el){el.innerHTML=`<div class="stack"><div class="row" style="gap:16px">${slider('pm-a','DC loop gain βA₀ (dB)',20,100,1,80,'')}${slider('pm-1','pole 1: log₁₀ f',2,7,0.1,3,'')}</div>

   stsvg=V.plot({w:520,h:220,x:[0,T*1e9],y:[0,2],xl:'time (ns)',yl:'step response',xt:[0,T*1e9/2,T*1e9].map(v=>+v.toPrecision(2)),yt:[0,0.5,1,1.5,2],series:[{pts:st.pts.map(p=>[p[0]*1e9,p[1]]),cls:'sv-book'}],hl:[{y:1,label:'final value'}],aria:'Closed-loop step response'})}
  const verdict=r.pm===null?'—':r.pm<0?'UNSTABLE (oscillates)':r.pm<45?'rings a lot':r.pm<55?'some ringing':r.pm<=70?'≈ optimum (60°)':'very damped, slower';
  $('.readout',el).innerHTML=`<div><span>gain crossover GX</span><b>${r.gx?fmtHz(r.gx):'—'}</b></div><div><span>phase crossover PX</span><b>${r.px?fmtHz(r.px):'none'}</b></div><div><span>phase margin</span><b>${r.pm===null?'—':r.pm.toFixed(0)+'°'}</b></div><div><span>overshoot</span><b>${st&&r.pm>0?pct(Math.max(0,(st.peak-1)*100)):'—'}</b></div><div><span>verdict</span><b>${verdict}</b></div>`;
  $('.out',el).innerHTML=figHTML(r.svg+stsvg,'Lower the loop gain (less feedback): GX moves left, PX stays — more phase margin. Add pole 3: the phase falls faster than the gain, so PX moves in (Fig. 10.8).');mountZooms(el)};
 $$('input',el).forEach(i=>i.oninput=up);up()};

WIDGETS.miller2=function(el){el.innerHTML=`<div class="stack"><div class="row" style="gap:16px">${slider('m2-c','C_c (pF)',0,5,0.1,1,'')}${slider('m2-r','R_z (Ω)',0,1500,10,0,'')}</div>
 <div class="row"><button class="btn sm" data-m2="0">R_z = 0</button><button class="btn sm" data-m2="1">R_z = 1/g_m9 (zero → ∞)</button><button class="btn sm" data-m2="2">R_z for pole–zero cancel (10.28)</button></div>
 <div class="readout" aria-live="polite"></div><div class="out"></div><p class="small muted">Our numbers: g_m1 = 1 mS, R_S = 200 kΩ, C_E = 0.1 pF; g_m9 = 5 mS, R_L = 20 kΩ, C_L = 2 pF; one extra pole at 2 GHz; unity feedback (β = 1).</p></div>`;
 const gm1=1e-3,Rs=2e5,CE=0.1e-12,gm9=5e-3,RL=2e4,CL=2e-12,p3=2e9,A0=gm1*Rs*gm9*RL;
 const up=()=>{const Cc=+$('#m2-c',el).value*1e-12,Rz=+$('#m2-r',el).value;$('#m2-c-v',el).textContent=(Cc*1e12).toFixed(1);$('#m2-r-v',el).textContent=Rz;
  const a=Rs*RL*(CE*CL+CE*Cc+CL*Cc),b=Rs*(1+gm9*RL)*Cc+Rs*CE+RL*(Cc+CL),k=Cc*(1/gm9-Rz);
  const H=f=>{const w=2*Math.PI*f;let h=CX.div([A0*1,-A0*w*k],[1-a*w*w,b*w]);return CX.div(h,[1,f/p3])};
  const disc=b*b-4*a;
  const r1=disc>=0?2/(b+Math.sqrt(disc)):null,r2=disc>=0?(b+Math.sqrt(disc))/(2*a):null; /* |s| of the two roots */

  $('.readout',el).innerHTML=`<div><span>DC gain</span><b>${(20*Math.log10(A0)).toFixed(0)} dB</b></div><div><span>dominant pole ω_p1</span><b>${r1?fmtHz(r1/(2*Math.PI)):'complex'}</b></div><div><span>output pole ω_p2</span><b>${r2?fmtHz(r2/(2*Math.PI)):'complex'}</b></div><div><span>zero</span><b>${z?fmtHz(z)+(k>0?' (RHP)':' (LHP)'):'at ∞'}</b></div><div><span>GX (≈ g_m1/2πC_c)</span><b>${r.gx?fmtHz(r.gx):'—'}</b></div><div><span>phase margin</span><b>${r.pm===null?'—':r.pm.toFixed(0)+'°'}</b></div>`;
  $(".out",el).innerHTML=figHTML(V.millerOut(Rz>0))+figHTML(r.svg,'Raise C_c: ω_p1 falls, ω_p2 rises (pole splitting) and PM grows — but the RHP zero g_m9/C_c also moves in. R_z = 1/g_m9 removes the zero; a larger R_z moves it into the LHP to cancel ω_p2.');mountZooms(el)};
 $$('input',el).forEach(i=>i.oninput=up);
 $$('[data-m2]',el).forEach(bt=>bt.onclick=()=>{const Cc=+$('#m2-c',el).value*1e-12||1e-12;const v=bt.dataset.m2==='0'?0:bt.dataset.m2==='1'?1/gm9:(CL+Cc)/(gm9*Cc);$('#m2-r',el).value=Math.min(1500,Math.round(v/10)*10);up()});up()};
